[package]
name = "boatramp-overlay-tunnel"
version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Service-by-name consumption layer over the boatramp overlay fabric (OpenZiti-style): a front-end-agnostic core (catalog, cap-cache, OverlayClient pool) plus a hand-rolled SOCKS5 front-end. The TUN virtual-interface front-end is a later, feature-gated increment."

[features]
default = []
# The full TUN virtual-interface front-end (device + embedded DNS + synthetic-IP allocator +
# userspace TCP/IP stack + per-OS route/resolver integration) — overlay-service-tunneler plan §3,
# release R2 (Linux). Default OFF so the lean SOCKS build never links this heavier dependency set —
# every dep below is `optional = true` and enabled ONLY by this feature, so the lean (no-`tun`)
# graph is byte-for-byte what it was in R1.
tun = [
  "dep:tun-rs",
  "dep:smoltcp",
  "dep:hickory-proto",
  "dep:net-route",
  # `nix` (the unix privilege-drop / `kill(pid, None)` liveness wrappers) is declared ONLY under
  # `[target.'cfg(unix)'.dependencies]` below — it does not build on Windows (R4) and has no business
  # in the Windows graph. A `dep:` reference to a target-gated optional dependency is honoured by
  # Cargo on EVERY target: on a non-unix build it is simply inert (the dep isn't in that target's
  # graph to activate), so the Windows `--features tun` build never tries to compile `nix`. The
  # Windows-specific privilege/teardown code paths are plain `#[cfg(windows)]` std/shell-outs that
  # need no crate here (see `privilege.rs` / `teardown.rs`).
  "dep:nix",
  "dep:serde",
  "dep:serde_json",
  # Signal handling for the clean-teardown path (plan §3.9: SIGINT/SIGTERM/SIGHUP on unix;
  # Ctrl-C/Ctrl-Break on Windows R4). `tokio` itself is a non-optional dependency of the lean build
  # too, so this is a feature-on-a-feature reference (not `dep:tokio`) — the lean (no-`tun`) build's
  # tokio feature set is untouched. `tokio/signal` exists on Windows as well as unix.
  "tokio/signal",
]

[dependencies]
# The ONLY boatramp dependency (plan §4): the embeddable overlay client SDK — `OverlayClient::dial`,
# `Flow`, the identity/dial-request types. This crate never links `boatramp-overlay`'s server roles,
# `boatramp-server`, or `boatramp-core`; the lean (no-`tun`) graph stays ring-free /
# rustls-platform-verifier-free, matching the SDK's own posture (mobile.yml).
boatramp-overlay-client = { workspace = true }
# A minimal tokio — mirrors `boatramp-overlay-client`'s own cut: just the runtime + the primitives
# the catalog/cap-cache/SOCKS accept-loop/splice path needs. NOT `fs`/`process`/`signal`/`io-std`
# (CLI concerns) — an embedder brings its own runtime shape.
tokio = { version = "1", default-features = false, features = [
  "rt",
  "rt-multi-thread",
  "net",
  "io-util",
  "sync",
  "time",
  "macros",
] }
# The injected `ControlPlane` boundary (the SDK does no HTTP — the CLI implements this trait over
# `client::connect`): an `#[async_trait]` trait, same pattern as the CLI's own `LiveExposers`.
async-trait = { workspace = true }
# Typed error enums ONLY — the untyped-error convenience crate is CI-banned.
thiserror = { workspace = true }
tracing = { workspace = true }
# Decodes the `Proxy-Authorization: Basic` header the HTTP CONNECT front-end checks (Security
# MEDIUM-2 — the same local-auth credential SOCKS enforces, carried as HTTP's own idiom). Already
# in the tree (root workspace dep, used by `boatramp` itself); pinned to the same "0.22" spec here
# rather than `workspace = true` so this crate's own Cargo.toml stays self-contained per its
# existing style (every other dep here is a plain version string too).
base64 = "0.22"
# Keeps the pool's reconstructable copy of the operator's long-term ed25519 seed
# (`ClientPool::holder_seed_hex`) zeroized on drop, matching `OverlaySecret::seed_hex()`'s own
# `Zeroizing<String>` (Security MEDIUM-1: a plain `String` here would leave the seed recoverable
# from a core dump / swapped memory for the daemon's whole life). Already in the tree transitively
# (via boatramp-overlay-proto, which names it directly too); zero deps of its own, so this adds
# nothing to the dependency graph and cannot affect the ring-free posture.
zeroize = "1"

# ---- `tun` feature only (plan §3/§7) — every dep below is `optional = true`, enabled solely by
# the `tun` feature table above, so the lean (SOCKS-only) build graph is untouched by any of this.
#
# TUN device (plan §3.1). The plan names the `tun` crate (rust-tun), but its Cargo.toml declares
# `license = "WTFPL"` (confirmed by reading its published manifest) — not MIT as the plan assumed,
# and not in this workspace's `deny.toml` license allow-list. `tun-rs` is a drop-in equivalent
# (async/tokio Linux `/dev/net/tun` support via the same `nix`-based posix layer, same
# builder-pattern API) under Apache-2.0, already allow-listed — a license-driven substitution, not
# a functional one; see the crate-level `tun` module doc for the full rationale.
tun-rs = { version = "2", optional = true, default-features = false, features = [
  "async_tokio",
] }
# Userspace TCP/IP stack (plan §3.5): pure-Rust, no_std+alloc, upstream-fuzzed, no C FFI, no `ring` —
# the explicit alternative to C lwIP/`netstack-lwip` the plan rejects. Default features only (no
# `log`/`alloc`/`std`-gated extras we don't need beyond what `std` already pulls in for `Vec`).
smoltcp = { version = "0.12", optional = true, default-features = false, features = [
  "std",
  "medium-ip",
  "socket-tcp",
  "proto-ipv4",
] }
# Embedded DNS zone handler (plan §3.3): `op::Message`/`rr::*` encode+decode only — explicitly
# `default-features = false` with just `std` (NOT the crate's own `default = ["std", "tokio"]`,
# and nowhere near `__tls`/`__https`/`__quic`/`dnssec-*`) so this can never pull `ring` or
# `rustls*` even if a future hickory-proto release changes its own defaults; this crate hand-rolls
# the UDP/TCP listen loop (same hand-rolled-protocol posture as the SOCKS codec) rather than using
# hickory-proto's own tokio transport, so the `tokio` feature is not needed either.
hickory-proto = { version = "0.26", optional = true, default-features = false, features = [
  "std",
] }
# Route install (plan §3.2): one cross-platform crate for the CIDR→TUN route instead of shelling a
# native tool. Non-decision per plan §9.
net-route = { version = "0.4", optional = true }
# The plan §3.9 dirty-state marker: a small JSON file listing every host mutation this run made, so
# a NEXT launch (or `boatramp tunnel --cleanup`) can detect and revert a crashed run's leftovers.
# Already a workspace dependency (used throughout `boatramp` itself); `optional = true` here purely
# to keep it out of the lean (no-`tun`) graph.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# ---- `tun` feature, UNIX targets only (plan §3.7/§3.9) --------------------------------------------
#
# `nix` does not build on Windows (R4) — it is a thin SAFE wrapper over POSIX syscalls — so it is
# declared under a unix-only target table rather than the portable `[dependencies]` above. It stays
# `optional = true` and is still turned on by the `tun` feature (`dep:nix` in the feature table), so
# the lean (no-`tun`) unix graph is byte-for-byte unchanged AND the Windows `--features tun` graph
# never pulls it. On Windows the two call sites below have `#[cfg(windows)]` std/shell-out
# equivalents that need no crate: `privilege::drop_to_unprivileged` is a documented no-op (there is
# no unix setuid-drop to perform), and `teardown::process_alive` answers conservatively without a
# PID-liveness syscall (see each module's doc).
[target.'cfg(unix)'.dependencies]
# Unix privilege drop (plan §3.7 — `geteuid`/`setgid`/`setuid` after TUN+route setup, when this
# process is root via `sudo`): `nix`'s `user` feature is a SAFE wrapper over those syscalls, which
# this crate needs because `#![forbid(unsafe_code)]` (lib.rs) rules out calling raw `libc` directly.
# Already transitively in the tree (via `tun-rs`, itself unix-gated for `nix`); named directly only
# because this crate's own `privilege`/`teardown` modules call it.
nix = { version = "0.31", optional = true, default-features = false, features = [
  "user",
  # `kill(pid, None)` — the portable (Linux + macOS, unlike parsing Linux-only `/proc`) existence
  # check `teardown::process_alive` uses to decide whether a marker's recorded PID is still alive.
  "signal",
] }

[lints]
workspace = true
