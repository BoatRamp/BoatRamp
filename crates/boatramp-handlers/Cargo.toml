[package]
name = "boatramp-handlers"
version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebAssembly handler engine for boatramp (wasmtime component runtime)"

[features]
# The wasmtime engine is heavy; it is off by default so `cargo build
# --workspace` stays lean. The server enables it via its `handlers` feature.
default = []
# Anti-hollow gate lane: arms the `BOATRAMP_ASYNCLANE_MUTATION` seams in `engine.rs`
# (per-invocation memory down-clamp, per-consumer concurrency floor) so a CI gate can prove each
# clamp goes RED when removed. NEVER enabled in a shipped build — it only exposes a test env var,
# it is not a backdoor. Needs `messaging` for the per-consumer gate and `engine` for the limits.
async-lane-gate-mutation = ["engine", "messaging"]
# Anti-hollow gate lane for the `blob-list` prefix confinement: arms the `BOATRAMP_BLOBLIST_MUTATION`
# seam in `bindings/blobstore.rs` (`join_list_prefix`/`confine_list_names`) so a CI gate can prove the
# container-prefix join + the strip-back + the marker-hide each go RED when neutered. The seam also
# lives under `cfg(test)`; this feature arms it for an out-of-test gate run. NEVER in a shipped build.
blob-list-gate-mutation = []
# Anti-hollow gate lane for the `on_unresolved: "pass"` null-principal confinement: arms the
# `BOATRAMP_PASS_MUTATION` seam (`tenant::pass_mutation`) so a CI gate can prove that neutering the
# pass handling (`deny_pass`) makes the `wasi:blobstore` `{tenant}` binding AND the legacy
# `sql_marker` refuse again (the gate goes RED). Also under `cfg(test)`; NEVER in a shipped build.
pass-gate-mutation = []
# Anti-hollow gate lane for the gated `wasi:sockets` outbound-TCP connect gate (PLAN-handler-tcp-egress):
# arms the `BOATRAMP_TCPEGRESS_MUTATION` seam (`engine::tcpegress_mutation`) so the CI gate can prove
# each of the three security checks in `tcp_connect_decision` — allowlist membership, connect-only, and
# the posture gate — goes RED when neutered (`admit_unallowlisted`/`admit_bind_listen`/`drop_posture`).
# Also armed under `cfg(test)`; NEVER enabled in a shipped build (it only reads a test env var).
tcpegress-gate-mutation = ["engine"]
# Anti-hollow gate lane for the host-owned inbound-TCP listener dispatch gate (PLAN-handler-tcp-inbound):
# arms the `BOATRAMP_TCPLISTENER_MUTATION` seam (`engine::tcplistener_mutation`) so the CI gate can prove
# the two dispatch checks in `tcp_listener_dispatch_decision` — the posture gate and the operator-declared
# gate — go RED when neutered (`drop_posture`/`admit_undeclared`), AND that the conn-lane store grants NO
# socket authority (`add_socket_authority` must turn the structural assertion RED). Pulls `tcp-listener`
# (the world + dispatch path the gate drives). Also armed under `cfg(test)`; NEVER in a shipped build.
tcp-listener-gate-mutation = ["tcp-listener"]
engine = [
  "dep:wasmtime",
  "dep:wasmtime-wasi",
  "dep:wasmtime-wasi-http",
  "dep:wasmtime-wasi-io",
  "dep:lru",
  "dep:http",
  "dep:http-body-util",
  "dep:hyper",
  "dep:bytes",
  "dep:futures",
  "dep:tracing",
  "dep:getrandom",
  "dep:sha2",
  # The read-only instance-lifecycle stats snapshot (`instance_stats`) serializes to the admin stats
  # surface, so the engine lane pulls serde (already in the graph via the server/types layer).
  "dep:serde",
  # Guest outbound `wasi:http` TLS: the stock wasmtime-wasi-http send handler
  # hardcodes the webpki roots with no hook, so the dev-posture extra-CA option
  # (see engine.rs `guest_egress_client_config`) reimplements the TLS send with an
  # expanded root store — needs the rustls stack directly.
  "dep:rustls",
  "dep:tokio-rustls",
  "dep:webpki-roots",
  "dep:hyper-util",
  "tokio/sync",
  "tokio/rt",
  "tokio/time",
  # `net` for the SSRF egress guard's DNS resolution.
  "tokio/net",
]
# The `sql` handler binding (wasi:sql-shaped). Engine-agnostic: it talks only to
# `boatramp_core::sql::SqlBackend`; the concrete database (libsql, single-node
# file or sqld namespace) is a `boatramp-storage` backend the server wires in.
sql = ["engine"]
# The orm `related-aggregate` correlated roll-up — the one scalar-subquery form
# (`(SELECT agg(col) FROM table WHERE …)`). Off in THIS crate's own default set: it is a
# (guest-declared) nested-`FROM` access path, so an operator can build a host that refuses it.
# Enabling it needs `sql` (it rides the orm binding). NOTE: the shipped `boatramp` binary turns
# it ON via its batteries-included default — a kill-switch is a rebuild without the feature.
orm-subquery = ["sql"]
# The `wasi:messaging` producer binding: publish to boatramp's internal
# `boatramp_core::messaging::Messaging` substrate. (Consumer dispatch is the
# server's job.) Needs async-trait for the object-safe `ProducerContextSource`
# (Gap 3 `present-token`, which host-seals a producer context).
messaging = ["engine", "dep:async-trait"]
# The `invoke` binding: one function calls another in-process via the server's
# `Invoker` (resolution + metering live a layer up). Needs async-trait for the
# object-safe `Invoker` trait.
invoke = ["engine", "dep:async-trait"]
# The `graphql` binding: a guest runs an operation against the project's composed
# supergraph in-process via the server's `SupergraphRunner` (registry + planner +
# executor + safelist live a layer up). Shares the invoke depth cap.
graphql = ["engine", "invoke", "dep:async-trait"]
# The `email` binding: a guest submits a finished message to the per-project SMTP
# gateway (`boatramp:handlers/email`). The host holds the SMTP credentials
# (resolved from `boatramp_core::email_config`) and delivers via `lettre`; the
# guest only ever calls `send`. Needs async-trait for the object-safe `EmailSpool`
# / `SmtpBackend` seams and serde to (de)serialize a message onto the durable spool.
email = ["engine", "dep:lettre", "dep:async-trait", "dep:serde"]
# The `admin` binding: a guest reconfigures its own project (domains / email profiles / site
# config / secrets) via the server's `AdminController` (the mutation logic, per-project rate
# quota, and audit live a layer up). Needs async-trait for the object-safe controller trait.
admin = ["engine", "dep:async-trait"]
# The `migrate-ddl` binding: a migration FUNCTION step runs owner-role DDL/DML/verification via the
# server's owner-connection substrate (`boatramp_core::sql::MigrateDdl`). The binding is attached
# only inside a Project·Admin migration run (context-gated a layer up, boatramp-server). Needs
# async-trait for the object-safe seam ( `query` rows are JSON-encoded by a core helper). Off by default.
migrate = ["engine", "sql", "dep:async-trait"]
# The `capability` binding: a guest mints a fleet-signed target capability
# (`boatramp:handlers/capability`, PLAN-delegable-capabilities). The host holds the fleet signer and
# stamps the audience + clamps the TTL (the `CapabilityMinter` impl lives a layer up, boatramp-server);
# this gates the WIT `capability` interface + the object-safe minter seam. Off by default.
capability = ["engine", "dep:async-trait"]
# The `session` binding: a duplex/resumable session handler (PLAN-session-primitive). The host
# session store + re-entry driver + serving live a layer up (boatramp-server); this gates the WIT
# `session` interface + the guest-export/host-import binding. Off by default (experimental).
session = ["engine", "dep:async-trait"]
# The per-tenant sealed-secret binding (`boatramp:handlers/tenant-secrets`, task #493): a guest
# reads/writes secrets sealed to THIS invocation's resolved tenant via a `boatramp_core`
# `TenantSecretStore` (KV + the `[secrets]` envelope; the store itself is NOT handlers-gated so the
# control-plane routes compile on a lean node). This gates only the WIT interface + host binding +
# linker. Off by default; the server turns it on inside its `handlers` feature.
tenant-secrets = ["engine", "dep:async-trait"]
# The `blob-upload` binding (S3-compatible external blob ingress): a guest mints a short-lived, scoped
# S3 upload credential for one of its OWN project+site's blob containers, which an external client uses
# to upload directly (the wasm guest then reads by key via `wasi:blobstore`). The host holds the fleet
# signer + the S3-ingress secret and stamps project+site + clamps the TTL/max-bytes (the
# `BlobUploadMinter` impl lives a layer up, boatramp-server); this gates only the WIT interface + the
# object-safe minter seam + linker. Off by default; the server turns it on inside its `handlers` feature.
blob-upload = ["engine", "dep:async-trait"]
# The `tcp-listener` capability (host-owned inbound-TCP listeners, PLAN-handler-tcp-inbound): the host
# binds/listens/accepts on an operator-declared `[serve.listeners.<name>]` and re-enters a guest's
# `tcp-connection-handler` export once per ALREADY-ACCEPTED connection, handing it the connection's
# `wasi:io` streams as host-owned resources. The guest NEVER receives `wasi:sockets` (no bind/listen/
# connect authority; the deny-all socket host default stands — no permissive `socket_addr_check`, no
# `allow_tcp` for this lane). The accept loop + per-connection binding build live a layer up
# (boatramp-server/boatramp); this gates the WIT `tcp-connection-host` world + the engine's conn-lane
# dispatch. Off by default (experimental); the shipped binary turns it on via batteries-included.
tcp-listener = ["engine"]

[dependencies]
boatramp-core.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
# CIDR matching for the gated `wasi:sockets` outbound-TCP allowlist (PLAN-handler-tcp-egress):
# a `CIDR:port` allowlist entry is matched structurally against the resolved connect IP.
ipnet.workspace = true

wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
wasmtime-wasi-http = { workspace = true, optional = true }
wasmtime-wasi-io = { workspace = true, optional = true }
lru = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
# Guest egress TLS (dev-posture extra-CA): the workspace rustls (0.23, aws_lc_rs
# provider) + a matching tokio-rustls/webpki-roots, used to reimplement the
# wasmtime-wasi-http outbound TLS send with an operator-supplied extra root.
rustls = { workspace = true, optional = true }
tokio-rustls = { version = "0.26", optional = true }
webpki-roots = { version = "1.0", optional = true }
hyper-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# A deterministic digest for the AOT-artifact engine fingerprint (cold-start cap-req 09):
# reduces wasmtime's `precompile_compatibility_hash` to a stable 32-byte cache-partition key.
sha2 = { workspace = true, optional = true }
# A per-process nonce stamps the self-egress depth marker so an external client can't forge it.
getrandom = { workspace = true, optional = true }
# For the object-safe `Invoker` trait behind the `invoke` feature.
async-trait = { workspace = true, optional = true }
# SMTP client behind the `email` feature (pure-rustls, no OpenSSL — see the
# workspace dep for the feature rationale).
lettre = { workspace = true, optional = true }
# (De)serialize an outbound email onto the durable spool, behind `email`.
serde = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# For the in-memory `Storage` test double (the trait is `#[async_trait]`).
async-trait.workspace = true
# Mint a throwaway CA + leaf for the guest-egress extra-CA loopback-TLS handshake gate.
rcgen = "0.13"

[lints]
workspace = true
