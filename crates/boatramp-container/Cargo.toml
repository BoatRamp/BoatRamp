[package]
name = "boatramp-container"
version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native Linux container backend for boatramp tier-2 compute: the self-jail sandbox plan + veth networking"

[dependencies]
boatramp-types.workspace = true
serde.workspace = true
# Async runtime + IO. Cross-platform: the guest-log sink (`logsink`) drains the
# worker's stdout/stderr over tokio pipes + an mpsc channel, and is unit-tested
# on every host. `sync` = the log mpsc; `time` = the health-probe timeout.
tokio = { workspace = true, features = ["sync", "time"] }
# Guest-log lines are mirrored to the structured tracing sink.
tracing.workspace = true

# The self-jail worker (`worker`, Linux-only) applies the sandbox plan with real
# syscalls (no external `unshare`/`nsenter`/`capsh`): `nix` for namespaces /
# mounts / pivot_root / hostname / uid-gid / exec, `caps` for capability drop,
# `seccompiler` (Firecracker's seccomp compiler) + `syscalls` (name→number) to
# compile + install the allow-list filter.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = [
  "sched",
  "mount",
  "process",
  "hostname",
  "user",
  "signal",
  "fs",
] }
caps = "0.5"
seccompiler = "0.4"
syscalls = "0.6"
# veth/netns wiring over netlink (no `ip` shell-outs).
rtnetlink = "0.14"
# The netlink message/attribute types (LinkAttribute/LinkFlag/AddressAttribute), used to
# read host link + address state in-process for the one-shot compute-net-debug dump. Pinned
# to the version rtnetlink 0.14 already resolves so no new dependency graph is introduced.
netlink-packet-route = "0.19"
futures = "0.3"
# The `ContainerBackend` (ComputeBackend impl): the trait + Storage staging + the
# shared IpPool live in core; rootfs tar unpack via tar+flate2. Linux-only (it
# re-execs the self-jail worker + does netns setup), so kept with the other
# target-linux deps rather than behind a portable feature.
boatramp-core.workspace = true
async-trait.workspace = true
# The internal-DNS socket seam (`dns_server`) binds a UDP listener on the bridge
# gateway and forwards to the upstream resolver — Linux-only (where the bridge is),
# so `net` is added to the Linux-target tokio features (the cross-platform base has
# only `sync`/`time`).
tokio = { workspace = true, features = ["net"] }
tar.workspace = true
flate2.workspace = true
serde_json.workspace = true
ipnet.workspace = true
# The daemonless OCI puller (pull an image over the registry HTTP API + overlay its
# layers into a rootfs directory, honoring whiteouts) so `materialize` accepts a
# `RootSource::Image` — the container backend can then run a stock image (e.g. a
# co-located Postgres) with no Docker daemon. Only the `build` feature is pulled
# (tar/flate2/reqwest/hex/sha2); `build_rootfs_dir` stops before `mke2fs`, so no
# e2fsprogs. The KVM/VMM deps are behind the crate's other (unselected) features.
boatramp-firecracker = { workspace = true, features = ["build"] }

[dev-dependencies]
serde_json.workspace = true
# Build an in-memory rootfs blob stream for the `materialize` staging test.
bytes.workspace = true
# A temp rootfs dir for the resolv.conf-writer test (`resolvconf`).
tempfile = "3"
# The privileged `container_live` seam drives a real launch (+ later CRIU
# checkpoint/restore) on a multi-thread runtime so the log-pump tasks drain the
# worker's pipes while the probe loop blocks. Linux-only, `#[ignore]`d by default.
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "process",
  "net",
  "fs",
  "io-util",
  "time",
  "sync",
] }

[lints]
workspace = true
