[package]
name = "boatramp-core"
version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core domain types, streaming storage trait, pluggable KV, and content-addressed deploys for boatramp"

[features]
# COSE/CWT control-plane tokens (RFC 8392/9052) + Cedar authorization:
# mint / verify / authorize over the `boatramp_types::authz` vocabulary. Native-only;
# pulls `coset`/`ciborium` (token format), `p256`/`ed25519-dalek` (ES256 default +
# Ed25519 sign/verify), and `cedar-policy` (the authorization decision). Off by
# default so the lean build and the wasm32 edge target stay free of it. The decision
# logic is unit-tested (incl. a Cedar-vs-oracle differential gate); the live
# multi-node revocation round-trip is exercised against a running cluster.
authz = [
  "dep:coset",
  "dep:ciborium",
  "dep:p256",
  "dep:ed25519-dalek",
  "dep:rand_core",
  "dep:cedar-policy",
]
# TEST-SUPPORT, NEVER SHIPPED: expose `kv::conformance` (the shared `KvStore` conformance suite +
# the `cas_race_has_exactly_one_winner` property) as a `#[doc(hidden)] pub` module so another
# crate's TEST build can run the IDENTICAL suite against its own backend (e.g. `boatramp-storage`'s
# `SqlKv`). Off in every normal/shipped build; a downstream crate enables it only in `dev-dependencies`.
kv-conformance = []
# TEST-ONLY, NEVER SHIPPED: pass-through of the D4 authz mutation seam to `boatramp-types` for the
# `BLOB DRAIN DAEMON-MEDIATED OK` gate (v0.6.3). `boatramp-server`'s `blob-drain-gate-mutation`
# enables this, which enables `boatramp-types/blob-drain-gate-mutation` — where the `Right::required`
# `POST /api/blob-drain` arm carries the LOWER_AUTHZ seam. Compiled OUT of every real build.
blob-drain-gate-mutation = ["boatramp-types/blob-drain-gate-mutation"]
# TEST-ONLY, NEVER SHIPPED: pass-through of the `owned`-scope anti-hollow seam to `boatramp-types` for
# the `OWNED-COLUMN ISOLATION OK` gate. A downstream test lane (`boatramp-storage`'s owner-isolation
# gate) enables this → `boatramp-types/owned-gate-mutation`, where `owned_scope` carries the
# `BOATRAMP_OWNED_MUTATION` seam. Compiled OUT of every real build.
owned-gate-mutation = ["boatramp-types/owned-gate-mutation"]
# TEST-ONLY, NEVER SHIPPED: arm the MF-1 crown-jewel CAS mutation seam
# ([`crownjewel::cas_mutation_active`]) in a NON-test build, so a downstream test lane (e.g.
# `boatramp-storage`'s live-Postgres crown-jewel gates) can set
# `BOATRAMP_KVSQL_MUTATION=drop_crownjewel_cas` and drive the converted writes back onto the blind
# pre-MF-1 path — turning every MF-1 gate RED. Mirrors `blob-drain-gate-mutation`. Compiled OUT of
# every real build (the seam also compiles under this crate's own `cfg(test)`).
crownjewel-cas-gate-mutation = []
# TEST-ONLY, NEVER SHIPPED: arm the kv-sql WS4 shared-mode mutation seams
# ([`shared_mode::election_lock_disabled`] / [`shared_mode::cp_id_stamp_skipped`]) in a NON-test
# build, so a downstream test lane (`boatramp-storage`'s live-Postgres shared-mode gates) can set
# `BOATRAMP_KVSQL_MUTATION=disable_leader_lock` / `=skip_cp_id_stamp` and drive the election / cp-id
# stamp off — turning the single-leader + commingle/split-brain gates RED. Mirrors
# `crownjewel-cas-gate-mutation`. Compiled OUT of every real build (also lives under `cfg(test)`).
shared-mode-gate-mutation = []
# TEST-ONLY, NEVER SHIPPED: arm the claim-transform tenant-key-derivation mutation seam
# ([`claim_extract::gate_mutation`]) in a NON-test build, so a downstream test lane
# (`boatramp-storage`'s libsql claim-transform gates) can set `BOATRAMP_CLAIMTRANSFORM_MUTATION` to
# disable ONE derived-key screen: `skip_derived_screen` (span alphabet + key-safety), `extract_fallback`
# (no-match → verbatim claim), or `skip_namespace_check` (the injective-namespace guard) — turning the
# corresponding G1/G2/G3 gate RED. Mirrors `crownjewel-cas-gate-mutation`. Compiled OUT of every real
# build (the seam also compiles under this crate's own `cfg(test)`).
claim-transform-gate-mutation = []
# Anti-hollow gate lane for the `tenant_or_base` base-write capability: lets a test / the
# `boatramp-storage` catalog_persistence gate set `BOATRAMP_BASEWRITE_MUTATION` to disable ONE
# invariant in `Scope::write_target` — `leak_stamp` (a base write stamps a tenant value instead of the
# NULL baseline → leaks into a tenant partition) or `skip_target_guard` (drops the target-route
# refusal) — turning the gate RED. Mirrors `claim-transform-gate-mutation`. Compiled OUT of every real
# build (the seam also compiles under this crate's own `cfg(test)`).
basewrite-gate-mutation = []
# Anti-hollow gate lane for the first-class `system` principal (PLAN-system-principal). Lets a test
# set `BOATRAMP_SYSPRINCIPAL_MUTATION` to disable ONE provenance invariant: in `DeployStore`,
# `content_keyed` (drop the per-deployment-id binding on the activation-class record → the class is
# mis-applicable across deployments, the cross-tenant escalation) or `skip_clear` (a non-system
# activation leaves a stale System record → a prior capture survives); in the COSE verifier,
# `infer_system_from_missing_tenant` (a markerless/tenantless seal is promoted to System → provenance
# by absence, not the positive marker). Each turns a provenance gate RED. Compiled OUT of every real
# build (the seams also compile under this crate's own `cfg(test)`).
system-principal-gate-mutation = []

[dependencies]
# The shared, wasm-clean type + routing/config layer (re-exported below so
# `boatramp_core::config`/`::route`/… keep working).
boatramp-types.workspace = true
bytes.workspace = true
futures.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# Compute guest-IP pool (`ipam`): CIDR math for the per-node VM/container IP pool.
ipnet.workspace = true
sha2.workspace = true
hex.workspace = true
lru.workspace = true
# Claim-transform tenant-key derivation (`claim_extract`): a linear-time (RE2, no
# backtracking) matcher for the `token` source's template/regex, with HIR shape
# analysis at apply (`regex-syntax`). Host-side only.
regex.workspace = true
regex-syntax.workspace = true
getrandom.workspace = true
# Structured logging facade (wasm-clean): the shared compute IP authority
# (`ipam::IpAuthority`) warns on pool exhaustion / high-water so an operator sees an
# approaching-exhaustion cliff before launches start failing.
tracing.workspace = true
# Dialect-aware SQL tokenizer for the guest-SQL reserved-session-key guard
# (`sql::reject_reserved_session_writes`): comments/whitespace are normalized away
# and casing/quoting handled, so a hostile guest cannot smuggle a reserved
# `boatramp.*` / `@boatramp_*` write past a naive string filter.
sqlparser.workspace = true

# COSE/CWT tokens + Cedar authorization (`authz` feature). Optional, native only.
coset = { version = "0.3", optional = true }
ciborium = { version = "0.2", optional = true }
p256 = { version = "0.13", features = [
  "ecdsa",
  "pkcs8",
  "pem",
], optional = true }
ed25519-dalek = { version = "2", features = ["rand_core"], optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
base64 = { workspace = true }
cedar-policy = { version = "4", optional = true }

# On `wasm32-unknown-unknown`, `getrandom` (token generation in auth/
# domain_verify) needs its `js` backend to compile — it has no default RNG
# source there. Other targets (native,
# wasm32-wasi) are unaffected.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["js"] }

[dev-dependencies]
tokio = { workspace = true }
# Serialize the shared-mode mutation-seam gates: they set/clear the `BOATRAMP_KVSQL_MUTATION` env var
# (process-global), so they must not run concurrently with each other.
serial_test = "3"

[lints]
workspace = true
