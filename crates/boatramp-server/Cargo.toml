[package]
name = "boatramp-server"
version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "boatramp HTTP server + API library (streaming static-site publishing)"

[features]
# WebAssembly handler dispatch in the serving pipeline. Heavy
# (pulls the wasmtime engine via boatramp-handlers); off by default so the
# static server stays lean. The CLI enables it through its own `handlers` flag.
handlers = [
  "dep:boatramp-handlers",
  "boatramp-handlers/engine",
  "boatramp-handlers/sql",
  "boatramp-handlers/messaging",
  "boatramp-handlers/invoke",
  "boatramp-handlers/graphql",
  "boatramp-handlers/tenant-secrets",
  "dep:chrono",
  "dep:async-graphql-parser",
  "dep:async-graphql-value",
  "dep:wasmparser",
]
# The orm `related-aggregate` correlated roll-up. Independently toggleable so an operator can
# ship a host that refuses the one scalar-subquery form; implies `handlers` (it rides the orm
# binding). On in batteries-included builds, off if you drop it from the feature set.
orm-subquery = ["handlers", "boatramp-handlers/orm-subquery"]

# The per-project SMTP email gateway (`boatramp:handlers/email`): a guest submits a
# finished message; the host holds the SMTP credentials and delivers via lettre.
# Implies `handlers` (it rides the wasm engine). On in batteries-included builds,
# off in the lean build (which then also skips the lettre dependency).
email = ["handlers", "boatramp-handlers/email"]

# The guest project self-config capability (`boatramp:handlers/admin`): a guest reconfigures
# its own project (domains / email profiles / site config / secrets) in-process via the
# `ServerAdminController`. Implies `handlers`. On in batteries-included builds, off in lean.
admin = ["handlers", "boatramp-handlers/admin"]

# The owner-gated schema-migration `function` step's `migrate-ddl` capability
# (`boatramp:handlers/migrate-ddl`): a migration function runs owner-role DDL/DML/verification via
# the node's owner-connection substrate, attached only inside a Project·Admin migration run. Implies
# `handlers` (which pulls `boatramp-handlers/sql`). On in batteries-included builds, off in lean
# (then sql/extension migration steps still work; function steps fail closed with a clear message).
migrate = ["handlers", "boatramp-handlers/migrate"]

# The guest capability-minting capability (`boatramp:handlers/capability`, PLAN-delegable-capabilities):
# a guest mints a fleet-signed, own-project-only target capability via the `ServerCapabilityMinter`
# (which reaches the fleet signer). Implies `handlers`. On in batteries-included builds, off in lean.
capability = ["handlers", "boatramp-handlers/capability"]

# The guest blob-upload minting capability (`boatramp:handlers/blob-upload`, S3 external ingress):
# a guest mints a short-lived, scoped S3 upload credential for one of its OWN project+site's blob
# containers via the `ServerBlobUploadMinter` (which reaches the fleet signer + the S3-ingress secret).
# Implies `handlers`. On in batteries-included builds, off in lean.
blob-upload = ["handlers", "boatramp-handlers/blob-upload"]

# The **cloud** blob-upload minters (M4): for an S3/GCS/Azure-backed blob container, broker a NATIVE
# scoped short-lived credential (AWS STS session policy / GCS signed-URL + CAB token exchange / Azure
# user-delegation SAS) so the client uploads DIRECTLY to the real store — behind the SAME `BlobUploadMinter`
# seam the local face uses, so the guest WIT / allowlist / rights / CLI / route are unchanged from M3.
# Each cloud is independently toggleable; all imply `blob-upload`. Off in lean; on in the cloud-batteries
# build.
blob-upload-aws = [
  "blob-upload",
  "dep:aws-config",
  "dep:aws-sdk-sts",
  "dep:aws-sdk-s3",
]
blob-upload-gcs = [
  "blob-upload",
  "dep:gcs-signer",
  "dep:gcs-signer-auth",
]
blob-upload-azure = [
  "blob-upload",
  "dep:azure_core_v1",
  "dep:azure_identity",
  "dep:azure_storage_blob",
  "dep:azure_storage_sas",
  "dep:azure_storage_common",
  "dep:time",
]
# Convenience: all cloud blob-upload minters at once.
blob-upload-cloud = ["blob-upload-aws", "blob-upload-gcs", "blob-upload-azure"]

# TEST-ONLY, NEVER SHIPPED: the mutation seams that anti-hollow-verify the `S3 INGRESS SCOPED+SIGV4 OK`
# live gate (M5). When this feature is on AND the matching `BOATRAMP_S3INGRESS_MUTATE_*` env var is set,
# a single S3-ingress security choke point (the scope check, the SigV4 verify, the sha256 content-
# address verify, or the create-only overwrite precondition) is NEUTERED — reproducing exactly what a
# real regression at that choke point would do — so the gate can prove each check actually FAILS the
# gate when broken (a hollow gate would pass even neutered). Implies only `blob-upload` (the LOCAL fs
# face + minter), so the fs-face invariants (1-8 + guest read-through) build+run on the lean musl gate
# lane WITHOUT the heavy cloud SDK stack. Invariant 9's cloud-policy-builder tightness assertions are
# additionally compiled when `blob-upload-cloud` is ALSO on (they are pure functions — the gate runs
# them on the host toolchain, no live cloud). The seams are `#[cfg(feature = "s3-ingress-gate-mutation")]`
# so they are COMPILED OUT of every real build — zero production surface. CI runs the gate once clean
# (must pass) then once per mutation (must fail).
s3-ingress-gate-mutation = ["blob-upload"]

# TEST-ONLY, NEVER SHIPPED: the mutation-verified `BLOB DRAIN DAEMON-MEDIATED OK` gate (v0.6.3) for
# the daemon-mediated blob drain (`POST /api/blob-drain`). When ON, the `blob_drain::gate` battery
# compiles and drives a real `DeployStore` over a `FallbackStorage(primary=fs, secondary=fs)` in
# tempdirs (so it needs `boatramp-storage`'s `fs` + `fallback`), then prints the marker. Each
# `BOATRAMP_BLOBDRAIN_MUTATE_*` env var neuters exactly one invariant (reverse the drain direction /
# delete from the source / ignore a missing fallback / downgrade the route authz), so CI can prove
# each is load-bearing by asserting the mutation FAILS the gate. The D4 authz seam is plumbed to
# `boatramp-core`/`boatramp-types` via `blob-drain-gate-mutation`. Compiled OUT of every real build.
blob-drain-gate-mutation = [
  "boatramp-core/blob-drain-gate-mutation",
  "boatramp-storage/fs",
  "boatramp-storage/fallback",
]

# The duplex/resumable session capability (`boatramp:handlers/session`, PLAN-session-primitive):
# a long-lived, client-addressable, bidirectional, resumable channel the host drives via
# event-driven re-entry over the durable async lane. Implies `handlers`. Experimental.
session = ["handlers", "boatramp-handlers/session"]

# DNS-TXT domain ownership verification. Pulls a resolver (hickory)
# for the public-DNS TXT lookup; off by default so the lean build verifies via
# the HTTP-token method (no extra dependency). The verification logic is always
# compiled and tested — this gates only the live resolver.
domain-verify-dns = ["dep:hickory-resolver"]

# OIDC bearer-JWT control-plane auth. Pulls `jsonwebtoken`; off by
# default so the lean build carries only single/multi-token auth. The verify
# logic is unit-tested; fetching the live JWKS is exercised only in live testing.
oidc = ["dep:jsonwebtoken"]

# On-the-fly response compression, runtime-opt-in per site.
# Pulls pure-Rust gzip/brotli stream encoders; off by default (the precompressed-
# variant path needs no extra dependency).
compression = ["dep:async-compression", "dep:tokio-util"]

# HTTP/3 (QUIC) serving: a third listener transport feeding
# the same router. Pulls quinn + h3; off by default. The QUIC handshake is
# exercised only in live testing (no in-process round-trip).
http3 = ["dep:quinn", "dep:h3", "dep:h3-quinn", "dep:tower"]

# External token signer backends: the control-plane root key
# lives outside the process (KMS/HSM/Vault). The REST backends (Vault/GCP/Azure)
# reuse the in-tree `reqwest`; AWS pulls the KMS SDK; PKCS#11 pulls `cryptoki`.
# All off by default (the `local` in-process signer needs no feature). The
# request/response + signature-format logic is unit-tested; the live round-trip
# is exercised only in integration testing.
signer-vault = []
signer-gcp = []
signer-azure = []
signer-aws = ["dep:aws-config", "dep:aws-sdk-kms"]
signer-pkcs11 = ["dep:cryptoki"]

# The embedded web management console: bake the `boatramp-console` Wasm SPA
# (its built `dist/`) into the binary via `include_dir` and serve it, when the
# operator enables it, at a configurable host+path. Off by default so lean
# builds don't carry the ~MB of Wasm; the shipped/release binary enables it.
console = ["dep:include_dir"]

# The in-`serve` HTTP MCP endpoint (`/mcp`): mounts rmcp's streamable-http tower
# service, backed by an in-process dispatch to this node's own control-plane
# router (carrying the caller's forwarded bearer). Pulls the shared `boatramp-mcp`
# tool layer + rmcp + tower's `oneshot`.
mcp = ["dep:boatramp-mcp", "dep:rmcp", "dep:tower"]

[dependencies]
# The embedded console's built assets (feature `console`), baked in at compile
# time from `../boatramp-console/dist`.
include_dir = { workspace = true, optional = true }
# The MCP tool layer (feature `mcp`) + rmcp's HTTP transport for the `/mcp` endpoint.
boatramp-mcp = { workspace = true, optional = true }
rmcp = { version = "1.2", features = [
  "server",
  "transport-streamable-http-server",
], optional = true }
# COSE/CWT + Cedar is the control-plane credential model — always on
# for the server (it is the native binary's auth; `boatramp-core` keeps it opt-in
# for library/wasm cleanliness).
boatramp-core = { workspace = true, features = ["authz"] }
# The hand-rolled HTTP serving stack (h1 loop + h2 mux driver + connection upgrade):
# *the* serving path, replacing hyper/axum_server. Non-optional. A first-party,
# published workspace member (its HPACK codec is our own — no external HPACK crate).
boatramp-http = { workspace = true }
# `time` + `sync` (beyond the workspace defaults) for the bounded shutdown drain
# in `serve` (in-flight requests finish under a deadline).
tokio = { workspace = true, features = ["time", "sync"] }
# `ws` adds the WebSocket upgrade + extractor for the bidirectional stream
# endpoint (WebSocket fan-out).
axum = { workspace = true, features = ["ws"] }
futures.workspace = true
# WebSocket framing over an already-upgraded connection (handler `websocket` stream
# routes): `from_raw_socket`, server role, no client/TLS/handshake features. The opening
# handshake's accept key is computed directly (sha1 + base64, both already in the tree).
tokio-tungstenite = { version = "0.24", default-features = false }
sha1 = "0.10"
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
base64.workspace = true
hex.workspace = true
getrandom.workspace = true
# Bounded LRU for the per-project supergraph + query-plan caches (graphql_cache).
lru.workspace = true
# HMAC-SHA256 webhook-signature verification (FA-5) + constant-time compare.
sha2.workspace = true
hmac.workspace = true
subtle.workspace = true
# AES-256-GCM for the local-KEK secrets-at-rest envelope. Same provider the
# mesh + rustls already use.
aws-lc-rs = "1.17"
# Implementing the core `DomainProbe` trait (domain ownership verification).
async-trait.workspace = true

# The backend-agnostic blob-backend migration copy engine (`blob_migrate::migrate`, over the
# `Storage` trait) the daemon-mediated blob drain (`POST /api/blob-drain`, v0.6.3) runs against its
# own configured `[serve.blob_fallback]` `drain_pair`. The `blob_migrate` module is always compiled
# (no backend feature needed) so the server stays backend-agnostic — the node supplies the concrete
# `Arc<dyn Storage>`. (Inherits the workspace default `fs` feature, which is tiny; the server never
# constructs a concrete backend, only drives the trait.)
boatramp-storage = { workspace = true }

# Public-DNS TXT resolver for the `domain-verify-dns` feature (DNS ownership
# method). Optional; the HTTP-token method needs no resolver.
hickory-resolver = { version = "0.24", optional = true }

# JWT verification for the `oidc` control-plane auth feature. Optional.
jsonwebtoken = { version = "9", optional = true }

# Reads a component's `boatramp:function-manifest` custom section at deploy to detect a
# self-declared GraphQL subgraph (`handlers` feature). Optional; the static server never parses
# wasm.
wasmparser = { version = "0.252", optional = true }

# On-the-fly response compression (`compression` feature): pure-Rust gzip +
# brotli stream encoders over the body stream. Optional.
async-compression = { version = "0.4", default-features = false, features = [
  "tokio",
  "gzip",
  "brotli",
], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }

# HTTP/3 (`http3` feature): QUIC endpoint + the HTTP/3 layer + the rustls config
# the QUIC crypto is built from. All optional.
quinn = { version = "0.11", optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
# rustls is a base dep (the gateway's `wss` upstream upgrade needs a TLS client, HS-2);
# it is already compiled in the base build via reqwest, so this adds negligible weight.
# The `http3` feature reuses it for the QUIC crypto config.
rustls = { version = "0.23", features = ["ring"] }
# Lock-free hot-swap of the served rustls `ServerConfig` (ACME cert renewal swaps
# the cert live under the TLS accept loop — the same primitive axum_server used).
arc-swap = "1"
# TLS client for the gateway's `wss`/`https` WebSocket-upgrade upstreams (HS-2).
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "logging",
  "tls12",
] }
webpki-roots = "1.0"
# Calling the router as a `tower::Service` (oneshot) for each HTTP/3 request.
tower = { version = "0.5", features = ["util"], optional = true }
# Error enums (the OIDC verifier's error type).
thiserror.workspace = true
# GraphQL parsing (`handlers` feature) for the edge guard, subscription detection,
# federation compose/plan, and the data connector. `async-graphql-parser` is the
# parser async-graphql itself uses, so boatramp parses exactly what a subgraph emits
# — crucially the federation-v2 `extend schema @link(...)` SDL. `async-graphql-value`
# carries the shared `Value`/`ConstValue`/`Type` AST leaf types (Display renders
# GraphQL; variables resolve to JSON). No async-graphql runtime is pulled in.
async-graphql-parser = { version = "7", optional = true }
async-graphql-value = { version = "7", optional = true }

# External signer backends (optional). AWS KMS reuses the workspace `aws-config`
# (already in the tree for s3) + the KMS SDK; PKCS#11 uses `cryptoki` (a thin,
# audited binding). Vault/GCP/Azure are REST over the in-tree `reqwest`.
aws-config = { workspace = true, optional = true }
aws-sdk-kms = { version = "1", features = [
  "behavior-version-latest",
], optional = true }
cryptoki = { version = "0.7", optional = true }

# The M4 cloud blob-upload minters (feature-gated). AWS reuses the workspace aws-config +
# the STS SDK for session-policy brokering + aws-sdk-s3 for the presigned-PUT shape. GCS uses
# the OFFICIAL google-cloud-storage 1.x (package-renamed `gcs-signer` so it never aliases the
# storage crate's community 0.24) for V4 signed URLs + a hand-rolled STS token-exchange over
# the in-tree reqwest. Azure uses the new GA 1.x SDK generation for user-delegation SAS.
aws-sdk-sts = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
# `default-rustls-provider` keeps aws-lc-rs (the workspace primary rustls provider); no `unstable-*`
# feature is needed for V4 signed URLs. Package-renamed so it never aliases the storage crate's 0.24.
gcs-signer = { package = "google-cloud-storage", version = "1", default-features = false, features = [
  "default-rustls-provider",
], optional = true }
# The Signer that backs `SignedUrlBuilder::sign_with` (ADC / service-account / Workload-Identity via IAM
# signBlob, all resolved by ADC). Pinned to the auth version gcs-signer 1.x depends on.
gcs-signer-auth = { package = "google-cloud-auth", version = "1", default-features = false, features = [
  "default-rustls-provider",
], optional = true }
azure_core_v1 = { workspace = true, optional = true }
azure_identity = { workspace = true, optional = true }
azure_storage_blob = { workspace = true, optional = true }
azure_storage_sas = { workspace = true, optional = true }
# The shared model crate carrying `UserDelegationKey` — the SAME type both `azure_storage_blob`'s
# `get_user_delegation_key` returns AND `azure_storage_sas::SasBuilder::new` signs with.
azure_storage_common = { version = "1", optional = true }
# `OffsetDateTime` (the time type the Azure 1.x SDK uses) formatting for the `<KeyInfo>` request body
# + SAS expiry. Already in the tree via the azure crates; named directly for the RFC3339 formatter.
time = { version = "0.3", default-features = false, features = [
  "formatting",
], optional = true }

boatramp-handlers = { workspace = true, optional = true }
# Byte buffers for the serving path (multipart/byteranges part headers) + the
# handler/gateway body plumbing.
bytes.workspace = true
# hyper (client-conn+http1) + hyper-util (`TokioIo`) back the gateway's WebSocket/
# upgrade tunnelling and unix-socket upstreams (a one-shot `client::conn::http1`
# handshake over the raw stream + `hyper::upgrade::on`). The reverse-proxy data plane
# no longer uses hyper — it runs on boatramp-http's own h1 client codec + connection
# pool (see `proxy.rs`), which streams the upstream body straight to the downstream
# writer with no connection task or intermediate copy.
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
# The Linux `splice()` reverse-proxy fast-path (crates/boatramp-server/src/splice.rs)
# calls `splice`/`pipe2` directly; only used under `cfg(target_os = "linux")`.
libc = "0.2"
# The `Service` trait for the HTTP/3 request path (calling the router as a
# `tower::Service`). Trait-only crate, already in the tree via hyper-util.
tower-service = "0.3"
# Wall-clock decomposition for the cron scheduler (already in the tree).
chrono = { version = "0.4", default-features = false, features = [
  "clock",
], optional = true }

[dev-dependencies]
boatramp-core = { workspace = true }
# Property-based fuzzing of the splice fast-path's hand-written HTTP/1 head parsers
# (crates/boatramp-server/src/splice.rs): arbitrary bytes must never panic, and the
# Content-Length + Transfer-Encoding desync case must never classify as splice-able.
proptest = "1"
# The full async-graphql runtime, dev-only (the shipped binary uses just the parser).
# Emits federation SDL exactly as a live subgraph's `_service { sdl }` does, so the
# composer is tested against real federation-v2 SDL — not only synthetic fixtures.
async-graphql = { version = "7" }
# P-256 for the signer backends' unit tests (building SPKI/DER fixtures). Already
# in the tree via `boatramp-core[authz]`; exposing it directly is cheap.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Ed25519 for signing a test app-token the GraphQL data connector verifies via a JWKS
# (already in the tree via `boatramp-core[authz]`). Deterministic key, no keygen rng.
ed25519-dalek = { version = "2" }
# The SQL backend (libsql), for the handler `sql` e2e conformance test (gated
# on the `handlers` feature); `fs` + `fallback` for the v0.6.4 `blob_purge` route tests
# (a real `FallbackStorage(primary=fs, secondary=fs)` behind a real `DeployStore`).
boatramp-storage = { workspace = true, features = ["sql", "fs", "fallback"] }
tower = { version = "0.5", features = ["util"] }
hex.workspace = true
sha2.workspace = true
bytes.workspace = true
async-trait.workspace = true
serde_json.workspace = true
# A hyper HTTP/1 *server* for the unix-socket mock upstream in the gateway
# conformance test (the non-test build only needs the client).
hyper = { workspace = true, features = ["server", "http1"] }
# A real WebSocket client for the WebSocket fan-out conformance test (already
# in the tree via axum's `ws` feature; plain ws://, no TLS features needed).
tokio-tungstenite = { version = "0.24", default-features = false, features = [
  "connect",
] }
# The `blob_drain::gate` battery (feature `blob-drain-gate-mutation`) drives a real DeployStore over
# a `FallbackStorage(primary=fs, secondary=fs)` in scratch directories.
tempfile = "3"

[lints]
workspace = true
