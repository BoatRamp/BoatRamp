[package]
name = "boatramp-storage"
version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Pluggable streaming blob backends and KV stores for boatramp"

[features]
default = ["fs"]
# Local filesystem backend. `memmap2` lets it serve a large blob by memory-mapping
# the (immutable) file — one borrowed body, no `tokio::fs` double-buffer copy.
fs = ["dep:bytes", "dep:memmap2"]
s3 = [
  "dep:aws-config",
  "dep:aws-sdk-s3",
  "dep:aws-sdk-sqs",
  "dep:serde_json",
  "dep:bytes",
  # `tokio::sync::OnceCell` caches ONE process-wide base `SdkConfig`, so every S3 backend (global +
  # each per-project) shares ONE HTTP connector + connection pool instead of building N independent
  # ones — a cold `/img` burst spread across backends reuses warm connections, not N× cold connects.
  "tokio/sync",
]
# GCS backend (native google-cloud-storage SDK). `tokio/sync` for the upload
# channel bridge (Send-only ByteStream → the SDK's Send+Sync upload stream).
gcs = [
  "dep:google-cloud-storage",
  "dep:google-cloud-pubsub",
  "dep:serde_json",
  "dep:bytes",
  # A timeout-bounded `reqwest` client is injected as the GCS SDK's HTTP client (its `ClientConfig.http`
  # takes a `reqwest_middleware::ClientWithMiddleware`); the SDK otherwise uses an unbounded default.
  "dep:reqwest",
  "dep:reqwest-middleware",
  "tokio/sync",
]
# Azure Blob backend (GA azure-sdk-for-rust 1.x — the single Azure generation).
# Account-key/Azurite auth is preserved by a hand-rolled Shared Key signing policy
# (`azure_shared_key`), so `hmac`/`sha2`/`subtle`/`time` come along for the ride.
azure = [
  "dep:azure_core_v1",
  "dep:azure_storage_blob",
  "dep:azure_storage_queue",
  "dep:hmac",
  "dep:sha2",
  "dep:subtle",
  "dep:serde_json",
  "dep:base64",
  "dep:bytes",
]
cloudflare-kv = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:base64"]
# Durable embedded KV: transactional LSM over an object_store backend. The
# `object_store` dep (same version slatedb uses, so the `ObjectStore` trait
# unifies) with its `aws` feature lets the store run on S3/R2, not just local disk.
slatedb = ["dep:slatedb", "dep:bytes", "dep:object_store"]
# The SQL backend for the handler `sql` binding (impl `boatramp_core::sql`):
# libsql (SQLite-compatible) — an embedded file per site (single-node) or a
# namespace per site on a shared sqld primary (cluster, read-replicable). One
# backend; the single-node/cluster split is config, not a backend choice.
sql = ["dep:libsql", "dep:reqwest", "dep:sqlparser", "tokio/sync"]
# External bring-your-own SQL databases (impl `boatramp_core::sql` over sqlx):
# an operator-configured Postgres/MySQL a function/handler opens by name.
# Isolation is the operator's (their DB), so these bypass the per-site libsql
# boundary — libsql stays the managed default. Each engine is its own feature so
# the (heavy) sqlx tree is only pulled when actually used. Timestamp/uuid/
# numeric/json columns are stringified through `sqlx::types` re-exports (the
# chrono/uuid/bigdecimal/json features are set on the workspace `sqlx` dep).
sql-postgres = ["dep:sqlx", "dep:sqlparser", "dep:log", "sqlx/postgres"]
sql-mysql = ["dep:sqlx", "dep:sqlparser", "dep:log", "sqlx/mysql"]
# The libsql/SQLite CHANGESET true-delta engine (`sql_libsql_changeset`; SQL true-delta program,
# Stage 4). Pulls `libsql-ffi` with the SQLite `session`/`preupdate_hook` extensions ON so the
# offline file-based capture (session diff of a base snapshot vs the current DB) + the confined
# replay (`sqlite3changeset_apply` with a base-table filter + abort-on-conflict) are available.
# Needs the libsql backend (`sql`) for the snapshot/shadow primitives it reuses. OFF by default
# until proven; the managed/CI build opts it in.
sql-delta-libsql = ["sql", "dep:libsql-ffi", "dep:sha2", "dep:hex"]
# A bounded local read-through cache over any `Storage`:
# clustered/CF nodes front the shared object store with a hot-blob cache.
cache = ["dep:lru", "dep:bytes"]
# A process-wide, positive-only cache of VERIFIED container markers: skips the per-serve
# `.boatramp-container` HEAD round-trip without touching confinement. Needs `bytes` (the `Storage`
# zero-copy accessor it delegates). No `lru` — a small capped map suffices for tiny marker metas.
marker-cache = ["dep:bytes"]
# The hedged-read blob wrapper (`HedgedStorage`): races a second read against a slow first one to cut
# the serve-path fetch tail. Backend-agnostic (decorates any `Storage`); needs tokio time/sync/macros
# for the delayed race + the concurrent-hedge cap. Rides the serve path alongside `marker-cache`.
hedged = ["tokio/time", "tokio/sync", "tokio/macros"]
# A read-fallback composite over two `Storage` backends (blob-backend migration Part 2):
# serve the new (primary) backend first, fall through to the old (secondary) on a
# definitive, allowlisted primary miss, so a `--blobs` switch has no serving gap while
# `boatramp blob migrate` drains the secondary. `tokio/time` bounds each secondary read
# (a wedged secondary degrades a miss to NotFound, never a hang); `bytes` for the
# `Storage::mapped` return type.
fallback = ["dep:bytes", "tokio/time", "tokio/rt"]
# CI gate lane for Part 1 of the blob-backend migration (`BLOB MIGRATE COMPLETE OK`). When ON, the
# `blob_migrate::gate` battery compiles + each `BOATRAMP_BLOBMIG_MUTATE_*` env var neuters exactly
# ONE invariant (via a `#[cfg(feature = "blob-migrate-gate-mutation")]` seam), so CI can prove the
# gate is load-bearing by asserting every mutation FAILS it. Implies `fs` (the gate runs entirely
# fs→fs in a tempdir — no cloud — so it pulls this crate's `FsStorage`). Moved here from
# `boatramp-node` in v0.6.3 when the copy engine relocated into `boatramp-storage`.
blob-migrate-gate-mutation = ["fs"]
# The ROBUST purge gate (v0.6.4) — the deliberate successor to the marker-style gates above. When ON,
# the test-only `PurgeMutation` fault-injection enum + the `purge_drained_source_with` mutation
# parameter compile OUTSIDE `cfg(test)` too, so the in-process mutation matrix is available to any
# `blob_purge`-selecting test run. UNLIKE `blob-{migrate,drain}-gate-mutation`, this feature carries
# NO env-var seam and NO println marker: the safety decision is the pure `drained_source_deletable`
# predicate, and the gate's contract is the ordinary test-runner EXIT CODE (`cargo test blob_purge`).
# Implies `fs` + `fallback` (the fixtures build a `FallbackStorage(primary=fs, secondary=fs)`); note
# both are also in `default`, so a plain `cargo test -p boatramp-storage blob_purge` already runs it.
blob-purge-gate = ["fs", "fallback"]
# TEST-ONLY, NEVER SHIPPED: arm the MF-1 crown-jewel CAS mutation seam in `boatramp-core` from this
# crate's live-Postgres crown-jewel gate lane. With this ON and
# `BOATRAMP_KVSQL_MUTATION=drop_crownjewel_cas`, the converted crown-jewel writes (secret set/delete,
# tenant cap, policy If-Match) revert to the blind pre-MF-1 path, so every `crownjewel_*` live gate
# goes RED — proving the CAS/If-Match is load-bearing. Mirrors the MF-2 `drop_cas_predicate` seam;
# pass-through to `boatramp-core/crownjewel-cas-gate-mutation`. Compiled OUT of every real build.
crownjewel-cas-gate-mutation = ["boatramp-core/crownjewel-cas-gate-mutation"]
# TEST-ONLY, NEVER SHIPPED: arm the kv-sql WS4 shared-mode mutation seams in `boatramp-core` from this
# crate's live-Postgres shared-mode gate lane. With this ON and
# `BOATRAMP_KVSQL_MUTATION=disable_leader_lock` / `=skip_cp_id_stamp`, the leader lease / cp-id stamp
# is driven off, so `shared_election_single_leader_under_concurrency` /
# `shared_control_plane_identity_detects_commingle_and_split_brain` go RED — proving the lease / stamp
# is load-bearing. Mirrors `crownjewel-cas-gate-mutation`; pass-through to
# `boatramp-core/shared-mode-gate-mutation`. Compiled OUT of every real build.
shared-mode-gate-mutation = ["boatramp-core/shared-mode-gate-mutation"]
# TEST-ONLY, NEVER SHIPPED: arm the claim-transform tenant-key-derivation mutation seam in
# `boatramp-core` from this crate's libsql claim-transform gate lane. With this ON and
# `BOATRAMP_CLAIMTRANSFORM_MUTATION=skip_derived_screen|extract_fallback|skip_namespace_check`, one
# derived-key screen is disabled, so `claim_transform_*` gates in `orm_tenant_isolation` go RED —
# proving the screen is load-bearing. Pass-through to `boatramp-core/claim-transform-gate-mutation`.
# Compiled OUT of every real build.
claim-transform-gate-mutation = ["boatramp-core/claim-transform-gate-mutation"]
# The `catalog_persistence` base-write gate lane. With this ON and
# `BOATRAMP_BASEWRITE_MUTATION=leak_stamp|skip_target_guard`, one base-write invariant in
# `Scope::write_target` is disabled, so the `catalog_persistence` gate goes RED — proving the NULL
# stamp + the target-route refusal are load-bearing. Pass-through to
# `boatramp-core/basewrite-gate-mutation`. Compiled OUT of every real build.
basewrite-gate-mutation = ["boatramp-core/basewrite-gate-mutation"]
# The `owned`-column owner-isolation gate lane (`OWNED-COLUMN ISOLATION OK`). With this ON and
# `BOATRAMP_OWNED_MUTATION=wrong_column|unscoped`, `TableScope::Owned` lowers to the shared tenant
# column / unscoped, so the owner-isolation gate goes RED — proving the owner-column confine + stamp
# are load-bearing. Pass-through to `boatramp-core/owned-gate-mutation`. Compiled OUT of every real build.
owned-gate-mutation = ["boatramp-core/owned-gate-mutation"]
# The blob-read fault-classifier gate lane. With this ON and
# `BOATRAMP_BLOBFAULT_MUTATION=flatten_403`, `blob_fault::classify` collapses AccessDenied→NotFound
# (the exact blob-read-404 incident), so the classifier-distinctness gate goes RED — proving the
# 403/404 (and the other classes') distinction is load-bearing. Compiled OUT of every real build (the
# seam also lives under this crate's own `cfg(test)`).
blob-fault-gate-mutation = []
# The per-project blob-backend cross-project isolation gate lane (PLAN-per-project-blob-backend). With
# this ON and `BOATRAMP_BLOB_PERPROJECT_MUTATION` set, `CompositeBlobBackends::backend` resolves the
# GLOBAL default for EVERY project instead of its own backend — the exact "wrong/global backend for a
# project that declared its own" regression — so the isolation gate goes RED, proving the per-project
# resolution is load-bearing. Compiled OUT of every real build.
blob-perproject-gate-mutation = []
# The default-scope re-home blob gate lane (v0.31.0 Finding 8, `DEFAULT-SCOPE FALLBACK OK`). When ON,
# the translating read-fallback + the `blob_rehome` retire compile their `BOATRAMP_DEFAULTSCOPE_MUTATE_*`
# env-var seams, so CI can prove the gate is load-bearing by asserting every mutation FAILS it:
# `DISABLE_FALLBACK` (the fallback stops serving the old datum at the new spelling) and
# `RETIRE_BEFORE_VERIFY` (retire deletes the old key before the new key verifies). Implies `fs` (the
# gate runs fs→fs in a tempdir) + `fallback` (the translating fallback lives there). Compiled OUT of
# every real build.
default-scope-gate-mutation = ["fs", "fallback"]
# TEST-ONLY, NEVER SHIPPED: arm the embedded-SQLite exec-serialization mutation seam
# (`local_exec_lock`). With this ON and `BOATRAMP_LIBSQL_EXECLOCK_MUTATE` set, the process-global
# lock that serializes embedded (local) libsql execution is BYPASSED, so the concurrent
# `libsql_exec_serialization_gate` workload reproduces the static-musl heap corruption
# (SIGSEGV / `SQLITE_MISUSE`) — proving the serialization is load-bearing. Implies `sql` (the seam
# lives in the libsql backend). Compiled OUT of every real build.
libsql-execlock-gate-mutation = ["sql"]

[dependencies]
boatramp-core.workspace = true
futures.workspace = true
async-trait.workspace = true
tokio = { workspace = true }
tokio-util.workspace = true
notify.workspace = true
# The `MigrateError` type in the always-compiled `blob_migrate` copy engine.
thiserror.workspace = true
# Periodic progress logging in the `blob_migrate` copy engine (the `maybe_log` cadence).
tracing.workspace = true

bytes = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-sdk-sqs = { workspace = true, optional = true }
google-cloud-storage = { workspace = true, optional = true }
google-cloud-pubsub = { workspace = true, optional = true }
azure_core_v1 = { workspace = true, optional = true }
azure_storage_blob = { workspace = true, optional = true }
azure_storage_queue = { workspace = true, optional = true }
# Shared Key request signing (account-key/Azurite auth) — the 1.x SDK dropped native
# shared-key auth, so `azure_shared_key` hand-rolls Azure's HMAC-SHA256 string-to-sign.
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# Streaming SHA-256 of the libsql delta base snapshot (bounded memory, no whole-file read) +
# its hex compare against the recorded cursor — behind `sql-delta-libsql`.
hex = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
# Wraps the timeout-bounded `reqwest` client into the GCS SDK's `ClientConfig.http` (matches the
# `reqwest-middleware 0.4` the GCS 0.24 SDK itself uses).
reqwest-middleware = { version = "0.4", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
slatedb = { workspace = true, optional = true }
object_store = { version = "0.14", features = ["aws"], optional = true }
libsql = { workspace = true, optional = true }
# Raw SQLite FFI with the `session`/`preupdate_hook` extensions ON — the libsql changeset
# true-delta engine (`sql_libsql_changeset`, behind `sql-delta-libsql`). The SAME `libsql-ffi`
# the `libsql` crate already pulls transitively (features unify to ONE SQLite build), so no
# second amalgamation and no symbol collision.
libsql-ffi = { workspace = true, optional = true }
sqlparser = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
# Only to name `log::LevelFilter::Off` when disabling sqlx statement logging on the
# provisioning pools (credential DDL must never be logged). See `sql_sqlx::build_pool`.
log = { workspace = true, optional = true }
lru = { workspace = true, optional = true }
# Memory-map local blob files for zero-copy large-static serving (`fs` feature).
memmap2 = { version = "0.9", optional = true }

[dev-dependencies]
# The Stage-4 durable signed-context battery (`tests/orm_tenant_isolation.rs`) uses the COSE
# signer/envelope helpers in `boatramp_core::cose`, which are `authz`-gated — enable that feature
# for the test build only (the storage crate itself needs no COSE).
# `kv-conformance` exposes `boatramp_core::kv::conformance` so the `SqlKv` test suite runs the
# IDENTICAL shared `KvStore` conformance assertions (test build only; never shipped).
boatramp-core = { workspace = true, features = ["authz", "kv-conformance"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# The claim-transform gate builds `serde_json::Value` claims for `derive_tenant` (serde_json is only
# an OPTIONAL dep of the crate itself; the tests always need it).
serde_json.workspace = true
bytes.workspace = true
# The `kv_slatedb` tests open a SlateDB instance and close/reopen it. `close()`
# awaits the background compactor + GC task shutdowns, which could stall on a
# loaded CI host — the tests now open with those tasks disabled (see
# `kv_slatedb::tests::test_settings`), which removes the stall. `#[serial]` stays
# as a secondary guard (one instance at a time; distinct temp dirs, so it gates
# concurrency, not correctness).
serial_test = "3"
# The `blob_migrate::gate` battery (feature `blob-migrate-gate-mutation`) runs the copy engine
# fs→fs in a scratch directory.
tempfile = "3"

[lints]
workspace = true
