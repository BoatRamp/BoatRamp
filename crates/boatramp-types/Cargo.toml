[package]
name = "boatramp-types"
version.workspace = true
readme.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared, wasm-clean wire types + routing/config logic for boatramp (used by the server, CLI, and the edge Worker so the wire format and routing can't drift)"

[features]
# TEST-ONLY, NEVER SHIPPED: the D4 authz mutation seam for the `BLOB DRAIN DAEMON-MEDIATED OK`
# gate (v0.6.3). When ON AND `BOATRAMP_BLOBDRAIN_MUTATE_LOWER_AUTHZ` is set, `Right::required`
# downgrades `POST /api/blob-drain` from `System·Admin` to a project-scoped `Deploy` right — the
# exact escalation a bad routing/table change would introduce — so the gate can prove the arm is
# load-bearing (the mutation must FAIL the gate). Plumbed from `boatramp-server`'s gate feature via
# `boatramp-core`. Compiled OUT of every real build.
blob-drain-gate-mutation = []
# TEST-ONLY, NEVER SHIPPED: the anti-hollow seam for the `OWNED-COLUMN ISOLATION OK` gate. When ON AND
# `BOATRAMP_OWNED_MUTATION` is set, `owned_scope` lowers a `TableScope::Owned` to the wrong column
# (`wrong_column` → the shared `default_tenant_key`) or drops confinement (`unscoped`) — so the
# owner-isolation gate goes RED, proving the owner-column lowering is load-bearing. A `compile_error!`
# guard fails any release build that enables it. Compiled OUT of every real build.
owned-gate-mutation = []
# TEST-ONLY, NEVER SHIPPED: the anti-hollow seam for the `EXT-METHOD ROUTING OK` gate (mailroom #4).
# When ON AND `BOATRAMP_EXTMETHOD_MUTATION` is set, `extmethod_gate_mutation` neuters ONE property so
# the gate goes RED: `admit_nontoken` (validation accepts a non-token method), `drop_wildcard` (the
# `*` catch-all stops matching), `drop_ext_match` (a declared extension verb stops routing). A
# `compile_error!` guard fails any release build that enables it. Compiled OUT of every real build.
extmethod-gate-mutation = []
# TEST-ONLY, NEVER SHIPPED: the anti-hollow seam for the `RECORD-VERIFY MATCH OK` gate (DNS
# record-set verification, Phase 1). When ON AND `BOATRAMP_RECORDVERIFY_MUTATION` is set,
# `record_verify::evaluate` neuters exactly one match-security property — `missing_is_ok` (an absent
# record passes), `mismatch_is_ok` (a wrong value passes), or `accept_illegal_mode` (Contains/Prefix
# honored for A/CNAME/MX) — so the gate can prove each is load-bearing (the mutation must FAIL the
# gate). A `compile_error!` guard fails any non-test release build that enables it. Compiled OUT of
# every real build.
record-verify-gate-mutation = []
# TEST-ONLY, NEVER SHIPPED: the anti-hollow seam for the two-tier gateway security gates (0.37.0). When
# ON AND `BOATRAMP_GATEWAY_MUTATION` is set, `gateway_mutation` neuters exactly one enforced property so
# the gate goes RED: `skip_reserved` (a project route captures a site reserved path) or `skip_egress`
# (a project raw target bypasses the site∩node egress allowlist). A `compile_error!` guard fails any
# non-test release build that enables it. Compiled OUT of every real build.
gateway-gate-mutation = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
regex.workspace = true
lru.workspace = true
ron.workspace = true
hex.workspace = true
ipnet.workspace = true
url.workspace = true
argon2.workspace = true
getrandom.workspace = true
# For `domain_verify`'s injected `DomainProbe` async trait (pure, wasm-clean).
async-trait.workspace = true

# On `wasm32-unknown-unknown` (the edge Worker target), `getrandom` needs its
# `js` backend to compile (argon2 salt + token-style randomness). Native and
# wasm32-wasi are unaffected.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["js"] }

[dev-dependencies]
# `domain_verify`'s tests use `#[tokio::test]`.
tokio = { workspace = true }

[lints]
workspace = true
