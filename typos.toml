# Configuration for the `typos` spell checker.
# https://github.com/crate-ci/typos

[default]
# Opaque, copy-pasteable base64url join-ticket blobs (`brjoin1.<base64url>`) shown
# in the cluster docs are not prose — their coincidental substrings (e.g. "Jod")
# are not typos. Likewise Hetzner Cloud datacenter location codes (`fsn1`, `nbg1`,
# `hel1`) in the cluster-on-Hetzner runbook are identifiers (`hel1` ≈ "help"/"hell").
# The ES256 COSE_Sign1 token vectors in `cose.rs` tests (base64url of a CBOR tag-18
# envelope, so they start `0oR…`) are opaque signed blobs — their coincidental
# substrings (e.g. "pn") are not typos.
extend-ignore-re = [
  "brjoin1\\.[A-Za-z0-9_-]+",
  "\\b(?:fsn1|nbg1|hel1)\\b",
  "0oR[A-Za-z0-9_-]{40,}",
]

[default.extend-words]
# `mke2fs` is the e2fsprogs tool name; not a typo of "make".
mke = "mke"
# `THR` = the 8250 UART Transmit Holding Register (embedded VMM serial).
THR = "THR"
# `ExtINT`/`EXTINT` = the APIC External Interrupt delivery mode (MP table).
EXTINT = "EXTINT"
ExtINT = "ExtINT"
# `COSE`/`cose` = CBOR Object Signing and Encryption (RFC 9052) + the `coset`
# crate / `cose.rs` module (the authz token format). Not a typo of "case".
COSE = "COSE"
Cose = "Cose"
cose = "cose"
# `HashiCorp` — the vendor of Vault (the `signer-vault` backend); a proper noun,
# not a typo of "Hash".
Hashi = "Hashi"
# `clen` = a content-length local in the HTTP/2 codec + its proxy examples; a
# deliberate abbreviation, not a typo of "clean".
clen = "clen"
# `HELO` = the SMTP greeting verb (RFC 5321), matched in the email capability's
# live SMTP-sink test. Not a typo of "hello".
HELO = "HELO"
# `FO` = the Windows `tasklist.exe /FO CSV` *format-output* flag used by the R4
# Windows liveness probe (overlay-tunnel teardown). A real CLI flag, not "OF".
FO = "FO"
# `unparseable` = the spelling used across the codebase (messaging, gcs-notify, the
# raw-SQL tenancy confinement) for "cannot be parsed". A newer `typos` dictionary
# prefers "unparsable"; standardize on the existing spelling rather than churn.
unparseable = "unparseable"

[files]
# Lockfiles and vendored third-party WIT (upstream WASI definitions, copied
# verbatim — their spelling is not ours to "fix").
extend-exclude = [
  "Cargo.lock",
  "flake.lock",
  "examples/handlers/*/wit/**",
  "crates/boatramp/templates/*/wit/**",
]
