name: Set up cargo-zigbuild (musl target)
description: >-
  Rust stable with the x86_64-unknown-linux-musl target plus zig + cargo-zigbuild, so a
  lane can compile/lint/test/run the *shipped* musl artifact. Use the cargo-zigbuild
  subcommands (`cargo-zigbuild {clippy,test,run,check} --target x86_64-unknown-linux-musl`)
  — they own the C-dep cross-compile (aws-lc-sys, ring, sqlite) and the incompatible-arg
  Rust link. For a tool without a cargo-zigbuild subcommand (cargo-llvm-cov), point CC/CXX
  and CARGO_TARGET_*_LINKER at the /usr/local/bin/zig-musl-{cc,cxx} wrappers this action
  installs (they wrap `cargo-zigbuild zig cc`, which does the target/arg translation).
  Static x86_64-musl binaries run natively on the x86_64 runner — no emulator needed.
inputs:
  components:
    description: Extra rustup components (comma-separated), e.g. "clippy" or "llvm-tools-preview".
    required: false
    default: ""
runs:
  using: composite
  steps:
    # aws-lc-sys (pulled transitively even by the lean set, via slatedb's object_store
    # → rustls) builds vendored C through cmake + nasm; both are preinstalled, so skip
    # apt unless truly missing.
    - name: Ensure build deps (cmake + nasm)
      shell: bash
      run: |
        if command -v cmake >/dev/null && command -v nasm >/dev/null; then
          echo "cmake + nasm already present"
        else
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake nasm
        fi

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl
        components: ${{ inputs.components }}

    # Install Zig from PyPI, not the community mirror network: `mlugg/setup-zig` and the
    # ziglang mirrors intermittently 404/502/503 (every mirror + the official /builds
    # path failed a run), whereas the `ziglang` PyPI wheel bundles the toolchain and PyPI
    # is reliable. A `zig` shim on PATH (→ `python3 -m ziglang`) is what cargo-zigbuild
    # auto-detects for the cross toolchain.
    - name: Install Zig (PyPI ziglang) + a `zig` shim
      shell: bash
      run: |
        set -eo pipefail
        pip3 install --break-system-packages "ziglang==0.14.1"
        sudo tee /usr/local/bin/zig >/dev/null <<'EOF'
        #!/bin/sh
        exec python3 -m ziglang "$@"
        EOF
        sudo chmod +x /usr/local/bin/zig
        zig version

    - name: Install cargo-zigbuild
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-zigbuild

    # Target-translating cc/c++ wrappers for tools that have NO cargo-zigbuild subcommand
    # (cargo-llvm-cov): `cargo-zigbuild zig cc` rewrites cc-rs's rust-triple `--target`
    # and filters the flags zig rejects — the same translation cargo-zigbuild's own
    # subcommands do internally. Only lanes that opt in (by setting CC/linker to these)
    # use them; the subcommand lanes are unaffected.
    - name: Install zig-cc translating wrappers (for cargo-llvm-cov)
      shell: bash
      run: |
        set -eo pipefail
        sudo tee /usr/local/bin/zig-musl-cc >/dev/null <<'EOF'
        #!/bin/sh
        exec cargo-zigbuild zig cc -- -target x86_64-linux-musl "$@"
        EOF
        sudo tee /usr/local/bin/zig-musl-cxx >/dev/null <<'EOF'
        #!/bin/sh
        exec cargo-zigbuild zig c++ -- -target x86_64-linux-musl "$@"
        EOF
        sudo chmod +x /usr/local/bin/zig-musl-cc /usr/local/bin/zig-musl-cxx
