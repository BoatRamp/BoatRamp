name: CI

# TIER 1 — the blocking merge gate, split by WHAT it protects (not by clock). See
# ../../boatramp-roadmap/plans/PLAN-ci-tiering-policy.md. The guarantee it gives:
# "does the SHIPPED artifact hold?" — the `default` feature set ≈ the full ~30-feature
# set, so the release binary + OCI images ship essentially `--all-features`.
#
#   • quick          — instant source checks (fmt, typos, bans, #[ignore]-reasons,
#                       README pins, relaxed-durability sole-caller): no compile, fails
#                       in seconds.
#   • shipped-clippy — THE compile guarantee: `clippy --all-features --all-targets` on
#                       the shipped musl target via the crane-cached nix check.
#                       `--all-targets` compiles EVERY feature-gated test target, so an
#                       arity/type/shared-signature break fails the merge, not nightly
#                       (the blind spot that shipped two total failures through green CI).
#                       Replaces the old narrow `fs,slatedb` + `cluster,tls,acme-dns`
#                       clippy legs (they validated a config nobody ships). Dep closure
#                       substitutes from the public cachix cache → only our ~17 crates
#                       recompile per push.
#   • test           — a lean fs+SlateDB workspace test RUN for fast broad execution.
#   • the live-run gates — EXECUTE the security/correctness invariants on real engines
#                       (compile of them is already covered by shipped-clippy):
#                       test-server-features (handlers/oidc/mcp/compression/dns-verify +
#                       count tripwire), test-cluster (raft consensus + messaging DLQ
#                       matrix), test-orm-tenancy (in-site isolation on libsql),
#                       test-orm-tenancy-sqlx (SAME on real Postgres + MySQL service
#                       containers, per-dialect — now also the raw-SQL own/session
#                       confinement gate + its mutation loop), test-rawsql-own-confinement
#                       (the P0 marker-escape fix on libsql, mutation-verified),
#                       test-gdc-target + test-target-plain-wasm
#                       (target-tenant read/write isolation + the #470 three-key gate),
#                       helm-chart (CRD drift + least-privilege), coverage-gate, deny.
#                       All secret-free, so they run on fork PRs too.
#
# TIER 2/3 live in nightly.yml + release.yml (privileged / secret-bearing / slow, and
# kept as a release precondition per owner): glibc clippy, the NixOS-service VM, the
# full `--all-features` test RUN, darwin/windows builds, reproducible OCI images, the
# combinatorial matrix, operator e2e. Fork PRs never reach a secret-bearing step — the
# cachix PUSH + release run only on push-to-main / tags; Tier 1 only PULLS (anonymous).
on:
  # Fire on EVERY branch push — merges land both as PRs and as client-side pushes
  # straight to a branch / to main, so the gate can't assume the PR flow. A maintainer
  # sees Tier 1 before a client-side merge, and again when it lands on main. Release
  # tags don't match `branches`, so they stay owned by release.yml.
  push:
    branches: ['**']
  # Fork / contributor code (which can't push to the repo) is gated here instead.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A persistent cache can corrupt incremental state when a run is cancelled
  # mid-build; disable it (no benefit on a fresh CI checkout anyway).
  CARGO_INCREMENTAL: "0"
  # CI never debugs the binaries; dropping debug info keeps the target dir small.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  quick:
    name: fmt · typos · bans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # First-party code uses typed `thiserror` error enums only — the `anyhow`
      # crate is banned. It stays a *transitive* dep, so this is a source +
      # manifest guard (a cargo-deny ban would be infeasible).
      - name: Ban the anyhow crate
        run: |
          set -eo pipefail
          if grep -rnI --include='*.rs' -e 'anyhow' crates/; then
            echo "::error::the 'anyhow' crate is banned — use typed thiserror error enums"
            exit 1
          fi
          if grep -rn --include=Cargo.toml -e '\banyhow\b' crates/ Cargo.toml; then
            echo "::error::a Cargo.toml reintroduced the 'anyhow' dependency"
            exit 1
          fi

      # Every `#[ignore]` (a capability-gated live seam that runs nowhere automated on
      # a stock runner) MUST carry a `= "reason"` explaining its gate, so the coverage it
      # represents stays auditable and an ignore is never an unexplained silent skip. A
      # bare `#[ignore]` attribute fails the gate. (Matches the attribute on its own line;
      # doc/comment mentions of `#[ignore]` are unaffected.)
      - name: Every #[ignore] carries a reason
        run: |
          set -eo pipefail
          if grep -rnE --include='*.rs' '^[[:space:]]*#\[ignore\][[:space:]]*$' crates/; then
            echo "::error::a bare #[ignore] has no reason — use #[ignore = \"why + how it runs\"]"
            exit 1
          fi
          echo "all #[ignore] attributes carry a reason"

      # The README's install pins (`cargo install boatramp@X`, `nix run …/vX`,
      # `git checkout vX`) MUST equal the workspace version, so a release bump can never
      # leave the front page advertising a stale version — it once still read `v0.1` at
      # v0.3.0. A version bump that forgets the README fails here. The canonical version
      # is shown via the live crates.io badge, never hardcoded in prose; a bare `(vN.M)`
      # in prose is refused so the footgun can't come back.
      - name: README version pins match the workspace
        run: |
          set -eo pipefail
          ver=$(grep -m1 -oE '^version = "[0-9]+\.[0-9]+\.[0-9]+"' Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "workspace version: $ver"
          pins=$(grep -oE '(boatramp@|BoatRamp/v|checkout v)[0-9]+\.[0-9]+\.[0-9]+' README.md \
                 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          if [ -z "$pins" ]; then
            echo "::error::found no README version pins to check — did the pin format change?"
            exit 1
          fi
          fail=0
          for p in $pins; do
            if [ "$p" != "$ver" ]; then
              echo "::error::README pins boatramp $p but the workspace is $ver — bump the README pins"
              fail=1
            fi
          done
          if grep -nE '\(`?v[0-9]+\.[0-9]+`?\)' README.md; then
            echo "::error::README hardcodes a version in prose — show it via the crates.io badge instead"
            fail=1
          fi
          if [ "$fail" != 0 ]; then exit 1; fi
          echo "README pins all match $ver"

      # rustfmt only — no workspace build, so this lane stays sub-minute.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Typos
        # Pinned to a release tag (the repo's `master` branch was renamed to `main`, so `@master`
        # no longer resolves) — and to the SAME version the local pre-commit hook uses, so a commit
        # that passes the hook passes CI.
        uses: crate-ci/typos@v1.47.0

      - name: Relaxed-durability sole-caller guard
        # `KvStore::write_batch_relaxed` acks BEFORE the durable flush — it may be called ONLY by the
        # messaging bus publish path (`LogMessaging::commit_group`) and the `CachedKv` decorator that
        # forwards it, both in `boatramp-core`. A call from any other crate/module (a control-plane,
        # auth, guest-kv, or messaging ack/claim path) would silently weaken a durability guarantee on
        # the SHARED store — so a stray caller must fail the build, not a review. (Definitions/impls
        # `fn write_batch_relaxed` are excluded; we match call syntax `.write_batch_relaxed(`.)
        run: |
          set -eo pipefail
          stray=$(grep -rn '\.write_batch_relaxed(' crates/*/src \
            | grep -vE 'crates/boatramp-core/src/(kv|messaging)\.rs:' || true)
          if [ -n "$stray" ]; then
            echo "::error::write_batch_relaxed called outside the allowed bus publish path:" >&2
            echo "$stray" >&2
            exit 1
          fi
          echo "relaxed-durability sole-caller guard OK"

  # TIER 1 compile guarantee. Clippy the SHIPPED config — `--all-features --all-targets`
  # on the musl target the release binary + OCI images ship — via the crane-cached nix
  # check. `--all-targets` COMPILES every feature-gated test target (sql live tests,
  # graphql, raft, dns-verify), so a shared-signature/arity/type break in code that no
  # narrow slice compiled fails HERE at the merge gate rather than nightly (the exact
  # blind spot that shipped two total failures through green CI). This REPLACES the old
  # narrow `fs,slatedb` + `cluster,tls,acme-dns` clippy legs, which validated a config
  # nobody ships. The heavy third-party dep closure substitutes from the public
  # boatramp cachix cache (kept warm by cache.yml on every push to main), so a push
  # that doesn't touch Cargo.lock recompiles only our ~17 crates (minutes); a Cargo.lock
  # change rebuilds the dep layer once (the disk/swap dance below absorbs its RAM peak).
  # Runnable client-side before a merge: `nix build .#checks.x86_64-linux.musl-clippy`.
  shipped-clippy:
    name: clippy (shipped config — all features, musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Reclaim preinstalled toolchains + add swap (mirrors the nightly nix legs) so a
      # cold dep-layer rebuild of the all-features closure can't OOM the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - uses: DeterminateSystems/nix-installer-action@main
      # Pull the crane dep closure from the PUBLIC boatramp cache. On a fork PR the push
      # token (`CACHIX_AUTH_TOKEN`) is absent — cachix-action then configures the cache
      # PULL-only, which is all Tier 1 needs (anonymous substitution of the dep layer);
      # only cache.yml/release PUSH the cache. So Tier 1 never depends on a secret.
      - uses: cachix/cachix-action@v15
        with:
          name: boatramp
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Clippy — shipped config (--all-features --all-targets, musl)
        run: nix build .#checks.x86_64-linux.musl-clippy --print-build-logs --max-jobs 1 --cores 4

  helm-chart:
    name: operator Helm chart (lint + CRD drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: helm-chart-musl
      - uses: azure/setup-helm@v4

      # The chart's `crds/` are single-sourced from the Rust CRD types. Fail if the
      # checked-in copy has drifted from what the binary emits (regenerate with
      # `boatramp operator crds > charts/boatramp-operator/crds/boatramp-crds.yaml`).
      # Built + run on the shipped musl target (the static binary runs natively).
      - name: CRDs match the Rust types
        run: |
          cargo-zigbuild run --target x86_64-unknown-linux-musl -p boatramp --no-default-features --features operator -- operator crds > /tmp/crds.yaml
          diff -u charts/boatramp-operator/crds/boatramp-crds.yaml /tmp/crds.yaml

      # The operator unit tests (CRD drift guard + the least-privilege ClusterRole pin)
      # otherwise run nightly-only. Gate them here - a privilege broadening or a
      # chart-vs-types drift must fail a push, not a nightly. Reuses the build above.
      - name: operator unit tests
        run: |
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp --no-default-features --features operator operator::

      - name: Lint + render the chart
        run: |
          helm lint charts/boatramp-operator
          helm template t charts/boatramp-operator --namespace boatramp-system >/dev/null

  test:
    name: test (lean fs+slatedb run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Compile + run the tests on the SHIPPED musl target via cargo-zigbuild; the
      # static x86_64-musl test binaries run natively on the x86_64 runner. This is the
      # gate that catches a musl-only breakage before it reaches a release tag.
      - uses: ./.github/actions/setup-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-musl

      - name: Test (musl)
        run: cargo-zigbuild test --target x86_64-unknown-linux-musl --workspace --no-default-features --features boatramp/fs,boatramp/slatedb

      # Uniform db-name parameter screening (v0.5.0): the cross-surface consistency
      # guard must actually RUN — a silent skip is not evidence. Run the integration
      # test with `--nocapture` and assert its gate marker, so a `#[cfg]`/rename that
      # drops the test fails the merge rather than passing quietly (mirrors the
      # `… OK` live-gate convention used elsewhere).
      - name: DB-name screening cross-surface guard
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp \
            --no-default-features --features fs,slatedb \
            --test db_name_screening -- --nocapture 2>&1 | tee db-name-screen.log
          grep -q 'DB-NAME SCREENING CROSS-SURFACE OK' db-name-screen.log \
            || { echo "::error::db-name screening cross-surface guard did not run/pass"; exit 1; }

  # The lean `test` lane above opts down to `fs,slatedb` for speed, which enables
  # NEITHER `handlers` NOR the other feature-gated surfaces — so the whole GraphQL /
  # federation / data-connector suite (245 handlers-gated cfgs) plus oidc/mcp/
  # compression/dns-verify ran only in nightly `--all-features`. That blind spot let
  # two total failures ship through green CI (federated mutations broken; federation-v2
  # SDL rejected). This lane runs that feature-gated integration surface AT THE MERGE
  # GATE. Scoped to `boatramp-server` (one crate + wasmtime) so it stays affordable;
  # the heavy openraft/cloud-SDK unions stay nightly.
  test-server-features:
    name: test (server feature union)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Compile + run this feature-gated surface on the SHIPPED musl target.
      - uses: ./.github/actions/setup-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-server-features-musl

      - name: Test (handlers + oidc + mcp + compression + dns-verify)
        run: cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-server --features handlers,oidc,mcp,compression,domain-verify-dns

      # Tripwire: fail if this lane's test count drops below the committed floor. A
      # `#[cfg]`/feature-gate mistake that silently drops a whole module shrinks the
      # count — which is how the GraphQL surface once went dark — so a shrink fails the
      # gate rather than passing quietly. Adding tests raises the floor (bump the file).
      # Reuses the musl build above; `-- --list` only enumerates test names.
      - name: Test-count tripwire (no silent drop)
        run: |
          set -eo pipefail
          # shellcheck disable=SC1091
          . .github/test-count-baseline
          live=$(cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-server \
            --features handlers,oidc,mcp,compression,domain-verify-dns \
            -- --list 2>/dev/null | grep -cE ': test$')
          echo "server-features tests: live=$live floor=$SERVER_FEATURES_MIN"
          if [ "$live" -lt "$SERVER_FEATURES_MIN" ]; then
            echo "::error::server-features test count $live dropped below the floor $SERVER_FEATURES_MIN — a feature-gate mistake may have silently dropped tests. If the drop is intentional, lower .github/test-count-baseline deliberately."
            exit 1
          fi

      # #503 CROSS-SURFACE HARD GATE (marker `SCOPED UNSCOPED-WRITE CROSS-SURFACE OK`, mirrors the
      # v0.5.0 `DB-NAME SCREENING CROSS-SURFACE OK` convention). A `scoped` route may WRITE a
      # genuinely-global table via two opt-ins (write-global `unscoped { writable: true }` OR a
      # per-route `unscoped_writes` allowlist), but ONLY via the typed `orm` path (it is
      # injection-immune and scopes `INSERT … SELECT` sources). The RAW `sql` write path has NO
      # write-global exemption — the P0 AST write confiner REFUSES a raw-SQL write to a global table
      # (write-global or plain) fail-closed, so a global write NEVER runs via raw SQL. Cross-surface
      # safety is by REFUSAL (raw SQL offers no weaker route than the ORM), not by a schema-blind parse
      # of the raw statement — the security review found that parse a live cross-tenant WRITE bypass
      # under MySQL/MariaDB `/*! … */` version comments. This gate drives BOTH surfaces (write_target + apply_scope_marker)
      # on all dialects and asserts the whole #503 property; the marker + pass count catch a silent
      # skip/rename. It is then MUTATION-VERIFIED (the #499 convention): the SAME test is re-run under
      # each `BOATRAMP_503_MUTATION`, each of which violates one security property (widen the
      # allowlist, fire the arm before the fresh resolve, co-widen the read, drop the target guard,
      # RE-INTRODUCE the raw write-global exemption) and MUST FAIL — a PASS-under-mutation (a hollow
      # gate) fails the merge.
      - name: "#503 scoped-unscoped-write cross-surface gate"
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-handlers \
            --features sql scoped_unscoped_write_cross_surface_gate -- --nocapture 2>&1 | tee uw-cross-surface.log
          grep -qE 'test result: ok\. 1 passed' uw-cross-surface.log \
            || { echo "::error::#503 cross-surface gate did not run (silent skip or a failure)" >&2; exit 1; }
          grep -q 'SCOPED UNSCOPED-WRITE CROSS-SURFACE OK' uw-cross-surface.log \
            || { echo "::error::#503 cross-surface gate never reached its marker (an ORM/raw-SQL write-global parity regression)" >&2; exit 1; }
          # Mutation guard: each mutation MUST fail the gate (proving it is sensitive, not hollow).
          for mut in m1_widen_allowlist m2_arm_before_resolve m3_widen_read m6_target_allow m7_raw_exemption_reintroduced; do
            if BOATRAMP_503_MUTATION="$mut" cargo-zigbuild test --target x86_64-unknown-linux-musl \
              -p boatramp-handlers --features sql scoped_unscoped_write_cross_surface_gate \
              -- --nocapture > "uw-mutation-$mut.log" 2>&1; then
              echo "::error::#503 gate is HOLLOW — it passed under mutation '$mut' (a #503 security property is not actually enforced)" >&2
              exit 1
            else
              echo "#503 mutation verified: '$mut' fails the cross-surface gate as expected."
            fi
          done

      # v0.8.0 BLOB TENANT-CONFINEMENT HARD GATE (marker `BLOB TENANT-CONFINEMENT OK`). The plain
      # `wasi:blobstore` binding was site-scoped, NOT tenant-scoped — a guest granted it could
      # open("assets-<other-tid>") and get/list/put/DELETE/clear another tenant's objects in a
      # multi-tenant site (a LIVE cross-tenant read+destroy hole). The host now confines every
      # container op to the invocation's resolved OWN tenant at the single choke point
      # `BlobHost::container_prefix` (a `{tenant}`-templated `blobstore_containers` allowlist,
      # exact-matched after host-expanding the own tenant; multi-tenant deny-default; single-tenant
      # permissive; object names validated). This gate drives that choke point end to end; the marker
      # + pass count catch a silent skip/rename. MUTATION-VERIFIED (the #503 convention): the SAME
      # test re-run under each `BOATRAMP_BLOBCONFINE_MUTATION` flips ONE expectation to the insecure
      # outcome (a cross-tenant op allowed, a `{tenant}` entry expanded with no resolved tenant, the
      # deny-default dropped, a Disabled binding denied, an operator `shared` container refused, a
      # `../escape` object name accepted) and MUST FAIL — a PASS-under-mutation (a hollow gate) fails
      # the merge.
      - name: "v0.8.0 blob tenant-confinement gate"
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-handlers \
            --features engine blob_tenant_confinement_gate -- --nocapture 2>&1 | tee blob-confine.log
          grep -qE 'test result: ok\. 1 passed' blob-confine.log \
            || { echo "::error::blob tenant-confinement gate did not run (silent skip or a failure)" >&2; exit 1; }
          grep -q 'BLOB TENANT-CONFINEMENT OK' blob-confine.log \
            || { echo "::error::blob tenant-confinement gate never reached its marker (a cross-tenant blob confinement regression)" >&2; exit 1; }
          # Mutation guard: each mutation MUST fail the gate (proving it is sensitive, not hollow).
          for mut in cross_tenant_open no_tenant_expands multitenant_open disabled_denied shared_denied traversal_allowed; do
            if BOATRAMP_BLOBCONFINE_MUTATION="$mut" cargo-zigbuild test --target x86_64-unknown-linux-musl \
              -p boatramp-handlers --features engine blob_tenant_confinement_gate \
              -- --nocapture > "blob-confine-mutation-$mut.log" 2>&1; then
              echo "::error::blob tenant-confinement gate is HOLLOW — it passed under mutation '$mut' (a cross-tenant blob confinement property is not actually enforced)" >&2
              exit 1
            else
              echo "blob-confine mutation verified: '$mut' fails the gate as expected."
            fi
          done

      # v0.8.0 BLOB DIMENSION-0 HARD GATE (marker `BLOB DIMENSION-0 GATE OK`). `wasi:blobstore` carries
      # per-tenant blob assets, so it is a tenant-scoped DATA capability like sql/orm: on a multi-tenant
      # (strict `require_declaration`) posture a blob importer MUST declare a `tenancy` decision, else it
      # would bind permissive and slip past the confinement gate above (the HIGH-1 finding — a blob-only
      # GC sweep with no `tenancy` block stayed cross-tenant-open). This gate drives the REAL
      # `build_function_bindings` path: an undeclared blob-only importer is REFUSED under the strict
      # posture, a declared `Scoped`+allowlist importer binds, and an explicit `Disabled` importer binds
      # permissive (MEDIUM-1). MUTATION-VERIFIED: each `BOATRAMP_BLOBDIM0_MUTATION` flips one expectation
      # (undeclared binds / Disabled refused / scoped refused) and MUST FAIL.
      - name: "v0.8.0 blob Dimension-0 gate"
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-server \
            --features handlers,oidc,mcp,compression,domain-verify-dns blob_dimension0_gate \
            -- --nocapture 2>&1 | tee blob-dim0.log
          grep -qE 'test result: ok\. 1 passed' blob-dim0.log \
            || { echo "::error::blob Dimension-0 gate did not run (silent skip or a failure)" >&2; exit 1; }
          grep -q 'BLOB DIMENSION-0 GATE OK' blob-dim0.log \
            || { echo "::error::blob Dimension-0 gate never reached its marker (a blob tenancy-declaration regression)" >&2; exit 1; }
          for mut in undeclared_binds disabled_refused scoped_refused; do
            if BOATRAMP_BLOBDIM0_MUTATION="$mut" cargo-zigbuild test --target x86_64-unknown-linux-musl \
              -p boatramp-server --features handlers,oidc,mcp,compression,domain-verify-dns \
              blob_dimension0_gate -- --nocapture > "blob-dim0-mutation-$mut.log" 2>&1; then
              echo "::error::blob Dimension-0 gate is HOLLOW — it passed under mutation '$mut' (the blob Dimension-0 tenancy-declaration requirement is not actually enforced)" >&2
              exit 1
            else
              echo "blob-dim0 mutation verified: '$mut' fails the gate as expected."
            fi
          done

      # v0.12.4 ASYNC-LANE RESOURCE GATES (raisable per-lane memory ceiling + per-consumer async
      # concurrency + the out-of-memory terminal outcome). Two operator-budget clamps: a per-invocation
      # memory override may only LOWER a lane's ceiling (never raise it past `*_max_memory_mb`), and a
      # per-consumer `max_concurrency` is floored to the async lane budget (`min(cap, async)`). The
      # gates are PAIRED clean+mutation tests that carry the anti-hollow proof IN-PROCESS: each clean
      # test asserts the SECURE clamped value (so a hollowed clamp fails it — e.g. a 512 MiB request
      # clamping to the 128 MiB ceiling, a cap of 100 flooring to a lane of 4, an uncapped request
      # inheriting the raised ceiling) and each `mutation_*` test arms `BOATRAMP_ASYNCLANE_MUTATION`
      # itself and asserts the clamp is GONE (the escape) — a self-contained RED-under-mutation proof
      # that needs no external env loop (unlike the gates above, whose clean tests don't self-arm).
      # This step proves they RUN in the merge gate (exact pass count + the two mutation test names),
      # per the "ignore-gated tests ≠ evidence" discipline; the end-to-end OOM serve test additionally
      # runs in nightly's `--all-features` suite.
      - name: "v0.12.4 async-lane memory + per-consumer concurrency gates"
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-handlers \
            --features engine,messaging engine::tests::lane_clamp_gates -- --test-threads=1 --nocapture 2>&1 | tee async-lane.log
          grep -qE 'test result: ok\. 5 passed' async-lane.log \
            || { echo "::error::async-lane clamp gates did not run (silent skip/failure, or the count drifted from 5)" >&2; exit 1; }
          for t in mutation_mem_override_escapes_the_ceiling mutation_consumer_cap_escapes_the_lane_budget; do
            grep -q "lane_clamp_gates::$t ... ok" async-lane.log \
              || { echo "::error::async-lane mutation gate '$t' did not run — the clamp seam is unproven (a rename or a hollow clamp)" >&2; exit 1; }
          done
          # OOM classification precedence (a denied grow → OutOfMemory; explicit interrupt/fuel win).
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-handlers \
            --features engine,messaging engine::tests::classify_maps_oom_flag_but_explicit_trap_kinds_win 2>&1 | tee oom-classify.log
          grep -qE 'test result: ok\. 1 passed' oom-classify.log \
            || { echo "::error::OOM classification gate did not run (silent skip or a failure)" >&2; exit 1; }

      # BLOB-READ FAULT-CLASS gate (boatramp-blob-read-error-granularity): a failed blob read
      # (`get`/`get_range`/`head`) must classify its concrete outcome — 404 / 403 AccessDenied / 416 /
      # throttle (503/429) / 5xx / transport — into DISTINCT kinds, so a 403 under-scoped credential or
      # a throttle is never conflated with a genuine 404 (the incident), and the structured
      # status/code/request-id reach the operator log. Marker `BLOB READ FAULT CLASS OK`.
      # MUTATION-VERIFIED: `BOATRAMP_BLOBFAULT_MUTATION=flatten_403` (via `blob-fault-gate-mutation`)
      # collapses AccessDenied→NotFound, turning the 403≠404 assertion RED.
      - name: "blob-read fault-class gate (403/throttle/5xx never conflated with 404)"
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-storage \
            --features s3 blob_fault -- --nocapture 2>&1 | tee blob-fault.log
          grep -qE 'test result: ok\. 3 passed' blob-fault.log \
            || { echo "::error::blob-read fault-class gate did not run (silent skip/failure, or the count drifted from 3)" >&2; exit 1; }
          grep -q 'BLOB READ FAULT CLASS OK' blob-fault.log \
            || { echo "::error::blob-read fault-class gate never reached its marker (a classifier regression or a skipped test)" >&2; exit 1; }
          if BOATRAMP_BLOBFAULT_MUTATION=flatten_403 cargo-zigbuild test --target x86_64-unknown-linux-musl \
            -p boatramp-storage --features s3,blob-fault-gate-mutation \
            blob_fault::tests::classifier_distinguishes_every_read_outcome > blob-fault-mutation.log 2>&1; then
            echo "::error::blob-read fault-class gate is HOLLOW — it passed under flatten_403 (a 403 is conflated with a 404)" >&2
            exit 1
          else
            echo "blob-fault mutation verified: flatten_403 turns the gate RED → the 403≠404 distinction is load-bearing."
          fi

      # BLOB-LIST PREFIX-CONFINEMENT gate (construens blob-list-prefix): the new guest `blob-list`
      # (server-side prefix filter + bounded/resumable page) must stay inside the guest's container.
      # The guest `prefix` is JOINED under the host container prefix (`hblob/{site}/{container}/`) and
      # the returned keys are STRIPPED back to it — so a crafted/escaping prefix (or a forged cursor)
      # can only ever list WITHIN the guest's own container; the marker is hidden; nested keys are
      # kept. Marker `BLOB LIST PREFIX-CONFINEMENT OK`. MUTATION-VERIFIED: each
      # `BOATRAMP_BLOBLIST_MUTATION` (via `blob-list-gate-mutation`, compiled OUT of shipped builds)
      # neuters ONE half of the confinement and MUST turn the gate RED.
      - name: "blob-list prefix-confinement gate (guest prefix can't escape its container)"
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-handlers \
            --features engine blob_list_prefix_confinement_gate -- --nocapture 2>&1 | tee blob-list.log
          grep -qE 'test result: ok\. 1 passed' blob-list.log \
            || { echo "::error::blob-list prefix-confinement gate did not run (silent skip/failure, or the count drifted from 1)" >&2; exit 1; }
          grep -q 'BLOB LIST PREFIX-CONFINEMENT OK' blob-list.log \
            || { echo "::error::blob-list prefix-confinement gate never reached its marker (a confinement regression or a skipped test)" >&2; exit 1; }
          for mut in escape_prefix no_strip show_marker; do
            if BOATRAMP_BLOBLIST_MUTATION="$mut" cargo-zigbuild test --target x86_64-unknown-linux-musl \
              -p boatramp-handlers --features engine,blob-list-gate-mutation \
              blob_list_prefix_confinement_gate > "blob-list-$mut.log" 2>&1; then
              echo "::error::blob-list prefix-confinement gate is HOLLOW — it passed under '$mut' (a guest prefix escapes its container, or a raw internal key / the marker leaks)" >&2
              exit 1
            else
              echo "blob-list mutation verified: '$mut' turns the gate RED → the container confinement is load-bearing."
            fi
          done

      # MULTI-ISSUER TRUST gate (token_claims `issuer_trust` + per-`iss` JWKS discovery, the trust-axis
      # dual of the claim transform). The token's `iss` is checked against the operator policy
      # (explicit `allow` ∪ an anchored host-suffix) BEFORE any fetch — fail-closed, no network on an
      # untrusted iss; the anchored suffix is a parsed-host LABEL-BOUNDARY match (never a raw
      # `ends_with`); an OIDC `jwks_uri` host is pinned to the verified `iss` host; and the discovery
      # fetch is SSRF-guarded (https-only, public-IP, address-pinned). Marker `MULTI-ISSUER TRUST OK`.
      # MUTATION-VERIFIED: each `BOATRAMP_ISSUERTRUST_MUTATION` (via the `issuer-trust-gate-mutation`
      # feature, compiled OUT of shipped builds) disables ONE invariant and MUST turn the gate RED.
      - name: "multi-issuer trust gate (issuer policy + jwks host-pin + SSRF)"
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-server \
            --features handlers,oidc --lib issuer_trust_policy_discovery_and_ssrf_gates \
            -- --nocapture 2>&1 | tee issuer-trust.log
          grep -qE 'test result: ok\. 1 passed' issuer-trust.log \
            || { echo "::error::multi-issuer trust gate did not run (silent skip or a failure)" >&2; exit 1; }
          grep -q 'MULTI-ISSUER TRUST OK' issuer-trust.log \
            || { echo "::error::multi-issuer trust gate never reached its marker (an issuer-trust regression or a skipped test)" >&2; exit 1; }
          for mut in skip_iss_policy loosen_suffix_anchor skip_jwks_host_pin skip_ssrf_guard; do
            if BOATRAMP_ISSUERTRUST_MUTATION="$mut" cargo-zigbuild test --target x86_64-unknown-linux-musl \
              -p boatramp-server --features handlers,oidc,issuer-trust-gate-mutation \
              --lib issuer_trust_policy_discovery_and_ssrf_gates > "issuer-trust-mutation-$mut.log" 2>&1; then
              echo "::error::multi-issuer trust gate is HOLLOW — it passed under BOATRAMP_ISSUERTRUST_MUTATION=$mut (an issuer-trust invariant is not actually enforced)" >&2
              exit 1
            else
              echo "issuer-trust mutation verified: $mut turns the gate RED → the invariant is load-bearing."
            fi
          done

      # CONSUMER/CRON BLOB-SCOPE gate (boatramp-consumer-blob-scope-bug): a consumer/cron's binding
      # scope must be PROJECT-QUALIFIED, identical to the handler path, so its `wasi:blobstore`
      # (`hblob/{scope}/…`) and plain-topic namespace resolve to the SAME namespace this project's
      # handlers use, isolated across projects that share a site name (the bug: a non-default project's
      # consumer used the BARE site scope → an empty, cross-project-colliding `hblob/{site}/…`). Marker
      # `CONSUMER BLOB SCOPE OK`. MUTATION-VERIFIED: `bare_scope` (via `consumer-scope-gate-mutation`)
      # drops the qualification → the "equals the handler's qualified scope" assertion goes RED.
      - name: "consumer/cron blob-scope gate (project-qualified, cross-project isolated)"
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-server \
            --features handlers --lib consumer_scope_is_project_qualified_and_isolated \
            -- --nocapture 2>&1 | tee consumer-scope.log
          grep -qE 'test result: ok\. 1 passed' consumer-scope.log \
            || { echo "::error::consumer blob-scope gate did not run (silent skip or a failure)" >&2; exit 1; }
          grep -q 'CONSUMER BLOB SCOPE OK' consumer-scope.log \
            || { echo "::error::consumer blob-scope gate never reached its marker (a scope-qualification regression or a skipped test)" >&2; exit 1; }
          if BOATRAMP_CONSUMERSCOPE_MUTATION=bare_scope cargo-zigbuild test --target x86_64-unknown-linux-musl \
            -p boatramp-server --features handlers,consumer-scope-gate-mutation \
            --lib consumer_scope_is_project_qualified_and_isolated > consumer-scope-mutation.log 2>&1; then
            echo "::error::consumer blob-scope gate is HOLLOW — it passed under bare_scope (the consumer scope is not actually project-qualified)" >&2
            exit 1
          else
            echo "consumer-scope mutation verified: bare_scope turns the gate RED → the qualification is load-bearing."
          fi

      # MULTI-ISSUER TRUST — LIVE end-to-end gate (clean pass + live gate are BOTH preconditions). The
      # unit gate above proves the four predicates in isolation; this drives the REAL discovery → host-
      # pin → redirect-refusal → fetch → verify path against a localhost mock (via the TEST_LOOPBACK
      # fixture): a trusted iss verifies, an untrusted iss resolves zero claims with NO fetch, an
      # off-host jwks_uri is refused, and a redirecting JWKS endpoint is refused (the SSRF redirect
      # fix). Marker `MULTI-ISSUER TRUST LIVE OK`. MUTATION-VERIFIED: `follow_redirects` (build the
      # client WITHOUT the no-redirect policy) makes the redirect case followed → the gate MUST go RED.
      - name: "multi-issuer trust LIVE gate (discovery + verify + redirect refusal)"
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-server \
            --features handlers,oidc --lib multi_issuer_live_discovery_verify_and_redirect_refusal \
            -- --ignored --nocapture 2>&1 | tee issuer-trust-live.log
          grep -qE 'test result: ok\. 1 passed' issuer-trust-live.log \
            || { echo "::error::multi-issuer LIVE gate did not run (silent skip or a failure)" >&2; exit 1; }
          grep -q 'MULTI-ISSUER TRUST LIVE OK' issuer-trust-live.log \
            || { echo "::error::multi-issuer LIVE gate never reached its marker (a regression or a skipped test)" >&2; exit 1; }
          if BOATRAMP_ISSUERTRUST_MUTATION=follow_redirects cargo-zigbuild test \
            --target x86_64-unknown-linux-musl -p boatramp-server \
            --features handlers,oidc,issuer-trust-gate-mutation \
            --lib multi_issuer_live_discovery_verify_and_redirect_refusal -- --ignored \
            > issuer-trust-live-follow.log 2>&1; then
            echo "::error::multi-issuer LIVE gate is HOLLOW — it passed under follow_redirects (a JWKS-endpoint redirect is followed off the pinned host — the SSRF escape is not actually closed)" >&2
            exit 1
          else
            echo "issuer-trust LIVE mutation verified: follow_redirects turns the gate RED → the redirect refusal is load-bearing."
          fi

  # BOATRAMP-HANDLERS test lane — closes the nightly-only blind spot. The wasm handler engine's unit
  # tests PLUS its `tests/serve.rs` integration surface (the request / consumer / invoke / graphql
  # dispatch paths, incl. the legible terminal-outcome taxonomy) ran ONLY in the nightly
  # `test (all features)` tier — the `test-server-features` lane above is `-p boatramp-server`, never
  # `-p boatramp-handlers`. That blind spot let two stale `serve.rs` consumer-error asserts
  # (`Trap` where the taxonomy now yields `ConsumerError`) sit RED in nightly for days unnoticed. This
  # lane runs the SAME boatramp-handlers surface the nightly runs, AT THE MERGE GATE. One crate +
  # wasmtime, so affordable; the `*-gate-mutation` features `--all-features` pulls in are inert without
  # their `BOATRAMP_*_MUTATION` env vars (the dedicated mutation gates arm those separately).
  test-handlers:
    name: test (handlers engine — unit + serve integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Compile + run on the SHIPPED musl target (matches the other merge-gate test lanes).
      - uses: ./.github/actions/setup-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-handlers-musl

      - name: Test (boatramp-handlers, all features)
        run: cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-handlers --all-features

      # Tripwire: fail if the handlers test count drops below the committed floor. A `#[cfg]`/feature
      # gate mistake that silently drops a whole module (exactly how the serve consumer tests went
      # unnoticed in nightly) shrinks the count — a shrink fails the gate rather than passing quietly.
      # Reuses the musl build above; `-- --list` only enumerates test names. Adding tests raises the
      # floor (bump .github/test-count-baseline); never lower it to make CI pass.
      - name: Test-count tripwire (no silent drop)
        run: |
          set -eo pipefail
          # shellcheck disable=SC1091
          . .github/test-count-baseline
          live=$(cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-handlers \
            --all-features -- --list 2>/dev/null | grep -cE ': test$')
          echo "handlers tests: live=$live floor=$HANDLERS_MIN"
          if [ "$live" -lt "$HANDLERS_MIN" ]; then
            echo "::error::handlers test count $live dropped below the floor $HANDLERS_MIN — a feature-gate mistake may have silently dropped tests. If the drop is intentional, lower .github/test-count-baseline deliberately."
            exit 1
          fi

  # SlateDB WAL-recovery HARD GATE (v0.5.5 incident: the control-plane KV was unbootable with
  # `Data error: empty SSTable` after a crash / crash-consistent snapshot froze a zero-byte tail WAL
  # object). Proves a store with such a frozen tail WAL still OPENS — the incident fix (`slatedb` 0.16
  # treats a zero-byte WAL as a fence and replays past it) — with every committed key (incl. a sealed
  # secret) intact. The test is `#[ignore]`d (an on-disk close→reopen SIGSEGVs on process exit under the
  # static-musl workspace lane — the known SlateDB-on-musl teardown flake, like the ORM battery below)
  # and runs here UNIGNORED on the host toolchain; a silent skip or a regression fails the merge.
  # (0.16↔0.13.1 on-disk read compatibility — needed to recover construens's 0.13.1-written volume — was
  # verified with a cross-version open test during the upgrade; not a standing gate, since it would pull
  # a second `slatedb` into the storage test binary and aggravate that musl exit-SIGSEGV.)
  test-slatedb-wal-recovery:
    name: test (slatedb WAL recovery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-slatedb-wal-recovery-host
      - name: SlateDB tolerates a frozen empty tail WAL (the incident) on the host toolchain
        run: |
          set -eo pipefail
          # `#[ignore]`d (an on-disk close→reopen SIGSEGVs on process exit under the static-musl
          # harness — the known SlateDB-on-musl teardown flake); run unignored here on the host.
          cargo test -p boatramp-storage --features slatedb --lib \
            empty_tail_wal_object_is_tolerated_and_data_survives \
            -- --ignored --nocapture 2>&1 | tee slatedb-wal.log
          grep -qE 'test result: ok\. 1 passed' slatedb-wal.log \
            || { echo "::error::slatedb empty-tail WAL recovery test did not pass (silent skip or failure?)" >&2; exit 1; }
          grep -q 'EMPTY WAL TAIL RECOVERED OK' slatedb-wal.log \
            || { echo "::error::empty-tail WAL recovery never reached its marker (the empty SSTable incident regressed)" >&2; exit 1; }

      # WAL clean-shutdown + opt-in repair gate battery (v0.7.2, P0). The store-backed gates
      # (A1 close-advances-frontier, B1 default-loud-on-torn-v0-tail, B2 repair-recovers-all-keys,
      # B3 mid-range-gap refusal, B4 beyond-frontier-only, B5 quarantined-bytes-preserved,
      # B6 dry-run-purity, B7 await_durable characterization) open a REAL SlateDB store and
      # close/reopen it, so — like the empty-tail test above — they are `#[ignore]`d for the
      # static-musl harness and run UNIGNORED here on the host. The pure-logic gates
      # (trailing-only / mid-gap / unreadable-manifest / classify) run in the same lib run. A
      # silent skip or any failure fails the merge (the exit code is the gate).
      - name: WAL repair + close gate battery (boatramp-storage, host toolchain)
        run: |
          set -eo pipefail
          cargo test -p boatramp-storage --features slatedb --lib \
            -- --include-ignored --nocapture \
            wal_repair:: \
            a1_close_advances_frontier_empty_wal_replay \
            b1_default_open_is_loud_on_torn_version0_tail \
            b2_repair_recovers_and_all_keys_survive \
            b3_refuses_mid_range_gap_over_real_store \
            b4_repair_never_touches_at_or_below_frontier \
            b5_quarantined_bytes_preserved_and_removed_from_wal \
            b6_dry_run_mutates_nothing \
            b7_await_durable_write_survives_reopen_without_flush_or_close \
            2>&1 | tee wal-repair.log
          # Each store-backed gate prints a unique marker; assert every one reached it (no silent skip).
          for marker in \
            'A1 CLOSE-ADVANCES-FRONTIER OK' \
            'B1 DEFAULT-LOUD-ON-TORN-TAIL OK' \
            'B2 REPAIR-RECOVERS-ALL-KEYS OK' \
            'B3 MID-RANGE-GAP-REFUSAL OK' \
            'B4 BEYOND-FRONTIER-ONLY OK' \
            'B5 QUARANTINED-BYTES-PRESERVED OK' \
            'B6 DRY-RUN-PURITY OK' \
            'B7 AWAIT-DURABLE-CHARACTERIZATION OK'; do
            grep -qF "$marker" wal-repair.log \
              || { echo "::error::WAL repair gate never reached its marker: $marker" >&2; exit 1; }
          done
          grep -qE 'test result: ok\.' wal-repair.log \
            || { echo "::error::WAL repair gate battery did not pass" >&2; exit 1; }

      # v0.9.0 KV-recovery SELF-HEAL gate battery (the durability-DEFAULT flip). These store-backed
      # gates use an InMemory object store (non-stalling — no on-disk close/reopen SIGSEGV), so they
      # run UNIGNORED here (and in the default merge lane). They prove: checkpoint() advances the
      # durable frontier without close (C1); the self-heal DEFAULT opens+quarantines a sole safe
      # trailing torn tail and the sealed secret survives (C3/C7); `--strict-kv` still fails loud
      # (C11); an UNSAFE shape (torn compacted SST) fails loud + mutates NOTHING (C3 dry-run-first).
      # The LINCHPIN proves the flip cannot drop an ACKED crown-jewel write; it is then
      # MUTATION-VERIFIED — under `BOATRAMP_LINCHPIN_MUTATION=no_frontier_sync` the crown-jewel write
      # SKIPS the checkpoint (a frontier-async write, the C2 miss), the acked secret lands in the torn
      # tail self-heal quarantines, and the survival gate MUST FAIL. A pass-under-mutation (a hollow
      # linchpin) fails the merge.
      - name: "v0.9.0 KV self-heal + recovery gate battery (host toolchain)"
        run: |
          set -eo pipefail
          cargo test -p boatramp-storage --features slatedb --lib -- \
            kv_slatedb::tests::checkpoint_advances_the_durable_frontier_without_close \
            kv_slatedb::tests::crown_jewel_write_survives_torn_tail_self_heal_linchpin \
            kv_slatedb::tests::self_heal_opens_after_quarantining_a_safe_torn_tail \
            kv_slatedb::tests::self_heal_refuses_and_preserves_on_an_unsafe_compacted_tear \
            kv_slatedb::tests::strict_policy_fails_loud_on_a_safe_torn_tail \
            2>&1 | tee kv-recovery.log
          grep -qE 'test result: ok\. 5 passed' kv-recovery.log \
            || { echo "::error::v0.9.0 KV self-heal gate battery did not run all 5 (silent skip or a failure)" >&2; exit 1; }
          # LINCHPIN anti-hollow: the checkpoint on the crown-jewel write path is load-bearing.
          if BOATRAMP_LINCHPIN_MUTATION=no_frontier_sync cargo test -p boatramp-storage \
            --features slatedb --lib -- \
            kv_slatedb::tests::crown_jewel_write_survives_torn_tail_self_heal_linchpin \
            > linchpin-mutation.log 2>&1; then
            echo "::error::LINCHPIN gate is HOLLOW — it passed under no_frontier_sync; a crown-jewel write left frontier-async would silently drop an acked secret (sealed secret / RBAC / posture) on a self-heal-default boot" >&2
            exit 1
          else
            echo "linchpin mutation verified: no_frontier_sync drops the acked secret as expected — the crown-jewel checkpoint is load-bearing."
          fi

      # v0.11.x KV MANIFEST + COMPACTIONS RECOVERY GATE BATTERY (host toolchain).
      # v0.11.0: F1 fsync (the correctness precondition) + F2 auto last-good-generation rollback for an
      #   empty/torn LATEST manifest + the MF2 GC-hole guard (fail-loud, never a silent lossy rollback) +
      #   MF5 crown-jewel survival AND non-resurrection + the slatedb WAL-GC-retention invariant-pin (RED
      #   the day slatedb stops retaining the frontier WAL object, which is what makes MF2's empty-range
      #   branch safe).
      # v0.11.1: the openability WALK (adopt the newest generation that OPENS, skipping a decodes-but-
      #   won't-open one — selection by open-ability, not decode-ability) + the corrupt-`.compactions`
      #   RESET (quarantine `compactions/*` + the GC boundary so a compactor-ON reopen rebuilds it).
      # All InMemory/host-lane, so they run UNIGNORED here. See boatramp-kv-graceful-shutdown.
      - name: "v0.11.x KV manifest + compactions recovery gate battery (host toolchain)"
        run: |
          set -eo pipefail
          cargo test -p boatramp-storage --features slatedb --lib -- \
            control_plane_local_store_is_constructed_with_fsync \
            mf2_catches_a_hole_under_a_non_readable_anchor_that_survivor_contiguity_misses \
            mf2_contiguity_allows_contiguous_and_empty_cases \
            mf2_contiguity_refuses_a_leading_gc_hole \
            mf2_contiguity_refuses_an_interior_hole \
            mf5_acked_tombstone_is_not_resurrected_after_manifest_rollback \
            recover_is_a_noop_when_the_latest_manifest_is_readable \
            recover_refuses_a_gc_hole_under_a_torn_anchor_mf2_isolated \
            recover_refuses_a_wal_gc_hole_below_the_rollback_frontier \
            recover_refuses_loud_when_no_generation_decodes \
            recover_replays_an_acked_wal_write_beyond_g_frontier_byte_equal \
            recover_rolls_back_to_last_good_generation_and_crown_jewel_survives \
            self_heal_recovers_a_torn_latest_manifest_by_rollback \
            slatedb_wal_gc_retains_the_frontier_object_INVARIANT \
            strict_does_not_manifest_recover_a_torn_latest_manifest \
            recover_adopts_newest_openable_generation_and_crown_jewel_survives \
            self_heal_walk_skips_a_decodable_but_unopenable_generation \
            generation_structurally_openable_flags_missing_and_torn_referenced_sst \
            no_openable_manifest_error_names_the_invalid_compaction_shape \
            recover_resets_a_corrupt_compactions_object_and_crown_jewel_survives \
            self_heal_resets_a_corrupt_compactions_object \
            compactions_reset_is_a_noop_when_not_corrupt \
            2>&1 | tee kv-recovery.log
          grep -qE 'test result: ok\. 22 passed' kv-recovery.log \
            || { echo "::error::v0.11.x KV recovery battery did not run all 22 (silent skip or a failure)" >&2; exit 1; }
          # ANTI-HOLLOW: each mutation (a cfg(test)-only env seam, compiled to a no-op in shipped binaries)
          # must make its target gate(s) go RED — proving the recovery step it disables is load-bearing
          # (without it: acked data lost, or the store stays unbootable). A gate that PASSES under its
          # mutation is hollow → fail the build.
          check_red() {
            local mut="$1"; shift
            if BOATRAMP_KVMANIFEST_MUTATION="$mut" cargo test -p boatramp-storage --features slatedb --lib -- "$@" > "mut-$mut.log" 2>&1; then
              echo "::error::anti-hollow gate is HOLLOW — it PASSED under BOATRAMP_KVMANIFEST_MUTATION=$mut; the recovery step that mutation disables is not actually exercised by the gate" >&2
              exit 1
            fi
            echo "mutation verified RED: $mut — the disabled recovery step is load-bearing."
          }
          # v0.11.0 MF5: no last-good rollback ⇒ crown-jewel lost / tombstone unpreserved on a torn manifest.
          check_red skip_lastgood \
            self_heal_recovers_a_torn_latest_manifest_by_rollback \
            mf5_acked_tombstone_is_not_resurrected_after_manifest_rollback
          # v0.11.1 openability walk: stopping at the first DECODABLE (not openable) generation ⇒ adopt an
          # unopenable one ⇒ the store does not open / the crown-jewel is lost.
          check_red stop_at_first_decodable \
            recover_adopts_newest_openable_generation_and_crown_jewel_survives \
            self_heal_walk_skips_a_decodable_but_unopenable_generation
          # v0.11.1 compactions-reset: skipping the reset ⇒ the corrupt `.compactions` remains ⇒ reopen fails.
          check_red skip_compactions_reset \
            recover_resets_a_corrupt_compactions_object_and_crown_jewel_survives \
            self_heal_resets_a_corrupt_compactions_object
          # v0.11.1 compactions-reset: quarantining the files but KEEPING the GC boundary ⇒ the fresh id-1
          # create is rejected (ObjectVersionExists) ⇒ reopen still fails.
          check_red keep_compactions_boundary \
            recover_resets_a_corrupt_compactions_object_and_crown_jewel_survives \
            self_heal_resets_a_corrupt_compactions_object

      # Part A quiesce-before-close gates that live outside boatramp-storage:
      #   A2         — the scheduler quiesce (drainer/watchers/crons stop before close) in boatramp-server,
      #   A2-cluster — raft.shutdown() precedes the store close, and A3 — the bounded close deadline,
      #   both in the boatramp binary's serve tests.
      - name: WAL close-ordering gates (scheduler quiesce + raft ordering + bounded close)
        run: |
          set -eo pipefail
          cargo test -p boatramp-server --features handlers --lib \
            a2_quiesce_before_close_no_write_races_the_close 2>&1 | tee wal-a2.log
          grep -qE 'test result: ok\. 1 passed' wal-a2.log \
            || { echo "::error::A2 scheduler-quiesce-before-close gate did not pass" >&2; exit 1; }
          cargo test -p boatramp --bin boatramp -- \
            a2_cluster_raft_shuts_down_before_store_close \
            a3_stalled_close_is_abandoned_at_deadline 2>&1 | tee wal-a3.log
          grep -qE 'test result: ok\. 2 passed' wal-a3.log \
            || { echo "::error::A2-cluster / A3 close-ordering+deadline gates did not pass" >&2; exit 1; }

      # Async-lane persona propagation gate battery (v0.7.3, PLAN-async-persona). Mutation-verified
      # named tests (robust exit-code contract — no marker/grep-loop): the persona seal round-trips +
      # is bound to the SAME envelope as the tenant + TTL/forge/over-cap fail-closed (cose); the host
      # resolver is fail-closed on every absent/expired/forged/anchorless/garbage seal, the terminal
      # -outcome taxonomy distinguishes an EXPIRED seal from a forged one (the operator's "re-ingest"
      # signal), and the UNTRUSTED guest DLQ text is injection-sanitized + bounded (handler_dispatch);
      # and persona extraction takes only a SINGLE scalar (no multi-role widening). A fail-closed→open
      # flip, a reason-collapse, or a dropped sanitizer step turns one of these red.
      - name: async-lane persona propagation gates (host toolchain)
        run: |
          set -eo pipefail
          cargo test -p boatramp-core --features authz --lib \
            signed_context_persona_round_trips_and_is_bound_to_the_same_envelope 2>&1 | tee persona-cose.log
          grep -qE 'test result: ok\. 1 passed' persona-cose.log \
            || { echo "::error::persona seal round-trip / envelope-bound / fail-closed gate did not pass" >&2; exit 1; }
          cargo test -p boatramp-server --features handlers,oidc --lib -- \
            persona_seal_gate:: \
            persona_from_claims_takes_only_a_single_scalar_role 2>&1 | tee persona-host.log
          grep -qE 'test result: ok\. 4 passed' persona-host.log \
            || { echo "::error::async-lane persona host gates (fail-closed resolver / taxonomy / sanitizer / single-scalar) did not pass" >&2; exit 1; }

      # v0.7.4 bundle gates (host toolchain, exit-code contract — no marker/grep-loop): the version
      # endpoint is operator-gated (never public); the blob-upload capability is advertised + grantable
      # and its presigned-only no-STS mint works while prefix/multipart is refused; and a blob-read
      # backend fault is no longer masked as a silent 404. Each is mutation-verified in its own test.
      - name: v0.7.4 version + blob-upload + blob-read-404 gates
        run: |
          set -eo pipefail
          # Version endpoint: operator-only (system·read), never the unauthenticated public path.
          cargo test -p boatramp-types --lib version_endpoint_is_operator_read_gated 2>&1 | tee v-authz.log
          grep -qE 'test result: ok\. 1 passed' v-authz.log \
            || { echo "::error::version endpoint operator-gating gate did not pass" >&2; exit 1; }
          # The `version` subcommand coexists with clap's `--version` flag (tree is structurally valid).
          cargo test -p boatramp --bin boatramp cli_tree_is_valid 2>&1 | tee v-cli.log
          grep -qE 'test result: ok\. 1 passed' v-cli.log \
            || { echo "::error::CLI tree / version-subcommand gate did not pass" >&2; exit 1; }
          # blob-upload capability advertised iff compiled (the construens capabilities-omission gap).
          cargo test -p boatramp-server --features handlers,blob-upload --lib \
            host_capability_features_registry_and_requires_filter 2>&1 | tee bu-reg.log
          grep -qE 'test result: ok\. 1 passed' bu-reg.log \
            || { echo "::error::blob-upload capability-registry gate did not pass" >&2; exit 1; }
          # A declared blob-upload:write/:multipart satisfies the capability token; undeclared refused.
          cargo test -p boatramp --bin boatramp policy_gates_blob_upload_by_either_declared_right 2>&1 | tee bu-tok.log
          grep -qE 'test result: ok\. 1 passed' bu-tok.log \
            || { echo "::error::blob-upload capability-token gate did not pass" >&2; exit 1; }
          # Presigned-only no-STS mint: single-object presigned PUT works with NO STS; prefix/multipart
          # refused; presigned_only mutually exclusive with the STS knobs; unset config still errs loud.
          cargo test -p boatramp-server --features blob-upload-aws --lib -- \
            presigned_only no_sts_mode 2>&1 | tee bu-nosts.log
          grep -qE 'test result: ok\. 5 passed' bu-nosts.log \
            || { echo "::error::blob-upload presigned no-STS mode gates did not pass" >&2; exit 1; }
          # blob-read: a backend/permission fault is logged + coarse-categorized, NOT a silent 404, and
          # the raw SDK error never reaches the guest (the construens blob-read-404 masking trap).
          cargo test -p boatramp-handlers --features engine --lib \
            blob_err_masks_a_backend_fault_but_preserves_notfound 2>&1 | tee blobread.log
          grep -qE 'test result: ok\. 1 passed' blobread.log \
            || { echo "::error::blob-read fault-masking gate did not pass" >&2; exit 1; }
          # blob-read (v0.7.5): a whole-object read (`get-data(0, u64::MAX)`) must NOT forge an
          # out-of-range explicit end (`bytes=0-<huge>`) that strict S3 backends (Tigris/R2/MinIO)
          # 416 — it's a plain GET / open-ended range. The exact bug that 404'd every Tigris read.
          cargo test -p boatramp-storage --features s3 --lib \
            range_header_never_forges_an_out_of_range_end_for_a_whole_object_read 2>&1 | tee blobrange.log
          grep -qE 'test result: ok\. 1 passed' blobrange.log \
            || { echo "::error::blob-read range-header (416/Tigris) gate did not pass" >&2; exit 1; }

  # Stage 0 in-site tenant isolation HARD GATE. The ORM/`sql` tenant scope must isolate tenants
  # on a REAL SQL engine (embedded libsql), not merely in the compiler's string output. The test
  # is `sql`-feature-gated, so the workspace lane (which enables only `boatramp/fs,slatedb`) would
  # silently skip it — a skip is not evidence — so this lane runs it explicitly with `sql` and
  # asserts a success marker, so a silent skip OR a cross-tenant regression fails the merge.
  #
  # Runs on the **host** toolchain (glibc), NOT the musl cross-target: the tenant-scope SQL
  # semantics are libc-independent (a compiled `WHERE`/stamp the engine applies), and a
  # cross-compiled-musl *test binary* + libsql-local's bundled SQLite has a runtime quirk under the
  # static-musl test harness that the production musl binary doesn't hit (managed libsql is proven
  # on musl by the container capability gate + real deployments). Matching the nightly, which runs
  # target-agnostic logic tests on the host toolchain.
  test-orm-tenancy:
    name: test (ORM in-site tenant isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-orm-tenancy-host
      - name: Live in-site tenant isolation on a real libsql engine
        run: |
          set -eo pipefail
          # All nine are `#[ignore]`d (the general workspace lane skips them — a static-musl test
          # binary segfaults in libsql); run them explicitly here, unignored, on the host toolchain.
          # Nine batteries: the Stage 0 single-column model, the Stage 1 per-table-key model, the
          # Stage 3 anonymous-first (TenantOrSession) disjunct, the Stage 4 durable signed-context
          # lane (publish->claim->verify->scope on a real messaging store + libsql), the #503
          # write-global / per-route-allowlist model on a real non-RLS libsql engine, (v0.10.0)
          # the grouped-aggregate cross-tenant PRE-AGGREGATION gate + its LEFT-JOIN semantics companion,
          # (v0.12.x) the opt-in `on_unresolved: pass` null-principal pass-through (zero-rows) gate,
          # and (v0.12.x) the token-source claim-transform derived-key gate (screened / deny-on-no-match
          # / injective namespace).
          cargo test -p boatramp-storage \
            --features sql --test orm_tenant_isolation -- --ignored --nocapture 2>&1 | tee orm-tenancy.log
          grep -qE 'test result: ok\. 9 passed' orm-tenancy.log \
            || { echo "::error::ORM tenant isolation tests did not all pass (silent skip or failure? count drifted from 9?)" >&2; exit 1; }
          grep -q 'ORM IN-SITE TENANT ISOLATION OK' orm-tenancy.log \
            || { echo "::error::ORM tenant isolation never reached its success marker (a cross-tenant breach or a skipped test)" >&2; exit 1; }
          grep -q 'ORM PER-TABLE-KEY TENANCY OK' orm-tenancy.log \
            || { echo "::error::ORM per-table-key tenancy never reached its success marker (a per-table scoping breach or a skipped test)" >&2; exit 1; }
          grep -q 'ORM TENANT-OR-SESSION DISJUNCT OK' orm-tenancy.log \
            || { echo "::error::ORM TenantOrSession disjunct never reached its success marker (an R3 anon/tenant isolation breach or a skipped test)" >&2; exit 1; }
          grep -q 'ORM DURABLE SIGNED-CONTEXT ISOLATION OK' orm-tenancy.log \
            || { echo "::error::ORM durable signed-context lane never reached its success marker (a Stage 4 async-lane isolation breach or a skipped test)" >&2; exit 1; }
          grep -q 'SCOPED UNSCOPED-WRITE CROSS-SURFACE OK \[libsql\]' orm-tenancy.log \
            || { echo "::error::#503 write-global libsql live gate never reached its marker (a non-RLS write-global/allowlist isolation regression or a skipped test)" >&2; exit 1; }
          grep -q 'ORM GROUP-BY CROSS-TENANT PRE-AGGREGATION OK' orm-tenancy.log \
            || { echo "::error::ORM grouped-aggregate gate never reached its marker (a GROUP BY aggregating across tenants, or a skipped test)" >&2; exit 1; }
          grep -q 'ORM LEFT-JOIN AGGREGATE SEMANTICS OK' orm-tenancy.log \
            || { echo "::error::ORM LEFT-JOIN aggregate semantics never reached its marker (a skipped test)" >&2; exit 1; }
          grep -q 'DOMAIN-SOURCE UNRESOLVED PASS-THROUGH OK' orm-tenancy.log \
            || { echo "::error::v0.12.x on_unresolved:pass gate never reached its marker (a null-principal scoped read leaked rows, a resolved host regressed, a write was allowed, or a skipped test)" >&2; exit 1; }
          grep -q 'CLAIM TRANSFORM DERIVED-KEY SAFE OK' orm-tenancy.log \
            || { echo "::error::v0.12.x claim-transform derived-key gate never reached its marker (an unscreened/fallback/non-injective derived tenant key, or a skipped test)" >&2; exit 1; }
          # v0.10.0 grouped-aggregate gate is MUTATION-VERIFIED: dropping the pre-aggregation force_scope
          # (BOATRAMP_ORMGROUPBY_MUTATION=skip_scope) leaks another tenant's rows into the grouped
          # aggregates, so the gate's equality-to-single-tenant baseline MUST fail. A pass-under-mutation
          # (a hollow gate) fails the merge.
          if BOATRAMP_ORMGROUPBY_MUTATION=skip_scope cargo test -p boatramp-storage --features sql \
            --test orm_tenant_isolation -- --ignored \
            orm_group_by_aggregate_is_tenant_confined_pre_aggregation_on_a_real_engine \
            > orm-groupby-mutation.log 2>&1; then
            echo "::error::ORM grouped-aggregate gate is HOLLOW — it passed under skip_scope (a GROUP BY can aggregate across tenants)" >&2
            exit 1
          else
            echo "orm group-by mutation verified: skip_scope leaks tenant B's rows into the aggregates → the gate fails as expected."
          fi
          # v0.12.x on_unresolved:pass gate is MUTATION-VERIFIED: `skip_confine` makes the null-principal
          # pass path run the scoped read WITHOUT the zero-row confinement (treats a null principal as
          # all-rows), so the unresolved-host read leaks BOTH tenants' rows and the ZERO-ROWS assertion
          # MUST fail. A pass-under-mutation (a hollow gate) fails the merge — proving the pass-through
          # relaxes ONLY the pre-handler deny, never the row scoping.
          if BOATRAMP_DOMAINPASS_MUTATION=skip_confine cargo test -p boatramp-storage --features sql \
            --test orm_tenant_isolation -- --ignored \
            domain_source_unresolved_pass_through_is_null_scoped_to_zero_rows_on_a_real_engine \
            > domainpass-mutation.log 2>&1; then
            echo "::error::on_unresolved:pass gate is HOLLOW — it passed under skip_confine (a null-principal pass read can see other tenants' rows)" >&2
            exit 1
          else
            echo "domain-pass mutation verified: skip_confine leaks both tenants' rows into the null-principal read → the gate fails as expected."
          fi
          # v0.12.x claim-transform derived-key gate is MUTATION-VERIFIED: each
          # `BOATRAMP_CLAIMTRANSFORM_MUTATION` disables ONE derived-key screen (via the
          # `claim-transform-gate-mutation` feature, compiled OUT of shipped builds), which MUST turn the
          # gate RED: `skip_derived_screen` resolves a `/`-bearing (path-traversing) key; `extract_fallback`
          # makes a non-matching claim fall back to the verbatim claim and read the VICTIM tenant's rows;
          # `skip_namespace_check` resolves a `:`-bearing namespace (collapsing the injective namespace:span
          # split); `skip_source_mix` models removing the runtime backstop that refuses a namespaced +
          # un-namespaced source list, so a forged verbatim claim reads the victim's rows. A
          # pass-under-mutation (a hollow gate) fails the merge.
          for mut in skip_derived_screen extract_fallback skip_namespace_check skip_source_mix; do
            if BOATRAMP_CLAIMTRANSFORM_MUTATION="$mut" cargo test -p boatramp-storage \
              --features "sql claim-transform-gate-mutation" \
              --test orm_tenant_isolation -- --ignored \
              claim_transform_derived_key_is_screened_denies_and_injective_on_a_real_engine \
              > "claimxform-mutation-$mut.log" 2>&1; then
              echo "::error::claim-transform derived-key gate is HOLLOW — it passed under BOATRAMP_CLAIMTRANSFORM_MUTATION=$mut (a screen the mutation disables is not actually enforced by the gate)" >&2
              exit 1
            else
              echo "claim-transform mutation verified: $mut turns the derived-key gate RED → the screen is load-bearing."
            fi
          done
      - name: "v0.12.4 H2 SQLite KV cancellation-heal gate"
        run: |
          set -eo pipefail
          # H2 cached one shared SQLite/libsql connection; a write whose future is dropped between
          # BEGIN IMMEDIATE and finish() would leave the connection mid-transaction and brick every
          # later control-plane KV write (an attacker-triggerable DoS on a crown-jewel store). The fix
          # heals a zombie transaction on acquire (`lock_clean`). Runs on the HOST toolchain (a
          # static-musl libsql test binary segfaults — same quirk as the ORM tenancy gate above). The
          # gate is a PAIRED clean+mutation test: the clean test leaks an open txn then asserts the next
          # write recovers; `mutation_skip_conn_heal_bricks_the_next_write` arms
          # BOATRAMP_KVSQL_MUTATION=skip_conn_heal and asserts the next write FAILS (RED) — proving the
          # heal is load-bearing, in-process. Single-threaded because both touch the shared mutation env.
          cargo test -p boatramp-storage --features sql --lib -- --test-threads=1 --nocapture \
            kv_sql::sqlite_tests::sqlkv_recovers_from_a_cancelled_write_leaving_an_open_txn \
            kv_sql::sqlite_tests::mutation_skip_conn_heal_bricks_the_next_write 2>&1 | tee kv-cancel-heal.log
          grep -qE 'test result: ok\. 2 passed' kv-cancel-heal.log \
            || { echo "::error::H2 KV cancellation-heal gate did not run (silent skip/failure, or the count drifted from 2)" >&2; exit 1; }
          grep -q 'mutation_skip_conn_heal_bricks_the_next_write ... ok' kv-cancel-heal.log \
            || { echo "::error::H2 cancellation mutation gate did not run — the heal is unproven (a rename or a hollow heal)" >&2; exit 1; }
      - name: "v0.12.5 tenant_or_base BASE-WRITE gate (write:null + target refusal)"
        run: |
          set -eo pipefail
          # A `write:"null"` grant writes ONLY the `tenant_id IS NULL` base partition of a
          # `tenant_or_base` table (shipped since v0.4.16 as `AccessMode::Null`→`ScopeMode::NullOnly`);
          # v0.12.5 adds the TARGET-route refusal (a target carries only `B`, so a base write under it
          # would stamp the shared baseline — a cross-boundary blast). LIVE end-to-end proof on a real
          # libsql file (host toolchain; static-musl segfaults, as the ORM tenancy gate above):
          cargo test -p boatramp-storage --features sql --test catalog_persistence \
            -- --ignored --nocapture 2>&1 | tee catalog-base-write.log
          grep -qE 'test result: ok\. 1 passed' catalog-base-write.log \
            || { echo "::error::catalog base-write live gate did not run (silent skip or a failure)" >&2; exit 1; }
          grep -q 'CATALOG BASE-WRITE OK' catalog-base-write.log \
            || { echo "::error::catalog base-write gate never reached its marker (a base-write isolation regression or a skipped test)" >&2; exit 1; }
          # The MUTATION-VERIFIED unit gate on `write_target` (fast, no DB): the clean run asserts the
          # NULL stamp + the target refusal; then each `BOATRAMP_BASEWRITE_MUTATION` (via the
          # `basewrite-gate-mutation` feature, compiled OUT of shipped builds) disables ONE invariant
          # and MUST turn it RED — `leak_stamp` (a base write stamps a tenant value, not NULL) and
          # `skip_target_guard` (drops the target refusal). A pass-under-mutation (a hollow gate) fails.
          cargo test -p boatramp-core base_write_target_stamps_null_and_refuses_target \
            -- --nocapture 2>&1 | tee basewrite-unit.log
          grep -qE 'test result: ok\. 1 passed' basewrite-unit.log \
            || { echo "::error::base-write write_target unit gate did not run (silent skip or a failure)" >&2; exit 1; }
          grep -q 'BASE-WRITE WRITE-TARGET OK' basewrite-unit.log \
            || { echo "::error::base-write unit gate never reached its marker" >&2; exit 1; }
          for mut in leak_stamp skip_target_guard; do
            if BOATRAMP_BASEWRITE_MUTATION="$mut" cargo test -p boatramp-core \
              --features basewrite-gate-mutation base_write_target_stamps_null_and_refuses_target \
              > "basewrite-mutation-$mut.log" 2>&1; then
              echo "::error::base-write gate is HOLLOW — it passed under BOATRAMP_BASEWRITE_MUTATION=$mut (the NULL stamp or the target refusal is not actually enforced)" >&2
              exit 1
            else
              echo "base-write mutation verified: '$mut' turns write_target RED → the invariant is load-bearing."
            fi
          done
      - name: Owner-gated schema-migration libsql/SQLite parity SUBSTRATE on a real embedded file
        run: |
          set -eo pipefail
          # Embedded-libsql backend parity for `project migrate` (PLAN-migrate-backend-parity, libsql
          # stage). On a REAL embedded libsql file the substrate (LibsqlMigrationRunner): creates the
          # reserved-prefixed `boatramp_migrations_schema_migrations` ledger table; applies + records a
          # `sql` step (origin=apply, recorded effective hash = the immutability signal); rolls a failed
          # multi-statement step back CLEANLY — the 1st statement's DDL is UNDONE (SQLite transactional
          # DDL, the INVERSE of the MySQL partial-apply gate); refuses the `extension` step kind (no
          # guest-loadable SQLite extensions) + a raw CREATE EXTENSION + a self-managed BEGIN/COMMIT +
          # a ledger-table reference, all tokenized under the SQLite dialect (sqlparser SQLiteDialect,
          # so a `--`-comment can't hide a COMMIT); host-mediates the owner-DDL seam (the guest holds
          # NO credential — the file is the trust boundary, there is no owner/runtime role split to
          # model); and records a baseline without running it (U6 origin). Runs on the HOST toolchain
          # (a static-musl test binary segfaults in libsql's bundled SQLite — same quirk as the ORM
          # tenancy gate above), needs no service container (an embedded file under a temp dir), and
          # only the `migrate` feature (⇒ the embedded libsql substrate). A regression fails the
          # assertion.
          cargo test -p boatramp-node --no-default-features --features migrate \
            --test migrate_runner_libsql_live -- --nocapture 2>&1 | tee migrate-libsql.log
          grep -qE 'test result: ok\. 1 passed' migrate-libsql.log \
            || { echo "::error::migrate libsql parity gate did not run (a silent skip or a failure)" >&2; exit 1; }
          grep -q 'MIGRATE LIBSQL PARITY OK' migrate-libsql.log \
            || { echo "::error::migrate libsql parity never reached its marker (a ledger/transactional-rollback/extension-refusal/txn-control-guard/ledger-guard/owner-DDL/baseline regression)" >&2; exit 1; }

  # P0 raw-SQL OWN/SESSION confinement HARD GATE (`RAWSQL OWN-CONFINEMENT AST OK`). The raw-SQL
  # `{scope}` marker for own/session was string-substituted with no AST check, so a guest OR-escaped
  # it (`WHERE 1=1 OR {scope}` -> cross-tenant read+write). The fix force-injects the tenant
  # confinement at the AST level (`boatramp_core::target_sql::rewrite_own_read`/`rewrite_own_write`)
  # for own/session READ and WRITE, exactly as the target-read path + the ORM already do. This lane
  # proves the fix BEHAVIORALLY on a REAL embedded libsql engine (victim tenant B's rows unchanged /
  # not disclosed), then MUTATION-VERIFIES it: it reverts the confinement to the old escapable string
  # marker (and to no-confinement) via `RAWSQL_CONFINE_MUTATION` and asserts the gate then FAILS
  # (non-zero) — so a regression that re-opens the hole fails the merge. `#[ignore]`d (static-musl
  # libsql SIGSEGV, like test-orm-tenancy); run unignored here on the host toolchain.
  test-rawsql-own-confinement:
    name: test (raw-SQL own-confinement AST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-rawsql-own-confinement-host
      - name: Raw-SQL own/session AST confinement on a real libsql engine
        run: |
          set -eo pipefail
          # 1) The real fix must PASS + reach its marker (a silent skip / a cross-tenant breach fails).
          cargo test -p boatramp-storage --features sql --test rawsql_own_confinement \
            -- --ignored --nocapture 2>&1 | tee rawsql-confine.log
          grep -qE 'test result: ok\. 1 passed' rawsql-confine.log \
            || { echo "::error::raw-SQL own-confinement gate did not pass (silent skip or failure?)" >&2; exit 1; }
          grep -q 'RAWSQL OWN-CONFINEMENT AST OK \[libsql\]' rawsql-confine.log \
            || { echo "::error::raw-SQL own-confinement never reached its success marker (a cross-tenant breach or a skipped test)" >&2; exit 1; }
      - name: Mutation-verify the gate genuinely detects the hole (each mutation MUST fail it)
        run: |
          set -eo pipefail
          # Belt-and-suspenders that the gate is not hollow: reverting the AST injection to the OLD
          # escapable string marker (`string-marker`) or to no confinement (`no-confinement`) MUST
          # make the gate FAIL (non-zero). If either mutation still passes, the assertions don't
          # actually depend on the fix — fail the merge.
          for mut in string-marker no-confinement; do
            if RAWSQL_CONFINE_MUTATION="$mut" cargo test -p boatramp-storage --features sql \
                 --test rawsql_own_confinement -- --ignored >/dev/null 2>&1; then
              echo "::error::mutation '$mut' did NOT fail the raw-SQL own-confinement gate — the gate is hollow (it does not depend on the AST fix)" >&2
              exit 1
            fi
            echo "mutation '$mut' correctly FAILED the gate"
          done
          echo "RAWSQL OWN-CONFINEMENT MUTATION-VERIFIED OK"

  # RESOURCE-NAME ALLOWLIST HARD GATE (v0.7.0 breaking cutover). The strict-slug allowlist
  # (`validate_resource_name`) + the two ingress closures (A8 token-role target, A6 project-scope
  # path) + the resolv.conf sink + the escape-hatch containment. Robust exit-code mechanism (the
  # v0.6.4/v0.6.5 style): named `#[test]`s where the TEST EXIT CODE is the contract — NO greppable
  # marker, NO bash env-loop. Each invariant G1–G7 is anti-hollow (its doc comment names the
  # mutation that flips it to a failure). The gate binary carries G1 (charset incl. the homoglyph
  # `аcme`/`acme１`/`café`), G2 (all four mint feeders 4xx a `publisher:${PROJECT}` target — via the
  # real HTTP feeders + the offline predicate), G3 (the offline-token authz-match deny backstop),
  # G4 (A6 generic 400), G5 (the resolv.conf newline invariant predicate), and G7 (the libsql
  # subset drift re-run). G6 (escape-hatch `derived_managed_db_workload(old,n) != (new,n)`) lives in
  # boatramp-storage behind its SQL feature; the resolv.conf `render` mutation witness lives in
  # boatramp-container. This lane runs all three so a non-conforming build fails by exit code.
  test-name-allowlist:
    name: test (resource-name allowlist gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-name-allowlist-host
      # G1–G5 + G7 in the dedicated gate binary; `--features oidc` also runs the OIDC feeder (G2c).
      - name: Name-allowlist gate (G1–G7)
        run: cargo test -p boatramp-server --features oidc --test name_allowlist_gate
      # G6 escape-hatch containment (authoritative copy behind the SQL feature).
      - name: G6 escape-hatch workload inequality
        run: cargo test -p boatramp-storage --features sql-postgres tenant_provision::tests::escape_hatch_workload_differs_by_project
      # The resolv.conf `render` mutation witness (a second injected nameserver line).
      - name: G5 resolv.conf render sink
        run: cargo test -p boatramp-container resolvconf::tests::newline_in_project_cannot_inject_a_second_nameserver_line
      # The offline mint feeder refusal (end-to-end, in the CLI binary).
      - name: Offline mint feeder refuses a non-conforming target
        run: cargo test -p boatramp --bins token::tests::offline_mint_refuses_nonconforming_role_target
      # The charset/authz/scope unit invariants in their home crates.
      - name: Charset + authz-backstop + A6 unit invariants
        run: |
          set -eo pipefail
          cargo test -p boatramp-core --lib project::tests::resource_name_rejects_unicode_homoglyphs
          cargo test -p boatramp-core --lib project::tests::validator_matches_the_slug_oracle
          cargo test -p boatramp-core --features authz --lib cedar::tests::cedar_matches_oracle_default_policy
          cargo test -p boatramp-types --lib authz::tests::nonconforming_grant_target_matches_nothing
          cargo test -p boatramp-server project_scope::tests::nonconforming_project_segment_is_malformed_no_rewrite_no_ctx

  # `{tenant}`-TEMPLATE QUEUE-CONSUMER FAN-IN HARD GATE (v0.7.1). A consumer subscribed to a
  # `bus:sync/{tenant}/import` template must fan IN over every matching concrete per-tenant topic
  # (per-tenant DLQ preserved), non-templated consumers must keep exact-matching unchanged, a
  # message whose SEALED `signed_context` tenant does not equal its concrete topic's `{tenant}`
  # segment must be QUARANTINED (dead-lettered, not delivered), and an uncovered topic with work
  # must raise the orphaned signal. Robust exit-code mechanism (the v0.6.4/v0.6.5 style): named
  # `#[test]`s where the TEST EXIT CODE is the contract — NO greppable marker, NO bash env-loop.
  # The bind-verify gate is anti-hollow (a thread-local mutation seam neuters the tenant-match check
  # → the mismatched message then DELIVERS → the CLEAN lane of the same test FAILS), proving the
  # check is load-bearing. Runs on the SHIPPED musl target (the fan-in dispatch + the matcher +
  # the quarantine + `indexed_topics` primitives).
  test-wildcard-consumer:
    name: test (wildcard queue-consumer fan-in gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-wildcard-consumer-musl
      # The four server-side gates: fan-in (per-concrete delivery + independent DLQ), non-template
      # unchanged, bind-verify quarantine (anti-hollow), orphaned signal.
      - name: Fan-in + bind-verify + orphaned gates (server)
        run: |
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-server --features handlers --lib -- \
            tests::tenant_template_fans_in_over_concrete_topics_each_own_dlq \
            tests::non_template_consumer_still_exact_matches \
            tests::bind_verify_quarantines_a_tenant_seal_mismatch \
            tests::orphaned_signal_fires_only_for_an_uncovered_topic
      # The `{tenant}` matcher + the quarantine + `indexed_topics` primitives in boatramp-core.
      - name: Matcher + quarantine + indexed-topics primitives (core)
        run: |
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-core --lib -- \
            messaging::tests::tenant_tmpl_matches_exact_is_literal_and_binds_no_tenant \
            messaging::tests::tenant_tmpl_matches_template_captures_the_tenant_segment \
            messaging::tests::tenant_tmpl_matches_is_single_segment_never_crosses_slash \
            messaging::tests::tenant_tmpl_matches_repeated_slots_must_agree \
            messaging::tests::dead_letter_quarantines_a_claimed_message_terminally \
            messaging::tests::indexed_topics_enumerates_concrete_topics

  # Stage 5a GraphQL Data Connector TARGET-tenant read isolation HARD GATE. A `@tenant(scope:
  # target)` read must confine to another tenant `B`'s declared PUBLIC subset on a REAL libsql
  # engine (compile -> SQL -> execute -> shape), returning only B's published+non-deleted rows and
  # refusing (deny-by-default) any table with no declared public subset. The test is `#[ignore]`d
  # (the general/musl lanes skip it — a static-musl test binary segfaults in libsql's bundled
  # SQLite, the same runtime quirk as test-orm-tenancy), so this lane runs it unignored on the host
  # toolchain (glibc) and asserts the success marker — a silent skip OR a target-read isolation
  # breach fails the merge.
  test-gdc-target:
    name: test (GDC target-tenant read isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-gdc-target-host
      - name: Live GraphQL target-tenant read isolation on a real libsql engine
        run: |
          set -eo pipefail
          cargo test -p boatramp-server --features handlers,oidc --lib \
            gdc_target_read_isolates_to_b_public_subset_on_a_real_engine \
            -- --ignored --nocapture 2>&1 | tee gdc-target.log
          grep -qE 'test result: ok\. 1 passed' gdc-target.log \
            || { echo "::error::GDC target-tenant read isolation test did not pass (silent skip or failure?)" >&2; exit 1; }
          grep -q 'GDC TARGET-TENANT ISOLATION OK' gdc-target.log \
            || { echo "::error::GDC target-tenant read never reached its success marker (a target-read isolation breach or a skipped test)" >&2; exit 1; }

  # Stage 5a PLAIN-WASM target-tenant read isolation HARD GATE. The non-federated analog of
  # test-gdc-target: a `Tenancy::Target` route's `orm` AND raw-`sql` reads must both confine to
  # another tenant `B`'s declared PUBLIC subset on a REAL libsql engine (HostTenancy::target →
  # orm_scope compile+run AND sql_marker splice+run). `#[ignore]`d (static-musl libsql segfault),
  # run here unignored on the host toolchain + marker-asserted, so a silent skip OR a target-read
  # isolation breach on either binding fails the merge.
  test-target-plain-wasm:
    name: test (plain-wasm target-tenant read isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-target-plain-wasm-host
      - name: Live plain-wasm target-tenant read + write isolation on a real libsql engine
        run: |
          set -eo pipefail
          # The plain-wasm target gates: READ isolation (5a), WRITE isolation (5b), attach_reference,
          # the capability-only exemption, the delegable-capability context round-trip (v0.4.5:
          # mint -> redeem surfaces sub -> read-back -> in-guest client filter), and the per-table
          # TenantOrBase base⊕own/target fold (v0.4.16) — all on a real engine.
          cargo test -p boatramp-server --features handlers,oidc --lib \
            plain_wasm_target \
            -- --ignored --nocapture 2>&1 | tee target-plainwasm.log
          grep -qE 'test result: ok\. 6 passed' target-plainwasm.log \
            || { echo "::error::plain-wasm target-tenant isolation tests did not all pass (silent skip or failure?)" >&2; exit 1; }
          grep -q 'PLAIN-WASM TARGET ISOLATION OK' target-plainwasm.log \
            || { echo "::error::plain-wasm target-tenant READ never reached its success marker (an orm/raw-sql target-read isolation breach or a skipped test)" >&2; exit 1; }
          grep -q 'PLAIN-WASM TENANT-OR-BASE OK' target-plainwasm.log \
            || { echo "::error::plain-wasm TenantOrBase base-fold never reached its success marker (a base⊕own/target confinement breach or a skipped test)" >&2; exit 1; }
          grep -q 'PLAIN-WASM TARGET WRITE ISOLATION OK' target-plainwasm.log \
            || { echo "::error::plain-wasm target-tenant WRITE never reached its success marker (a target-write isolation breach or a skipped test)" >&2; exit 1; }
          grep -q 'PLAIN-WASM TARGET ATTACH-REFERENCE ISOLATION OK' target-plainwasm.log \
            || { echo "::error::plain-wasm target-tenant attach_reference never reached its success marker (a derived-tenant isolation breach or a skipped test)" >&2; exit 1; }
          grep -q 'PLAIN-WASM CAPABILITY TARGET ISOLATION OK' target-plainwasm.log \
            || { echo "::error::plain-wasm capability target never reached its success marker (a capability-exemption isolation breach or a skipped test)" >&2; exit 1; }
          grep -q 'PLAIN-WASM CAPABILITY CONTEXT ROUNDTRIP OK' target-plainwasm.log \
            || { echo "::error::plain-wasm capability context round-trip never reached its success marker (a mint/redeem/read-back regression, a cross-project redeem, or a skipped test)" >&2; exit 1; }
      - name: Live three-key ceiling-exception truth table on a real libsql engine (#470)
        run: |
          set -eo pipefail
          # #470: a route may run a tenancy that EXCEEDS its site's `own` ceiling only under the
          # three-key model — site `allow_ceiling_exceptions` (key 1) + route `exceed_site_ceiling`
          # (key 2) admit the widen at bind, and the operator posture `allow_cross_tenant_db` (key 3)
          # decides whether `all` actually crosses tenants (else clamped to `own`). Drives the REAL
          # bind admission + resolve+clamp + ORM scope against a libsql engine holding tenant A + B
          # rows, so every corner (both keys + posture → cross-tenant; posture off → own; each missing
          # key → fail closed; sibling/gateway no-bleed) is observed in SQL. A regression that lets a
          # single key (or a bleed to a sibling/the gateway) reach cross-tenant fails the assertion.
          cargo test -p boatramp-server --features handlers,oidc --lib \
            ceiling_exception_three_key_truth_table_on_a_real_engine \
            -- --ignored --nocapture 2>&1 | tee threekey.log
          grep -qE 'test result: ok\. 1 passed' threekey.log \
            || { echo "::error::three-key ceiling-exception gate did not run (a silent skip or a failure)" >&2; exit 1; }
          grep -q 'TENANCY OVERRIDE THREE-KEY OK' threekey.log \
            || { echo "::error::three-key ceiling-exception gate never reached its marker (a single-key widen reached cross-tenant, a posture clamp failed, or a sibling/gateway bleed)" >&2; exit 1; }
      - name: Live graphql::run principal-propagation on a real libsql engine (v0.4.6)
        run: |
          set -eo pipefail
          # v0.4.6 (PLAN-async-lane-propagation): a compiled subgraph function reached via the REAL
          # FederationRunner inherits the caller's resolved principal (returns only tenant B's rows);
          # with no principal it fails closed. Proves the async lane can drive a tenant-scoped
          # supergraph read/write with no request bearer, symmetric to emit::invoke.
          cargo test -p boatramp-server --features handlers,oidc --lib \
            graphql_run_propagates_caller_principal_to_a_scoped_subfetch \
            -- --ignored --nocapture 2>&1 | tee gqlprop.log
          grep -qE 'test result: ok\. 1 passed' gqlprop.log \
            || { echo "::error::graphql::run propagation test did not pass (silent skip or failure?)" >&2; exit 1; }
          grep -q 'GRAPHQL-RUN PRINCIPAL PROPAGATION OK' gqlprop.log \
            || { echo "::error::graphql::run principal propagation never reached its success marker (a propagation regression, a widening, or a skipped test)" >&2; exit 1; }
      - name: Live gateway wasm-plane target confinement on a real libsql engine (v0.4.7 Gap 1)
        run: |
          set -eo pipefail
          # v0.4.7 Gap 1: the /graphql gateway resolves target tenant B per fetch and FORCES a
          # HostTenancy::target binding onto a WASM subgraph invocation (invoke_target), confining the
          # guest's own SQL to tenant=B AND <public subset>. Returns ONLY B's public row (never B's
          # private row, never A's); no resolved target ⇒ fail closed. A leak (wrong tenant / private
          # row / no confinement) fails the assertion.
          cargo test -p boatramp-server --features handlers,capability,oidc --lib \
            gateway_forces_target_confinement_onto_a_wasm_subgraph \
            -- --ignored --nocapture 2>&1 | tee gwtarget.log
          grep -qE 'test result: ok\. 1 passed' gwtarget.log \
            || { echo "::error::gateway wasm-target gate did not pass (silent skip or failure?)" >&2; exit 1; }
          grep -q 'GATEWAY WASM-TARGET OK' gwtarget.log \
            || { echo "::error::gateway wasm-plane target confinement never reached its success marker (a target-axis widening, a public-subset breach, or a skipped test)" >&2; exit 1; }
      - name: Live gateway target_or_null (base⊕target) on a real libsql engine (v0.4.8)
        run: |
          set -eo pipefail
          # v0.4.8: scope:target_or_null reads B's public rows PLUS the shared NULL-tenant base floor,
          # each confined to the public subset — never B's private row, never a non-public base row,
          # never another tenant's row. A base-floor loss (no base_pub) OR a leak fails the assertion.
          cargo test -p boatramp-server --features handlers,capability,oidc --lib \
            gateway_target_or_null_includes_the_shared_base \
            -- --ignored --nocapture 2>&1 | tee gwton.log
          grep -qE 'test result: ok\. 1 passed' gwton.log \
            || { echo "::error::gateway target_or_null gate did not pass (silent skip or failure?)" >&2; exit 1; }
          grep -q 'GATEWAY TARGET-OR-NULL OK' gwton.log \
            || { echo "::error::gateway target_or_null never reached its marker (base floor lost, a public-subset breach, or a cross-tenant leak)" >&2; exit 1; }
      - name: Live gateway OWN-principal propagation on a real libsql engine (v0.4.11)
        run: |
          set -eo pipefail
          # v0.4.11: the EXTERNAL /graphql federation gateway propagates the caller's resolved OWN
          # principal to a wasm subgraph fetch, so a post-P48 host-forced `own` read returns the
          # caller's tenant rows instead of failing closed. Caller principal = tenant B ⇒ ONLY B's
          # rows; an empty (anon) principal ⇒ fail closed (anon NOT widened). A regression (empty
          # principal again, a cross-tenant leak, or an anon widening) fails the assertion.
          cargo test -p boatramp-server --features handlers,oidc --lib \
            gateway_propagates_caller_own_principal_to_a_wasm_subgraph \
            -- --ignored --nocapture 2>&1 | tee gwown.log
          grep -qE 'test result: ok\. 1 passed' gwown.log \
            || { echo "::error::gateway own-propagation gate did not pass (silent skip or failure?)" >&2; exit 1; }
          grep -q 'GATEWAY OWN-PROPAGATION OK' gwown.log \
            || { echo "::error::gateway own-principal propagation never reached its marker (a dropped principal, a cross-tenant leak, or an anon widening)" >&2; exit 1; }
      - name: Live present-token verify/seal/resolve chain + batch isolation (v0.4.7 Gap 3)
        run: |
          set -eo pipefail
          # v0.4.7 Gap 3: a guest-presented app JWT is HOST-verified against the component's
          # token_claims, its tenant host-sealed, and the sealed durable context resolves back to that
          # tenant; a forged / wrong-issuer token seals nothing (fail-closed). Plus the per-message
          # batch-isolation of the shared producer-context cell (the security-review Finding-1 fix).
          cargo test -p boatramp-server --features handlers,capability,oidc --lib \
            gap3_tests:: -- --nocapture 2>&1 | tee presenttoken.log
          # 3 tests: the present-token verify/seal/resolve chain, the per-message batch-isolation of
          # the shared producer-context cell, and (v0.7.3) the persona extractor's single-scalar rule
          # (`persona_from_claims`), which lives in this same seal-path module.
          grep -qE 'test result: ok\. 3 passed' presenttoken.log \
            || { echo "::error::present-token gate did not pass 3 tests (silent skip or failure?)" >&2; exit 1; }
          grep -q 'PRESENT-TOKEN CHAIN OK' presenttoken.log \
            || { echo "::error::present-token verify/seal/resolve chain never reached its success marker (a verification bypass, a guest naming an arbitrary tenant, or a skipped test)" >&2; exit 1; }
      - name: Live consumer signed-context dispatch isolation on a real libsql engine (v0.4.17)
        run: |
          set -eo pipefail
          # v0.4.17: the site-consumers async lane resolves EACH claimed message's host-sealed
          # signed_context into that message's binding (the R1 producer-stamp the consumer never
          # read). Through the exact new seam (ConsumerRebuild::bindings_for): a valid fleet-signed
          # envelope scopes a real libsql engine to the originator's tenant ONLY; an unsealed OR a
          # forged message resolves no principal and fails an own op closed (never cross-tenant,
          # never unscoped). The resolved principal is the same value that propagates onto a
          # graphql::run sub-fetch. A leak / a widening / a fail-open regression fails the assertion.
          cargo test -p boatramp-server --features handlers,oidc --lib \
            consumer_signed_context_dispatch_resolves_per_message_tenant_on_a_real_engine \
            -- --nocapture 2>&1 | tee consumer-sctx.log
          grep -qE 'test result: ok\. 1 passed' consumer-sctx.log \
            || { echo "::error::consumer signed-context dispatch gate did not pass (silent skip or failure?)" >&2; exit 1; }
          grep -q 'CONSUMER SIGNED-CONTEXT DISPATCH OK' consumer-sctx.log \
            || { echo "::error::consumer signed-context dispatch never reached its marker (a dropped per-message resolve, a cross-tenant leak, or a fail-open on an unsealed/forged message)" >&2; exit 1; }
      - name: Managed-dependency readiness gate (v0.4.19)
        run: |
          set -eo pipefail
          # v0.4.19: a component whose required host-MANAGED database is still starting must gate
          # with a retryable 503 + Retry-After (fail-closed, guest never runs), NOT run into a
          # confusing "not granted". Driven through the real `build_bindings` with a fake provider:
          # managed-not-ready (SqlError::Unavailable) -> BindingsError::NotReady; a transient blip is
          # caught by the bounded readiness retry; an external/local DB outage is skipped (per-DB
          # resilience, NOT gated); the gate response is a 503 with Retry-After. A fail-open
          # regression (a not-ready managed DB NOT gating) fails the assertion.
          cargo test -p boatramp-server --features handlers,oidc --lib \
            managed_dependency_not_ready_gates_with_a_retryable_503 \
            -- --nocapture 2>&1 | tee readiness-gate.log
          grep -qE 'test result: ok\. 1 passed' readiness-gate.log \
            || { echo "::error::managed-dependency readiness gate did not pass (silent skip or failure?)" >&2; exit 1; }
          grep -q 'MANAGED-DEP READINESS GATE OK' readiness-gate.log \
            || { echo "::error::managed-dependency readiness never reached its marker (a fail-open on a not-ready managed DB, a lost retry, or a gated non-managed outage)" >&2; exit 1; }
      - name: Live guest-egress extra-CA TLS trust on a real loopback handshake (v0.4.17)
        run: |
          set -eo pipefail
          # v0.4.17: the dev-posture guest-egress extra-CA option makes the guest's outbound wasi:http
          # TLS client trust an operator-supplied extra root ON TOP of the webpki roots (a hermetic
          # HTTPS test-double lever). A REAL loopback TLS handshake to a test-CA server succeeds WITH
          # the extra CA supplied and is REJECTED without it — trust is widened, never bypassed (full
          # certificate verification always runs). A verification-bypass regression fails the assertion.
          cargo test -p boatramp-handlers --features engine --lib \
            egress_tls_tests:: -- --nocapture 2>&1 | tee egress-ca.log
          grep -qE 'test result: ok\. 1 passed' egress-ca.log \
            || { echo "::error::guest-egress extra-CA gate did not pass (silent skip or failure?)" >&2; exit 1; }
          grep -q 'GUEST-EGRESS EXTRA-CA OK' egress-ca.log \
            || { echo "::error::guest-egress extra-CA never reached its marker (a verification bypass, trust not actually widened, or a skipped test)" >&2; exit 1; }
      - name: Live deploy-resilience async-deploy + batch-compose invariant on a real libsql engine (v0.4.22)
        run: |
          set -eo pipefail
          # v0.4.22 deploy-resilience #1b/#3: the accept-then-validate async deploy must NEVER flip the
          # served `active` to a component that failed validation, and the batch compose must
          # validate-before-promote. Over the REAL wasm engine + REAL libsql: an async deploy of an
          # uncompilable component returns Failed WITHOUT flipping `active` (the validated version keeps
          # serving real gateway traffic and the supergraph still composes); a valid async deploy reaches
          # Active and only THEN flips `active`; a batch of N staged subgraphs composes with exactly ONE
          # version bump while a non-composing batch promotes nothing. A regression (an unvalidated
          # component becoming active/serving, or a half-promoted batch) fails the assertion.
          cargo test -p boatramp-server --features handlers,oidc --lib \
            async_deploy_never_activates_or_serves_an_unvalidated_component \
            -- --ignored --nocapture 2>&1 | tee deployres.log
          grep -qE 'test result: ok\. 1 passed' deployres.log \
            || { echo "::error::deploy-resilience async/batch gate did not pass (silent skip or failure?)" >&2; exit 1; }
          grep -q 'DEPLOY-RESILIENCE ASYNC/BATCH OK' deployres.log \
            || { echo "::error::deploy-resilience async/batch invariant never reached its marker (an unvalidated component activated or served, a lost old version, or a half-promoted/over-bumped batch)" >&2; exit 1; }

  # The SAME Stage 0 tenant-isolation invariant, but on REAL Postgres and MySQL. The ORM emits
  # portable `?N` SQL that the external-SQL backend rewrites to each engine's native placeholder
  # style ($N on PG, ? on MySQL); a per-dialect rendering bug in the SCOPED predicate could drop
  # the tenant filter on one engine and not another, so the #1 invariant is proven on every engine
  # the ORM targets — not just the libsql gate above. Postgres + MySQL come up as service
  # containers; the env-gated test runs both batteries and prints a per-engine marker that the grep
  # requires (a silent skip or a cross-tenant regression on either engine fails the merge). Host
  # toolchain (real TCP + the sqlx drivers), matching test-orm-tenancy.
  test-orm-tenancy-sqlx:
    name: test (ORM tenant isolation on Postgres + MySQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boatramp
          POSTGRES_PASSWORD: boatramp
          POSTGRES_DB: boatramp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boatramp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_USER: boatramp
          MYSQL_PASSWORD: boatramp
          MYSQL_DATABASE: boatramp
          MYSQL_ROOT_PASSWORD: boatramp
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uboatramp -pboatramp --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-orm-tenancy-sqlx-host
      - name: Live in-site tenant isolation on Postgres + MySQL
        env:
          BOATRAMP_TEST_PG_URL: postgres://boatramp:boatramp@localhost:5432/boatramp
          BOATRAMP_TEST_MYSQL_URL: mysql://boatramp:boatramp@localhost:3306/boatramp
        run: |
          set -eo pipefail
          # Both engines' batteries must actually RUN (URLs set above) — a skipped engine still
          # reports `ok`, so we additionally require both per-engine success markers.
          cargo test -p boatramp-storage --features sql-postgres,sql-mysql \
            --test orm_tenant_isolation_sqlx_live -- --nocapture --test-threads=1 2>&1 | tee orm-sqlx.log
          grep -qE 'test result: ok\. 2 passed' orm-sqlx.log \
            || { echo "::error::ORM sqlx tenant isolation did not run both engines (a silent skip or a failure)" >&2; exit 1; }
          grep -q 'ORM IN-SITE TENANT ISOLATION OK \[postgres\]' orm-sqlx.log \
            || { echo "::error::Postgres ORM tenant isolation never reached its marker (cross-tenant breach or skip)" >&2; exit 1; }
          grep -q 'ORM IN-SITE TENANT ISOLATION OK \[mysql\]' orm-sqlx.log \
            || { echo "::error::MySQL ORM tenant isolation never reached its marker (cross-tenant breach or skip)" >&2; exit 1; }
          # Stage 1 per-table-key model on each engine (same test fns; a second battery per engine).
          grep -q 'ORM PER-TABLE-KEY TENANCY OK \[postgres\]' orm-sqlx.log \
            || { echo "::error::Postgres ORM per-table-key tenancy never reached its marker (per-table scoping breach or skip)" >&2; exit 1; }
          grep -q 'ORM PER-TABLE-KEY TENANCY OK \[mysql\]' orm-sqlx.log \
            || { echo "::error::MySQL ORM per-table-key tenancy never reached its marker (per-table scoping breach or skip)" >&2; exit 1; }
          # Stage 3 R3 anonymous-first (TenantOrSession) disjunct + promote, per engine.
          grep -q 'ORM TENANT-OR-SESSION DISJUNCT OK \[postgres\]' orm-sqlx.log \
            || { echo "::error::Postgres R3 TenantOrSession disjunct never reached its marker (anon/tenant/session breach or skip)" >&2; exit 1; }
          grep -q 'ORM TENANT-OR-SESSION DISJUNCT OK \[mysql\]' orm-sqlx.log \
            || { echo "::error::MySQL R3 TenantOrSession disjunct never reached its marker (anon/tenant/session breach or skip)" >&2; exit 1; }
          # v0.4.12: a portable SqlValue::Json binds as Postgres jsonb, so it type-unifies with a
          # jsonb column in COALESCE / comparison / || (not only INSERT). A regression (the pre-fix
          # "jsonb and json cannot be matched") fails the assertion. Postgres-only.
          grep -q 'ORM JSONB LITERAL OK \[postgres\]' orm-sqlx.log \
            || { echo "::error::Postgres jsonb-literal unification never reached its marker (a json/jsonb type-unification regression or a skip)" >&2; exit 1; }
          # v0.4.9: a tenant-scoped upsert (ON CONFLICT DO UPDATE) executes on Postgres (the
          # host-injected own-guard column is target-qualified, not ambiguous) AND can't clobber
          # another tenant's row via a shared non-tenant conflict key. Postgres-only: a scoped
          # upsert is refused at compile on MySQL (fail-closed). SQLite tolerates the bare form,
          # so the ambiguity — and thus this regression — is only observable on a real Postgres.
          grep -q 'ORM UPSERT GUARD OK \[postgres\]' orm-sqlx.log \
            || { echo "::error::Postgres scoped-upsert guard never reached its marker (a DO-UPDATE ambiguity regression or a cross-tenant upsert clobber, or a skip)" >&2; exit 1; }
          # #503: the write-global / per-route-allowlist model on each engine — a read:own route reads
          # ONLY its own rows (a write-global grant does NOT widen reads, G2) AND writes a genuinely-
          # global table UNSTAMPED; a listed plain-unscoped table too; an unlisted plain-unscoped write
          # stays refused. A cross-tenant read leak or a wrongly-scoped global write fails the assertion.
          grep -q 'SCOPED UNSCOPED-WRITE CROSS-SURFACE OK \[postgres\]' orm-sqlx.log \
            || { echo "::error::Postgres #503 write-global gate never reached its marker (a read-widening/G2 or write-global scoping regression, or a skip)" >&2; exit 1; }
          grep -q 'SCOPED UNSCOPED-WRITE CROSS-SURFACE OK \[mysql\]' orm-sqlx.log \
            || { echo "::error::MySQL #503 write-global gate never reached its marker (a read-widening/G2 or write-global scoping regression, or a skip)" >&2; exit 1; }
      - name: Raw-SQL own/session AST confinement on real Postgres + MySQL (P0 fix)
        env:
          BOATRAMP_TEST_PG_URL: postgres://boatramp:boatramp@localhost:5432/boatramp
          BOATRAMP_TEST_MYSQL_URL: mysql://boatramp:boatramp@localhost:3306/boatramp
        run: |
          set -eo pipefail
          # The P0 raw-SQL own/session confinement fix, proven on the per-dialect SQL the rewrite
          # emits (an OR-escape / re-tenant / force-stamp bug could manifest on one engine's grammar
          # but not another). Both engines' batteries must RUN (URLs set) + reach their markers.
          cargo test -p boatramp-storage --features sql-postgres,sql-mysql \
            --test rawsql_own_confinement -- --nocapture --test-threads=1 2>&1 | tee rawsql-sqlx.log
          grep -qE 'test result: ok\. 2 passed' rawsql-sqlx.log \
            || { echo "::error::raw-SQL own-confinement did not run both engines (a silent skip or a failure)" >&2; exit 1; }
          grep -q 'RAWSQL OWN-CONFINEMENT AST OK \[postgres\]' rawsql-sqlx.log \
            || { echo "::error::Postgres raw-SQL own-confinement never reached its marker (a cross-tenant breach or a skip)" >&2; exit 1; }
          grep -q 'RAWSQL OWN-CONFINEMENT AST OK \[mysql\]' rawsql-sqlx.log \
            || { echo "::error::MySQL raw-SQL own-confinement never reached its marker (a cross-tenant breach or a skip)" >&2; exit 1; }
      - name: Mutation-verify the raw-SQL confinement gate on Postgres + MySQL (each mutation MUST fail)
        env:
          BOATRAMP_TEST_PG_URL: postgres://boatramp:boatramp@localhost:5432/boatramp
          BOATRAMP_TEST_MYSQL_URL: mysql://boatramp:boatramp@localhost:3306/boatramp
        run: |
          set -eo pipefail
          # Reverting the AST injection to the OLD escapable string marker (`string-marker`) or to no
          # confinement (`no-confinement`) MUST make the gate FAIL (non-zero) on the real engines too —
          # so the per-dialect gate is not hollow.
          for mut in string-marker no-confinement; do
            if RAWSQL_CONFINE_MUTATION="$mut" cargo test -p boatramp-storage \
                 --features sql-postgres,sql-mysql --test rawsql_own_confinement \
                 -- --test-threads=1 >/dev/null 2>&1; then
              echo "::error::mutation '$mut' did NOT fail the raw-SQL own-confinement gate on PG/MySQL — the gate is hollow" >&2
              exit 1
            fi
            echo "mutation '$mut' correctly FAILED the gate on PG/MySQL"
          done
          echo "RAWSQL OWN-CONFINEMENT MUTATION-VERIFIED OK [postgres+mysql]"
      - name: RLS tenant session GUC backstop on a real non-superuser Postgres role (v0.4.20)
        env:
          BOATRAMP_TEST_PG_URL: postgres://boatramp:boatramp@localhost:5432/boatramp
        run: |
          set -eo pipefail
          # v0.4.20: the host-resolved tenant is exposed as an RLS session GUC so an app's Postgres
          # RLS mirrors boatramp's injected predicate (defense-in-depth). On a real PG as a
          # NON-superuser role (the itests use the superuser, which BYPASSES RLS) against a
          # FORCE-RLS table: own reads/writes see + admit only the resolved tenant and reject a
          # forged one; an `all` provisioning write derives the GUC from the row the statement
          # declares (typed + raw extractors) so creating tenant B succeeds yet cannot touch A. A
          # missing GUC / a cross-tenant leak fails the assertion.
          cargo test -p boatramp-storage --features sql-postgres \
            --test rls_guc_sqlx_live -- --nocapture --test-threads=1 2>&1 | tee rls-guc.log
          grep -qE 'test result: ok\. 1 passed' rls-guc.log \
            || { echo "::error::RLS tenant GUC gate did not run (a silent skip — BOATRAMP_TEST_PG_URL unset — or a failure)" >&2; exit 1; }
          grep -q 'RLS TENANT GUC OK \[postgres\]' rls-guc.log \
            || { echo "::error::RLS tenant GUC never reached its marker (the GUC didn't drive RLS, a forged-tenant write slipped through, or an all-write couldn't provision)" >&2; exit 1; }
          # v0.4.21: an `all` READ writes a reserved marker to the tenant GUC so a table that opts in
          # (`USING … OR guc = marker`) opens cross-tenant, while a strict table + every write + an
          # unset GUC stay fail-closed. A leak (marker over-opening) fails the assertion.
          grep -q 'RLS ALL-READ MARKER OK \[postgres\]' rls-guc.log \
            || { echo "::error::RLS all-read marker never reached its marker (the marker didn't open an opted-in all-read, or it leaked to a non-opted table / a write)" >&2; exit 1; }
      - name: Owner-gated schema-migration owner-role confinement on a real Postgres (v0.4.25)
        env:
          BOATRAMP_TEST_PG_URL: postgres://boatramp:boatramp@localhost:5432/boatramp
        run: |
          set -eo pipefail
          # v0.4.25: the owner-gated migration surface runs DDL as a per-project NON-superuser owner
          # role (the owner's constraint), never the cluster superuser. On a real PG, the REAL
          # provision_ddl three-identity model is stood up and, as the owner role, every cluster-escape
          # primitive (CREATE DATABASE/ROLE, ALTER ROLE SUPERUSER, COPY TO PROGRAM, CREATE EXTENSION
          # dblink/postgres_fdw, pg_read_file) is DENIED by privilege while a legit CREATE TABLE + FORCE
          # RLS succeeds; the runtime role gets default-privileges DML but is a non-owner and cannot
          # escalate. A confinement breach (any escape succeeding) fails the assertion.
          cargo test -p boatramp-storage --features sql-postgres \
            --test migrate_owner_role_sqlx_live -- --nocapture 2>&1 | tee migrate-owner.log
          grep -qE 'test result: ok\. 1 passed' migrate-owner.log \
            || { echo "::error::migrate owner-role confinement gate did not run (a silent skip or a failure)" >&2; exit 1; }
          grep -q 'MIGRATE OWNER-ROLE CONFINEMENT OK \[postgres\]' migrate-owner.log \
            || { echo "::error::migrate owner-role confinement never reached its marker (a cluster-escape succeeded as the non-superuser owner, or the runtime role gained ownership/escalation)" >&2; exit 1; }
      - name: Owner-gated schema-migration SUBSTRATE ledger on a real Postgres (v0.4.25)
        env:
          BOATRAMP_TEST_PG_URL: postgres://boatramp:boatramp@localhost:5432/boatramp
        run: |
          set -eo pipefail
          # v0.4.25: the migration SUBSTRATE (the node seam the server orchestrator drives) applies a
          # sql/extension step + records its ledger row atomically, ATOMIC per-step (a failing 2nd
          # statement leaves no table + no ledger row), the extension allowlist + raw-CREATE-EXTENSION
          # rejection, the owner-DDL seam's S3 ledger-schema + S4 transaction-control guards (incl. the
          # comment-evasion cases the byte scan missed), and the U6 baseline origin — all on a real
          # engine. Needs the `migrate` feature (the owner-DDL seam). A regression fails the assertion.
          cargo test -p boatramp-node --features sql-postgres,migrate \
            --test migrate_runner_sqlx_live -- --nocapture 2>&1 | tee migrate-runner.log
          grep -qE 'test result: ok\. 1 passed' migrate-runner.log \
            || { echo "::error::migrate substrate ledger gate did not run (a silent skip or a failure)" >&2; exit 1; }
          grep -q 'MIGRATE RUNNER LEDGER OK \[postgres\]' migrate-runner.log \
            || { echo "::error::migrate substrate ledger never reached its marker (a ledger/atomic-rollback/extension-allowlist/owner-DDL-guard/baseline-origin regression)" >&2; exit 1; }
      - name: Provisioning drift-repair reconcile on a real Postgres (#491)
        env:
          BOATRAMP_TEST_PG_URL: postgres://boatramp:boatramp@localhost:5432/boatramp
        run: |
          set -eo pipefail
          # #491: the owner-gated, idempotent, DATA-PRESERVING `repair` verb reconciles a pre-v0.4.25
          # shared-Postgres tenant (db owned by the runtime role, no `_owner` role) on a real Postgres,
          # driving the SHIPPED NodeTenantRepair. A tenant is provisioned then MUTATED to the pre-model
          # shape (dropped owner role, db re-owned to runtime, a runtime-owned table, a superuser-owned
          # table, a superuser-owned SEQUENCE, and an overloaded superuser-owned FUNCTION). The gate
          # asserts against the LIVE pg catalog (not the report): a dry-run reports drift + re-owns
          # NOTHING; an apply recreates + seals the owner role (safe attrs) and re-owns the db + BOTH
          # tables + the sequence + BOTH function overloads + the ledger to the owner (so a table-only
          # converge that missed the sequence/function arms would FAIL); a re-apply converges NOTHING
          # (idempotent); a second tenant's ownership is UNTOUCHED (scope); the runtime role still
          # connects; and repair over a soft-deleted tenant is a zero-action no-op. A regression on any
          # of these fails the assertion. The BOATRAMP_TEST_PG_URL user is a superuser (CREATE ROLE /
          # CREATE DATABASE / ALTER DATABASE OWNER / REASSIGN OWNED).
          cargo test -p boatramp-node --features sql-postgres,migrate \
            --test repair_reconcile_pg_live -- --nocapture 2>&1 | tee repair-reconcile.log
          grep -qE 'test result: ok\. 1 passed' repair-reconcile.log \
            || { echo "::error::provisioning drift-repair gate did not run (a silent skip — BOATRAMP_TEST_PG_URL unset — or a failure)" >&2; exit 1; }
          grep -q 'PROVISION REPAIR RECONCILE OK' repair-reconcile.log \
            || { echo "::error::provisioning drift-repair never reached its marker (a re-ownership/idempotency/scope/isolation/soft-delete regression — the db/table/sequence/function was not re-owned to the owner role, or repair touched a soft-deleted or second tenant)" >&2; exit 1; }
      - name: Owner-gated schema-migration FUNCTION-STEP path on a real Postgres (v0.4.25)
        env:
          BOATRAMP_TEST_PG_URL: postgres://boatramp:boatramp@localhost:5432/boatramp
        run: |
          set -eo pipefail
          # v0.4.25: the function-step BASE, end to end with a REAL compiled guest + REAL engine + REAL
          # orchestrator + REAL substrate. Proves: a function step's migrate::exec runs owner DDL and is
          # recorded (kind=function); the S1 binding-split (the function sees NO tenant sql binding); the
          # S2 context-gate (the same component as a normal request => not-a-migration, DDL never runs);
          # the S3 ledger-schema guard via a function; S7 at-least-once (a failed step is not recorded +
          # re-attempted); and #480 baseline (record without running, then suffix-only apply). Any of
          # these regressing fails the assertion.
          cargo test -p boatramp-node --features sql-postgres,migrate \
            --test migrate_function_live -- --nocapture 2>&1 | tee migrate-fn.log
          grep -qE 'test result: ok\. 1 passed' migrate-fn.log \
            || { echo "::error::migrate function-step gate did not run (a silent skip or a failure)" >&2; exit 1; }
          grep -q 'MIGRATE FUNCTION-STEP OK \[postgres\]' migrate-fn.log \
            || { echo "::error::migrate function-step never reached its marker (a function-DDL/binding-split/context-gate/ledger-guard/idempotent/baseline regression)" >&2; exit 1; }
      - name: Schema-migration MySQL parity SUBSTRATE on a real MySQL
        env:
          BOATRAMP_TEST_MYSQL_URL: mysql://boatramp:boatramp@localhost:3306/boatramp
          # The DDL identity (owner-role analog) MUST be distinct from the runtime user — the CI
          # service container's root account. The test derives the DDL URL from these + the runtime
          # host/port/db, so migration DDL never runs as the runtime `boatramp` tenant user.
          BOATRAMP_TEST_MYSQL_ROOT_USER: root
          BOATRAMP_TEST_MYSQL_ROOT_PASSWORD: boatramp
        run: |
          set -eo pipefail
          # MySQL backend parity for `project migrate` (PLAN-migrate-backend-parity, MySQL stage). On a
          # REAL MySQL the substrate: connects as a DISTINCT DDL login (`migration_url_env`), never the
          # runtime user (absent it, migrate REFUSES fail-closed — asserted in unit tests); creates the
          # InnoDB `boatramp_migrations` ledger DATABASE + table; applies + records a `sql` step
          # (origin=apply, recorded effective hash for the immutability signal); reports a mid-DDL
          # failure as PARTIALLY APPLIED with the 1st statement NOT rolled back (MySQL auto-commits each
          # DDL — the honest weaker-than-Postgres caveat, the inverse of the PG rollback gate); refuses
          # the `extension` step kind (no CREATE EXTENSION on MySQL) + a raw CREATE EXTENSION + a
          # self-managed BEGIN/COMMIT; enforces the owner-DDL S3 ledger-DB + S4 txn-control guards under
          # the MySQL dialect (a `#`-comment can't hide a COMMIT); and records a baseline without running
          # it (U6 origin). A regression fails the assertion.
          cargo test -p boatramp-node --features sql-mysql,migrate \
            --test migrate_runner_mysql_live -- --nocapture 2>&1 | tee migrate-mysql.log
          grep -qE 'test result: ok\. 1 passed' migrate-mysql.log \
            || { echo "::error::migrate MySQL parity gate did not run (a silent skip — BOATRAMP_TEST_MYSQL_URL unset — or a failure)" >&2; exit 1; }
          grep -q 'MIGRATE MYSQL PARITY OK' migrate-mysql.log \
            || { echo "::error::migrate MySQL parity never reached its marker (a ledger/DDL-identity/partial-apply/extension-refusal/owner-DDL-guard/baseline regression)" >&2; exit 1; }
      - name: Schema-migration MySQL refusal + guard UNIT tests (no live DB)
        run: |
          set -eo pipefail
          # Security review MEDIUM-1: the live gate above proves the happy path, but the
          # SECURITY-CRITICAL refusals are host-side unit tests that never touch a live DB and so
          # would otherwise only run in nightly `--all-features`. Run the boatramp-node `sql-mysql`
          # unit tests here so a regression in ANY of them fails the merge: the distinct-DDL-identity
          # refusal (HIGH-1: no `migration_url_env`, an identical URL, an equivalent DSN that
          # authenticates as the SAME username), the compute-backed-managed refusal (HIGH-2), and —
          # transitively via boatramp-core — the `/*! … */` executable-comment guard (CRITICAL-1).
          cargo test -p boatramp-node --features sql-mysql --lib managed_sql -- --nocapture 2>&1 | tee migrate-mysql-unit.log
          grep -qE 'test result: ok\.' migrate-mysql-unit.log \
            || { echo "::error::MySQL migrate unit tests did not run (a compile/skip regression)" >&2; exit 1; }
          for t in mysql_refuses_without_a_distinct_ddl_user \
                   mysql_refuses_when_ddl_url_equals_runtime_url \
                   mysql_refuses_same_username_even_when_dsn_strings_differ \
                   mysql_allows_a_distinct_ddl_username \
                   mysql_refuses_compute_backed_managed_migration; do
            grep -q "$t ... ok" migrate-mysql-unit.log \
              || { echo "::error::MySQL migrate refusal unit test '$t' did not pass (a distinctness/compute-backed refusal regression)" >&2; exit 1; }
          done
          # The `/*! … */` executable-comment guard (CRITICAL-1) lives in boatramp-core; run it too so
          # a regression in the neutralization / classification fails the merge.
          cargo test -p boatramp-core --lib sql::migration_guard_tests -- --nocapture 2>&1 | tee migrate-guard-unit.log
          grep -q 'mysql_executable_comment_is_refused_by_every_guard ... ok' migrate-guard-unit.log \
            || { echo "::error::MySQL executable-comment guard test did not pass (a /*! */ evasion regression)" >&2; exit 1; }
          grep -q 'postgres_treats_executable_comment_syntax_as_inert ... ok' migrate-guard-unit.log \
            || { echo "::error::Postgres executable-comment inertness test did not pass (a PG guard regression)" >&2; exit 1; }

  # ============================================================================================
  # kv-sql backend family (v0.12.0): the SQL-backed control-plane KvStore + multi-writer `shared`
  # coordination (SQLite/libsql single-writer; Postgres/MySQL multi-writer, self-coordinating).
  # This is a SECURITY-CORE build (PLAN-kv-sql-backend, 3-role panel): the multi-writer half rests
  # on crown-jewel value-CAS (MF-1/MF-2), a stale-authz fence + fail-closed (MF-3/MF-4), a non-Raft
  # single-leader election + positive control-plane identity (C1/UX-C1), and MF-6 custody. Every one
  # of those invariants gets a gate here, and — the anti-hollow contract — every gate is run under a
  # cfg(test)/feature-gated mutation seam (`BOATRAMP_KVSQL_MUTATION`, compiled OUT of shipped builds)
  # that MUST turn the gate RED; a gate that still PASSES under its mutation is hollow and fails the
  # job. Postgres + MySQL come up as service containers (modelled on `test-orm-tenancy-sqlx`); the
  # live gates print per-engine `… OK [postgres]`/`[mysql]` markers that the greps require, so a
  # silent skip (service down / URL unset ⇒ the live tests early-return `ok`) cannot pass unnoticed.
  # Host toolchain (real TCP + the sqlx drivers). See PLAN-kv-sql-backend.md.
  test-kv-sql-backend:
    name: test (kv-sql backend + shared-mode security gates)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boatramp
          POSTGRES_PASSWORD: boatramp
          POSTGRES_DB: boatramp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boatramp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_USER: boatramp
          MYSQL_PASSWORD: boatramp
          MYSQL_DATABASE: boatramp
          MYSQL_ROOT_PASSWORD: boatramp
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uboatramp -pboatramp --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-kv-sql-backend-host

      # --- No-DB battery: MemoryKv / SQLite / types. These need no service (SQLite is embedded,
      # the rest are deterministic in-memory), but they are the single-writer + backend-agnostic
      # half of the same campaign, so they gate here with the live half. Exact pass-counts catch a
      # cfg/rename that silently drops a gate.
      - name: "kv-sql no-DB gates (MemoryKv / SQLite / types)"
        run: |
          set -eo pipefail
          # boatramp-core — crown-jewel CAS (MemoryKv), non-Raft election + cp-identity, and the
          # portable dump/export/import safety invariants. (10 gates.)
          cargo test -p boatramp-core --lib -- --test-threads=1 \
            crownjewel_concurrent_secret_rotation_no_lost_update \
            crownjewel_rotate_vs_delete_no_resurrection \
            crownjewel_tenant_name_cap_holds_under_concurrency \
            crownjewel_concurrent_policy_edit_no_lost_write \
            shared_election_single_leader_under_concurrency \
            shared_control_plane_identity_detects_commingle_and_split_brain \
            kv_dump_roundtrip_preserves_all_keys \
            kv_export_contains_no_plaintext_secret_or_kek \
            kv_import_refuses_nonempty_destination_without_force \
            kv_import_dryrun_mutates_nothing 2>&1 | tee kvsql-nodb-core.log
          grep -qE 'test result: ok\. 10 passed' kvsql-nodb-core.log \
            || { echo "::error::kv-sql no-DB core battery did not run all 10 (a cfg/rename silent-drop or a failure)" >&2; exit 1; }
          # boatramp-storage — the embedded SQLite SqlKv over the shared conformance suite + value-CAS
          # + durability + change-log/custody + dump + the v0.12.4 cancellation-heal recovery.
          # (`--features sql`, 11 `sqlkv_*` gates.)
          cargo test -p boatramp-storage --features sql --lib -- --test-threads=1 sqlkv_ 2>&1 | tee kvsql-nodb-sqlite.log
          grep -qE 'test result: ok\. 11 passed' kvsql-nodb-sqlite.log \
            || { echo "::error::kv-sql no-DB SQLite battery did not run all 11 (a cfg/rename silent-drop or a failure)" >&2; exit 1; }
          # boatramp-server — the MF-3/MF-4 fence + fail-closed + local-mode no-shed over MemoryKv /
          # FailingKv (backend-agnostic; `--features handlers` so graphql_cache compiles). (6 gates.)
          cargo test -p boatramp-server --features handlers --lib -- --test-threads=1 \
            shared_stale_authz_fence_denies_on_missed_invalidation \
            shared_revoked_token_denied_across_nodes_without_notify \
            shared_fail_closed_on_db_unreachable \
            local_mode_authz_read_error_does_not_shed \
            shared_stale_graphql_registry_hidden_field_not_served_without_notify \
            shared_graphql_registry_fails_closed_on_db_unreachable 2>&1 | tee kvsql-nodb-server.log
          grep -qE 'test result: ok\. 6 passed' kvsql-nodb-server.log \
            || { echo "::error::kv-sql no-DB server battery did not run all 6 (a cfg/rename silent-drop or a failure)" >&2; exit 1; }
          # boatramp-types — the kv export/import op is op-gated System·Admin.
          cargo test -p boatramp-types --lib -- --test-threads=1 kv_export_import_require_system_admin 2>&1 | tee kvsql-nodb-types.log
          grep -qE 'test result: ok\. 1 passed' kvsql-nodb-types.log \
            || { echo "::error::kv-sql export/import System·Admin gate did not run (a cfg/rename silent-drop or a failure)" >&2; exit 1; }

      # --- Postgres live: the multi-writer SqlKv + crown-jewel CAS + non-Raft election + cp-identity
      # + MF-6 custody over a REAL Postgres primary, under real multi-connection concurrency. Markers
      # required (a silent skip early-returns `ok` with no marker ⇒ caught). (12 gates.)
      - name: "kv-sql Postgres live gate battery"
        env:
          BOATRAMP_TEST_PG_URL: postgres://boatramp:boatramp@localhost:5432/boatramp
        run: |
          set -eo pipefail
          cargo test -p boatramp-storage \
            --features sql,sql-postgres,shared-mode-gate-mutation,crownjewel-cas-gate-mutation \
            --lib -- --nocapture --test-threads=1 \
            sqlkv_pg_cas_race_has_exactly_one_winner \
            sqlkv_pg_conformance \
            sqlkv_pg_declares_multi_writer \
            sqlkv_pg_change_log_carries_no_secret_values \
            crownjewel_concurrent_secret_rotation_no_lost_update \
            crownjewel_rotate_vs_delete_no_resurrection \
            crownjewel_tenant_name_cap_holds_under_concurrency \
            crownjewel_concurrent_policy_edit_no_lost_write \
            shared_election_single_leader_under_concurrency \
            shared_control_plane_identity_detects_commingle_and_split_brain \
            sqlkv_cross_backend_dump_roundtrip_sqlite_pg \
            sqlkv_dump_scan_reads_real_versions 2>&1 | tee kvsql-pg.log
          grep -qE 'test result: ok\. 12 passed' kvsql-pg.log \
            || { echo "::error::kv-sql Postgres live battery did not run all 12 (a silent skip — BOATRAMP_TEST_PG_URL unset / service down — or a failure)" >&2; exit 1; }
          for marker in \
            'SQLKV PG CONFORMANCE OK [postgres]' \
            'SQLKV PG CAS RACE OK [postgres]' \
            'SQLKV PG MF-6 CUSTODY OK [postgres]' \
            'SQLKV PG CROWNJEWEL ROTATION OK [postgres]' \
            'SQLKV PG CROWNJEWEL RESURRECTION OK [postgres]' \
            'SQLKV PG CROWNJEWEL TENANT CAP OK [postgres]' \
            'SQLKV PG CROWNJEWEL POLICY EDIT OK [postgres]' \
            'SQLKV PG SHARED ELECTION OK [postgres]' \
            'SQLKV PG CP IDENTITY OK [postgres]' \
            'SQLKV CROSS-BACKEND DUMP OK [postgres]'; do
            grep -qF "$marker" kvsql-pg.log \
              || { echo "::error::kv-sql Postgres gate never reached its marker (cross-tenant/CAS/custody regression or a silent skip): $marker" >&2; exit 1; }
          done

      # ANTI-HOLLOW (Postgres storage): each mutation (a cfg(test)/feature seam, a no-op in shipped
      # builds) MUST turn its target gate(s) RED. A gate that still PASSES under its mutation is
      # hollow — the security property it claims to test is not actually enforced ⇒ fail the job.
      - name: "kv-sql Postgres mutation loops (each MUST go RED)"
        env:
          BOATRAMP_TEST_PG_URL: postgres://boatramp:boatramp@localhost:5432/boatramp
        run: |
          set -eo pipefail
          FEAT="sql,sql-postgres,shared-mode-gate-mutation,crownjewel-cas-gate-mutation"
          check_red() {
            local mut="$1"; shift
            if BOATRAMP_KVSQL_MUTATION="$mut" cargo test -p boatramp-storage --features "$FEAT" \
                 --lib -- --test-threads=1 "$@" > "mut-pg-$mut.log" 2>&1; then
              echo "::error::anti-hollow gate is HOLLOW — it PASSED under BOATRAMP_KVSQL_MUTATION=$mut; the security property that mutation breaks is not actually enforced by the gate(s): $*" >&2
              exit 1
            fi
            echo "mutation verified RED: $mut — the security property is load-bearing."
          }
          # MF-2: drop the value-predicate ⇒ the 32-way CAS race has >1 winner (lost update).
          check_red drop_cas_predicate sqlkv_pg_cas_race_has_exactly_one_winner
          # MF-1: revert the crown-jewel writes to blind read-modify-write ⇒ lost rotation / resurrect
          # -on-delete / lost grant / cap bypass (all four crown-jewel gates).
          check_red drop_crownjewel_cas \
            crownjewel_concurrent_secret_rotation_no_lost_update \
            crownjewel_rotate_vs_delete_no_resurrection \
            crownjewel_tenant_name_cap_holds_under_concurrency \
            crownjewel_concurrent_policy_edit_no_lost_write
          # C1: disable the CAS-lease ⇒ >1 node believes it is leader (two leader-gated singletons).
          check_red disable_leader_lock shared_election_single_leader_under_concurrency
          # UX-C1: skip the cp-id stamp ⇒ commingle/split-brain goes undetected.
          check_red skip_cp_id_stamp shared_control_plane_identity_detects_commingle_and_split_brain
          # MF-6: leak the value into the change log ⇒ the custody gate sees secret bytes in kv_changes.
          check_red leak_change_value sqlkv_pg_change_log_carries_no_secret_values

      # --- Postgres live, SERVER: the MF-3 stale-authz fence (policy + GraphQL registry) + revoke
      # propagation over a REAL shared Postgres primary with NOTIFY suppressed (node B denies via the
      # fence read-through). Markers required. (3 gates.)
      - name: "kv-sql server stale-authz fence on live Postgres"
        env:
          BOATRAMP_TEST_PG_URL: postgres://boatramp:boatramp@localhost:5432/boatramp
        run: |
          set -eo pipefail
          cargo test -p boatramp-server --features handlers,sql-postgres,shared-mode-gate-mutation \
            --lib -- --nocapture --test-threads=1 \
            pg_shared_stale_authz_fence_denies_on_missed_invalidation \
            pg_shared_revoked_token_denied_across_nodes_without_notify \
            pg_shared_stale_graphql_registry_hidden_field_not_served_without_notify 2>&1 | tee kvsql-pg-server.log
          grep -qE 'test result: ok\. 3 passed' kvsql-pg-server.log \
            || { echo "::error::kv-sql server live-PG fence battery did not run all 3 (a silent skip — BOATRAMP_TEST_PG_URL unset / service down — or a failure)" >&2; exit 1; }
          for marker in \
            'SERVER PG STALE-AUTHZ FENCE OK [postgres]' \
            'SERVER PG REVOKED-ACROSS-NODES OK [postgres]' \
            'SERVER PG GRAPHQL-REGISTRY FENCE OK [postgres]'; do
            grep -qF "$marker" kvsql-pg-server.log \
              || { echo "::error::kv-sql server fence gate never reached its marker (a stale-authz leak or a silent skip): $marker" >&2; exit 1; }
          done

      # ANTI-HOLLOW (server, live PG + MemoryKv): the stale-authz fence and the fail-closed-on-error
      # posture are the MF-3/MF-4 linchpins. `remove_authz_fence` targets both the MemoryKv twins and
      # the live-PG twins (the filters substring-match both); `revert_authz_fail_open` targets the
      # deterministic FailingKv gate. Each MUST go RED.
      - name: "kv-sql server MF-3/MF-4 mutation loops (each MUST go RED)"
        env:
          BOATRAMP_TEST_PG_URL: postgres://boatramp:boatramp@localhost:5432/boatramp
        run: |
          set -eo pipefail
          FEAT="handlers,sql-postgres,shared-mode-gate-mutation"
          check_red() {
            local mut="$1"; shift
            if BOATRAMP_KVSQL_MUTATION="$mut" cargo test -p boatramp-server --features "$FEAT" \
                 --lib -- --test-threads=1 "$@" > "mut-srv-$mut.log" 2>&1; then
              echo "::error::anti-hollow gate is HOLLOW — it PASSED under BOATRAMP_KVSQL_MUTATION=$mut; the authz property that mutation breaks is not actually enforced: $*" >&2
              exit 1
            fi
            echo "mutation verified RED: $mut — the authz property is load-bearing."
          }
          # MF-3: remove the fence ⇒ node B keeps serving the stale permissive policy / hidden-field
          # registry (both MemoryKv and live-PG twins + the GraphQL-registry twins go RED).
          check_red remove_authz_fence \
            shared_stale_authz_fence_denies_on_missed_invalidation \
            shared_stale_graphql_registry_hidden_field_not_served_without_notify
          # MF-4: revert to fail-OPEN ⇒ a DB-read error is treated as "not revoked / default policy"
          # instead of shedding (503/deny).
          check_red revert_authz_fail_open shared_fail_closed_on_db_unreachable

      # --- MySQL live: the multi-writer SqlKv (value-CAS via `UPDATE … WHERE value=` / absent-key
      # INSERT, winner-by-rows-affected), the dialect-agnostic election (no GET_LOCK), cp-identity,
      # and MF-6 custody over a REAL MySQL primary. Markers required. (6 gates.)
      - name: "kv-sql MySQL live gate battery"
        env:
          BOATRAMP_TEST_MYSQL_URL: mysql://boatramp:boatramp@localhost:3306/boatramp
        run: |
          set -eo pipefail
          cargo test -p boatramp-storage \
            --features sql,sql-mysql,shared-mode-gate-mutation,crownjewel-cas-gate-mutation \
            --lib -- --nocapture --test-threads=1 \
            sqlkv_mysql_cas_race_has_exactly_one_winner \
            sqlkv_mysql_conformance \
            sqlkv_mysql_declares_multi_writer \
            sqlkv_mysql_change_log_carries_no_secret_values \
            mysql_shared_election_single_leader_under_concurrency \
            mysql_shared_control_plane_identity_detects_commingle_and_split_brain 2>&1 | tee kvsql-mysql.log
          grep -qE 'test result: ok\. 6 passed' kvsql-mysql.log \
            || { echo "::error::kv-sql MySQL live battery did not run all 6 (a silent skip — BOATRAMP_TEST_MYSQL_URL unset / service down — or a failure)" >&2; exit 1; }
          for marker in \
            'SQLKV MYSQL CONFORMANCE OK [mysql]' \
            'SQLKV MYSQL CAS RACE OK [mysql]' \
            'SQLKV MYSQL MF-6 CUSTODY OK [mysql]' \
            'SQLKV MYSQL SHARED ELECTION OK [mysql]' \
            'SQLKV MYSQL CP IDENTITY OK [mysql]'; do
            grep -qF "$marker" kvsql-mysql.log \
              || { echo "::error::kv-sql MySQL gate never reached its marker (a CAS/custody/election regression or a silent skip): $marker" >&2; exit 1; }
          done

      # ANTI-HOLLOW (MySQL storage): the MySQL dialect's own CAS / election / custody paths are
      # load-bearing (a per-dialect bug can hide on one engine and not another), so the mutations run
      # against the real MySQL primary too. Each MUST go RED.
      - name: "kv-sql MySQL mutation loops (each MUST go RED)"
        env:
          BOATRAMP_TEST_MYSQL_URL: mysql://boatramp:boatramp@localhost:3306/boatramp
        run: |
          set -eo pipefail
          FEAT="sql,sql-mysql,shared-mode-gate-mutation,crownjewel-cas-gate-mutation"
          check_red() {
            local mut="$1"; shift
            if BOATRAMP_KVSQL_MUTATION="$mut" cargo test -p boatramp-storage --features "$FEAT" \
                 --lib -- --test-threads=1 "$@" > "mut-mysql-$mut.log" 2>&1; then
              echo "::error::anti-hollow gate is HOLLOW — it PASSED under BOATRAMP_KVSQL_MUTATION=$mut on MySQL; the per-dialect property that mutation breaks is not actually enforced: $*" >&2
              exit 1
            fi
            echo "mutation verified RED: $mut (mysql) — the per-dialect property is load-bearing."
          }
          check_red drop_cas_predicate sqlkv_mysql_cas_race_has_exactly_one_winner
          check_red disable_leader_lock mysql_shared_election_single_leader_under_concurrency
          check_red leak_change_value sqlkv_mysql_change_log_carries_no_secret_values

  # R2 (Security hardening) — the `*-gate-mutation` features are TEST-ONLY anti-hollow seams and must
  # NEVER be in the shipped binary. A plain `cargo tree -e features` CANNOT see them (they are empty
  # leaf features that activate no dependency edge), so this resolves the ENABLED feature set of the
  # DEFAULT (shipped) build with `cargo metadata` and fails if any package's resolved feature list
  # carries a `*-gate-mutation`. Standalone (no DB services) so a flaky container can never mask it.
  # Cheap: `cargo metadata` resolves, it does not compile.
  guard-gate-mutation-not-shipped:
    name: guard (no *-gate-mutation in the shipped build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Assert no *-gate-mutation feature in the default (shipped) feature closure
        run: |
          set -eo pipefail
          bad=$(cargo metadata --format-version 1 2>/dev/null \
            | jq -r '.resolve.nodes[]
                     | select(any(.features[]?; test("gate-mutation")))
                     | .id + " [" + ([.features[] | select(test("gate-mutation"))] | join(",")) + "]"')
          if [ -n "$bad" ]; then
            echo "::error::a TEST-ONLY *-gate-mutation feature is ENABLED in the default/shipped feature closure — it must never ship:" >&2
            echo "$bad" >&2
            exit 1
          fi
          echo "R2 OK: no *-gate-mutation feature in the default (shipped) feature resolve."

  # The embedded-Raft cluster tests (consensus, leader-loss failover, mesh admit,
  # cron single-firing) live behind the `raft`/`http` features and so ran ONLY in
  # nightly `--all-features` — the same merge-gate blind spot as the GraphQL surface.
  # They're the correctness core of the cluster (a replicated write surviving a leader
  # kill), so they gate merges here. Scoped to `boatramp-cluster` (+ openraft) — ~26s
  # with a warm cache.
  test-cluster:
    name: test (cluster consensus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-cluster-musl
      - name: Test (raft + http)
        run: cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-cluster --features raft,http
      # Phase-1 messaging poison-pill/DLQ matrix HARD GATE. The four conformance batteries cover the
      # full matrix — work-queue × grouped(fan-out) × single-node × cluster — each publishing a poison
      # message, exhausting max_attempts, and asserting dead_letters==N with exact redrive/purge. They
      # run in the lane above, but a silent skip (a rename, an accidental `#[ignore]`) reports `ok`, so
      # this re-runs the `conformance` subset with `--nocapture` and asserts all four success markers +
      # the exact pass count — a regression of the grouped-DLQ P0 fix (or a skipped cell) fails the merge.
      - name: Messaging poison-pill/DLQ matrix markers
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-cluster \
            --features raft,http conformance -- --nocapture 2>&1 | tee messaging-dlq.log
          grep -qE 'test result: ok\. 4 passed' messaging-dlq.log \
            || { echo "::error::messaging conformance did not run all 4 DLQ-matrix cells (silent skip or failure?)" >&2; exit 1; }
          for m in \
            'MESSAGING WQ DLQ MATRIX OK [single-node]' \
            'MESSAGING WQ DLQ MATRIX OK [cluster]' \
            'MESSAGING GROUPED DLQ MATRIX OK [single-node]' \
            'MESSAGING GROUPED DLQ MATRIX OK [cluster]'; do
            grep -qF "$m" messaging-dlq.log \
              || { echo "::error::missing poison-pill/DLQ matrix marker: $m (a DLQ regression or a skipped cell)" >&2; exit 1; }
          done
      # B10 (async-lane sharding) MULTI-NODE node-loss HARD GATE. The real 3-node in-process Raft
      # analog of the messaging gate6: a RaftKv async queue + RaftMessaging HRW ownership over one
      # shared applied state, drained sharded, a second wave enqueued, the shard-owning node KILLED +
      # removed from membership, then the survivors drain (unsharded backstop + sharded). Two
      # independent, mutation-verified detectors: the whole-record CAS claim ⇒ no double-execution
      # (concurrent drainers, a blind put would double-count), and correct ownership ⇒ no stranding
      # (the sharded-only wave must partition; under-ownership strands it, the no-owner window is
      # backstopped). Distinct from the boatramp-server B10 battery's `ASYNC-SHARD NODE-LOSS OK` (7→8
      # gate) — this asserts the MULTI-NODE marker. It runs in the lane above, but a rename/`#[ignore]`
      # reports `ok`, so re-run the specific test with `--nocapture` and assert the marker + pass count.
      - name: async-lane sharding MULTI-NODE node-loss marker (B10)
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-cluster \
            --features raft,http gate_async_shard_multinode_node_loss_no_double_execution_no_stranding \
            -- --nocapture 2>&1 | tee async-shard-multinode.log
          grep -qE 'test result: ok\. 1 passed' async-shard-multinode.log \
            || { echo "::error::B10 multi-node node-loss gate did not run (silent skip or a failure)" >&2; exit 1; }
          grep -q 'ASYNC-SHARD MULTINODE NODE-LOSS OK' async-shard-multinode.log \
            || { echo "::error::B10 multi-node node-loss gate never reached its marker (a double-execution or stranding regression across a real Raft node loss)" >&2; exit 1; }
      # v0.4.26: the read-only messaging-stats binding is tenant-scoped by a host-filled `{tenant}`
      # template — per-topic depth/DLQ counts are a cross-tenant oracle otherwise. This host-level
      # conformance gate drives the REAL substrate + the tenant-substitution security property end to
      # end: own-tenant read via the declared template, a foreign/undeclared topic refused, a
      # slash-bearing resolved tenant that would reshape the topic to a foreign one refused, and an
      # ungranted component access-denied. A tenant-scoping regression (the oracle) fails the merge.
      - name: messaging-stats tenant-scoped gate marker (v0.4.26)
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-server \
            --features handlers --test conformance messaging_stats_reads_own_tenant -- --nocapture 2>&1 | tee messaging-stats.log
          grep -qE 'test result: ok\. 1 passed' messaging-stats.log \
            || { echo "::error::messaging-stats gate did not run (silent skip or a failure)" >&2; exit 1; }
          grep -q 'MESSAGING-STATS TENANT-SCOPED OK' messaging-stats.log \
            || { echo "::error::messaging-stats gate never reached its marker (a tenant-scoping/cross-tenant-oracle regression)" >&2; exit 1; }
      # task #493: the per-tenant sealed-secret capability. This gate drives the REAL TenantSecretStore
      # + the REAL guest binding + the REAL control-plane router end to end: tenant A sets a secret and
      # reads it back, tenant B gets none over the SAME store (per-tenant isolation), a no-resolved-
      # tenant invocation is refused before store access, a slash-bearing resolved tenant is refused
      # before it can reshape the key, a control-plane PUT tenant=A is read by a guest resolving to A
      # (none to B), a `%2F`/`*`-bearing control-plane {tenant} is 400, and the value never appears on
      # a list. A cross-tenant leak / tenant-forgery / segment-validation regression fails the merge.
      - name: tenant-secrets scoped gate marker (#493)
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-server \
            --features handlers --test conformance tenant_secrets_scoped_end_to_end -- --nocapture 2>&1 | tee tenant-secrets.log
          grep -qE 'test result: ok\. 1 passed' tenant-secrets.log \
            || { echo "::error::tenant-secrets gate did not run (silent skip or a failure)" >&2; exit 1; }
          grep -q 'TENANT SECRETS SCOPED OK' tenant-secrets.log \
            || { echo "::error::tenant-secrets gate never reached its marker (a cross-tenant leak / tenant-forgery / segment-validation regression)" >&2; exit 1; }
      # v0.5.x: opt-in per-guest secret allowlist over the per-site `[handlers].secrets` pool. The
      # pool is injected into a guest's env at one choke point (`resolve_env`); a guest that declares
      # a `secrets` allowlist receives ONLY those keys, a non-declaring guest the whole pool (opt-in,
      # non-breaking). This gate drives the REAL router→dispatch→build_bindings→engine path: handler
      # A (with an allowlist) sees only its granted secret and NOT a sibling's, while a non-declaring
      # handler sees both. A filter regression (cross-handler secret-pool leak) fails the merge.
      - name: per-guest secret allowlist gate marker
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-server \
            --features handlers --test conformance handler_secret_allowlist_scopes_the_site_pool_end_to_end -- --nocapture 2>&1 | tee secret-allowlist.log
          grep -qE 'test result: ok\. 1 passed' secret-allowlist.log \
            || { echo "::error::secret-allowlist gate did not run (silent skip or a failure)" >&2; exit 1; }
          grep -q 'SECRET ALLOWLIST SCOPED OK' secret-allowlist.log \
            || { echo "::error::secret-allowlist gate never reached its marker (a cross-handler secret-pool leak regression)" >&2; exit 1; }
      # #495: edge-visibility for federated GraphQL. An `@edgeHidden` (or manifest-listed) ROOT field is
      # reachable via the internal paths (guest graphql::run, emit::invoke) but EXCLUDED from the
      # anonymous external `/graphql` edge — it fails to plan EXACTLY like an unknown field (no oracle)
      # and its resolver is NEVER invoked. This gate drives the REAL router→compose→plan→execute path
      # with two subgraph functions: the edge-hidden `Mutation.agent` (whose fixture echoes `ran:<input>`
      # when it runs) MUST NOT run on an anon external POST and must be byte-identical to an unknown
      # field (direct AND fragment-wrapped), while the visible `Query.users` still resolves. A hide
      # regression (the resolver runs / an existence oracle) fails the merge.
      - name: edge-visibility internal-op gate marker (#495)
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-server \
            --features handlers --test conformance edge_visibility_hides_an_internal_op_from_the_external_edge -- --nocapture 2>&1 | tee edge-visibility.log
          grep -qE 'test result: ok\. 1 passed' edge-visibility.log \
            || { echo "::error::edge-visibility gate did not run (silent skip or a failure)" >&2; exit 1; }
          grep -q 'EDGE VISIBILITY INTERNAL OK' edge-visibility.log \
            || { echo "::error::edge-visibility gate never reached its marker (an edge-hidden op became reachable on the external edge, or an existence oracle appeared)" >&2; exit 1; }
      # #500: the GraphQL edge (query guard, federation/data planner, and the GraphiQL explorer) is a
      # property of the graphql ENDPOINT ROUTE, not a site-wide browser fallback. A browser GET
      # (Accept: text/html) to a sibling declared guest route (an OIDC-style /authorize) must reach that
      # route's own handler — NOT be shadowed by the GraphiQL IDE (the construens browser-login blocker) —
      # while the /graphql endpoint still serves GraphiQL. A scoping regression (the site-wide edge shadows
      # guest GET routes again) fails the merge.
      - name: graphql edge route-scoped gate marker (#500)
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-server \
            --features handlers --test conformance graphql_edge_is_scoped_to_the_endpoint_route_not_the_whole_site -- --nocapture 2>&1 | tee graphql-edge-scope.log
          grep -qE 'test result: ok\. 1 passed' graphql-edge-scope.log \
            || { echo "::error::graphql-edge-scope gate did not run (silent skip or a failure)" >&2; exit 1; }
          grep -q 'GRAPHQL EDGE ROUTE-SCOPED OK' graphql-edge-scope.log \
            || { echo "::error::graphql-edge-scope gate never reached its marker (the GraphiQL / graphql edge shadows a sibling guest GET route again)" >&2; exit 1; }
      # #501 Stage B: the DECLARATIVE managed-database front door. A manifest `databases:` entry is a
      # TYPED, SAFE projection of the internal `ExternalDatabaseConfig` (no secret/URL/host-fs/image
      # field). This gate drives the REAL `NodeManagedDbDeclare` over a memory store and asserts the
      # security invariants: the lowered binding is ALWAYS the managed-credential path (no
      # password_env/url/image/path); a name colliding with a node-static `[databases].<name>` is
      # REFUSED at the merge point (daemon config wins); an identity change (kind/tenant/tenant_scope)
      # on re-apply is refused; the derived server workload is project-qualified (caller's-project
      # binding); and the API exposes NO deprovision (inert on removal). A regression that let a
      # manifest win, carry a credential, provision cross-project, or drop data fails the merge.
      - name: managed-DB declaration scoped gate marker (#501)
        run: |
          set -eo pipefail
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-node \
            --features sql-postgres,handlers --lib managed_db_declaration_scoped_gate -- --nocapture 2>&1 | tee managed-db-declare.log
          grep -qE 'test result: ok\. 1 passed' managed-db-declare.log \
            || { echo "::error::managed-db-declare gate did not run (silent skip or a failure)" >&2; exit 1; }
          grep -q 'MANAGED-DB DECLARATION SCOPED OK' managed-db-declare.log \
            || { echo "::error::managed-db-declare gate never reached its marker (a daemon-conflict / credential-in-manifest / cross-project / destructive-change regression)" >&2; exit 1; }
