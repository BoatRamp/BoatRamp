name: CI

# Fast per-push / per-PR gate, split into parallel jobs so intra-day feedback is
# quick:
#   • quick          — instant source checks (fmt, typos, anyhow ban): no
#                       workspace compile, so a format nit or typo fails within
#                       seconds instead of behind a multi-minute clippy build.
#   • clippy         — workspace clippy, default features.
#   • feature-clippy — clippy the CLI's cfg-gated `serve` dispatch under the
#                      cluster+tls+acme-dns feature union (a light slice of
#                      --all-features) so a feature-combination regression fails
#                      the PR gate, not only nightly.
#   • test           — workspace tests, lean fs+SlateDB slice.
#   • test-server-features — the `boatramp-server` feature-gated integration surface
#                      (handlers/oidc/mcp/compression/dns-verify) AT THE MERGE GATE.
#                      The lean `test` lane can't see this code; running it nightly-only
#                      is how two total failures shipped through green CI, so it gates now.
#   • test-cluster   — the embedded-Raft cluster tests (consensus + leader-loss failover),
#                      behind the `raft`/`http` features — also nightly-only before, now gated.
#   • test-orm-tenancy — the Stage 0 in-site tenant-isolation proof on a REAL libsql engine
#                      (`sql`-feature-gated, so the lean `test` lane skips it); asserts a success
#                      marker so a silent skip or a cross-tenant regression fails the merge.
#   • test-orm-tenancy-sqlx — the SAME in-site tenant-isolation proof on a REAL Postgres AND MySQL
#                      (service containers): the ORM renders the scope per-dialect, so isolation is
#                      proven on every engine it targets, not only SQLite. Marker-gated per engine.
#   • deny           — cargo-deny bans/licenses/sources (+ non-blocking advisories).
# clippy and test are the two full workspace compiles; running them as separate
# jobs lets them build concurrently on separate runners instead of one after the
# other, roughly halving the critical path versus the old single-job pipeline.
#
# The shipped `default` feature set is now **all** features (batteries-included),
# so per-push compiles deliberately opt DOWN to a lean fs+SlateDB slice
# (`--no-default-features --features boatramp/fs,boatramp/slatedb`) plus the light
# feature-clippy slice — so those jobs stay quick. But feature-gated *integration
# tests* must still gate merges (not run nightly-only), so `test-server-features`
# runs the server's handlers/oidc/mcp/compression/dns-verify surface per-push; the
# heavier openraft/cloud-SDK feature unions stay in nightly's `--all-features` lane.
# The full default (`--all-features` == default) clippy + test and the reproducible
# `nix flake check` run in the nightly workflow (.github/workflows/nightly.yml).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A persistent cache can corrupt incremental state when a run is cancelled
  # mid-build; disable it (no benefit on a fresh CI checkout anyway).
  CARGO_INCREMENTAL: "0"
  # CI never debugs the binaries; dropping debug info keeps the target dir small.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  quick:
    name: fmt · typos · bans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # First-party code uses typed `thiserror` error enums only — the `anyhow`
      # crate is banned. It stays a *transitive* dep, so this is a source +
      # manifest guard (a cargo-deny ban would be infeasible).
      - name: Ban the anyhow crate
        run: |
          set -eo pipefail
          if grep -rnI --include='*.rs' -e 'anyhow' crates/; then
            echo "::error::the 'anyhow' crate is banned — use typed thiserror error enums"
            exit 1
          fi
          if grep -rn --include=Cargo.toml -e '\banyhow\b' crates/ Cargo.toml; then
            echo "::error::a Cargo.toml reintroduced the 'anyhow' dependency"
            exit 1
          fi

      # Every `#[ignore]` (a capability-gated live seam that runs nowhere automated on
      # a stock runner) MUST carry a `= "reason"` explaining its gate, so the coverage it
      # represents stays auditable and an ignore is never an unexplained silent skip. A
      # bare `#[ignore]` attribute fails the gate. (Matches the attribute on its own line;
      # doc/comment mentions of `#[ignore]` are unaffected.)
      - name: Every #[ignore] carries a reason
        run: |
          set -eo pipefail
          if grep -rnE --include='*.rs' '^[[:space:]]*#\[ignore\][[:space:]]*$' crates/; then
            echo "::error::a bare #[ignore] has no reason — use #[ignore = \"why + how it runs\"]"
            exit 1
          fi
          echo "all #[ignore] attributes carry a reason"

      # The README's install pins (`cargo install boatramp@X`, `nix run …/vX`,
      # `git checkout vX`) MUST equal the workspace version, so a release bump can never
      # leave the front page advertising a stale version — it once still read `v0.1` at
      # v0.3.0. A version bump that forgets the README fails here. The canonical version
      # is shown via the live crates.io badge, never hardcoded in prose; a bare `(vN.M)`
      # in prose is refused so the footgun can't come back.
      - name: README version pins match the workspace
        run: |
          set -eo pipefail
          ver=$(grep -m1 -oE '^version = "[0-9]+\.[0-9]+\.[0-9]+"' Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "workspace version: $ver"
          pins=$(grep -oE '(boatramp@|BoatRamp/v|checkout v)[0-9]+\.[0-9]+\.[0-9]+' README.md \
                 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          if [ -z "$pins" ]; then
            echo "::error::found no README version pins to check — did the pin format change?"
            exit 1
          fi
          fail=0
          for p in $pins; do
            if [ "$p" != "$ver" ]; then
              echo "::error::README pins boatramp $p but the workspace is $ver — bump the README pins"
              fail=1
            fi
          done
          if grep -nE '\(`?v[0-9]+\.[0-9]+`?\)' README.md; then
            echo "::error::README hardcodes a version in prose — show it via the crates.io badge instead"
            fail=1
          fi
          if [ "$fail" != 0 ]; then exit 1; fi
          echo "README pins all match $ver"

      # rustfmt only — no workspace build, so this lane stays sub-minute.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Typos
        uses: crate-ci/typos@master

  clippy:
    name: clippy (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Lint the SHIPPED musl target via cargo-zigbuild's clippy subcommand (it owns the
      # C-dep cross-compile + arg translation). A lean fs+SlateDB slice for fast feedback;
      # the full default set is clippy'd nightly, the serve union in `feature-clippy`.
      - uses: ./.github/actions/setup-musl
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-musl

      - name: Clippy (musl)
        run: cargo-zigbuild clippy --target x86_64-unknown-linux-musl --workspace --all-targets --no-default-features --features boatramp/fs,boatramp/slatedb -- -D warnings

  feature-clippy:
    name: clippy (serve feature union)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-musl
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-clippy-musl

      # The CLI's `serve` dispatch is cfg-gated per TLS/cluster feature — the
      # `match args.tls` arms and the `serve::Error` `#[from]` variants differ by
      # feature. Default-features CI can't see those combinations, so a
      # feature-union regression (a missing `TlsMode::Rpk` arm, a colliding
      # `From<RpkError>`/`From<MeshError>`) previously only surfaced nightly. Clippy
      # the `cluster + tls + acme-dns` union of just the `boatramp` crate per-push
      # to catch it in the PR gate. This is a light slice — no wasmtime/handlers, no
      # cloud-signer SDKs, no s3/compute — so it stays quick; the full
      # `--all-features` clippy + test remains the nightly backstop.
      - name: Clippy (cluster + tls + acme-dns, musl)
        run: cargo-zigbuild clippy --target x86_64-unknown-linux-musl -p boatramp --no-default-features --features cluster,tls,acme-dns --all-targets -- -D warnings

  helm-chart:
    name: operator Helm chart (lint + CRD drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: helm-chart-musl
      - uses: azure/setup-helm@v4

      # The chart's `crds/` are single-sourced from the Rust CRD types. Fail if the
      # checked-in copy has drifted from what the binary emits (regenerate with
      # `boatramp operator crds > charts/boatramp-operator/crds/boatramp-crds.yaml`).
      # Built + run on the shipped musl target (the static binary runs natively).
      - name: CRDs match the Rust types
        run: |
          cargo-zigbuild run --target x86_64-unknown-linux-musl -p boatramp --no-default-features --features operator -- operator crds > /tmp/crds.yaml
          diff -u charts/boatramp-operator/crds/boatramp-crds.yaml /tmp/crds.yaml

      # The operator unit tests (CRD drift guard + the least-privilege ClusterRole pin)
      # otherwise run nightly-only. Gate them here - a privilege broadening or a
      # chart-vs-types drift must fail a push, not a nightly. Reuses the build above.
      - name: operator unit tests
        run: |
          cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp --no-default-features --features operator operator::

      - name: Lint + render the chart
        run: |
          helm lint charts/boatramp-operator
          helm template t charts/boatramp-operator --namespace boatramp-system >/dev/null

  test:
    name: test (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Compile + run the tests on the SHIPPED musl target via cargo-zigbuild; the
      # static x86_64-musl test binaries run natively on the x86_64 runner. This is the
      # gate that catches a musl-only breakage before it reaches a release tag.
      - uses: ./.github/actions/setup-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-musl

      - name: Test (musl)
        run: cargo-zigbuild test --target x86_64-unknown-linux-musl --workspace --no-default-features --features boatramp/fs,boatramp/slatedb

  # The lean `test` lane above opts down to `fs,slatedb` for speed, which enables
  # NEITHER `handlers` NOR the other feature-gated surfaces — so the whole GraphQL /
  # federation / data-connector suite (245 handlers-gated cfgs) plus oidc/mcp/
  # compression/dns-verify ran only in nightly `--all-features`. That blind spot let
  # two total failures ship through green CI (federated mutations broken; federation-v2
  # SDL rejected). This lane runs that feature-gated integration surface AT THE MERGE
  # GATE. Scoped to `boatramp-server` (one crate + wasmtime) so it stays affordable;
  # the heavy openraft/cloud-SDK unions stay nightly.
  test-server-features:
    name: test (server feature union)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Compile + run this feature-gated surface on the SHIPPED musl target.
      - uses: ./.github/actions/setup-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-server-features-musl

      - name: Test (handlers + oidc + mcp + compression + dns-verify)
        run: cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-server --features handlers,oidc,mcp,compression,domain-verify-dns

      # Tripwire: fail if this lane's test count drops below the committed floor. A
      # `#[cfg]`/feature-gate mistake that silently drops a whole module shrinks the
      # count — which is how the GraphQL surface once went dark — so a shrink fails the
      # gate rather than passing quietly. Adding tests raises the floor (bump the file).
      # Reuses the musl build above; `-- --list` only enumerates test names.
      - name: Test-count tripwire (no silent drop)
        run: |
          set -eo pipefail
          # shellcheck disable=SC1091
          . .github/test-count-baseline
          live=$(cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-server \
            --features handlers,oidc,mcp,compression,domain-verify-dns \
            -- --list 2>/dev/null | grep -cE ': test$')
          echo "server-features tests: live=$live floor=$SERVER_FEATURES_MIN"
          if [ "$live" -lt "$SERVER_FEATURES_MIN" ]; then
            echo "::error::server-features test count $live dropped below the floor $SERVER_FEATURES_MIN — a feature-gate mistake may have silently dropped tests. If the drop is intentional, lower .github/test-count-baseline deliberately."
            exit 1
          fi

  # Stage 0 in-site tenant isolation HARD GATE. The ORM/`sql` tenant scope must isolate tenants
  # on a REAL SQL engine (embedded libsql), not merely in the compiler's string output. The test
  # is `sql`-feature-gated, so the workspace lane (which enables only `boatramp/fs,slatedb`) would
  # silently skip it — a skip is not evidence — so this lane runs it explicitly with `sql` and
  # asserts a success marker, so a silent skip OR a cross-tenant regression fails the merge.
  #
  # Runs on the **host** toolchain (glibc), NOT the musl cross-target: the tenant-scope SQL
  # semantics are libc-independent (a compiled `WHERE`/stamp the engine applies), and a
  # cross-compiled-musl *test binary* + libsql-local's bundled SQLite has a runtime quirk under the
  # static-musl test harness that the production musl binary doesn't hit (managed libsql is proven
  # on musl by the container capability gate + real deployments). Matching the nightly, which runs
  # target-agnostic logic tests on the host toolchain.
  test-orm-tenancy:
    name: test (ORM in-site tenant isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-orm-tenancy-host
      - name: Live in-site tenant isolation on a real libsql engine
        run: |
          set -eo pipefail
          # All four are `#[ignore]`d (the general workspace lane skips them — a static-musl test
          # binary segfaults in libsql); run them explicitly here, unignored, on the host toolchain.
          # Four batteries: the Stage 0 single-column model, the Stage 1 per-table-key model, the
          # Stage 3 anonymous-first (TenantOrSession) disjunct, and the Stage 4 durable signed-context
          # lane (publish->claim->verify->scope on a real messaging store + libsql).
          cargo test -p boatramp-storage \
            --features sql --test orm_tenant_isolation -- --ignored --nocapture 2>&1 | tee orm-tenancy.log
          grep -qE 'test result: ok\. 4 passed' orm-tenancy.log \
            || { echo "::error::ORM tenant isolation tests did not all pass (silent skip or failure?)" >&2; exit 1; }
          grep -q 'ORM IN-SITE TENANT ISOLATION OK' orm-tenancy.log \
            || { echo "::error::ORM tenant isolation never reached its success marker (a cross-tenant breach or a skipped test)" >&2; exit 1; }
          grep -q 'ORM PER-TABLE-KEY TENANCY OK' orm-tenancy.log \
            || { echo "::error::ORM per-table-key tenancy never reached its success marker (a per-table scoping breach or a skipped test)" >&2; exit 1; }
          grep -q 'ORM TENANT-OR-SESSION DISJUNCT OK' orm-tenancy.log \
            || { echo "::error::ORM TenantOrSession disjunct never reached its success marker (an R3 anon/tenant isolation breach or a skipped test)" >&2; exit 1; }
          grep -q 'ORM DURABLE SIGNED-CONTEXT ISOLATION OK' orm-tenancy.log \
            || { echo "::error::ORM durable signed-context lane never reached its success marker (a Stage 4 async-lane isolation breach or a skipped test)" >&2; exit 1; }

  # The SAME Stage 0 tenant-isolation invariant, but on REAL Postgres and MySQL. The ORM emits
  # portable `?N` SQL that the external-SQL backend rewrites to each engine's native placeholder
  # style ($N on PG, ? on MySQL); a per-dialect rendering bug in the SCOPED predicate could drop
  # the tenant filter on one engine and not another, so the #1 invariant is proven on every engine
  # the ORM targets — not just the libsql gate above. Postgres + MySQL come up as service
  # containers; the env-gated test runs both batteries and prints a per-engine marker that the grep
  # requires (a silent skip or a cross-tenant regression on either engine fails the merge). Host
  # toolchain (real TCP + the sqlx drivers), matching test-orm-tenancy.
  test-orm-tenancy-sqlx:
    name: test (ORM tenant isolation on Postgres + MySQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boatramp
          POSTGRES_PASSWORD: boatramp
          POSTGRES_DB: boatramp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boatramp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_USER: boatramp
          MYSQL_PASSWORD: boatramp
          MYSQL_DATABASE: boatramp
          MYSQL_ROOT_PASSWORD: boatramp
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uboatramp -pboatramp --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-orm-tenancy-sqlx-host
      - name: Live in-site tenant isolation on Postgres + MySQL
        env:
          BOATRAMP_TEST_PG_URL: postgres://boatramp:boatramp@localhost:5432/boatramp
          BOATRAMP_TEST_MYSQL_URL: mysql://boatramp:boatramp@localhost:3306/boatramp
        run: |
          set -eo pipefail
          # Both engines' batteries must actually RUN (URLs set above) — a skipped engine still
          # reports `ok`, so we additionally require both per-engine success markers.
          cargo test -p boatramp-storage --features sql-postgres,sql-mysql \
            --test orm_tenant_isolation_sqlx_live -- --nocapture --test-threads=1 2>&1 | tee orm-sqlx.log
          grep -qE 'test result: ok\. 2 passed' orm-sqlx.log \
            || { echo "::error::ORM sqlx tenant isolation did not run both engines (a silent skip or a failure)" >&2; exit 1; }
          grep -q 'ORM IN-SITE TENANT ISOLATION OK \[postgres\]' orm-sqlx.log \
            || { echo "::error::Postgres ORM tenant isolation never reached its marker (cross-tenant breach or skip)" >&2; exit 1; }
          grep -q 'ORM IN-SITE TENANT ISOLATION OK \[mysql\]' orm-sqlx.log \
            || { echo "::error::MySQL ORM tenant isolation never reached its marker (cross-tenant breach or skip)" >&2; exit 1; }
          # Stage 1 per-table-key model on each engine (same test fns; a second battery per engine).
          grep -q 'ORM PER-TABLE-KEY TENANCY OK \[postgres\]' orm-sqlx.log \
            || { echo "::error::Postgres ORM per-table-key tenancy never reached its marker (per-table scoping breach or skip)" >&2; exit 1; }
          grep -q 'ORM PER-TABLE-KEY TENANCY OK \[mysql\]' orm-sqlx.log \
            || { echo "::error::MySQL ORM per-table-key tenancy never reached its marker (per-table scoping breach or skip)" >&2; exit 1; }
          # Stage 3 R3 anonymous-first (TenantOrSession) disjunct + promote, per engine.
          grep -q 'ORM TENANT-OR-SESSION DISJUNCT OK \[postgres\]' orm-sqlx.log \
            || { echo "::error::Postgres R3 TenantOrSession disjunct never reached its marker (anon/tenant/session breach or skip)" >&2; exit 1; }
          grep -q 'ORM TENANT-OR-SESSION DISJUNCT OK \[mysql\]' orm-sqlx.log \
            || { echo "::error::MySQL R3 TenantOrSession disjunct never reached its marker (anon/tenant/session breach or skip)" >&2; exit 1; }

  # The embedded-Raft cluster tests (consensus, leader-loss failover, mesh admit,
  # cron single-firing) live behind the `raft`/`http` features and so ran ONLY in
  # nightly `--all-features` — the same merge-gate blind spot as the GraphQL surface.
  # They're the correctness core of the cluster (a replicated write surviving a leader
  # kill), so they gate merges here. Scoped to `boatramp-cluster` (+ openraft) — ~26s
  # with a warm cache.
  test-cluster:
    name: test (cluster consensus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-cluster-musl
      - name: Test (raft + http)
        run: cargo-zigbuild test --target x86_64-unknown-linux-musl -p boatramp-cluster --features raft,http

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bans, licenses, sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
      # Advisories are reported but non-blocking: some transitive dependencies
      # carry unmaintained/DoS notices with no upstream fix yet (tracked in
      # deny.toml). Surfacing them keeps them visible without gating every PR.
      - name: Advisories (non-blocking)
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check advisories

  # Coverage ratchet: fail a push if line coverage of the handlers surface drops
  # below the recorded floor (`.github/coverage-baseline`). A floor, not a target —
  # raise the baseline as coverage grows so it never backslides. The summary is
  # printed either way, so the current number is visible to ratchet from.
  coverage-gate:
    name: coverage ratchet (llvm-cov)
    runs-on: ubuntu-latest
    # cargo-llvm-cov has no cargo-zigbuild subcommand, so point CC/CXX + the target
    # linker at the `cargo-zigbuild zig cc` translating wrappers (installed by
    # setup-musl) and run llvm-cov against the musl target. The instrumented static
    # binaries run natively on the x86_64 runner.
    env:
      CC_x86_64_unknown_linux_musl: zig-musl-cc
      CXX_x86_64_unknown_linux_musl: zig-musl-cxx
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: zig-musl-cc
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-musl
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-gate-musl
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage must not drop below the baseline
        run: |
          baseline="$(cat .github/coverage-baseline)"
          echo "line-coverage floor: ${baseline}%"
          cargo llvm-cov --target x86_64-unknown-linux-musl -p boatramp-server --features handlers --summary-only \
            --fail-under-lines "${baseline}" | tee coverage-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-summary
          path: coverage-summary.txt
