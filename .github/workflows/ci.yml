name: CI

# Fast per-push / per-PR gate, split into parallel jobs so intra-day feedback is
# quick:
#   • quick          — instant source checks (fmt, typos, anyhow ban): no
#                       workspace compile, so a format nit or typo fails within
#                       seconds instead of behind a multi-minute clippy build.
#   • clippy         — workspace clippy, default features.
#   • feature-clippy — clippy the CLI's cfg-gated `serve` dispatch under the
#                      cluster+tls+acme-dns feature union (a light slice of
#                      --all-features) so a feature-combination regression fails
#                      the PR gate, not only nightly.
#   • test           — workspace tests, lean fs+SlateDB slice.
#   • test-server-features — the `boatramp-server` feature-gated integration surface
#                      (handlers/oidc/mcp/compression/dns-verify) AT THE MERGE GATE.
#                      The lean `test` lane can't see this code; running it nightly-only
#                      is how two total failures shipped through green CI, so it gates now.
#   • test-cluster   — the embedded-Raft cluster tests (consensus + leader-loss failover),
#                      behind the `raft`/`http` features — also nightly-only before, now gated.
#   • deny           — cargo-deny bans/licenses/sources (+ non-blocking advisories).
# clippy and test are the two full workspace compiles; running them as separate
# jobs lets them build concurrently on separate runners instead of one after the
# other, roughly halving the critical path versus the old single-job pipeline.
#
# The shipped `default` feature set is now **all** features (batteries-included),
# so per-push compiles deliberately opt DOWN to a lean fs+SlateDB slice
# (`--no-default-features --features boatramp/fs,boatramp/slatedb`) plus the light
# feature-clippy slice — so those jobs stay quick. But feature-gated *integration
# tests* must still gate merges (not run nightly-only), so `test-server-features`
# runs the server's handlers/oidc/mcp/compression/dns-verify surface per-push; the
# heavier openraft/cloud-SDK feature unions stay in nightly's `--all-features` lane.
# The full default (`--all-features` == default) clippy + test and the reproducible
# `nix flake check` run in the nightly workflow (.github/workflows/nightly.yml).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A persistent cache can corrupt incremental state when a run is cancelled
  # mid-build; disable it (no benefit on a fresh CI checkout anyway).
  CARGO_INCREMENTAL: "0"
  # CI never debugs the binaries; dropping debug info keeps the target dir small.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  quick:
    name: fmt · typos · bans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # First-party code uses typed `thiserror` error enums only — the `anyhow`
      # crate is banned. It stays a *transitive* dep, so this is a source +
      # manifest guard (a cargo-deny ban would be infeasible).
      - name: Ban the anyhow crate
        run: |
          set -eo pipefail
          if grep -rnI --include='*.rs' -e 'anyhow' crates/; then
            echo "::error::the 'anyhow' crate is banned — use typed thiserror error enums"
            exit 1
          fi
          if grep -rn --include=Cargo.toml -e '\banyhow\b' crates/ Cargo.toml; then
            echo "::error::a Cargo.toml reintroduced the 'anyhow' dependency"
            exit 1
          fi

      # Every `#[ignore]` (a capability-gated live seam that runs nowhere automated on
      # a stock runner) MUST carry a `= "reason"` explaining its gate, so the coverage it
      # represents stays auditable and an ignore is never an unexplained silent skip. A
      # bare `#[ignore]` attribute fails the gate. (Matches the attribute on its own line;
      # doc/comment mentions of `#[ignore]` are unaffected.)
      - name: Every #[ignore] carries a reason
        run: |
          set -eo pipefail
          if grep -rnE --include='*.rs' '^[[:space:]]*#\[ignore\][[:space:]]*$' crates/; then
            echo "::error::a bare #[ignore] has no reason — use #[ignore = \"why + how it runs\"]"
            exit 1
          fi
          echo "all #[ignore] attributes carry a reason"

      # rustfmt only — no workspace build, so this lane stays sub-minute.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Typos
        uses: crate-ci/typos@master

  clippy:
    name: clippy (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Build/lint the SHIPPED target (static x86_64-musl), not glibc — a musl-only
      # break must fail the PR gate, not surface at release. Sets up zig + cargo-zigbuild
      # and defaults cargo to the musl target.
      - uses: ./.github/actions/setup-musl
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-musl

      # A lean fs+SlateDB slice for fast per-push feedback. The `default` feature
      # set is now **all** features (batteries-included), so this lane opts down
      # with `--no-default-features`; the full default set is clippy'd nightly
      # (`--all-features` == default), and the `serve`-dispatch feature union is
      # covered by `feature-clippy` below. Targets musl via `CARGO_BUILD_TARGET`
      # (set by setup-musl); clippy is check-only so it needs no Rust link.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features --features boatramp/fs,boatramp/slatedb -- -D warnings

  feature-clippy:
    name: clippy (serve feature union)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `tls` pulls aws-lc-rs (cmake/nasm); both are preinstalled on the runner.
      - name: Ensure build deps
        run: |
          if command -v cmake >/dev/null && command -v nasm >/dev/null; then
            echo "cmake + nasm already present"
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake nasm
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-clippy

      # The CLI's `serve` dispatch is cfg-gated per TLS/cluster feature — the
      # `match args.tls` arms and the `serve::Error` `#[from]` variants differ by
      # feature. Default-features CI can't see those combinations, so a
      # feature-union regression (a missing `TlsMode::Rpk` arm, a colliding
      # `From<RpkError>`/`From<MeshError>`) previously only surfaced nightly. Clippy
      # the `cluster + tls + acme-dns` union of just the `boatramp` crate per-push
      # to catch it in the PR gate. This is a light slice — no wasmtime/handlers, no
      # cloud-signer SDKs, no s3/compute — so it stays quick; the full
      # `--all-features` clippy + test remains the nightly backstop.
      - name: Clippy (cluster + tls + acme-dns)
        run: cargo clippy -p boatramp --no-default-features --features cluster,tls,acme-dns --all-targets -- -D warnings

  helm-chart:
    name: operator Helm chart (lint + CRD drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: helm-chart
      - uses: azure/setup-helm@v4

      # The chart's `crds/` are single-sourced from the Rust CRD types. Fail if the
      # checked-in copy has drifted from what the binary emits (regenerate with
      # `boatramp operator crds > charts/boatramp-operator/crds/boatramp-crds.yaml`).
      - name: CRDs match the Rust types
        run: |
          cargo run -p boatramp --no-default-features --features operator -- operator crds > /tmp/crds.yaml
          diff -u charts/boatramp-operator/crds/boatramp-crds.yaml /tmp/crds.yaml

      # The operator unit tests (CRD drift guard + the least-privilege ClusterRole pin)
      # otherwise run nightly-only. Gate them here - a privilege broadening or a
      # chart-vs-types drift must fail a push, not a nightly. Reuses the build above.
      - name: operator unit tests
        run: |
          cargo test -p boatramp --no-default-features --features operator operator::

      - name: Lint + render the chart
        run: |
          helm lint charts/boatramp-operator
          helm template t charts/boatramp-operator --namespace boatramp-system >/dev/null

  test:
    name: test (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Compile + run the tests on the SHIPPED musl target via cargo-zigbuild; the
      # static x86_64-musl test binaries run natively on the x86_64 runner.
      - uses: ./.github/actions/setup-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-musl

      - name: Test
        run: cargo zigbuild test --workspace --no-default-features --features boatramp/fs,boatramp/slatedb

  # The lean `test` lane above opts down to `fs,slatedb` for speed, which enables
  # NEITHER `handlers` NOR the other feature-gated surfaces — so the whole GraphQL /
  # federation / data-connector suite (245 handlers-gated cfgs) plus oidc/mcp/
  # compression/dns-verify ran only in nightly `--all-features`. That blind spot let
  # two total failures ship through green CI (federated mutations broken; federation-v2
  # SDL rejected). This lane runs that feature-gated integration surface AT THE MERGE
  # GATE. Scoped to `boatramp-server` (one crate + wasmtime) so it stays affordable;
  # the heavy openraft/cloud-SDK unions stay nightly.
  test-server-features:
    name: test (server feature union)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ensure build deps
        run: |
          if command -v cmake >/dev/null && command -v nasm >/dev/null; then
            echo "cmake + nasm already present"
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake nasm
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-server-features

      - name: Test (handlers + oidc + mcp + compression + dns-verify)
        run: cargo test -p boatramp-server --features handlers,oidc,mcp,compression,domain-verify-dns

      # Tripwire: fail if this lane's test count drops below the committed floor. A
      # `#[cfg]`/feature-gate mistake that silently drops a whole module shrinks the
      # count — which is how the GraphQL surface once went dark — so a shrink fails the
      # gate rather than passing quietly. Adding tests raises the floor (bump the file).
      - name: Test-count tripwire (no silent drop)
        run: |
          set -eo pipefail
          # shellcheck disable=SC1091
          . .github/test-count-baseline
          live=$(cargo test -p boatramp-server \
            --features handlers,oidc,mcp,compression,domain-verify-dns \
            -- --list 2>/dev/null | grep -cE ': test$')
          echo "server-features tests: live=$live floor=$SERVER_FEATURES_MIN"
          if [ "$live" -lt "$SERVER_FEATURES_MIN" ]; then
            echo "::error::server-features test count $live dropped below the floor $SERVER_FEATURES_MIN — a feature-gate mistake may have silently dropped tests. If the drop is intentional, lower .github/test-count-baseline deliberately."
            exit 1
          fi

  # The embedded-Raft cluster tests (consensus, leader-loss failover, mesh admit,
  # cron single-firing) live behind the `raft`/`http` features and so ran ONLY in
  # nightly `--all-features` — the same merge-gate blind spot as the GraphQL surface.
  # They're the correctness core of the cluster (a replicated write surviving a leader
  # kill), so they gate merges here. Scoped to `boatramp-cluster` (+ openraft) — ~26s
  # with a warm cache.
  test-cluster:
    name: test (cluster consensus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-cluster
      - name: Test (raft + http)
        run: cargo test -p boatramp-cluster --features raft,http

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bans, licenses, sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
      # Advisories are reported but non-blocking: some transitive dependencies
      # carry unmaintained/DoS notices with no upstream fix yet (tracked in
      # deny.toml). Surfacing them keeps them visible without gating every PR.
      - name: Advisories (non-blocking)
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check advisories

  # Coverage ratchet: fail a push if line coverage of the handlers surface drops
  # below the recorded floor (`.github/coverage-baseline`). A floor, not a target —
  # raise the baseline as coverage grows so it never backslides. The summary is
  # printed either way, so the current number is visible to ratchet from.
  coverage-gate:
    name: coverage ratchet (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ensure build deps
        run: |
          if command -v cmake >/dev/null && command -v nasm >/dev/null; then
            echo "cmake + nasm already present"
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake nasm
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-gate
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage must not drop below the baseline
        run: |
          baseline="$(cat .github/coverage-baseline)"
          echo "line-coverage floor: ${baseline}%"
          cargo llvm-cov -p boatramp-server --features handlers --summary-only \
            --fail-under-lines "${baseline}" | tee coverage-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-summary
          path: coverage-summary.txt
