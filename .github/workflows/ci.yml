        run: |
          set -eo pipefail
          # `blob-purge-gate` (storage) compiles the `PurgeMutation` matrix outside cfg(test) and pulls
          # `fs`+`fallback` for the fixtures; the server half runs its own `blob_purge` route tests.
          cargo test -p boatramp-storage --features blob-purge-gate \
                     -p boatramp-server \
                     blob_purge -- --nocapture
      # JSON config input (v0.6.5). Same ROBUST-SUCCESSOR mechanism as the blob-purge gate above:
      # a `#[test]` battery whose SOLE CI contract is the ordinary `cargo test` EXIT CODE — NO grepped
      # uppercase marker, NO `for mut in …; do env BOATRAMP_*_MUTATE_${mut}=1 …` bash loop. The
      # `config_json_gate_*` tests (in `boatramp::apply` + `boatramp_node::config`) prove: RON/JSON
      # deserialize to the SAME typed value incl. an externally-tagged enum variant (`RootSource::Image`
      # / `BlobBackend::S3`); `deny_unknown_fields` parity; the `resolve_format` detection table
      # (override-wins both ways, `.json`⇒Json else Ron, no content-sniff); no validation bypass (a JSON
      # bad db-name ⇒ the SAME `InvalidDbName`, a JSON bad route ⇒ the SAME `Routing` compile-check
      # failure); JSON current-schema-only (`version:<old>`⇒`JsonLegacyVersion`, `>current`⇒`VersionTooNew`,
      # absent/current⇒Ok); and the IN-PROCESS ANTI-HOLLOW proof — a document valid as JSON but NOT as RON
      # parses under `Json` and FAILS under `Ron`, so a `parse_with_format` that ignored `fmt` would fail
      # the battery (the format selection is load-bearing, no env var, no marker). The older marker gates
      # stay unchanged — they are NOT retrofitted.
      - name: config JSON-input robust gate (v0.6.5 — equivalence + detection + no-bypass + anti-hollow, exit-code contract)
        run: |
          set -eo pipefail
          # Both halves filtered by the shared `config_json` name prefix; exit code is the whole gate.
          cargo test -p boatramp-node --lib config_json -- --nocapture
          cargo test -p boatramp --bin boatramp config_json -- --nocapture

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bans, licenses, sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
      # Advisories are reported but non-blocking: some transitive dependencies
      # carry unmaintained/DoS notices with no upstream fix yet (tracked in
      # deny.toml). Surfacing them keeps them visible without gating every PR.
      - name: Advisories (non-blocking)
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check advisories

  # Coverage ratchet: fail a push if line coverage of the handlers surface drops
  # below the recorded floor (`.github/coverage-baseline`). A floor, not a target —
  # raise the baseline as coverage grows so it never backslides. The summary is
  # printed either way, so the current number is visible to ratchet from.
  coverage-gate:
    name: coverage ratchet (llvm-cov)
    runs-on: ubuntu-latest
    # cargo-llvm-cov has no cargo-zigbuild subcommand, so point CC/CXX + the target
    # linker at the `cargo-zigbuild zig cc` translating wrappers (installed by
    # setup-musl) and run llvm-cov against the musl target. The instrumented static
    # binaries run natively on the x86_64 runner.
    env:
      CC_x86_64_unknown_linux_musl: zig-musl-cc
      CXX_x86_64_unknown_linux_musl: zig-musl-cxx
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: zig-musl-cc
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-musl
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-gate-musl
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage must not drop below the baseline
        run: |
          baseline="$(cat .github/coverage-baseline)"
          echo "line-coverage floor: ${baseline}%"
          cargo llvm-cov --target x86_64-unknown-linux-musl -p boatramp-server --features handlers --summary-only \
            --fail-under-lines "${baseline}" | tee coverage-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-summary
          path: coverage-summary.txt
