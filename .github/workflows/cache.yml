name: Cache

# Build the boatramp binary and push it (plus its full Nix closure) to the public
# boatramp.cachix.org cache, so downstream consumers (contributors, the
# boatramp.dev website CI, and end users running `nix build github:BoatRamp/...`)
# pull it in seconds instead of rebuilding from source. Additive — it does not
# touch the existing CI/nightly/release workflows.
#
# Cross-platform coverage is data-driven: the `matrix.include` list below pairs
# each Nix `system` with the GitHub runner that can build it natively. We populate
# the cache for x86_64-linux, **aarch64-linux** (so the multi-arch release's arm64
# OCI image closure is warmed, not compiled on the critical path — see the container
# build step), and Apple Silicon (macOS `aarch64-darwin`), so a fresh machine
# substitutes the whole `.#default` closure — including the `boatramp-console-trunk`
# wasm/Trunk bundle it depends on — instead of compiling. Add `x86_64-darwin` by
# uncommenting its entry below (a native runner is the only requirement).
#
# Pushing needs the `CACHIX_AUTH_TOKEN` repo secret (the push token / signing key
# for the `boatramp` cache) — the SAME secret every other workflow uses; there is
# no second auth path. cachix-action adds the cache as a substituter and, after
# the build steps, pushes every store path realized during the job (the built
# closure, not just the CLI leaf) using that token. Until the secret is set this
# still runs green: cachix-action simply skips the push.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *" # nightly — keep the cache warm against nixpkgs drift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    name: build + cache (${{ matrix.system }})
    runs-on: ${{ matrix.runs-on }}
    # Keyed on the system too, so the Linux and macOS pushes for the same ref
    # don't cancel each other (they run on different runners and populate
    # different per-system store paths). `concurrency` lives on the job — the
    # workflow-level block can't see the `matrix` context.
    concurrency:
      group: cache-${{ github.ref }}-${{ matrix.system }}
      cancel-in-progress: true
    strategy:
      # A hiccup building one platform must not abort the others' cache push.
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runs-on: ubuntu-latest
          - system: aarch64-darwin
            runs-on: macos-14 # GitHub's Apple-Silicon runner
          # aarch64-linux is ENABLED so the release's arm64 OCI image closure is
          # warmed here (see the container build step below) instead of compiled from
          # source on the multi-arch release leg. x86_64-darwin stays off — toggle it
          # on by uncommenting (a native runner is the only requirement):
          - system: aarch64-linux
            runs-on: ubuntu-24.04-arm # GitHub's Linux arm64 runner
          # - system: x86_64-darwin
          #   runs-on: macos-13 # Intel macOS runner
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v15
        with:
          name: boatramp
          # The one shared push token/signing key for the boatramp cache — reused
          # verbatim across every workflow. No per-platform or second auth path.
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Build the batteries-included boatramp binary for THIS matrix system. Its
      # closure pulls in the `boatramp-console-trunk` bundle (the `console`
      # default feature stages that Trunk `dist` into the binary), so a single
      # `.#default` build covers the console output too. cachix-action's post-step
      # then pushes the whole realized closure — every store path built in this
      # job — to the cache, not just the CLI leaf.
      - name: Build + cache the boatramp closure
        run: nix build .#packages.${{ matrix.system }}.default --print-build-logs --print-out-paths

      # The release OCI images wrap `boatramp-static` (the fully-static musl + jemalloc
      # binary) — a DIFFERENT derivation from the glibc `default` above, so the build
      # of `.#default` does NOT warm the image closure. The x86_64 image closure is
      # already warmed by preflight-matrix's (x86_64) nix legs, but nothing else builds
      # the arm64 one — so warm it HERE for the multi-arch release, on the native arm64
      # runner. cachix-action's post-step then pushes the realized closure to the cache,
      # and the release `container-build` arm64 leg substitutes it instead of compiling
      # from source. (Harmless on any future Linux arch added to the matrix.)
      - name: Warm the arm64 OCI image closure
        if: matrix.system == 'aarch64-linux'
        run: |
          nix build \
            .#packages.aarch64-linux.boatramp-static \
            .#packages.aarch64-linux.container \
            .#packages.aarch64-linux.container-cloudflare \
            .#packages.aarch64-linux.container-debug \
            .#packages.aarch64-linux.container-cloudflare-debug \
            --print-build-logs --print-out-paths
