name: Capability e2e (privileged live seams)

# The capability runner for the #[ignore]d live-seam tests that need real host
# capabilities (KVM, root+namespaces+criu) or local test-doubles (a throwaway ACME
# CA) — the tests that otherwise run nowhere automated. Runs on GitHub's EPHEMERAL
# hosted runners: a fresh, single-use VM per job, destroyed afterward, with NO SSH
# key / VPN / LAN route to any private infrastructure and NO stored secrets. The
# isolation is the throwaway runner itself; every test here uses a capability
# (/dev/kvm, root) or a local test-double (busybox rootfs, Pebble CA), never a real
# cloud account or private host. This is why it is safe to run privileged test code
# on hosted infra rather than a self-hosted box that sits on your network.
#
# Nightly + on-demand. Public repo ⇒ these hosted runners are free.

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily (after the main nightly at 04:00)
  workflow_dispatch:
    inputs:
      vmlinux_tag:
        description: "boatramp-vmlinux release tag to boot"
        required: false
        default: "v0.2.3"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The built-in BOATRAMP_KERNEL_SIGNING_PUBKEY: the released kernel must verify
  # against this exact key (the production verify-before-boot bar) or the gate fails.
  BOATRAMP_RELEASE_PUBKEY: "es256:02c4e4af2e9cba6ba6745c513f193622e6674a8b2d0187ebea5612f5b46a7eade4"

jobs:
  # Tier A — the microVM (KVM) compute backend: fetch the PUBLISHED signed kernel,
  # verify hash+signature, boot it on /dev/kvm, then build a busybox rootfs and serve
  # a workload end to end. Needs only the ephemeral runner's /dev/kvm — no secrets.
  microvm:
    name: microVM boot + serve (KVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Confirm KVM is available on the hosted runner
        run: |
          test -e /dev/kvm && ls -l /dev/kvm
          sudo chmod 666 /dev/kvm || true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: capability-microvm

      - name: Host build deps (mke2fs for the scratch rootfs)
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs

      - name: Download the released kernel + .sha256 + .sig
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.vmlinux_tag || 'v0.2.3' }}"
          gh release download "$tag" -R BoatRamp/boatramp-vmlinux \
            -p 'boatramp-vmlinux-x86_64' \
            -p 'boatramp-vmlinux-x86_64.sha256' \
            -p 'boatramp-vmlinux-x86_64.sig' \
            -D rel --clobber
          ls -l rel/

      - name: Verify content hash + ES256 signature (verify-before-boot bar)
        run: |
          cd rel
          printf '%s  boatramp-vmlinux-x86_64\n' "$(cat boatramp-vmlinux-x86_64.sha256)" | sha256sum -c -
          cd ..
          export BOATRAMP_RELEASE_KERNEL="$(realpath rel/boatramp-vmlinux-x86_64)"
          export BOATRAMP_RELEASE_SHA256="$(cat rel/boatramp-vmlinux-x86_64.sha256)"
          export BOATRAMP_RELEASE_SIG="$(cat rel/boatramp-vmlinux-x86_64.sig)"
          cargo test -p boatramp-core --features authz \
            kernel_trust::tests::released_kernel_verifies_under_strict -- --ignored --nocapture

      - name: Boot the kernel to serial console (hard gate)
        run: |
          set -o pipefail
          KERNEL="$(realpath rel/boatramp-vmlinux-x86_64)"
          timeout -k 30 360 sudo -E env "PATH=$PATH" "BOATRAMP_TEST_KERNEL=$KERNEL" \
            cargo test -p boatramp-firecracker --lib --features build,backend,embedded \
            boots_a_real_kernel_to_serial -- --ignored --nocapture 2>&1 | tee serial.log
          grep -qE 'running [1-9][0-9]* tests?' serial.log \
            || { echo "::error::serial boot ran 0 tests (embedded backend cfg'd out)" >&2; exit 1; }

      - name: Build a busybox rootfs + serve a workload end to end (hard gate)
        run: |
          set -o pipefail
          KERNEL="$(realpath rel/boatramp-vmlinux-x86_64)"
          timeout -k 30 720 sudo -E env "PATH=$PATH" "BOATRAMP_TEST_KERNEL=$KERNEL" \
            cargo test -p boatramp-firecracker --features build,backend,embedded \
            --test embedded_backend_live serves_an_oci_workload_end_to_end \
            -- --ignored --nocapture 2>&1 | tee serve.log
          grep -qE 'running [1-9][0-9]* tests?' serve.log \
            || { echo "::error::serve path ran 0 tests" >&2; exit 1; }

  # Tier B — the native container backend: root + user namespaces + a veth bridge +
  # CRIU checkpoint/restore. Uses a busybox rootfs exported from the public busybox
  # image (a test-double, not a private artifact) plus a public pgvector image pulled
  # daemonless for the co-located managed-DB seam. No secrets.
  container:
    name: container launch (root) + co-located Postgres + cross-tenant isolation + rls_session guard + mysql rls_session + single-vol isolation + single reconcile stability + CRIU (informational)
    # Ubuntu 24.04 (noble) dropped the `criu` package; jammy still ships it. The native
    # container backend LAUNCH (userns + veth into br-boatramp + cgroup-v2 limits under a
    # delegated /sys/fs/cgroup/boatramp subtree + serve over HTTP) runs to GREEN here and
    # is a HARD GATE — for a busybox test-double AND for a real stock OCI image (pgvector)
    # run co-located as a managed Postgres, in both id-mapping modes (rootless default +
    # host-root opt-in). Only CRIU *restore* is informational: it segfaults on the hosted
    # runner's kernel (restore is highly kernel/environment-sensitive) — attempted +
    # surfaced, non-gating.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: capability-container

      - name: Host deps (criu, psql client) + a busybox rootfs tarball
        run: |
          # `criu` for the informational restore tier; `postgresql-client` for the
          # co-located Postgres gate's real `psql` query over TCP.
          sudo apt-get update && sudo apt-get install -y criu postgresql-client
          # A minimal rootfs from the public busybox image — a test-double, built on
          # the runner, never a private artifact.
          cid="$(docker create busybox:latest)"
          docker export "$cid" | gzip > /tmp/bb-rootfs.tar.gz
          docker rm "$cid"
          ls -l /tmp/bb-rootfs.tar.gz

      - name: Build the boatramp binary (BOATRAMP_BIN)
        run: cargo build -p boatramp --no-default-features --features fs

      - name: Auto-create the compute bridge (SIOCBRADDBR + netlink) — turnkey, hard gate
        run: |
          set -o pipefail
          # Proves boatramp self-creates + addresses a bridge over netlink with no `ip`
          # binary and no operator pre-step — the fly/stock-image turnkey path. The test
          # makes, addresses, re-ensures (idempotent), and tears down its own throwaway
          # bridge, so it doesn't touch the `br-boatramp` the container_live test uses.
          sudo -E env "PATH=$PATH" \
            cargo test -p boatramp-container --lib \
            ensure_bridge_creates_and_is_idempotent -- --ignored --nocapture 2>&1 | tee bridge.log
          grep -q 'idempotent, cleaned up' bridge.log \
            || { echo "::error::ensure_bridge did not create + address a bridge" >&2; exit 1; }

      - name: Create the container bridge + delegate a cgroup subtree (best-effort)
        run: |
          # The container_live test drives the backend directly (not the node-init path
          # that auto-creates the bridge), so give it `br-boatramp` explicitly here. In
          # production `ensure_bridge` (gated above) makes this at compute-node startup.
          sudo ip link add br-boatramp type bridge 2>/dev/null || true
          sudo ip addr add 10.0.0.1/24 dev br-boatramp 2>/dev/null || true
          sudo ip link set br-boatramp up
          ip -brief addr show br-boatramp
          # Best-effort cgroup-v2 delegation for /sys/fs/cgroup/boatramp/<id>: create the
          # parent and try to enable the controllers the backend sets limits with. On a
          # systemd-managed root this can be refused (no-internal-processes) — hence the
          # informational tier.
          sudo mkdir -p /sys/fs/cgroup/boatramp || true
          echo "+cpu +memory +pids" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null 2>&1 || true
          echo "+cpu +memory +pids" | sudo tee /sys/fs/cgroup/boatramp/cgroup.subtree_control >/dev/null 2>&1 || true
          cat /sys/fs/cgroup/cgroup.controllers || true

      - name: Launch + serve a container (hard gate)
        run: |
          set -o pipefail
          BIN="$(realpath target/debug/boatramp)"
          timeout -k 30 300 sudo -E env "PATH=$PATH" \
            "BOATRAMP_BIN=$BIN" "BOATRAMP_CONTAINER_ROOTFS=/tmp/bb-rootfs.tar.gz" \
            cargo test -p boatramp-container --test container_live \
            container_live_launch_and_hold -- --ignored --nocapture 2>&1 | tee container.log
          grep -qE 'test result: ok' container.log \
            || { echo "::error::container launch+serve failed" >&2; exit 1; }

      - name: Exec into a running container (setns) — command + stdin round-trip (hard gate)
        run: |
          set -o pipefail
          BIN="$(realpath target/debug/boatramp)"
          # `compute exec` re-enters a running container's namespaces (setns double-fork:
          # user→mnt/uts/ipc/net, then pid, then fork) and runs a command, capturing
          # stdout/stderr + feeding stdin. Proves the shared-kernel exec path the
          # operator `boatramp compute exec` uses.
          timeout -k 30 300 sudo -E env "PATH=$PATH" \
            "BOATRAMP_BIN=$BIN" "BOATRAMP_CONTAINER_ROOTFS=/tmp/bb-rootfs.tar.gz" \
            cargo test -p boatramp-container --test container_live \
            container_exec_runs_command_and_round_trips_stdin -- --ignored --nocapture 2>&1 | tee exec.log
          # A silent skip (missing fixtures) still prints `test result: ok`; gate on the
          # end-of-test marker that prints ONLY after echo captured + stdin round-tripped.
          grep -qE 'test result: ok' exec.log \
            || { echo "::error::container exec test did not pass" >&2; exit 1; }
          grep -q 'container exec OK: echo captured + stdin round-tripped' exec.log \
            || { echo "::error::container exec never reached the success marker (silent skip?)" >&2; exit 1; }

      - name: One-shot run_ephemeral round-trip — native project export/import engine (hard gate)
        run: |
          set -o pipefail
          BIN="$(realpath target/debug/boatramp)"
          # The native `ComputeBackend::run_ephemeral` (env-clone item 3): with no persisted
          # workload, resolve a small OCI image via the DEFAULT daemonless pull, launch a
          # hardened one-shot jail with veth egress, and prove the ephemeral contract live —
          # (A) stdout STREAMS out + the exit code is captured (`sh -c 'echo hi'` → `hi`, 0),
          # (B) stdin STREAMS in over the dedicated pipe (`cat` echoes a fed payload — the
          # restore direction, decoupled from the handshake fd), and (C) a non-zero exit is
          # returned as a LEGITIMATE code (`sh -c 'exit 7'` → Ok(7)), not an error. This is
          # the engine behind project export/import on the native container backend.
          timeout -k 30 600 sudo -E env "PATH=$PATH" "BOATRAMP_BIN=$BIN" \
            cargo test -p boatramp-container --test container_live \
            container_live_run_ephemeral -- --ignored --nocapture 2>&1 | tee ephemeral.log
          # A silent skip (missing BOATRAMP_BIN) still prints `test result: ok` — the exact
          # anti-silent-skip trap. Gate on the end-of-test marker that prints ONLY after all
          # three streamed-stdout / streamed-stdin / non-zero-exit assertions held.
          grep -qE 'test result: ok' ephemeral.log \
            || { echo "::error::run_ephemeral round-trip did not pass" >&2; exit 1; }
          grep -q 'native run_ephemeral OK: streamed stdout + stdin round-trip + non-zero exit code' ephemeral.log \
            || { echo "::error::run_ephemeral never reached the success marker (silent skip?)" >&2; exit 1; }

      - name: Co-located Postgres (pgvector) from an OCI image — rootless + host-root (hard gate)
        run: |
          set -o pipefail
          BIN="$(realpath target/debug/boatramp)"
          # Pull pgvector/pgvector:pg16 daemonless and run it under the native container
          # backend in BOTH id-mapping modes (rootless default + host-root opt-in), each
          # proving a real `initdb` + query + `create extension vector` over TCP.
          # --test-threads=1 so the two launches don't contend on the single test bridge.
          timeout -k 30 600 sudo -E env "PATH=$PATH" "BOATRAMP_BIN=$BIN" \
            cargo test -p boatramp-container --test container_live \
            container_live_postgres -- --ignored --test-threads=1 --nocapture 2>&1 | tee pg.log
          # A skip (missing BOATRAMP_BIN) still reports `test result: ok` — the exact trap
          # that once let a broken "tested e2e" claim through. Gate on the success markers
          # that print ONLY after each mode reaches a serving Postgres, so a silent skip
          # fails the job.
          grep -qE 'test result: ok' pg.log \
            || { echo "::error::co-located Postgres e2e did not pass" >&2; exit 1; }
          grep -q 'co-located pgvector from an OCI image (rootless):' pg.log \
            || { echo "::error::rootless mode never reached a serving Postgres (silent skip?)" >&2; exit 1; }
          grep -q 'co-located pgvector from an OCI image (host-root):' pg.log \
            || { echo "::error::host-root mode never reached a serving Postgres (silent skip?)" >&2; exit 1; }

      - name: Co-located managed-DB volume isolation + legacy adoption (hard gate — the cross-tenant volume collision)
        run: |
          set -o pipefail
          BIN="$(realpath target/debug/boatramp)"
          # The load-bearing proof that two co-located managed databases NO LONGER share one
          # host PGDATA (the CRITICAL `<data_dir>/compute/volumes/data` collision): launch TWO
          # managed pgvector workloads that BOTH request the bare "data" volume and assert they
          # land on DISTINCT per-(project,workload) scoped dirs, both come up healthy, and
          # NEITHER reads the other's sentinel row (a true two-cluster multi-tenant fixture).
          # The second test proves the one-time legacy-"data" migration: the proven claimant
          # adopts the pre-v0.46 flat cluster (data preserved, read as-is) while a non-claimant
          # gets a fresh dir and an unproven owner fails closed. The third (F4) proves the
          # ENV-configured turnkey recovery: a NODE-DEFAULT managed pg owning the bare `data`
          # cluster + a co-located declared `control` (no node-static config, no flag) — the
          # node-default pg adopts its cluster via the node-side bulk migration, `control` gets a
          # fresh scoped dir, both healthy, zero cross-read. --test-threads=1 so the launches
          # don't contend on the single test bridge.
          timeout -k 30 1200 sudo -E env "PATH=$PATH" "BOATRAMP_BIN=$BIN" \
            cargo test -p boatramp-container --test container_live \
            container_colocated_managed_dbs_get_isolated_volumes \
            container_legacy_data_volume_adopted_only_by_the_claimant \
            container_f4_node_default_pg_adopts_data_colocated_control_fresh \
            -- --ignored --test-threads=1 --nocapture 2>&1 | tee voliso.log
          # A silent skip (missing BOATRAMP_BIN) still prints `test result: ok`; gate on ALL
          # end-of-test success markers, which print ONLY after the isolation / zero-cross-read,
          # the claimant-adoption / refuse-on-unproven, and the F4 turnkey assertions all held.
          grep -qE 'test result: ok' voliso.log \
            || { echo "::error::co-located managed-DB volume isolation test did not pass" >&2; exit 1; }
          grep -q 'colocated isolation OK:' voliso.log \
            || { echo "::error::co-located isolation never reached the success marker (silent skip or cross-tenant volume collision?)" >&2; exit 1; }
          grep -q 'legacy single-claimant adoption + refuse-on-unproven OK' voliso.log \
            || { echo "::error::legacy-data adoption never reached the success marker (silent skip?)" >&2; exit 1; }
          grep -q 'F4 turnkey OK:' voliso.log \
            || { echo "::error::F4 turnkey node-default-pg migration never reached the success marker (silent skip?)" >&2; exit 1; }

      - name: Cross-tenant isolation on a shared Postgres (hard gate — the #1 invariant)
        run: |
          set -o pipefail
          BIN="$(realpath target/debug/boatramp)"
          # The load-bearing proof that per-tenant managed-DB isolation HOLDS live: launch
          # ONE shared pgvector via the container backend (as the co-located gate above),
          # provision two tenants (acme, globex) through the shipped `tenant_sql`
          # provisioning path, then assert Postgres DENIES acme's role a connection to
          # globex's database (REVOKE CONNECT FROM PUBLIC + per-role grant) while acme
          # reaches its own. `psql` over TCP for the connections; --test-threads=1 so it
          # doesn't contend with anything on the single test bridge. The `sql-postgres`
          # feature pulls the tenant_sql/managed_sql data plane into the test.
          timeout -k 30 600 sudo -E env "PATH=$PATH" "BOATRAMP_BIN=$BIN" \
            cargo test -p boatramp-node --features sql-postgres \
            --test tenant_isolation_live \
            -- --ignored --test-threads=1 --nocapture 2>&1 | tee tenant-iso.log
          # A silent skip (missing BOATRAMP_BIN) still prints `test result: ok` — the exact
          # trap the project's anti-silent-skip rule guards against. Gate on the success
          # marker that prints ONLY after the positive AND the negative (cross-tenant DENY)
          # assertions both held, so a skip or a partial pass fails the job.
          grep -qE 'test result: ok' tenant-iso.log \
            || { echo "::error::tenant isolation test did not pass" >&2; exit 1; }
          grep -q 'TENANT ISOLATION OK: acme reaches acme, acme denied globex' tenant-iso.log \
            || { echo "::error::tenant isolation never reached the success marker (silent skip or cross-tenant breach?)" >&2; exit 1; }

      - name: rls_session guest-SQL guard holds live (hard gate — the RLS spoof invariant)
        run: |
          set -o pipefail
          BIN="$(realpath target/debug/boatramp)"
          # The load-bearing proof that the `rls_session` guard HOLDS live: launch ONE
          # shared pgvector via the container backend (as the co-located gate above),
          # provision an `acme` tenant with `rls_session = true` through the shipped
          # resolver, and on the REAL session-context-injecting backend the data plane
          # hands a request assert (1) the injected `boatramp.project` reads back `acme`,
          # and (2) every guest spoof (`set_config`/`SET`/dollar-quoted `DO`) is refused
          # at the guest entry-point guard AND `boatramp.project` still equals `acme`
          # afterward. --test-threads=1 so it doesn't contend on the single test bridge.
          # The `sql-postgres` feature pulls the tenant_sql/rls_session data plane in.
          timeout -k 30 600 sudo -E env "PATH=$PATH" "BOATRAMP_BIN=$BIN" \
            cargo test -p boatramp-node --features sql-postgres \
            --test rls_session_live \
            -- --ignored --test-threads=1 --nocapture 2>&1 | tee rls.log
          # A silent skip (missing BOATRAMP_BIN) still prints `test result: ok` — the exact
          # trap the project's anti-silent-skip rule guards against. Gate on the success
          # marker that prints ONLY after the injection-is-real AND the spoof-refused +
          # value-unchanged assertions all held, so a skip or a bypass fails the job.
          grep -qE 'test result: ok' rls.log \
            || { echo "::error::rls_session guard test did not pass" >&2; exit 1; }
          grep -q 'RLS SESSION GUARD OK' rls.log \
            || { echo "::error::rls_session guard never reached the success marker (silent skip or guard bypass?)" >&2; exit 1; }

      - name: rls_session guard holds live on MySQL (hard gate — two-engine parity)
        run: |
          set -o pipefail
          BIN="$(realpath target/debug/boatramp)"
          # The two-engine-parity counterpart to the Postgres rls_session gate above, on a
          # stock `mysql:8.0`: MySQL is where the guard was previously live-bypassable (the
          # `@boatramp_*` comma-assign + `SELECT … INTO @var` forms), so a committed live
          # gate here is the durable proof. Launch ONE shared mysql via the container
          # backend, provision an `acme` tenant with `rls_session = true` through the
          # shipped resolver, and on the REAL session-context-injecting backend the data
          # plane hands a request assert (1) the injected `@boatramp_project` reads back
          # `acme`, and (2) every guest spoof is refused at the guest entry-point guard AND
          # `@boatramp_project` still equals `acme` afterward, with a control proving an
          # UNGUARDED overwrite WOULD change it. No host DB client is needed — readiness +
          # every read go through boatramp's own MySQL backend; MySQL's slow first boot
          # gets a generous readiness wait. --test-threads=1 so it doesn't contend on the
          # single test bridge. The `sql-mysql` feature pulls the tenant_sql/rls_session
          # data plane in.
          timeout -k 30 600 sudo -E env "PATH=$PATH" "BOATRAMP_BIN=$BIN" \
            cargo test -p boatramp-node --features sql-mysql \
            --test rls_session_mysql_live \
            -- --ignored --test-threads=1 --nocapture 2>&1 | tee rls-mysql.log
          # A silent skip (missing BOATRAMP_BIN) still prints `test result: ok` — the exact
          # trap the project's anti-silent-skip rule guards against. Gate on the success
          # marker that prints ONLY after the injection-is-real AND the spoof-refused +
          # value-unchanged assertions all held, so a skip or a bypass fails the job.
          grep -qE 'test result: ok' rls-mysql.log \
            || { echo "::error::mysql rls_session guard test did not pass" >&2; exit 1; }
          grep -q 'RLS SESSION GUARD OK (mysql)' rls-mysql.log \
            || { echo "::error::mysql rls_session guard never reached the success marker (silent skip or guard bypass?)" >&2; exit 1; }

      - name: Single-mode per-tenant volume isolation holds live (hard gate — the v0.3.11 fix)
        run: |
          set -o pipefail
          BIN="$(realpath target/debug/boatramp)"
          # The load-bearing proof of the v0.3.11 fix: a NON-DEFAULT Single-mode per-tenant
          # managed Postgres comes up on its OWN isolated data volume and authenticates with
          # its freshly-minted per-tenant credential. Before the fix every managed DB used the
          # fixed volume name "data" (keyed by name only), so a per-tenant Single container
          # reused another workload's PGDATA, Postgres skipped initdb, and the app failed auth
          # against its own credential. Provision two non-default Single tenants (acme, globex)
          # through the shipped `tenant_sql` path — which registers each tenant's dedicated
          # workload with the per-tenant volume name + mints its credential — launch each
          # dedicated container via the container backend, then assert (1) each volume dir is
          # `<data_dir>/compute/volumes/<workload>` (NOT `.../data`), (2) connecting through
          # the SHIPPED resolved backend + `SELECT current_user` SUCCEEDS (fresh initdb'd role
          # authenticates), and (3) the two tenants land on DISTINCT volume dirs (no collision).
          # No host DB client is needed — the connect goes through boatramp's own pg backend.
          # --test-threads=1 so the two launches don't contend on the single test bridge. The
          # `sql-postgres` feature pulls the tenant_sql/managed_sql data plane in.
          timeout -k 30 900 sudo -E env "PATH=$PATH" "BOATRAMP_BIN=$BIN" \
            cargo test -p boatramp-node --features sql-postgres \
            --test single_volume_live \
            -- --ignored --test-threads=1 --nocapture 2>&1 | tee single-vol.log
          # A silent skip (missing BOATRAMP_BIN) still prints `test result: ok` — the exact
          # trap the project's anti-silent-skip rule guards against. Gate on the success marker
          # that prints ONLY after the isolated-volume, authenticates, AND distinct-volume
          # assertions all held, so a skip or a regression (shared volume / auth failure) fails
          # the job.
          grep -qE 'test result: ok' single-vol.log \
            || { echo "::error::single-mode volume isolation test did not pass" >&2; exit 1; }
          grep -q 'SINGLE VOLUME ISOLATION OK' single-vol.log \
            || { echo "::error::single-mode volume isolation never reached the success marker (silent skip or shared-volume regression?)" >&2; exit 1; }

      - name: Single-mode reconcile stability holds live (hard gate — the v0.3.12 fixes)
        run: |
          set -o pipefail
          BIN="$(realpath target/debug/boatramp)"
          # The load-bearing proof of the v0.3.12 fixes for a non-default project's Single
          # per-tenant managed Postgres. Before v0.3.12 the tenant DB was (Bug 1) unreachable
          # on lazy provision until a process restart, and (Bug 2) after a boot reconcile the
          # credential the CONTAINER was initdb'd with drifted from the one the PROCESS
          # connected with — a tenant-blind bare `pg`/`default` duplicate workload + a
          # tenant-blind operator path. For a non-default `exampleorg` Single/project binding
          # this boot-warms the tenant through the shipped `auto_register` path, launches its
          # dedicated container, and asserts (1) exactly ONE managed workload `pg-<ident>`
          # under `exampleorg` and NONE (`pg`) under `default` (no two-workload split), (2)
          # the SHIPPED resolver's `SELECT current_user` authenticates WITHOUT a restart
          # (reachable), (3) after a boot-style reconcile (stop + relaunch on the same volume,
          # initdb skipped) the credential is STILL valid (the P1 == P2 core), and (4) the
          # `NodeOperatorSql` operator path reaches the tenant's OWN database + user (not a
          # bare `pg`/`default`). No host DB client is needed — every connect goes through
          # boatramp's own pg backend. --test-threads=1 so the launches don't contend on the
          # single test bridge. The `sql-postgres` feature pulls the tenant_sql/managed_sql
          # data plane in.
          timeout -k 30 900 sudo -E env "PATH=$PATH" "BOATRAMP_BIN=$BIN" \
            cargo test -p boatramp-node --features sql-postgres \
            --test single_reconcile_live \
            -- --ignored --test-threads=1 --nocapture 2>&1 | tee single-reconcile.log
          # A silent skip (missing BOATRAMP_BIN) still prints `test result: ok` — the exact
          # trap the project's anti-silent-skip rule guards against. Gate on the success marker
          # that prints ONLY after the no-split, reachable-no-restart, credential-stable, AND
          # operator-reaches-tenant assertions all held, so a skip or a regression (Bug 1 or
          # Bug 2) fails the job.
          grep -qE 'test result: ok' single-reconcile.log \
            || { echo "::error::single-mode reconcile stability test did not pass" >&2; exit 1; }
          grep -q 'SINGLE RECONCILE OK:' single-reconcile.log \
            || { echo "::error::single-mode reconcile stability never reached the success marker (silent skip or a v0.3.12 regression?)" >&2; exit 1; }

      - name: Project export/import round-trip holds live (hard gate — the env-clone pipeline)
        run: |
          set -o pipefail
          # Start a stock pgvector on the docker default bridge so BOTH this job and the
          # ephemeral pg_dump/pg_restore containers the test launches (siblings on the same
          # bridge, via the host docker daemon) reach it by its container IP — the
          # colocated-reachability shape the driver handles. No sudo: the test drives the
          # docker API as the runner user (docker group), not the native container backend.
          docker rm -f brexport-pg >/dev/null 2>&1 || true
          docker run -d --name brexport-pg -e POSTGRES_PASSWORD=postgres \
            pgvector/pgvector:pg16 >/dev/null
          for i in $(seq 1 60); do
            docker exec brexport-pg pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 2
          done
          PGIP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' brexport-pg)"
          echo "pgvector bridge IP: $PGIP"
          # Same colocated-reachability shape for MySQL: a stock mysql:8.0 on the default
          # bridge (native-password auth so the plaintext bridge connection works; 8.0 is
          # pinned because `--default-authentication-plugin` is gone in 8.4). The ephemeral
          # mysqldump/mysql client containers the test launches reach it by its bridge IP.
          docker rm -f brexport-mysql >/dev/null 2>&1 || true
          docker run -d --name brexport-mysql -e MYSQL_ROOT_PASSWORD=mysql \
            mysql:8.0 --default-authentication-plugin=mysql_native_password >/dev/null
          for i in $(seq 1 90); do
            docker exec brexport-mysql mysqladmin ping -h 127.0.0.1 -uroot -pmysql >/dev/null 2>&1 && break
            sleep 2
          done
          MYIP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' brexport-mysql)"
          echo "mysql bridge IP: $MYIP"
          BOATRAMP_TEST_PG_URL="postgres://postgres:postgres@${PGIP}:5432/postgres" \
          BOATRAMP_TEST_MYSQL_URL="mysql://root:mysql@${MYIP}:3306/mysql" \
            timeout -k 30 1800 cargo test -p boatramp-node --features project-export,sql-delta-libsql \
            --test project_export_roundtrip \
            -- --test-threads=1 --nocapture 2>&1 | tee project-export.log
          # Cross-node SOURCE-VERSION-INDEPENDENCE gate (v0.59.2): drives the REAL boatramp-server
          # clone/stream + project-import HANDLERS over the real axum stack on a SOURCE + TARGET node,
          # so the wire layer where a pre-v0.59.1 source drops the `managed_restore` signal is
          # exercised. The managed-restore mode travels ONLY as a wire query param (NO hand-built
          # ExportOptions/ImportOptions). Same pg+mysql servers; self-skips → gate on its markers.
          BOATRAMP_TEST_PG_URL="postgres://postgres:postgres@${PGIP}:5432/postgres" \
          BOATRAMP_TEST_MYSQL_URL="mysql://root:mysql@${MYIP}:3306/mysql" \
            timeout -k 30 900 cargo test -p boatramp-node --features project-export \
            --test project_sync_cross_node_source_independent_live \
            -- --test-threads=1 --nocapture 2>&1 | tee project-sync-xnode.log
          docker rm -f brexport-pg >/dev/null 2>&1 || true
          docker rm -f brexport-mysql >/dev/null 2>&1 || true
          # The test self-skips (and still prints `test result: ok`) when pg/docker are
          # absent — the exact silent-skip trap. Gate on the success marker that prints ONLY
          # after the real export -> bundle(SHA-256 verify) -> fresh-DB -> import ->
          # ROW+SCHEMA-equality round-trip, so a skip or a regression fails the job.
          grep -qE 'test result: ok' project-export.log \
            || { echo "::error::project export round-trip did not pass" >&2; exit 1; }
          grep -q 'PROJECT EXPORT ROUNDTRIP OK' project-export.log \
            || { echo "::error::project export round-trip never reached the success marker (silent skip or a regression?)" >&2; exit 1; }
          # The libsql round-trip is in-process (no server/daemon) so it ALWAYS runs in the
          # same invocation — its marker proves it was not silently feature-gated away.
          grep -q 'PROJECT EXPORT LIBSQL ROUNDTRIP OK' project-export.log \
            || { echo "::error::libsql project export round-trip never reached its marker (silent skip or a regression?)" >&2; exit 1; }
          # libsql CHANGESET true-delta (SQL true-delta program, Stage 4): in-process (no server),
          # so the `--features sql-delta-libsql` build ALWAYS runs it — its marker prints ONLY after
          # the base->mutate->changeset-delta->import round-trip AND the ≥2-tenant crafted-escape
          # refusal both pass, so a silent feature-gate-away or a regression fails the job.
          grep -q 'PROJECT EXPORT LIBSQL TRUE-DELTA OK' project-export.log \
            || { echo "::error::libsql changeset true-delta gate never reached its marker (silent skip or a regression?)" >&2; exit 1; }
          # libsql changeset true-delta MULTI-DELTA CHAIN (PLAN-sql-true-delta Stage 5): in-process,
          # so the `--features sql-delta-libsql` build ALWAYS runs it — its marker prints ONLY after
          # the base->d1->d2 3-link incremental round-trip (true-delta across EVERY link) AND the
          # crafted MIDDLE-of-chain changeset refusal both pass, so a silent feature-gate-away or a
          # chain-restore regression fails the job. (The pg/mysql CHAIN gates self-skip here — no
          # wal_level=logical / binlog on this job's DBs — and gate in preflight-matrix.yml instead.)
          grep -q 'PROJECT EXPORT LIBSQL TRUE-DELTA CHAIN OK' project-export.log \
            || { echo "::error::libsql changeset true-delta CHAIN gate never reached its marker (silent skip or a regression?)" >&2; exit 1; }
          # MySQL round-trip: self-skips without a reachable MySQL/docker (the silent-skip
          # trap), so gate on its marker which prints ONLY after the real mysqldump ->
          # bundle(SHA-256) -> drop -> mysql-restore -> ROW-equality round-trip.
          grep -q 'PROJECT EXPORT MYSQL ROUNDTRIP OK' project-export.log \
            || { echo "::error::mysql project export round-trip never reached its marker (silent skip or a regression?)" >&2; exit 1; }
          # Full-DRIVER round-trip: drives the real NodeProjectExport.export/import (not the
          # reconstructed primitives), so the driver's resolve_pg + run_sql_client glue is
          # exercised live. Same self-skip trap → gate on its marker.
          grep -q 'PROJECT EXPORT DRIVER ROUNDTRIP OK' project-export.log \
            || { echo "::error::full-driver project export round-trip never reached its marker (silent skip or a regression?)" >&2; exit 1; }
          # Clone self-provision on a Shared tenant (PLAN-clone-self-provision-managed-db):
          # reproduces construens's exact "database … does not exist" readiness-probe failure
          # (a clone into a FRESH, never-provisioned Shared-tenant target on an ALREADY-healthy
          # shared server) through the REAL NodeProjectExport driver, then asserts the fix
          # self-provisions + restores end-to-end, a pre-existing sibling tenant stays
          # byte-for-byte untouched (target-scoped only), and a second import is a clean
          # no-clobber no-op (idempotent). Same self-skip trap → gate on its marker.
          grep -q 'PROJECT EXPORT CLONE SELF-PROVISION SHARED TENANT OK' project-export.log \
            || { echo "::error::clone self-provision (Shared tenant) never reached its marker (silent skip or a regression?)" >&2; exit 1; }
          # `project sync` managed-pg SHADOW-LAND (the incident regression gate): drives the REAL
          # NodeProjectExport to EXPORT a DataPlane+ShadowSwap bundle of a seeded managed-pg source
          # and IMPORT it into a fresh managed dest via the atomic non-superuser shadow+swap, asserts
          # the rows LAND + the KV slice is not carried + no orphan shadow/apply-role remains, AND
          # mutation-verifies that the SAME data as a ManagedRestore::Overlay bundle is STILL refused
          # ("data-only restore of MANAGED pg … not supported"). Same self-skip trap → gate on its
          # marker so a skip or a regression (the refusal creeping back, or the overlay guard being
          # over-opened) fails the job.
          grep -q 'PROJECT SYNC MANAGED PG SHADOW LAND OK' project-export.log \
            || { echo "::error::project sync managed-pg shadow-land gate never reached its marker (silent skip or a regression?)" >&2; exit 1; }
          # `project sync` managed-MYSQL Shared SHADOW-LAND: the mysql analogue of the pg gate above —
          # drives the REAL NodeProjectExport to EXPORT a Shared tenant's DataPlane+ShadowSwap bundle
          # (framed sidecar/tables-only) and IMPORT it into a fresh Shared tenant via the NEW
          # mysql_sidecar_shadow_restore (non-superuser shadow+swap), asserting rows land + queryable
          # as the tenant role + ZERO cross-tenant bytes (≥2 tenants) + no orphan shadow/apply-user +
          # idempotent re-import + the Overlay RCE guard still refusing. Same self-skip trap → gate on
          # its marker.
          grep -q 'PROJECT SYNC MANAGED MYSQL SHARED SHADOW LAND OK' project-export.log \
            || { echo "::error::project sync managed-mysql Shared shadow-land gate never reached its marker (silent skip, a regression, or a cross-tenant leak)" >&2; exit 1; }
          # Shared rls_session force-RLS REPLICATE (v0.59.2): the non-super shadow restore EXCLUDES
          # boatramp's superuser-only force-RLS trigger+fn (no "permission denied to create event
          # trigger"), REPLICATES the source's per-table ENABLE/FORCE state exactly (NO sweep —
          # construens runs deliberate ENABLE-not-FORCE), re-installs the trigger via re-provision, and
          # proves cross-tenant isolation under a NON-OWNER runtime + a MUTATION (plain restore → the
          # exact wall). Same self-skip trap → gate on its marker.
          grep -q 'PROJECT SYNC SHARED RLS FORCE REPLICATE OK' project-export.log \
            || { echo "::error::Shared rls_session force-RLS replicate gate never reached its marker (silent skip, the exclude regressed into the event-trigger wall, or force was wrongly imposed)" >&2; exit 1; }
          # Idempotency + orphan-recovery (construens re-run shape): a RE-RUN of the restore into a
          # same-named dest whose managed DB ALREADY EXISTS RECOVERS (idempotent replace); the
          # soft-deprovision of a 63-byte-name tenant SUCCEEDS (the bounded `__deleted_` aside never
          # collapses to the live name → no `database … already exists`); `project rm`'s deprovisioner
          # tears down a PROJECT-DECLARED db even with an empty node-static map; and `db drop database`
          # clears an orphan — all with ≥2 tenants + zero foreign bytes. Self-skip trap → gate on marker.
          grep -q 'PROJECT SYNC IDEMPOTENCY ORPHAN OK' project-export.log \
            || { echo "::error::sync idempotency/orphan-recovery gate never reached its marker (silent skip, the aside overflow regressed into 'database already exists', a declared db was orphaned on rm, or the orphan-drop verb broke)" >&2; exit 1; }
          # UNDECLARED-ORPHAN reconcile + absent-dest FULL-bundle shadow-swap LAND (construens's 5th
          # layer): a fresh absent-dest FULL-bundle restore into a POPULATED UNDECLARED orphan at the
          # target name LANDS the source rows AND preserves the orphan's real data in a recoverable
          # `__deleted_` tombstone (fail-safe — never silently clobbered), under RLS with ≥2 tenants +
          # zero foreign bytes; and `db drop database --orphan` clears an orphan whose binding is gone
          # (the "no CLI path" case) + its `_owner` role, refusing the reserved default project.
          grep -q 'PROJECT SYNC UNDECLARED ORPHAN RECONCILE OK' project-export.log \
            || { echo "::error::undeclared-orphan reconcile gate never reached its marker (silent skip, a populated orphan was silently clobbered instead of preserved, the full shadow-swap restore failed to land, or the orphan-drop verb broke)" >&2; exit 1; }
          # ORPHAN-DROP clears OBJECT-OWNING derived roles + the role-sharing HARD GUARD (construens's
          # 6th layer): `db drop database --orphan` FORCE-clears an orphan's exclusively-owned
          # object-owning `_owner`/login roles (+ its own `__deleted_` aside db) so a fresh re-sync
          # LANDS; a role SHARED with a still-live sibling binding is LEFT intact + surfaced (its DROP
          # OWNED would clobber the live binding — mutation-proven both ways). Self-skip trap → marker.
          grep -q 'PROJECT SYNC ORPHAN DROP OWNING-ROLES OK' project-export.log \
            || { echo "::error::orphan-drop owning-roles gate never reached its marker (silent skip, an object-owning derived role leaked un-cleared, or a role shared with a live binding was force-cleared — DATA-LOSS risk)" >&2; exit 1; }
          # Managed MySQL carries triggers/stored routines/events across the shadow+swap, restored as
          # a non-SUPER user and RE-POINTED to the tenant's own role post-swap (the DEFINER-handling
          # seam). Gate on its marker so a skip or a regression (a carried object NOT re-pointed, or
          # the carry silently dropped) fails the job.
          grep -q 'PROJECT EXPORT MYSQL ROUTINES+TRIGGERS OK' project-export.log \
            || { echo "::error::mysql triggers/routines/events carry + DEFINER re-point gate never reached its marker (silent skip or a regression?)" >&2; exit 1; }
          # NEGATIVE control: an attacker-named view (`--all-databases`) in a bundle must be REFUSED
          # fail-closed by the view-name validator before the by-name capture mysqldump runs as the
          # admin — gate on its marker so the argv-injection guard can't silently regress.
          grep -q 'PROJECT EXPORT MYSQL VIEW-NAME INJECTION REFUSED OK' project-export.log \
            || { echo "::error::mysql view-name argument-injection refusal gate never reached its marker (silent skip, or the injection guard regressed)" >&2; exit 1; }
          # Cross-node SOURCE-VERSION-INDEPENDENCE (v0.59.2 — construens's 3rd-repeat production
          # failure): a managed-DB `project sync` into an ABSENT dest must land data CROSS-NODE against
          # ANY source version. The gate drives the REAL clone/stream + project-import handlers over
          # the real axum stack (SOURCE + TARGET node), simulates a pre-v0.59.1 source by OMITTING the
          # `managed_restore` wire param, and asserts (a) the old-source Overlay is REFUSED with the
          # distinct VERSION-SKEW message, and (b) the sync's own absent-dest decision
          # (`data_clone_request`) LANDS the rows via a full-bundle shadow+swap. Self-skips without
          # pg/mysql → gate on its markers so a skip or a regression (the fix or the version-skew error
          # regressing) fails the job.
          grep -q 'PROJECT SYNC CROSS-NODE PG SOURCE-INDEPENDENT OK' project-sync-xnode.log \
            || { echo "::error::cross-node managed-pg source-independent sync gate never reached its marker (silent skip or a regression?)" >&2; exit 1; }
          grep -q 'PROJECT SYNC CROSS-NODE MYSQL SOURCE-INDEPENDENT OK' project-sync-xnode.log \
            || { echo "::error::cross-node managed-mysql source-independent sync gate never reached its marker (silent skip or a regression?)" >&2; exit 1; }

      - name: CRIU checkpoint/restore (informational — restore is kernel-sensitive)
        continue-on-error: true
        run: |
          BIN="$(realpath target/debug/boatramp)"
          timeout -k 30 300 sudo -E env "PATH=$PATH" \
            "BOATRAMP_BIN=$BIN" "BOATRAMP_CONTAINER_ROOTFS=/tmp/bb-rootfs.tar.gz" \
            cargo test -p boatramp-container --test container_live \
            container_criu_roundtrip -- --ignored --nocapture 2>&1 | tee criu.log || true

  # Tier F — ACME DNS-01 issuance against a throwaway local Pebble CA (a test-double).
  # No real ACME account, no real DNS, no secrets — Pebble + challtestsrv bind local
  # ports on the ephemeral runner and are gone with it.
  acme:
    name: ACME DNS-01 (Pebble CA)
    runs-on: ubuntu-latest
    env:
      PEBBLE_VERSION: "v2.6.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: capability-acme

      - name: Install Pebble + challtestsrv binaries onto PATH
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          mkdir -p /tmp/pebble && cd /tmp/pebble
          # Release assets are hyphenated `.tar.gz` archives (e.g. pebble-linux-amd64.tar.gz),
          # each containing a single binary; extract and install under the names the test's
          # PATH lookup expects.
          gh release download "$PEBBLE_VERSION" -R letsencrypt/pebble \
            -p 'pebble-linux-amd64.tar.gz' -p 'pebble-challtestsrv-linux-amd64.tar.gz' --clobber
          # Extract each archive into its own dir so the pebble dir can't contain
          # challtestsrv; take the single binary file from each (name varies by release).
          mkdir -p p c
          tar xzf pebble-linux-amd64.tar.gz -C p
          tar xzf pebble-challtestsrv-linux-amd64.tar.gz -C c
          echo "extracted pebble dir:"; find p -type f
          echo "extracted challtestsrv dir:"; find c -type f
          peb="$(find p -type f -name '*pebble*' ! -name '*.tar.gz' | head -1)"
          cts="$(find c -type f -name '*challtestsrv*' ! -name '*.tar.gz' | head -1)"
          echo "pebble=$peb challtestsrv=$cts"
          sudo install -m 0755 "$peb" /usr/local/bin/pebble
          sudo install -m 0755 "$cts" /usr/local/bin/pebble-challtestsrv
          command -v pebble pebble-challtestsrv

      - name: Issue a wildcard cert via DNS-01 against the local Pebble CA
        run: |
          set -o pipefail
          cargo test -p boatramp-acme --features acme --test pebble_dns01 \
            -- --ignored --nocapture 2>&1 | tee acme.log
          grep -qE 'running [1-9][0-9]* tests?' acme.log \
            || { echo "::error::pebble ACME ran 0 tests" >&2; exit 1; }

  # Tier E — the PKCS#11 signer against SoftHSM2 (a SOFTWARE HSM). Brings the HSM
  # signing path — which ships in the binary but whose live test runs nowhere — under
  # CI, secret-free: SoftHSM2 + a throwaway P-256 token/key provisioned on the
  # ephemeral runner, gone with it. (The KMS/Vault signers need real accounts; those
  # stay out — SoftHSM covers the PKCS#11 code path itself.)
  softhsm:
    name: PKCS#11 signer (SoftHSM2)
    runs-on: ubuntu-latest
    env:
      PKCS11_PIN: "1234"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: capability-softhsm

      - name: Install SoftHSM2 + provision a token and a P-256 signing key
        run: |
          set -eo pipefail
          sudo apt-get update && sudo apt-get install -y softhsm2 opensc
          # A user-writable token store so no step needs root.
          conf="$HOME/softhsm2.conf"
          mkdir -p "$HOME/softhsm-tokens"
          printf 'directories.tokendir = %s/softhsm-tokens\nobjectstore.backend = file\n' "$HOME" > "$conf"
          echo "SOFTHSM2_CONF=$conf" >> "$GITHUB_ENV"
          export SOFTHSM2_CONF="$conf"
          softhsm2-util --init-token --free --label boatramp-test \
            --pin "$PKCS11_PIN" --so-pin "$PKCS11_PIN"
          module="$(find /usr/lib -name 'libsofthsm2.so' | head -1)"
          echo "module: $module"
          pkcs11-tool --module "$module" --token-label boatramp-test --login --pin "$PKCS11_PIN" \
            --keypairgen --key-type EC:prime256v1 --label boatramp-signing-key --id 01
          echo "PKCS11_MODULE=$module" >> "$GITHUB_ENV"

      - name: Sign round-trip against SoftHSM2 (hard gate)
        env:
          BOATRAMP_TEST_PKCS11_MODULE: ${{ env.PKCS11_MODULE }}
          BOATRAMP_TEST_PKCS11_TOKEN: boatramp-test
          BOATRAMP_TEST_PKCS11_KEY: boatramp-signing-key
        run: |
          set -o pipefail
          cargo test -p boatramp-server --features signer-pkcs11 pkcs11_live \
            -- --ignored --nocapture 2>&1 | tee softhsm.log
          grep -qE 'test result: ok' softhsm.log \
            || { echo "::error::PKCS#11 signer round-trip failed" >&2; exit 1; }

  # Tier D — Azure blob-change notify against Azurite (the local Azure emulator). The
  # cloud-notify code ships but its live test runs nowhere; Azurite exercises the
  # Storage-Queue provision/verify/retract path with NO real Azure account — the
  # well-known dev account only. (S3-notify could use LocalStack; GCS notify has no
  # emulator, so it stays real-cloud-only.)
  azure-notify:
    name: Azure notify (Azurite emulator)
    runs-on: ubuntu-latest
    env:
      BOATRAMP_TEST_AZURE_NOTIFY_ACCOUNT: devstoreaccount1
      BOATRAMP_TEST_AZURE_NOTIFY_CONTAINER: boatramp
      BOATRAMP_TEST_AZURE_EMULATOR: "1"
      # The Azurite well-known dev-account key (public, not a secret).
      AZURE_STORAGE_ACCESS_KEY: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: capability-azure

      - name: Start Azurite (queue + blob emulator)
        run: |
          npm install -g azurite
          azurite --silent --location /tmp/azurite \
            --blobHost 127.0.0.1 --blobPort 10000 \
            --queueHost 127.0.0.1 --queuePort 10001 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:10001/devstoreaccount1 >/dev/null 2>&1 && break
            sleep 1
          done
          echo "azurite up"

      - name: Provision / verify / retract a Storage Queue via Azurite (hard gate)
        run: |
          set -o pipefail
          cargo test -p boatramp-storage --features azure --test azure_notify_live \
            -- --ignored --nocapture 2>&1 | tee azure.log
          grep -qE 'test result: ok. 1 passed' azure.log \
            || { echo "::error::azure notify emulator test did not pass" >&2; exit 1; }

  # Tier G — the per-project SMTP `email` capability: prove a message actually
  # DELIVERS over SMTP through the real `lettre` backend + the node spool, on BOTH the
  # best-effort and the durable (messaging-fabric → worker re-resolves creds host-side)
  # paths. The catcher is an in-process loopback SMTP **sink** (a test-double) — no
  # relay account, no network egress, no secrets; the sink is gone with the runner.
  email:
    name: email delivery (SMTP sink)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: capability-email

      - name: Deliver best-effort + durable over a loopback SMTP sink (hard gate)
        run: |
          set -o pipefail
          # Drives the real spool + lettre transport (plaintext, no AUTH) against an
          # in-process SMTP sink and asserts the message arrived on both delivery paths.
          cargo test -p boatramp-server --features email --test email_live \
            -- --ignored --nocapture 2>&1 | tee email.log
          # A silent skip still prints `test result: ok`; gate on the success marker that
          # prints ONLY after BOTH paths delivered to the sink (the anti-silent-skip rule).
          grep -qE 'test result: ok' email.log \
            || { echo "::error::email live-delivery test did not pass" >&2; exit 1; }
          grep -q 'EMAIL LIVE SEND OK' email.log \
            || { echo "::error::email live delivery never reached the success marker (silent skip?)" >&2; exit 1; }

  # Tier H — the guest project self-config capability (`boatramp:handlers/admin`). Every
  # admin invariant is host-side authz, so the gate proves them ADVERSARIALLY against a
  # single shared, flat control-plane keyspace holding two tenants: a guest scoped to one
  # project can never read the other's secrets/email/site-config, a crafted `site` string
  # can't escape the host-stamped `project/<proj>/…` prefix, credentials are write-only,
  # multi-tenant posture enables NO surface, and a runaway is rate-limited. No privileges,
  # no secrets, no egress — the isolation under test is the keyspace prefix, not the runner.
  admin:
    name: admin capability tenant invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: capability-admin

      - name: Prove cross-tenant isolation + multi-tenant lockdown (hard gate)
        run: |
          set -o pipefail
          # Drives the real ServerAdminController with two tenants sharing one KV and asserts
          # the full invariant set (cross-tenant read impossible, site-string escapes blocked,
          # write-only creds, multi-tenant → no surface, rate-limited).
          cargo test -p boatramp-server --features admin --test admin_live \
            -- --ignored --nocapture 2>&1 | tee admin.log
          # A silent skip still prints `test result: ok`; gate on the success marker that prints
          # ONLY after every invariant held (the anti-silent-skip rule).
          grep -qE 'test result: ok' admin.log \
            || { echo "::error::admin capability test did not pass" >&2; exit 1; }
          grep -q 'ADMIN CAPABILITY GATE OK' admin.log \
            || { echo "::error::admin capability never reached the success marker (silent skip or tenant breach?)" >&2; exit 1; }

  # Tier I — the duplex/resumable `session` capability (`boatramp:handlers/session`). Drives the
  # REAL serving pipeline (router → serve_resolved → the session GET/POST routes) re-entering a REAL
  # compiled guest component (the committed `session-echo.wasm` fixture — no wasm build at gate time)
  # and asserts the end-to-end contract: duplex send/recv, checkpoint-resume, cursor-resume,
  # idempotent redelivery, guest-initiated close, and session-id hardening. No privileges, no
  # secrets, no egress — the thing under test is the serving + delivery + tenancy path itself.
  session:
    name: session capability duplex + resume + close
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: capability-session

      - name: Duplex + resume + dedup + close hold end to end (hard gate)
        run: |
          set -o pipefail
          # Drives router() → the session routes → the engine re-entering the compiled guest, and
          # asserts the whole contract against an in-memory control plane.
          cargo test -p boatramp-server --features session --test session_live \
            -- --ignored --nocapture 2>&1 | tee session.log
          # A silent skip still prints `test result: ok`; gate on the success marker that prints
          # ONLY after every property held against the real guest (the anti-silent-skip rule).
          grep -qE 'test result: ok' session.log \
            || { echo "::error::session capability test did not pass" >&2; exit 1; }
          grep -q 'SESSION CAPABILITY GATE OK' session.log \
            || { echo "::error::session capability never reached the success marker (silent skip or broken duplex/resume?)" >&2; exit 1; }

  # Tier J — the ACME DNS-01 `dns-persist-01` regression gate. Drives the REAL issuance path
  # (boatramp-acme `obtain_certificate` → `order.authorizations()` → `finalize_csr` → cert) against a
  # local Pebble CA pinned to >= 2.10.0. Pebble >= 2.10.0 includes a TOKENLESS `dns-persist-01`
  # challenge in every authorization — exactly as Let's Encrypt and Google Trust Services now do in
  # production. instant-acme < 0.8.5 made `Challenge.token` a required serde field, so that tokenless
  # challenge failed to deserialize ("missing field `token`"), aborting the whole authorization —
  # including the `dns-01` challenge boatramp selects — and crash-looping real DNS-01 issuance. The
  # 0.8.5 bump tolerates it. This is a HARD success-marker gate (NOT an `#[ignore]`d test): the test
  # prints `ACME-DNS-PERSIST GATE OK` only after a Pebble-signed cert comes back, and we grep for it
  # so a silent skip (pebble not on PATH) fails the job. No privileges, no secrets, no egress — a
  # local Pebble test-double, like the other test-double gates here.
  acme-dns-persist:
    name: ACME DNS-01 dns-persist-01 gate (Pebble >= 2.10.0)
    runs-on: ubuntu-latest
    env:
      # Pin a Pebble >= 2.10.0 (2.10.0 is the first release that emits the tokenless dns-persist-01
      # challenge). nixpkgs still ships 2.6.0, so CI fetches the pinned upstream release binary — the
      # nix dev shell pins the same version via a `pkgs.pebble` override in flake.nix.
      PEBBLE_VERSION: "2.10.1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: capability-acme-dns-persist

      - name: Install Pebble + pebble-challtestsrv (>= 2.10.0, emits dns-persist-01)
        run: |
          set -o pipefail
          base="https://github.com/letsencrypt/pebble/releases/download/v${PEBBLE_VERSION}"
          mkdir -p "$HOME/pebble-bin"
          for b in pebble pebble-challtestsrv; do
            curl -fsSL "${base}/${b}-linux-amd64.tar.gz" -o "/tmp/${b}.tar.gz"
            tar -xzf "/tmp/${b}.tar.gz" -C /tmp
            install -m 0755 "$(find /tmp -type f -name "$b" | head -n1)" "$HOME/pebble-bin/$b"
          done
          echo "$HOME/pebble-bin" >> "$GITHUB_PATH"
          "$HOME/pebble-bin/pebble" -version
          # Fail loud if the pin ever resolves to a pre-2.10 Pebble (which would NOT emit the
          # tokenless dns-persist-01 challenge, so the gate would no longer exercise the regression).
          "$HOME/pebble-bin/pebble" -version 2>&1 | grep -q "version: ${PEBBLE_VERSION}" \
            || { echo "::error::Pebble is not the pinned >= 2.10.0 build; the gate would not emit dns-persist-01" >&2; exit 1; }

      - name: Issue a wildcard cert via DNS-01 against Pebble (hard gate)
        run: |
          set -o pipefail
          # NOT `--ignored`: this is a real gate. The test spawns pebble + pebble-challtestsrv from
          # PATH (installed above), mints a throwaway CA, and issues `*.deploy.test`. The
          # authorization Pebble >= 2.10.0 returns carries the tokenless `dns-persist-01` challenge
          # the dep bump must tolerate.
          cargo test -p boatramp-acme --features acme --test pebble_dns01 \
            -- --nocapture --test-threads=1 2>&1 | tee pebble.log
          grep -qE 'test result: ok' pebble.log \
            || { echo "::error::ACME DNS-01 pebble gate did not pass" >&2; exit 1; }
          # The anti-silent-skip guard: the marker prints ONLY after a Pebble-signed cert is returned,
          # so if pebble was missing (the test's on_path guard returns early) this grep fails the job.
          grep -q 'ACME-DNS-PERSIST GATE OK' pebble.log \
            || { echo "::error::pebble gate never reached the success marker (silent skip or dns-persist-01 regression?)" >&2; exit 1; }

  # Tier — cap-req #29: a host-owned TCP LISTENER with `use_node_cert = true` + a verified+attached
  # `server_names` domain + NO static cert_file serves the NODE-MANAGED (ACME) cert for that domain —
  # the SAME cert the `:443` edge serves, via the SAME shared on-demand engine. The gate stands up the
  # single-node on-demand engine (DNS-01 against a local Pebble CA, behind the REAL #02 verified-domain
  # allowlist), builds the listener TLS config through the exact serve.rs seam (no static cert +
  # server_names managed allowlist + catch-all OFF), drives a REAL rustls handshake on it, and asserts
  # the served leaf is the Pebble-issued cert the node stored (what `:443` serves), with an SNI outside
  # server_names and an SNI-less handshake both refused fail-closed. MUTATION SENSE: before #29 this
  # listener could not even load (cert_file was required) and a server_name was always served the
  # STATIC cert — here there is NO static cert and the node-managed cert is served. HARD marker gate
  # (`--ignored` + the marker greps, so a silent skip when pebble is absent fails the job). A local
  # Pebble test-double only — no privileges, no secrets, no egress.
  listener-node-cert:
    name: listener use_node_cert — node-managed cert on a TCP listener (Pebble)
    runs-on: ubuntu-latest
    env:
      PEBBLE_VERSION: "2.10.1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: capability-listener-node-cert

      - name: Install Pebble + pebble-challtestsrv (>= 2.10.0)
        run: |
          set -o pipefail
          base="https://github.com/letsencrypt/pebble/releases/download/v${PEBBLE_VERSION}"
          mkdir -p "$HOME/pebble-bin"
          for b in pebble pebble-challtestsrv; do
            curl -fsSL "${base}/${b}-linux-amd64.tar.gz" -o "/tmp/${b}.tar.gz"
            tar -xzf "/tmp/${b}.tar.gz" -C /tmp
            install -m 0755 "$(find /tmp -type f -name "$b" | head -n1)" "$HOME/pebble-bin/$b"
          done
          echo "$HOME/pebble-bin" >> "$GITHUB_PATH"
          "$HOME/pebble-bin/pebble" -version

      - name: Listener serves the node-managed cert for its verified server_name (hard gate)
        run: |
          set -o pipefail
          # In-crate live gate (reaches the private acme-dns cert-resolution modules). It spawns pebble
          # + pebble-challtestsrv from PATH, issues the node-managed cert via DNS-01, and drives a real
          # handshake on the `use_node_cert` listener config. `--ignored` (it binds local ports); the
          # marker prints ONLY after the node-managed cert is served, so a silent skip fails the grep.
          cargo test -p boatramp --features acme-dns listener_use_node_cert_against_pebble \
            -- --ignored --nocapture --test-threads=1 2>&1 | tee listener-nodecert.log
          grep -qE 'test result: ok' listener-nodecert.log \
            || { echo "::error::listener use_node_cert gate did not pass" >&2; exit 1; }
          grep -q 'LISTENER NODE-CERT LIVE GATE OK' listener-nodecert.log \
            || { echo "::error::listener node-cert gate never reached the success marker (silent skip, or the listener did not serve the node-managed cert)" >&2; exit 1; }

  # Tier — the blob `/img` COLD-PATH FAN-OUT gate (image-serve-latency Ask 3c). N concurrent COLD
  # fetches through the REAL `aws_sdk_s3` backend must FAN OUT, not serialize at the connector. SeaweedFS
  # is the local S3-compatible endpoint (a real aws client, real TCP — the `benchmark-must-exercise-real
  # -path` rule: no warm/in-memory stand-in). The object is PRE-SEEDED (so the burst is the first — cold
  # — op, empty pool). On a localhost endpoint this is a functional + coarse fan-out smoke; the NODE run
  # against Tigris (real cold-connect latency) is the AUTHORITATIVE measurement.
  # (SeaweedFS — MinIO's open-source server/client are archived + unpullable.)
  blob-cold-fanout:
    name: blob /img cold-path fan-out (SeaweedFS)
    runs-on: ubuntu-latest
    env:
      # SeaweedFS S3 runs anonymous (no SigV4 verify), but the aws_sdk client still signs, so give it
      # dummy static creds.
      AWS_ACCESS_KEY_ID: anykey
      AWS_SECRET_ACCESS_KEY: anysecret
      AWS_REGION: us-east-1
      BOATRAMP_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      BOATRAMP_TEST_S3_BUCKET: boatramp
      # Pre-seeded key ⇒ the test's burst is the first S3 op (empty pool = genuinely cold).
      BOATRAMP_TEST_S3_COLD_KEY: zz/cold-fanout-seed.webp
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: capability-blob-cold-fanout

      - name: Start SeaweedFS + pre-seed a 12 KB object
        run: |
          set -o pipefail
          docker run -d --name seaweed -p 8333:8333 chrislusf/seaweedfs:latest \
            server -s3 -ip.bind=0.0.0.0 -s3.port=8333
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ 2>/dev/null || echo 000)
            [ "$code" = "200" ] && { echo "seaweedfs s3 ready"; break; }
            sleep 1
          done
          # CreateBucket + seed the cold object (anonymous, path-style — no aws CLI needed).
          curl -sf -X PUT http://127.0.0.1:8333/boatramp >/dev/null && echo "bucket created"
          head -c 12288 /dev/zero > /tmp/seed.webp
          curl -sf -X PUT --data-binary @/tmp/seed.webp \
            http://127.0.0.1:8333/boatramp/zz/cold-fanout-seed.webp >/dev/null
          echo "seaweedfs up + seeded"

      - name: N concurrent cold fetches must fan out, not serialize (hard gate)
        run: |
          set -o pipefail
          # The REAL aws_sdk_s3 backend against SeaweedFS, firing N concurrent cold get_range. The gate
          # asserts the max per-request latency is not ~N× the median (serialization) and prints the
          # marker ONLY after the fan-out assertions hold.
          cargo test -p boatramp-storage --features s3 --test s3_minio \
            concurrent_cold_fetches_fan_out -- --ignored --nocapture 2>&1 | tee fanout.log
          grep -qE 'test result: ok' fanout.log \
            || { echo "::error::blob cold fan-out gate did not pass (serialized, or a failure)" >&2; exit 1; }
          grep -q 'CONCURRENT-COLD FAN-OUT OK' fanout.log \
            || { echo "::error::blob cold fan-out never reached the success marker (silent skip or serialization?)" >&2; exit 1; }

  # Tier — `project sync` BLOB-TRANSFER ROBUSTNESS (the construens cross-node incident). A real
  # cross-node sync of ~42 GB transferred ~27 GB of blobs then ABORTED on a single Tigris
  # `503 SlowDown` the dest's S3 backend returned under the write storm, because `project sync` had
  # NO blob-robustness. The fix unifies sync onto the clone's `--continue-on-error=backend` +
  # `--only-blobs` repair. This gate reproduces the SHAPE on our own rig: a many-blob set written
  # through the REAL `aws_sdk_s3` client → a fault-injecting reverse PROXY (in the test) → a REAL
  # S3-compatible store (SeaweedFS) that returns a real HTTP `503 SlowDown` on a chosen mid-stream
  # blob. It asserts the restore ABORTS without the fix (continue_on_error OFF), RIDES PAST with it
  # (skip-and-record), and that an `--only-blobs` repair lands ALL blobs byte-for-byte (zero loss).
  # (SeaweedFS — MinIO's open-source server/client are archived + unpullable.)
  sync-blob-503-ride-past:
    name: project sync blob-transfer robustness — mid-stream 503 ride-past (SeaweedFS)
    runs-on: ubuntu-latest
    env:
      # SeaweedFS S3 runs anonymous (no SigV4 verify), but the aws_sdk client still signs, so give it
      # dummy static creds. The gate's dest store points at the IN-TEST proxy, which forwards here.
      AWS_ACCESS_KEY_ID: anykey
      AWS_SECRET_ACCESS_KEY: anysecret
      AWS_REGION: us-east-1
      BOATRAMP_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      BOATRAMP_TEST_S3_BUCKET: boatramp
      # Realistic-but-CI-friendly blob set (the ride-past logic holds at any scale; the
      # construens-preview SCALE is run on the lighthouse rig, hundreds of blobs / GB-ish).
      BOATRAMP_SYNC_GATE_BLOBS: "50"
      BOATRAMP_SYNC_GATE_BLOB_KB: "512"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: capability-sync-blob-503

      - name: Start a real S3-compatible store (SeaweedFS) + create the bucket
        run: |
          set -o pipefail
          docker run -d --name seaweed -p 8333:8333 chrislusf/seaweedfs:latest \
            server -s3 -ip.bind=0.0.0.0 -s3.port=8333
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ 2>/dev/null || echo 000)
            [ "$code" = "200" ] && { echo "seaweedfs s3 ready"; break; }
            sleep 1
          done
          # CreateBucket (anonymous, path-style).
          curl -sf -X PUT http://127.0.0.1:8333/boatramp >/dev/null && echo "bucket created"

      - name: A mid-transfer 503 must be RIDDEN PAST, not abort the run (hard gate)
        run: |
          set -o pipefail
          # The REAL aws_sdk_s3 write path → in-test fault proxy (real HTTP 503 SlowDown on a
          # mid-stream blob) → SeaweedFS. Arm A (no continue-on-error) ABORTS; Arm B
          # (continue-on-error=backend) RIDES PAST with a skip-and-record; Arm C (--only-blobs
          # repair) lands the recorded blob; the zero-loss read-back proves every blob intact. The
          # marker prints ONLY after all three arms + the read-back hold.
          cargo test -p boatramp-node --features project-export,s3 \
            --test sync_blob_robustness_live \
            sync_blob_transfer_rides_past_a_mid_stream_503_slowdown \
            -- --ignored --nocapture 2>&1 | tee sync-blob-503.log
          grep -qE 'test result: ok' sync-blob-503.log \
            || { echo "::error::sync blob-transfer robustness gate did not pass (a failure or silent skip)" >&2; exit 1; }
          grep -q 'SYNC BLOB ROBUSTNESS 503 RIDE-PAST OK' sync-blob-503.log \
            || { echo "::error::sync blob-transfer robustness never reached the success marker (silent skip, or the mid-stream 503 was not ridden past / a blob was lost)" >&2; exit 1; }

  docker-compute-net:
    name: docker compute backend — per-project-net DNS + cross-project isolation + recreate-on-redeploy resolution + one-shot default-bridge reachability + managed-DB alias upgrade heal
    # The docker compute backend puts every long-lived workload on its per-project user-defined
    # network as the PRIMARY attachment (the sole tenancy boundary) so siblings resolve each other
    # by name over docker's embedded DNS. The one-shot export/import client (run_ephemeral), by
    # contrast, stays PRIMARY on the daemon default bridge (reaching a BYO/external DB there) and
    # only ALSO joins a per-project net as a SECONDARY attach. These live gates run against the
    # runner's REAL docker daemon and are HARD markers: v0.55.0 shipped the launch net as a mere
    # SECONDARY attach (inert — names never resolved + a managed-DB-bound sibling crash-looped), and
    # v0.56.0 over-corrected run_ephemeral to per-project-net PRIMARY (default bridge dropped →
    # default-bridge DB unreachable → export/import broke, hence the v0.56.0 revert). alpine:3.20
    # test-double only; no private artifact.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: capability-docker-compute-net

      - name: Pre-pull the alpine test-double image
        run: docker pull alpine:3.20

      - name: Per-project-net DNS + cross-project isolation + recreate/resolution + ephemeral default-bridge (hard gate)
        run: |
          set -o pipefail
          # All ignored gates in one run: (1) two workloads in one project resolve by name over
          # the per-project net, a SECOND project's same-named workload is a DIFFERENT container
          # with NO cross-project DNS leak AND no raw-IP reach (the tenancy boundary); (2) a
          # spec-change redeploy RECREATES the container onto the net (new body served, resolvable
          # by alias + full name) and needs_redeploy()==false afterwards (auto-heal idempotency —
          # no reconcile churn loop); (3) a DUAL-ATTACHED run_ephemeral one-shot (per-project-net
          # hint set) still reaches a DB on the DEFAULT bridge (the v0.56.0 regression shape); (4) a
          # managed-DB workload whose RAW name exceeds the 63-octet DNS-label cap resolves by its
          # SHORT alias (the Docker-29 RFC-1035 SD-registration fix); (5) the UPGRADE path — a
          # producer created with a STALE pre-fix long alias is flagged for recreate by
          # needs_redeploy, relaunched with the current SHORT alias, reached by a sibling over it,
          # and reported idempotent (no churn). Each marker prints ONLY after every assertion holds.
          BOATRAMP_TEST_DOCKER=1 cargo test -p boatramp-docker --test docker_live \
            -- --ignored --nocapture 2>&1 | tee docker-net.log
          grep -qE 'test result: ok' docker-net.log \
            || { echo "::error::docker compute-net gates did not pass (a failure or silent skip)" >&2; exit 1; }
          grep -q 'DOCKER PROJECT-NET DNS + CROSS-PROJECT ISOLATION OK' docker-net.log \
            || { echo "::error::per-project-net DNS / cross-project isolation never reached its success marker (silent skip or a cross-project leak?)" >&2; exit 1; }
          grep -q 'DOCKER RECREATE-ON-REDEPLOY + RESOLUTION OK' docker-net.log \
            || { echo "::error::recreate-on-redeploy + resolution never reached its success marker (silent skip or a restart-in-place / non-resolving regression?)" >&2; exit 1; }
          grep -q 'DOCKER EPHEMERAL DEFAULT-BRIDGE OK' docker-net.log \
            || { echo "::error::dual-attached run_ephemeral never reached its default-bridge success marker (silent skip or the v0.56.0 per-project-net-PRIMARY regression — default-bridge DB unreachable)" >&2; exit 1; }
          grep -q 'DOCKER LONG MANAGED-DB SD OK' docker-net.log \
            || { echo "::error::long managed-DB workload (> 63-octet name) never reached its short-alias resolution marker (silent skip or the Docker-29 RFC-1035 label-cap regression — SD record for the over-long alias not published)" >&2; exit 1; }
          grep -q 'DOCKER MANAGED-DB ALIAS UPGRADE HEAL OK' docker-net.log \
            || { echo "::error::managed-DB alias UPGRADE auto-heal never reached its success marker (silent skip or a regression — a producer carrying a STALE pre-fix long alias was not flagged for recreate, not re-aliased to the current short label, or not idempotent afterwards)" >&2; exit 1; }
