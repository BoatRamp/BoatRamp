# Overlay service tunneler — TUN front-end BUILD + unprivileged tests (plan §3/§6/§8, release R2,
# Linux only). Builds + tests this crate's `tun` feature on every push/PR (cheap, no privilege
# needed) — the allocator, the DNS zone handler, and the `smoltcp`-direct E2E test in
# `tun::netstack`'s own test module, which plan §6 itself calls out as giving "most of the coverage
# without privilege".
#
# The PRIVILEGED half — opening a REAL Linux TUN device, installing its route, and driving a real
# connection through the kernel into the netstack — used to live here as a bespoke `ip netns exec`
# job (`linux-tun-device-smoke`). It has been RETIRED in favour of the declarative `tunnel-tun`
# nixosTest gate (`nix build .#checks.x86_64-linux.tunnel-tun`, wired into preflight-matrix.yml /
# nightly), which boots a full VM with a real `/dev/net/tun` AND a real systemd-resolved — so it
# ALSO exercises the split-DNS (`resolvectl` per-link, zone-scoped) path the netns shim could not,
# runs the SAME `tun_privileged` test binary, and is `nix build`-able standalone by any dev
# (PLAN-nixos-vm-testing.md decision 3 — "converge on one mechanism"). This workflow keeps only the
# cheap, REQUIRED-eligible per-push build + unprivileged-test job below.
name: Tunnel TUN build + unprivileged tests (R2)

on:
  push:
    branches: ['**']
    paths:
      - 'crates/boatramp-overlay-tunnel/**'
      - 'crates/boatramp/src/tunnel.rs'
      - 'crates/boatramp/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/tunnel.yml'
  pull_request:
    paths:
      - 'crates/boatramp-overlay-tunnel/**'
      - 'crates/boatramp/src/tunnel.rs'
      - 'crates/boatramp/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/tunnel.yml'
  workflow_dispatch:

concurrency:
  group: tunnel-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Cheap, unprivileged, REQUIRED-eligible (not gated non-blocking): the `tun` feature's own
  # build + unit/integration test suite, including the no-device smoltcp-direct E2E test. Separate
  # from ci.yml's own `--workspace` default-feature run because `tun` is off by default (plan §7
  # feature isolation) — this is where it actually gets exercised on every push/PR.
  tun-feature-tests:
    name: boatramp-overlay-tunnel --features tun (unprivileged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tunnel-tun-feature-tests
      - name: cargo test -p boatramp-overlay-tunnel --features tun
        run: cargo test -p boatramp-overlay-tunnel --features tun --locked
      - name: cargo clippy -p boatramp-overlay-tunnel --features tun --all-targets
        run: cargo clippy -p boatramp-overlay-tunnel --features tun --all-targets --locked -- -D warnings
      - name: cargo check -p boatramp --features overlay,tun
        run: cargo check -p boatramp --features overlay,tun --locked

  # NOTE: the former `linux-tun-device-smoke` job (a bespoke `ip netns exec` + `setcap` run of the
  # privileged `tun_privileged` test) has been RETIRED — superseded by the `tunnel-tun` nixosTest
  # gate (`nix build .#checks.x86_64-linux.tunnel-tun`), wired into preflight-matrix.yml / nightly.
  # The VM gate boots a real `/dev/net/tun` AND a real systemd-resolved, so it runs the SAME test
  # binary plus the split-DNS (`resolvectl`) path the netns shim could not reach, as one declarative,
  # reproducible mechanism (PLAN-nixos-vm-testing.md decision 3). See the module doc at the top.
