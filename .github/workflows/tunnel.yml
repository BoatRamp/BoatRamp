# Overlay service tunneler — TUN front-end device/route smoke (plan §3/§6/§8, release R2, Linux
# only). Build-and-test this crate's `tun` feature on every push/PR (cheap, no privilege needed),
# plus a SEPARATE, privileged job that opens a REAL Linux TUN device inside its own network
# namespace and drives one connection through it — the "per-OS TUN smoke needs a device/privilege"
# half of plan §6 that the Linux merge gate (ci.yml) deliberately does NOT cover (that gate tests
# only what every push's `cargo test`/`clippy` already proves without any privilege: the allocator,
# the DNS zone handler, and the `smoltcp`-direct E2E test in `tun::netstack`'s own test module,
# which plan §6 itself calls out as giving "most of the coverage without privilege").
#
# NON-BLOCKING TO START (mirrors the `mobile.yml` precedent exactly): the privileged job sets
# `continue-on-error: true` and is NOT a required check. Promote it once reliably green (plan §8
# R5 — "promote `tunnel.yml` toward required").
name: Tunnel TUN smoke (R2)

on:
  push:
    branches: ['**']
    paths:
      - 'crates/boatramp-overlay-tunnel/**'
      - 'crates/boatramp/src/tunnel.rs'
      - 'crates/boatramp/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/tunnel.yml'
  pull_request:
    paths:
      - 'crates/boatramp-overlay-tunnel/**'
      - 'crates/boatramp/src/tunnel.rs'
      - 'crates/boatramp/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/tunnel.yml'
  workflow_dispatch:

concurrency:
  group: tunnel-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Cheap, unprivileged, REQUIRED-eligible (not gated non-blocking): the `tun` feature's own
  # build + unit/integration test suite, including the no-device smoltcp-direct E2E test. Separate
  # from ci.yml's own `--workspace` default-feature run because `tun` is off by default (plan §7
  # feature isolation) — this is where it actually gets exercised on every push/PR.
  tun-feature-tests:
    name: boatramp-overlay-tunnel --features tun (unprivileged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tunnel-tun-feature-tests
      - name: cargo test -p boatramp-overlay-tunnel --features tun
        run: cargo test -p boatramp-overlay-tunnel --features tun --locked
      - name: cargo clippy -p boatramp-overlay-tunnel --features tun --all-targets
        run: cargo clippy -p boatramp-overlay-tunnel --features tun --all-targets --locked -- -D warnings
      - name: cargo check -p boatramp --features overlay,tun
        run: cargo check -p boatramp --features overlay,tun --locked

  # The privileged half (plan §6): open a REAL TUN device, install its route, run a real TCP
  # connection through the kernel into it — inside a dedicated network namespace so it can never
  # collide with routes already on the runner, and running the test binary with EXACTLY
  # `CAP_NET_ADMIN` (via `setcap`, as a non-root user) rather than full root, matching the
  # production-recommended posture `device.rs`'s own doc comment describes.
  linux-tun-device-smoke:
    name: Linux TUN device + route smoke (privileged, netns, non-blocking)
    runs-on: ubuntu-latest
    # NON-BLOCKING (module doc above) — this job's own failure never blocks a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tunnel-device-smoke

      # Build-only here (no `--ignored`, so the usual unprivileged run is a no-op skip) — the
      # privileged run happens as its own step below, directly against the built binary, so it can
      # control exactly which capabilities/namespace it runs under.
      - name: Build the privileged integration test binary
        run: cargo test -p boatramp-overlay-tunnel --features tun --test tun_privileged --no-run --locked

      - name: Run it as a non-root user with ONLY CAP_NET_ADMIN, inside its own network namespace
        run: |
          set -euo pipefail

          bin=$(find target/debug/deps -maxdepth 1 -type f -name 'tun_privileged-*' \
            ! -name '*.d' -perm -u+x | head -n1)
          if [ -z "$bin" ]; then
            echo "::error::could not find the built tun_privileged test binary under target/debug/deps"
            exit 1
          fi
          echo "test binary: $bin"

          # Exactly the capability the TUN front-end actually needs (plan §3.7) — not full root.
          sudo setcap cap_net_admin+ep "$bin"
          getcap "$bin"

          # A dedicated namespace so this test's route/interface can never collide with (or be
          # confused for) anything already on the runner's default namespace.
          sudo ip netns add brtun-ci

          # Creating/entering the namespace needs root (the first `sudo`); `sudo -u "$(id -un)"`
          # immediately drops back to the normal CI user for the actual test run, which then only
          # has whatever the `setcap` grant above gave the BINARY — CAP_NET_ADMIN, nothing more.
          sudo ip netns exec brtun-ci \
            sudo -u "$(id -un)" "$bin" --ignored --nocapture --test-threads=1 \
            a_real_tcp_connection_through_the_kernel_tun_device_drives_a_dial_attempt

      - name: Clean up the network namespace
        if: always()
        run: sudo ip netns delete brtun-ci || true
