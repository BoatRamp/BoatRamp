name: Preflight matrix

# The heavy, comprehensive pre-delivery sweep — a REUSABLE workflow (`workflow_call`) invoked by BOTH
# the scheduled `Nightly` (daily drift detection) AND the `Release` workflow (as a `preflight` job the
# publish jobs gate on, so nothing ships until this whole matrix is green on the exact release commit;
# owner decision: nightly is a release PRECONDITION). Split out of per-push CI because on a stock
# runner these take ~80 min (all-features) and ~175 min (nix) — too slow to gate
# every push. Runs daily (via Nightly), before every release (via Release), or on demand.
#   • test (all features)  — runs the whole feature matrix's test suite (a network-
#                            capable runner, which the nix sandbox can't provide)
#   • nix (…)              — the reproducible nix checks + the release-cache warm, FANNED
#                            OUT across parallel runners (was one serial `nix flake check`
#                            job that summed to ~1h43m): glibc clippy, musl clippy (all-
#                            features, shipped target), the NixOS-service VM, and the
#                            static-musl + OCI-image release artifacts — each ALONE on its
#                            own runner so it uses all cores and the critical path is the
#                            slowest single leg, not their sum. The crane dep closure is
#                            shared via cachix (each leg substitutes it, never recompiles).
#   • nix (flake eval …)   — whole-flake eval hygiene (`--no-build`) + the fast pre-commit
#                            check (rustfmt · typos · anyhow-ban), kept off the heavy legs.
# all-features *compile* coverage on musl now runs PER-PUSH as CI's `shipped-clippy`
# Tier 1 gate (the crane-cached `musl-clippy` check), not here — so the only thing left
# on the host toolchain in this workflow is the all-features test *run* (target-agnostic
# logic a network-capable runner can host, which the nix sandbox can't).
on:
  workflow_call: # invoked by Nightly (scheduled) and Release (as a publish-gating preflight job)
  workflow_dispatch: # on-demand (Run workflow ▸)

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  test:
    name: test (all features)
    runs-on: ubuntu-latest
    # Fail a wedged infra step fast rather than burn the 6h default (release precondition).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Stock runners ship ~14 GB free — not enough for a debug `--all-features`
      # build of this workspace. Reclaim the preinstalled toolchains we don't use
      # (Android SDK, .NET, GHC, CodeQL) for ~25 GB of headroom.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # Compiling all features (wasmtime, cranelift, cedar, openraft, …) peaks above
      # the runner's 7 GB RAM and rustc gets OOM-killed. A big swapfile on the roomy
      # /mnt disk absorbs the spikes.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # aws-lc-rs (pulled by the `tls` / `s3` features) needs cmake + nasm. Both are
      # preinstalled on the runner, so skip apt (and its flaky third-party repos)
      # unless they're genuinely missing.
      - name: Ensure build deps
        run: |
          if command -v cmake >/dev/null && command -v nasm >/dev/null; then
            echo "cmake + nasm already present"
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake nasm
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # all-features *clippy* runs per-push as CI's `shipped-clippy` gate (the crane-cached
      # `checks.musl-clippy` derivation on the shipped musl target). This lane runs the
      # all-features test *suite* on a network-capable runner (the nix sandbox can't host it).
      - name: Test (all features)
        run: cargo test --workspace --all-features

  # The Windows RELEASE build is release-only: it escapes both per-push CI (Linux musl) and the rest
  # of this matrix — exactly the gap that shipped a broken Windows binary in v0.46.0 (an unix-only
  # MetadataExt use that no Linux/nix gate could see). Validate the EXACT release feature union — the
  # portable set PLUS the Windows-only tun,overlay the release archive ships — compiles + links on a
  # native windows-latest runner HERE, so a feature-interaction or cfg break fails in nightly and in
  # the release's own preflight rather than mid-cut. Mirrors release.yml's Windows `cargo build`
  # (same target + features); keep the feature list in sync with release.yml's PORTABLE_FEATURES +
  # the windows matrix row's extra_features.
  windows-release-build:
    name: windows release build (feature union)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: preflight-windows-release
      # aws-lc-rs (tls / s3) needs nasm on Windows; cmake is preinstalled on the runner.
      - uses: ilammy/setup-nasm@v1
      - name: cargo build -p boatramp --release (portable union + tun,overlay)
        run: cargo build -p boatramp --release --locked --target x86_64-pc-windows-msvc --features "tls,handlers,cluster,s3,cloudflare-kv,compression,bundler,oidc,tun,overlay"

  # The heavy nix work, FANNED OUT across parallel runners. Was a single serial job
  # (`nix flake check` then the release-cache warm) that summed to ~1h43m; each leg now
  # runs ALONE on its own 4-vCPU/16 GB runner, so the critical path is the slowest single
  # leg (~30m) instead of the sum. `fail-fast: false` so one failing leg still lets the
  # others report. The crane dep closure is shared through cachix — each leg substitutes
  # it rather than recompiling the third-party graph.
  #
  # The `release artifacts` leg builds the EXACT Linux release outputs — the fully-static
  # musl + jemalloc binary AND both OCI images. Per-push CI compiles glibc only, so a
  # musl-only breakage (e.g. a dep constructing `cmsghdr`/`msghdr` with struct literals
  # that omit musl's private fields) sails through every green gate and only surfaces at
  # release time. Building `.#container` / `.#container-cloudflare` here (not just
  # `.#boatramp-static`) also warms the release GHCR cache: in v0.4.15 the GHCR job's
  # `.#container` resolved its embedded binary to a DIFFERENT store path than the cached
  # `.#boatramp-static` (static = cavx8…, container = 6vqi…, same tag), so caching only the
  # bare binary left GHCR cold — a ~36 min recompile. Building the exact container closure
  # here (pushed to cachix via the post-step) lets the release GHCR job substitute it.
  nix:
    name: nix (${{ matrix.leg.label }})
    runs-on: ubuntu-latest
    # The Nix build + cachix PUSH leg — exactly where v0.44.0 wedged ~3h40m. Cap it so a
    # stuck push fails fast; 90m is ample for a cold, cache-miss closure build.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        leg:
          - label: glibc clippy
            build: .#checks.x86_64-linux.clippy
          # musl clippy (--all-features --all-targets on the shipped target) now runs
          # per-push as CI's `shipped-clippy` Tier 1 gate, so it's dropped here to avoid
          # duplicating a ~30-min leg on the same commit. glibc clippy stays — a distinct
          # target that catches glibc-only lints the musl gate can't.
          - label: nixos-service vm
            build: .#checks.x86_64-linux.nixos-service
          # NixOS-VM real-path GATES (PLAN-nixos-vm-testing.md decisions 1+2: correctness VM
          # tests gate in nightly + release-preflight, alongside nixos-service). Each boots a
          # real VM via the NixOS test driver on this KVM-capable runner.
          #   • tunnel-tun       — a real /dev/net/tun device + route + systemd-resolved
          #                        split-DNS round-trip (overlay tunneler R2; supersedes the old
          #                        tunnel.yml privileged-netns job).
          #   • export-import-live — the project export/import round-trip against real Postgres
          #                        (pgvector) + MySQL in an in-VM docker daemon fed from an offline
          #                        registry mirror (institutionalizes the host-runner live-export job).
          - label: tunnel-tun gate vm
            build: .#checks.x86_64-linux.tunnel-tun
          - label: export-import-live gate vm
            build: .#checks.x86_64-linux.export-import-live
          - label: release artifacts + OCI images
            build: .#boatramp-static .#container .#container-cloudflare
    steps:
      - uses: actions/checkout@v5
      # A leg compiles the whole workspace (and, for the VM leg, a NixOS image) into
      # /nix/store on the runner's cramped root disk. Reclaim the preinstalled toolchains
      # (Android SDK, .NET, GHC, CodeQL) for ~25 GB of headroom.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      # An all-features compile peaks above the runner's 16 GB RAM and rustc gets
      # OOM-killed (signal 9); swap on the roomy /mnt disk absorbs the spikes so a leg can
      # safely use all cores (`--cores 4` below).
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - uses: DeterminateSystems/nix-installer-action@main
      # Pull the compiled dependency closure from the project's own Cachix (kept warm by
      # `cache.yml` on every push to main), and push newly-built derivations back so later
      # runs — and the release GHCR job — reuse them.
      - uses: cachix/cachix-action@v15
        with:
          name: boatramp
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Each leg is the only heavy build on its runner, so `--cores 4` uses the whole box
      # (swap absorbs the RAM spike). `--max-jobs 1` still serializes any uncached
      # sub-derivations (e.g. the release leg's static-binary → container chain) so a cold
      # cache can't run two full compiles at once and OOM.
      - name: Build ${{ matrix.leg.label }}
        run: nix build ${{ matrix.leg.build }} --print-build-logs --max-jobs 1 --cores 4

  # Whole-flake eval hygiene (every output on every system evaluates — catches a broken
  # devShell / package / nixosModule that the per-leg builds above don't force) plus the
  # fast pre-commit check (rustfmt · typos · anyhow-ban). Both cheap, kept off the heavy
  # legs so they report in ~1-2 min.
  nix-eval:
    name: nix (flake eval + pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v15
        with:
          name: boatramp
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Flake eval (all outputs, no build)
        run: nix flake check --no-build --print-build-logs
      - name: Pre-commit check (rustfmt, typos, anyhow ban)
        run: nix build .#checks.x86_64-linux.pre-commit --print-build-logs --max-jobs 1 --cores 4

  k8s-e2e:
    name: operator e2e (kind)
    runs-on: ubuntu-latest
    # Fail a hung kind cluster / pull fast rather than the 6h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: helm/kind-action@v1
        with:
          cluster_name: boatramp-e2e
      - uses: azure/setup-helm@v4
      # Install → found a 3-node cluster → scale 3→5→3 → rolling upgrade →
      # kill-pod recovery, quorum-verified at each step. The kind cluster is
      # created by kind-action above; the script reuses it (KEEP=1) and builds +
      # loads the operator image itself.
      - name: Operator e2e
        env:
          PROVIDER: kind
          CLUSTER: boatramp-e2e
          KEEP: "1"
        run: scripts/e2e-k8s.sh

  # LIVE project export/import round-trip (inc2: atomic shadow-restore, the ephemeral
  # non-superuser apply that closes RCE-on-import, and a pgvector FULL round-trip) against
  # REAL Postgres (pgvector) + MySQL — `crates/boatramp-node/tests/project_export_roundtrip.rs`.
  # This file's `#![cfg(feature = "project-export")]` makes the `test (all features)` job above
  # (`cargo test --workspace --all-features`) compile + run it too, but that job never sets
  # BOATRAMP_TEST_PG_URL / BOATRAMP_TEST_MYSQL_URL, so every live test in the file hits its
  # self-skip guard and the job still reports `test result: ok` — a silent skip, not a gate. This
  # job stands up a pgvector Postgres + a MySQL on the docker default bridge (mirrors
  # `capability.yml`'s `container_live` env-clone step): both this job's test process AND the
  # test's own ephemeral pg_dump/pg_restore/mysqldump/mysql client containers — launched via the
  # SAME host docker daemon as siblings on that bridge — reach the servers by container IP. It
  # then runs the WHOLE test binary and greps for EVERY one of its success markers, so a silently
  # skipped live test (unset env, unreachable docker) or a real regression fails the job instead
  # of reporting a clean `ok`.
  export-import-live:
    name: test (project export/import live — Postgres pgvector + MySQL)
    runs-on: ubuntu-latest
    # Fail a hung DB container / live gate fast rather than the 6h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: export-import-live

      - name: Project export/import round-trip holds live (hard gate — shadow-restore + pgvector)
        run: |
          set -o pipefail
          # Start a stock pgvector Postgres on the docker default bridge so BOTH this job's test
          # process AND the ephemeral pg_dump/pg_restore containers the test launches (siblings on
          # the same bridge, via the host docker daemon) reach it by its container IP — the
          # colocated-reachability shape the driver handles. No sudo: the test drives the docker
          # API as the runner user (docker group), not the native container backend.
          docker rm -f brexport-pg >/dev/null 2>&1 || true
          # `-c wal_level=logical …` enables logical decoding so the pg WAL true-delta gate can
          # create a pgoutput capture slot (a bring-your-own test pg must be launched with it, the
          # way `managed_db_spec` bakes it into a managed DB's launch argv under `delta_capture`).
          docker run -d --name brexport-pg -e POSTGRES_PASSWORD=postgres \
            pgvector/pgvector:pg16 \
            -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10 >/dev/null
          for _ in $(seq 1 60); do
            docker exec brexport-pg pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 2
          done
          PGIP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' brexport-pg)"
          echo "pgvector bridge IP: $PGIP"
          # Same colocated-reachability shape for MySQL: native-password auth so the plaintext
          # bridge connection works; 8.0 is pinned because `--default-authentication-plugin` is
          # gone in 8.4. The ephemeral mysqldump/mysql client containers the test launches reach
          # it by its bridge IP.
          # `--log-bin --binlog-format=ROW --gtid-mode=ON …` enables the row binlog + GTID so the
          # mysql binlog TRUE-DELTA gate can snapshot-pin a base + stream the delta (a bring-your-own
          # test mysql must launch with it, the way `managed_db_spec` bakes it into a managed DB's
          # launch argv under `delta_capture`).
          docker rm -f brexport-mysql >/dev/null 2>&1 || true
          docker run -d --name brexport-mysql -e MYSQL_ROOT_PASSWORD=mysql \
            mysql:8.0 --default-authentication-plugin=mysql_native_password \
            --log-bin --binlog-format=ROW --gtid-mode=ON --enforce-gtid-consistency=ON \
            --server-id=1 >/dev/null
          for _ in $(seq 1 90); do
            docker exec brexport-mysql mysqladmin ping -h 127.0.0.1 -uroot -pmysql >/dev/null 2>&1 && break
            sleep 2
          done
          MYIP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' brexport-mysql)"
          echo "mysql bridge IP: $MYIP"
          BOATRAMP_TEST_PG_URL="postgres://postgres:postgres@${PGIP}:5432/postgres" \
          BOATRAMP_TEST_MYSQL_URL="mysql://root:mysql@${MYIP}:3306/mysql" \
            cargo test -p boatramp-node --features project-export \
            --test project_export_roundtrip \
            -- --nocapture --test-threads=1 2>&1 | tee project-export-live.log
          docker rm -f brexport-pg >/dev/null 2>&1 || true
          docker rm -f brexport-mysql >/dev/null 2>&1 || true

          # HARD gate: the file's 17 live/always-on tests + the 1 pure-unit URL-parser + the 1
          # pure-unit WAL-render-inertness test must ALL actually run (both live DBs reachable,
          # docker usable for the ephemeral client containers) — a self-skip (unset env /
          # unreachable docker) still prints `test result: ok`, so require the exact passed-count
          # AND every one of the file's success markers below. (The libsql true-delta + its CHAIN
          # gate are `#[cfg(feature = "sql-delta-libsql")]`, NOT compiled in this `--features
          # project-export` build, so they are NOT in this count — they gate in capability.yml.)
          grep -qE 'test result: ok\. 19 passed' project-export-live.log \
            || { echo "::error::project export/import live suite did not pass all 19 tests (silent skip or failure?)" >&2; exit 1; }

          # --- live pg (needs BOATRAMP_TEST_PG_URL + docker) ---
          grep -q 'PROJECT EXPORT ROUNDTRIP OK' project-export-live.log \
            || { echo "::error::live pg export/import round-trip never reached its marker (silent skip or a regression?)" >&2; exit 1; }
          grep -q 'PROJECT EXPORT PG CHUNKED SHADOW OK' project-export-live.log \
            || { echo "::error::live pg ATOMIC shadow-restore round-trip never reached its marker (silent skip or a regression?)" >&2; exit 1; }
          grep -q 'PROJECT EXPORT PG CORRUPTION ABORT OK' project-export-live.log \
            || { echo "::error::live pg corruption all-or-nothing abort gate never reached its marker (silent skip, or a partial import landed)" >&2; exit 1; }
          grep -q 'PROJECT EXPORT PG CRAFTED ESCAPE REFUSED OK' project-export-live.log \
            || { echo "::error::live pg crafted-superuser-escape REFUSED gate never reached its marker (silent skip, or an escape was NOT refused — RCE-on-import)" >&2; exit 1; }
          grep -q 'PROJECT EXPORT PG CRAFTED ESCAPE DRIVER OK' project-export-live.log \
            || { echo "::error::live pg crafted-escape-via-the-real-driver gate never reached its marker (silent skip, or the RCE-on-import escape was NOT refused through NodeProjectExport)" >&2; exit 1; }
          grep -q 'PROJECT EXPORT PG PGVECTOR ROUNDTRIP OK' project-export-live.log \
            || { echo "::error::live pgvector FULL round-trip through the real driver never reached its marker (silent skip or a regression — needs pgvector/pgvector:pg16)" >&2; exit 1; }
          grep -q 'PROJECT EXPORT DRIVER ROUNDTRIP OK' project-export-live.log \
            || { echo "::error::live full-driver pg round-trip (NodeProjectExport::export/import, not the reconstructed primitives) never reached its marker (silent skip or a regression?)" >&2; exit 1; }
          grep -q 'PROJECT EXPORT PG TRUE-DELTA OK' project-export-live.log \
            || { echo "::error::live pg logical-WAL TRUE-DELTA round-trip never reached its marker (silent skip, a WAL-capture/replay regression, or the test pg lacks wal_level=logical)" >&2; exit 1; }
          grep -q 'PROJECT EXPORT PG OVERLAP-WINDOW OK' project-export-live.log \
            || { echo "::error::live pg true-delta OVERLAP-WINDOW proof never reached its marker (silent skip, or the base↔WAL overlap window reopened — concurrent writes must import cleanly via the snapshot-pin)" >&2; exit 1; }
          grep -q 'PROJECT EXPORT PG TRUE-DELTA CHAIN OK' project-export-live.log \
            || { echo "::error::live pg true-delta MULTI-DELTA CHAIN round-trip never reached its marker (silent skip, a chain-restore regression, or the test pg lacks wal_level=logical)" >&2; exit 1; }

          # --- live mysql (needs BOATRAMP_TEST_MYSQL_URL + docker) ---
          grep -q 'PROJECT EXPORT MYSQL ROUNDTRIP OK' project-export-live.log \
            || { echo "::error::live mysql export/import round-trip never reached its marker (silent skip or a regression?)" >&2; exit 1; }
          grep -q 'PROJECT EXPORT MYSQL SHADOW OK' project-export-live.log \
            || { echo "::error::live mysql ATOMIC shadow-restore round-trip never reached its marker (silent skip or a regression?)" >&2; exit 1; }
          grep -q 'PROJECT EXPORT MYSQL TRUE-DELTA OK' project-export-live.log \
            || { echo "::error::live mysql binlog TRUE-DELTA round-trip never reached its marker (silent skip, a binlog-capture/replay regression, or the test mysql lacks gtid_mode=ON)" >&2; exit 1; }
          grep -q 'PROJECT EXPORT MYSQL TRUE-DELTA CHAIN OK' project-export-live.log \
            || { echo "::error::live mysql true-delta MULTI-DELTA CHAIN round-trip never reached its marker (silent skip, a chain-restore regression, or the test mysql lacks gtid_mode=ON)" >&2; exit 1; }

          # --- no-docker members of the SAME test binary (always run) — gating on their markers
          #     too proves the whole file executed, not just the live-pg/mysql subset above (e.g.
          #     a feature-flag change that silently dropped project-export's libsql coverage).
          grep -q 'PROJECT EXPORT LIBSQL ROUNDTRIP OK' project-export-live.log \
            || { echo "::error::libsql project export/import round-trip never reached its marker (silent skip or a regression?)" >&2; exit 1; }
          grep -q 'PROJECT EXPORT LIBSQL CHUNKED ATOMIC OK' project-export-live.log \
            || { echo "::error::libsql chunked ATOMIC shadow round-trip never reached its marker (silent skip or a regression?)" >&2; exit 1; }
          grep -q 'PROJECT EXPORT CROSS-TENANT LEAK GATE OK' project-export-live.log \
            || { echo "::error::cross-tenant leak gate never reached its marker (silent skip, or a cross-tenant byte leak)" >&2; exit 1; }
