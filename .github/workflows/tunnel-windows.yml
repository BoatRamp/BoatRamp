# Overlay service tunneler — Windows TUN front-end BUILD + live SMOKE (plan §8, release R4). The
# `tun` feature must COMPILE + link on a native `windows-latest` runner (target x86_64-pc-windows-msvc)
# — the only way to verify Windows here, there being no local Windows toolchain — AND actually RUN:
# the `wintun-smoke` job opens a real wintun adapter on an elevated runner and drives a TCP connection
# through it (the "build-AND-smoke gate" R4 calls for). Still NO signed installer — that is the one
# deferred R4 item (it needs a code-signing cert). The unprivileged unit/integration tests stay on
# Linux (tunnel.yml) and the live/privileged Linux coverage on the `tunnel-tun` nixosTest; this lane
# proves the Windows cfg story (device = tun-rs wintun/net-route IP-Helper; privilege = no-op;
# teardown = tasklist liveness; resolver = NRPT; frontend = Ctrl-C/Break/Close/Logoff/Shutdown + :53
# DNS bind) both compiles and, for the device path, runs live.
#
# WHY A SEPARATE WORKFLOW (not a job in ci.yml): ci.yml is the Linux-only Tier-1 merge gate; per its
# tiering doctrine non-Linux native builds live outside it (Tier 2/3). The Windows leg needs a
# windows-latest runner, so — exactly like mobile.yml's macOS/Windows cargo-native legs — it is a
# plain rustup cargo lane (dtolnay/rust-toolchain adds the stable toolchain; Swatinem/rust-cache
# keyed per job), NOT the musl/nix/cargo-zigbuild flow.
#
# NON-BLOCKING TO START: this is the first Windows CI, so it is intentionally NOT wired into branch
# protection as a required check — it runs and is visible, but a red leg does not block a merge while
# the lane is driven to green. Promote it to a required check once it is reliably green.
# `workflow_dispatch` lets a maintainer re-run on demand during that iteration.
name: Tunnel TUN build (Windows, R4 Stage A)

on:
  push:
    branches: ['**']
    paths:
      - 'crates/boatramp-overlay-tunnel/**'
      - 'crates/boatramp/src/tunnel.rs'
      - 'crates/boatramp/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/tunnel-windows.yml'
  pull_request:
    paths:
      - 'crates/boatramp-overlay-tunnel/**'
      - 'crates/boatramp/src/tunnel.rs'
      - 'crates/boatramp/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/tunnel-windows.yml'
  workflow_dispatch:

concurrency:
  group: tunnel-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Match ci.yml / tunnel.yml: no incremental (fresh CI checkout) and no debug info (small target).
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # The crate this change is actually about: its `tun` feature must COMPILE + link on Windows. This
  # is the load-bearing leg — the cfg-gating (nix → unix-only; privilege/teardown/resolver/frontend
  # Windows arms) all lives here. `@stable` matches rust-toolchain.toml's `channel = "stable"`.
  overlay-tunnel-crate:
    name: boatramp-overlay-tunnel --features tun (windows-msvc build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tunnel-windows-overlay-tunnel
      - name: cargo build -p boatramp-overlay-tunnel --features tun
        run: cargo build -p boatramp-overlay-tunnel --features tun --locked

  # The full `boatramp` binary with the tunnel wired in (`--features tun,overlay`) — the shape an
  # operator would actually ship on Windows. Separate job (not a second step) so its result is
  # independent of the crate leg above: a failure in the much larger server dependency graph does
  # not mask the primary crate's green, and vice-versa (mobile.yml's fail-fast:false philosophy).
  boatramp-server:
    name: boatramp --features tun,overlay (windows-msvc build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tunnel-windows-boatramp
      - name: cargo build -p boatramp --features tun,overlay
        run: cargo build -p boatramp --features tun,overlay --locked

  # Live wintun SMOKE — the "build-AND-smoke" half of the R4 gate: the only check that proves the
  # Windows path RUNS, not just compiles. It opens a REAL wintun adapter (needs Administrator + a real
  # wintun.dll), installs the in-CIDR route via IP-Helper, and drives a real TCP connection through
  # the adapter into the netstack, asserting exactly one overlay dial attempt — the Windows analog of
  # tunnel.yml's Linux netns smoke. The test is #[ignore]d so it never runs in the unprivileged suite;
  # this job runs it EXPLICITLY by exact name and FAILS the job if it fails — a real success-marker
  # gate, NOT an ignored-never-run test. GitHub's windows-latest runner executes steps elevated, which
  # wintun's driver install requires. wintun.dll is the official, WireGuard-signed build from
  # wintun.net, staged into System32 so the OS DLL search always finds it at load time. Same
  # non-blocking-to-branch-protection posture as the build legs until it is reliably green.
  wintun-smoke:
    name: wintun live smoke (windows-latest, Administrator)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tunnel-windows-smoke
      - name: Download the official WireGuard-signed wintun.dll into System32
        shell: pwsh
        run: |
          $ver = '0.14.1'
          $url = "https://www.wintun.net/builds/wintun-$ver.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile wintun.zip
          Expand-Archive -Path wintun.zip -DestinationPath wintun-extract -Force
          $dll = "wintun-extract/wintun/bin/amd64/wintun.dll"
          Write-Host "wintun.dll SHA256:"; Get-FileHash $dll -Algorithm SHA256
          # Stage into System32 (the runner step is elevated) so LoadLibrary("wintun.dll") from the
          # test binary — wherever cargo runs it — resolves without a per-exe copy.
          Copy-Item $dll -Destination "$env:SystemRoot\System32\wintun.dll" -Force
      - name: Build the privileged test binary
        run: cargo test -p boatramp-overlay-tunnel --features tun --test tun_privileged --locked --no-run
      - name: Run the live wintun device smoke (fails the job on failure)
        run: cargo test -p boatramp-overlay-tunnel --features tun --test tun_privileged --locked -- --ignored --exact windows_wintun_device_route_drives_a_dial_attempt --nocapture --test-threads=1
