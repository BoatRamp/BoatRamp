# boatramp release pipeline, hand-rolled — no cargo-dist: it doesn't own our
# Nix + distro-package surface and adds a framework on the critical path. Each target
# builds on its **native** GitHub runner (so macOS/Windows are real hosts, not a
# cross-compile of aws-lc-rs), packages the binary + generated completions/man +
# licenses, and the release job assembles SHA256SUMS + a provenance attestation.
#
# Tag `vX.Y.Z` to release. GHCR image is built reproducibly via the Nix flake.
# Distro packages (.deb/.rpm) + the Homebrew tap bump are folded in as a
# fast-follow (metadata already lives in crates/boatramp/Cargo.toml + packaging/).
#
# The `crates-io` job publishes the workspace to crates.io on a real tag push, but
# only after a human approves the `crates-io` environment (crates.io is
# irreversible: names are claimed forever and releases can only be yanked).

name: Release

on:
  push:
    tags: ["v*"]
  # Manual dry run against a ref (no publish) for pipeline changes. With
  # `multiarch_test: true` it instead exercises ONLY the GHCR per-arch build +
  # multi-arch manifest-list assembly against a throwaway `ci-multiarch-test` tag
  # (no signing, no `release-signing` environment, the heavy build/preflight jobs
  # skipped), so the multi-arch wiring can be verified end-to-end BEFORE a real
  # `vX.Y.Z` cut. It never creates or moves a real release tag.
  workflow_dispatch:
    inputs:
      multiarch_test:
        description: "GHCR multi-arch dry run → ghcr.io/<owner>/boatramp:ci-multiarch-test (amd64+arm64, UNSIGNED). No real tags touched."
        type: boolean
        default: false

permissions:
  contents: write # create the release + upload assets
  packages: write # push the GHCR image
  id-token: write # OIDC for provenance attestation
  attestations: write

env:
  # The Linux release binary is the fully-static **musl + jemalloc** build — the same
  # artifact that backs the OCI images (`nix build .#boatramp-static`, default
  # features), so no glibc/loader closure and the concurrency throughput musl's own
  # malloc would throw away. macOS/Windows build the portable core via cargo (compute
  # *execution* + the Kubernetes `operator` are Linux-only).
  PORTABLE_FEATURES: "tls,handlers,cluster,s3,cloudflare-kv,compression,bundler,oidc"

jobs:
  # Pre-delivery PRECONDITION: the full nightly matrix (all-features test + nix checks + NixOS-service
  # VM + operator kind-e2e), run on the EXACT tagged commit via the shared reusable workflow. Every
  # publishing job below gates on this (`needs: … preflight`), so nothing — GHCR image, GitHub
  # release, or crates.io — ships unless the whole matrix is green on the release commit. (Owner
  # decision: nightly is a release precondition; this enforces the ordering structurally instead of
  # relying on running it by hand before the tag.)
  preflight:
    # Skipped on the GHCR multi-arch dry run (that path exercises only the container
    # jobs). Runs on every other trigger — tag push AND the plain dispatch dry-run.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.multiarch_test) }}
    uses: ./.github/workflows/preflight-matrix.yml
    secrets: inherit

  # The web console (`console`, a default feature) is a wasm32 Trunk build — no
  # cross-OS toolchain, so build it once here via the Nix flake and hand the dist
  # to every native binary build as an artifact. `boatramp-server/build.rs` bakes
  # whatever lands in `crates/boatramp-console/dist` into the binary (all targets),
  # so every shipped binary (Linux/macOS/Windows) embeds the same real console.
  console-dist:
    name: console SPA (Nix)
    # Skipped on the GHCR multi-arch dry run (containers build their console via Nix,
    # not this artifact). Runs on tag push and the plain dispatch dry-run.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.multiarch_test) }}
    runs-on: ubuntu-latest
    # Hard cap: a Nix/cachix step that WEDGES (the v0.44.0 release hung ~3h40m in a stuck
    # cachix push) must fail fast, not burn the 6h default. Generous vs a cold no-cache build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      # Read (+ push) the boatramp.cachix.org binary cache as a substituter, so the
      # Rust/Nix closures nightly + cache.yml already built download instead of
      # recompiling from source. Token absent (fork PR) ⇒ reads still work, push skips.
      - uses: cachix/cachix-action@v15
        continue-on-error: true
        with:
          name: boatramp
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the console SPA
        run: |
          set -euo pipefail
          nix build .#console --print-build-logs --out-link result-console
          # Copy out of the read-only store, dereferencing symlinks, into a plain
          # dir the upload/download-artifact pair can round-trip on every OS.
          mkdir -p console-dist
          cp -rL result-console/. console-dist/
          ls -l console-dist
      - uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: console-dist/
          retention-days: 5

  build:
    name: build · ${{ matrix.target }}
    needs: console-dist
    # Skipped on the GHCR multi-arch dry run (a plain `if` keeps the implicit
    # needs-success gate, so a real release still requires console-dist green).
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.multiarch_test) }}
    runs-on: ${{ matrix.os }}
    # Hard cap on the per-target build (Nix static build + cachix read/push) — fail a wedge
    # fast instead of the 6h default. 90m is ample for a cold, cache-miss build.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, kind: linux }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, kind: linux }
          - { os: macos-15-intel, target: x86_64-apple-darwin, kind: unix }
          - { os: macos-14, target: aarch64-apple-darwin, kind: unix }
          # Windows additionally ships the overlay service tunneler (`tun,overlay`): `boatramp
          # tunnel` on a wintun adapter, with the signed wintun.dll bundled alongside (R4). Only
          # the portable (cargo-built) targets read `extra_features`; the Linux legs build via Nix.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, kind: windows, extra_features: "tun,overlay" }
    steps:
      - uses: actions/checkout@v5

      # Drop the prebuilt console SPA where `boatramp-server/build.rs` embeds it,
      # so the default `console` feature bakes in the real assets (not the
      # build-script placeholder). The dist is OS-independent (wasm + html/css/js).
      - name: Fetch the prebuilt console SPA
        uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: crates/boatramp-console/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # aws-lc-rs (pulled by tls/s3) needs nasm on Windows; cmake is preinstalled
      # on the GitHub runners.
      - name: Install NASM (Windows)
        if: matrix.kind == 'windows'
        uses: ilammy/setup-nasm@v1

      # The Linux binary is the reproducible static musl + jemalloc artifact from the
      # flake (`nix build .#boatramp-static`, native arch on each Linux runner), staged
      # where the archive + .deb/.rpm steps expect it. macOS/Windows build the portable
      # core via cargo.
      - name: Install Nix (Linux)
        if: matrix.kind == 'linux'
        uses: DeterminateSystems/nix-installer-action@main
      # Substitute the `boatramp-static` (= boatrampMuslBin) closure nightly cached
      # instead of recompiling it on the Linux release leg. macOS/Windows build via
      # cargo (no Nix), so this is Linux-only like the installer above.
      - name: Nix binary cache (Linux)
        if: matrix.kind == 'linux'
        uses: cachix/cachix-action@v15
        continue-on-error: true
        with:
          name: boatramp
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.kind }}" = "linux" ]; then
            nix build .#boatramp-static --print-build-logs --out-link result-bin
            mkdir -p "target/${{ matrix.target }}/release"
            install -m755 result-bin/bin/boatramp "target/${{ matrix.target }}/release/boatramp"
          else
            feats="${PORTABLE_FEATURES}"
            # Per-target additions (e.g. Windows adds tun,overlay for the service tunneler).
            if [ -n "${{ matrix.extra_features }}" ]; then feats="${feats},${{ matrix.extra_features }}"; fi
            cargo build -p boatramp --release --locked \
              --target ${{ matrix.target }} --features "$feats"
          fi

      # The shipped macOS binary embeds the (non-optional) `boatramp-vz` compute
      # backend, which boots VMs via Apple's Virtualization.framework. VZVirtualMachine
      # init/start fails on an unsigned binary, so ad-hoc code-sign it with the free,
      # self-signable `com.apple.security.virtualization` entitlement (no Apple approval;
      # no `--options runtime` — hardened runtime is for Developer-ID notarization).
      # This MUST be the last mutation of the binary and be asserted: a later re-sign or
      # notarization silently strips the entitlement (podman #21843), so we sign here —
      # before packaging — and fail the job if the entitlement did not survive.
      - name: Code-sign macOS binary with virtualization entitlement
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/boatramp"
          codesign --force --sign - \
            --entitlements packaging/macos/boatramp.entitlements "$bin"
          # Assert the entitlement is actually present in the signature (guards against
          # a stripped/re-signed binary shipping without VM-boot capability).
          if ! codesign -d --entitlements - "$bin" 2>&1 | grep -q 'com.apple.security.virtualization'; then
            echo "::error::com.apple.security.virtualization entitlement missing from $bin after signing — the binary cannot boot VMs (see podman #21843: a re-sign can strip entitlements)"
            exit 1
          fi

      # Bundle the official WireGuard-signed wintun.dll next to boatramp.exe (R4): `boatramp tunnel`
      # loads it at runtime from the binary's own directory. This is the upstream Authenticode-signed
      # build (WireGuard LLC) shipped VERBATIM — we do not re-sign it; the boatramp.exe itself is
      # unsigned (a signed installer is the one deferred R4 item). Pinned version + recorded hash.
      - name: Fetch signed wintun.dll (Windows)
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          ver=0.14.1
          curl -fsSL "https://www.wintun.net/builds/wintun-${ver}.zip" -o wintun.zip
          7z x -y wintun.zip -owintun-extract >/dev/null
          mkdir -p wintun-dist
          cp "wintun-extract/wintun/bin/amd64/wintun.dll" wintun-dist/wintun.dll
          echo "wintun.dll (v${ver}, amd64) sha256:"
          sha256sum wintun-dist/wintun.dll || true

      - name: Assemble archive (binary + completions + man + docs)
        shell: bash
        run: |
          set -euo pipefail
          bindir="target/${{ matrix.target }}/release"
          bin="boatramp"; [ "${{ matrix.kind }}" = "windows" ] && bin="boatramp.exe"
          stage="dist/boatramp-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "$bindir/$bin" "$stage/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          # Generated payload — the binary describes its own flags.
          if [ "${{ matrix.kind }}" != "windows" ]; then
            mkdir -p "$stage/completions"
            for sh in bash zsh fish; do "$bindir/$bin" completions "$sh" > "$stage/completions/boatramp.$sh"; done
            "$bindir/$bin" man > "$stage/boatramp.1"
          else
            "$bindir/$bin" completions powershell > "$stage/boatramp.ps1"
            # Service tunneler (R4): ship the signed wintun.dll next to boatramp.exe + a provenance /
            # run-as-Administrator note the user sees right in the archive.
            cp wintun-dist/wintun.dll "$stage/"
            cp packaging/windows/WINTUN.txt "$stage/"
          fi

      - name: Pack + checksum
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          name="boatramp-${{ matrix.target }}"
          if [ "${{ matrix.kind }}" = "windows" ]; then
            7z a "${name}.zip" "$name" >/dev/null; asset="${name}.zip"
          else
            tar -cJf "${name}.tar.xz" "$name"; asset="${name}.tar.xz"
          fi
          # Portable sha256 (Linux: sha256sum; macOS: shasum).
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "${asset}.sha256";
          else shasum -a 256 "$asset" > "${asset}.sha256"; fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      # Distro packages, Linux only. The .deb/.rpm layout, maintainer scripts, and
      # systemd/sysusers/tmpfiles payload are single-sourced from
      # `[package.metadata.deb]` / `[package.metadata.generate-rpm]` in
      # `crates/boatramp/Cargo.toml`. Each Linux leg is a native-arch runner, so the
      # target build is also the host arch — copy it where those asset paths expect
      # it and let each tool stamp the host architecture (amd64/x86_64, arm64/aarch64).
      - name: Install packaging tools (Linux)
        if: matrix.kind == 'linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Build .deb + .rpm (Linux)
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/boatramp" target/release/boatramp
          cargo deb --no-build -p boatramp
          cargo generate-rpm -p crates/boatramp
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          ( cd dist && for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done )

      - uses: actions/upload-artifact@v4
        with:
          name: boatramp-${{ matrix.target }}
          path: |
            dist/${{ steps.pack.outputs.asset }}
            dist/${{ steps.pack.outputs.asset }}.sha256
            dist/*.deb
            dist/*.rpm
            dist/*.deb.sha256
            dist/*.rpm.sha256
          if-no-files-found: ignore
          retention-days: 5

  release:
    name: publish release
    needs: [build, preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }

      - name: Assemble SHA256SUMS + collect assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/boatramp-*.tar.xz artifacts/boatramp-*.zip release/ 2>/dev/null || true
          cp artifacts/*.deb artifacts/*.rpm release/ 2>/dev/null || true
          cp packaging/install/install.sh packaging/install/install.ps1 release/
          ( cd release && cat ../artifacts/*.sha256 | sed 's# .*/# #' > SHA256SUMS && cat SHA256SUMS )

      - name: Provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          # `boatramp*` also covers the `boatramp_<ver>_<arch>.deb` underscore form.
          subject-path: "release/boatramp*"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/boatramp-*.tar.xz
            release/boatramp-*.zip
            release/*.deb
            release/*.rpm
            release/SHA256SUMS
            release/install.sh
            release/install.ps1
          generate_release_notes: true

  # ── GHCR images, leg 1: per-arch build + push-by-digest (matrix) ────────────
  # The GHCR images are now MULTI-ARCH (linux/amd64 + linux/arm64). This matrix leg
  # builds the FOUR Nix image closures for ITS OWN native arch and pushes every
  # variant to an arch-suffixed staging tag, recording the immutable per-arch
  # digest; the dependent `container` job then joins the two arches into a manifest
  # list per human tag and signs the lists. nixpkgs `dockerTools` stamps the image
  # config's `architecture` from the build host's GOARCH, so the x86_64 runner
  # yields an amd64 image and the `ubuntu-24.04-arm` runner an arm64 image — each
  # arch is built NATIVELY, never cross-compiled.
  #
  # Runs on a real `vX.Y.Z` tag push (the release) AND on a `workflow_dispatch` with
  # `multiarch_test: true` (a throwaway `ci-multiarch-test` dry run, no signing). On
  # the release path it gates on `build` + `preflight` succeeding exactly as the old
  # single-arch job did; on the dry-run path those heavy jobs are skipped (see their
  # `if`), so the `if` below uses `!cancelled()` to run despite the skipped `needs`
  # and re-asserts build/preflight success on the release branch only.
  container-build:
    name: GHCR build · ${{ matrix.arch }}
    needs: [build, preflight]
    if: >-
      ${{ !cancelled() &&
          (
            (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              && needs.build.result == 'success' && needs.preflight.result == 'success')
            || (github.event_name == 'workflow_dispatch' && inputs.multiarch_test)
          ) }}
    runs-on: ${{ matrix.runs-on }}
    # Hard cap: the GHCR image build pushes a large Nix closure to cachix — the exact
    # step that wedged for ~3h40m in v0.44.0. Fail a stuck push fast, not at 6h.
    timeout-minutes: 90
    strategy:
      # A hiccup on one arch must not abort the other — but note the assembly job
      # below requires BOTH legs green (it needs both digests), so a failed leg still
      # fails the release.
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runs-on: ubuntu-latest }
          - { arch: arm64, runs-on: ubuntu-24.04-arm }
    env:
      IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5
      # Building the boatramp binaries through Nix is disk- and memory-heavy on a
      # stock runner (see the CI `nix` job): reclaim unused toolchains + add swap.
      # The arm64 runner needs the same headroom as the x86_64 one.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - uses: DeterminateSystems/nix-installer-action@main
      # THE big win: `.#container*` wrap `boatrampMuslBin`, the exact closure the
      # caches push to boatramp.cachix.org — x86_64's by preflight-matrix, arm64's by
      # cache.yml's now-enabled aarch64-linux leg. With the cache as a substituter the
      # Rust build downloads and only the thin `mkImage` layer builds. A cold arm64
      # cache falls back to a (slow but correct) from-source build under `--max-jobs 1`.
      - uses: cachix/cachix-action@v15
        continue-on-error: true
        with:
          name: boatramp
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Use a v2 registries.conf for skopeo
        run: |
          # The runner ships a v1 /etc/containers/registries.conf that nixpkgs'
          # skopeo (v2-only) rejects with a fatal error before it can even log in.
          # Point every skopeo call in this job at a minimal v2 file instead.
          printf 'unqualified-search-registries = []\n' > "$RUNNER_TEMP/registries.conf"
          echo "CONTAINERS_REGISTRIES_CONF=$RUNNER_TEMP/registries.conf" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          # skopeo falls back to ~/.docker/config.json; write it once, directly, so a
          # runner-configured docker credStore can't intercept `docker login`.
          mkdir -p "$HOME/.docker"
          auth="$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64 -w0)"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$auth" > "$HOME/.docker/config.json"
      - name: Resolve push mode
        run: |
          set -euo pipefail
          # Release → the real `vX.Y.Z`; dry run → the throwaway test tag. Both legs
          # and the assembly job derive the same PUSH_TAG the same way.
          if [ "${IS_RELEASE}" = "true" ]; then
            echo "PUSH_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "PUSH_TAG=ci-multiarch-test" >> "$GITHUB_ENV"
          fi
      # Build the four closures for THIS arch and push each to `<repo>:<PUSH_TAG>-<arch>`
      # (debug variants: `<repo>:<PUSH_TAG>-debug-<arch>`), recording the per-arch digest
      # the manifest-list job joins on. These arch-suffixed tags are immutable, version-
      # pinned, and are themselves usefully arch-pinnable by consumers.
      - name: Build + push per-arch images (by digest)
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          cf="${base}-cloudflare"
          # Realize all FOUR image closures in ONE `nix build`, so the daemon substitutes
          # their (cached) tarballs CONCURRENTLY. Substitution is NOT gated by `--max-jobs`,
          # so `--max-jobs 1` stays as the OOM guard for a rare cache-miss recompile; only
          # the download parallelises. `.#container*` resolve to this runner's native arch.
          nix build ".#container" ".#container-cloudflare" \
                    ".#container-debug" ".#container-cloudflare-debug" \
            --max-jobs 1 --cores 2 --no-link --print-build-logs

          : > "digests-${arch}.txt"
          : > "paths-${arch}.txt"
          # Push one variant to its arch-suffixed staging tag; record `<attr> <repo> <digest>`
          # for the assembly job and `<attr> <tar>` for the SBOM step. Resolve the store path
          # by ATTR (a cache hit after the batch build) so it never depends on build order.
          push() {  # $1=attr  $2=repo  $3=staging-tag
            local attr="$1" repo="$2" stag="$3" tar dig
            tar="$(nix build ".#${attr}" --no-link --print-out-paths)"
            echo "${attr} ${tar}" >> "paths-${arch}.txt"
            nix run nixpkgs#skopeo -- copy "docker-archive:${tar}" "docker://${repo}:${stag}"
            dig="$(nix run nixpkgs#skopeo -- inspect --format '{{.Digest}}' "docker://${repo}:${stag}")"
            echo "${attr} ${repo} ${dig}" >> "digests-${arch}.txt"
            echo "pushed ${attr} → ${repo}:${stag}  (${dig})"
          }
          push container                  "$base" "${PUSH_TAG}-${arch}"
          push container-debug            "$base" "${PUSH_TAG}-debug-${arch}"
          push container-cloudflare       "$cf"   "${PUSH_TAG}-${arch}"
          push container-cloudflare-debug "$cf"   "${PUSH_TAG}-debug-${arch}"
          echo "---- digests-${arch}.txt ----"; cat "digests-${arch}.txt"
      # Build the per-arch CycloneDX SBOMs from the LOCAL nix archive (no network
      # re-pull — the same optimization the old job made). syft's docker-archive reader
      # needs an UNCOMPRESSED tar (the nix output is gzipped) and the syft nix shell has
      # no gzip, so decompress each with the RUNNER's gzip first, then run syft inside the
      # shell. The predicate JSON is signed/attested later in `container` (which holds the
      # key). Release path only — the dry run signs/attests nothing.
      - name: Build CycloneDX SBOMs (per arch)
        if: ${{ env.IS_RELEASE == 'true' }}
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          while read -r attr tar; do
            [ -n "$attr" ] || continue
            zcat -f "$tar" > "sbom-src-${attr}.tar"   # `zcat -f` passes a non-gzip tar through unchanged
          done < "paths-${arch}.txt"
          nix shell nixpkgs#syft -c bash -euo pipefail -c '
            arch="'"${arch}"'"
            while read -r attr tar; do
              [ -n "$attr" ] || continue
              syft "docker-archive:sbom-src-${attr}.tar" -o cyclonedx-json > "sbom-${attr}-${arch}.json"
            done < "paths-${arch}.txt"
          '
          rm -f sbom-src-*.tar
          ls -l sbom-*-"${arch}".json
      # Hand the per-arch digests (+ SBOMs on the release path) to the assembly job.
      - uses: actions/upload-artifact@v4
        with:
          name: container-arts-${{ matrix.arch }}
          path: |
            digests-${{ matrix.arch }}.txt
            sbom-*-${{ matrix.arch }}.json
          if-no-files-found: ignore
          retention-days: 5

  # ── GHCR images, leg 2: manifest-list assembly + signing ────────────────────
  # Joins the two per-arch child digests into a multi-arch manifest list per human
  # tag — `<tag>` + `latest` (lean) and `<tag>-debug` + `debug` (debug), on both the
  # `boatramp` and `boatramp-cloudflare` repos — with `docker buildx imagetools
  # create` (skopeo cannot create lists). Then KEY-signs each DISTINCT list digest
  # `--recursive` (the list + both arch children), so the verifier contract is
  # UNCHANGED for a multi-arch tag:
  #   cosign verify --key cosign.pub ghcr.io/<owner>/boatramp:<tag>
  # resolves the tag to the list digest and finds the signature. Per-arch CycloneDX
  # SBOMs (built on the legs) are attested to each arch child by digest.
  #
  # The job keeps the id `container` (crates-io `needs: container`). The
  # `release-signing` environment — which scopes COSIGN_PRIVATE_KEY away from the
  # build jobs — is attached ONLY on the real release path; the `ci-multiarch-test`
  # dry run gets NO environment (no approval gate, no key) and signs nothing.
  container:
    name: GHCR images (base + cloudflare, Nix)
    needs: [container-build]
    if: >-
      ${{ !cancelled() && needs.container-build.result == 'success' &&
          (
            (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
            || (github.event_name == 'workflow_dispatch' && inputs.multiarch_test)
          ) }}
    runs-on: ubuntu-latest
    # Protected environment on the release path only; empty string = no environment
    # (so the dry run needs no reviewer approval and gets no signing secret).
    environment: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'release-signing' || '' }}
    timeout-minutes: 60
    env:
      IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          # `docker buildx imagetools`, cosign and skopeo all read ~/.docker/config.json;
          # write it once (directly, so a runner credStore can't intercept `docker login`).
          mkdir -p "$HOME/.docker"
          auth="$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64 -w0)"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$auth" > "$HOME/.docker/config.json"
      - name: Use a v2 registries.conf for skopeo
        run: |
          printf 'unqualified-search-registries = []\n' > "$RUNNER_TEMP/registries.conf"
          echo "CONTAINERS_REGISTRIES_CONF=$RUNNER_TEMP/registries.conf" >> "$GITHUB_ENV"
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Resolve push mode
        run: |
          set -euo pipefail
          if [ "${IS_RELEASE}" = "true" ]; then
            echo "PUSH_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "PUSH_TAG=ci-multiarch-test" >> "$GITHUB_ENV"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: arts
          pattern: container-arts-*
          merge-multiple: true
      # Assemble one multi-arch manifest list per variant and resolve its (immutable)
      # list digest. Signing is done by digest in the next step to avoid any tag race.
      - name: Assemble multi-arch manifest lists
        run: |
          set -euo pipefail
          # Each repo comes from the per-arch digests files (written by the legs), so no
          # repo base is needed here.
          test -f arts/digests-amd64.txt || { echo "::error::missing amd64 digests"; exit 1; }
          test -f arts/digests-arm64.txt || { echo "::error::missing arm64 digests"; exit 1; }
          declare -A AMD ARM REPO
          while read -r attr repo dig; do [ -n "$attr" ] || continue; AMD[$attr]="$dig"; REPO[$attr]="$repo"; done < arts/digests-amd64.txt
          while read -r attr repo dig; do [ -n "$attr" ] || continue; ARM[$attr]="$dig"; REPO[$attr]="$repo"; done < arts/digests-arm64.txt

          # Final human tags per variant. Lean → <tag> (+latest on release); debug →
          # <tag>-debug (+debug on release). The dry run uses only the ci-multiarch-test
          # family and NEVER the floating latest/debug tags (so it can't shadow a release).
          declare -A TAGS
          if [ "${IS_RELEASE}" = "true" ]; then
            TAGS[container]="${PUSH_TAG} latest"
            TAGS[container-debug]="${PUSH_TAG}-debug debug"
            TAGS[container-cloudflare]="${PUSH_TAG} latest"
            TAGS[container-cloudflare-debug]="${PUSH_TAG}-debug debug"
          else
            TAGS[container]="${PUSH_TAG}"
            TAGS[container-debug]="${PUSH_TAG}-debug"
            TAGS[container-cloudflare]="${PUSH_TAG}"
            TAGS[container-cloudflare-debug]="${PUSH_TAG}-debug"
          fi

          : > sign-lists.txt
          : > attest-plan.txt
          for attr in container container-debug container-cloudflare container-cloudflare-debug; do
            repo="${REPO[$attr]:-}"; amd="${AMD[$attr]:-}"; arm="${ARM[$attr]:-}"
            if [ -z "$repo" ] || [ -z "$amd" ] || [ -z "$arm" ]; then
              echo "::error::missing digest for ${attr} (repo=$repo amd=$amd arm=$arm)"; exit 1
            fi
            # First tag is the immutable version-pinned one; the rest are floating
            # aliases of the SAME list (same digest), so signing one covers all.
            read -r -a tags <<< "${TAGS[$attr]}"
            targs=(); for t in "${tags[@]}"; do targs+=(-t "${repo}:${t}"); done
            echo "manifest list ${repo} [${tags[*]}]  ← amd64:${amd} arm64:${arm}"
            docker buildx imagetools create "${targs[@]}" "${repo}@${amd}" "${repo}@${arm}"
            listref="${repo}:${tags[0]}"
            # Best-effort digest log (non-fatal): useful for debugging, not relied on.
            listdig="$(docker buildx imagetools inspect "${listref}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
            echo "  list ref: ${listref}  digest: ${listdig:-<unresolved>}"
            # Sign/attest by the immutable tag (cosign resolves the list digest itself;
            # nothing moves the tag within this job). `cosign sign --recursive` then
            # covers the list + both arch children; the floating aliases share the digest.
            echo "${listref}" >> sign-lists.txt
            # Attest BOTH per-arch SBOMs to the list (which the human tag resolves to),
            # so the existing single-command verifier flow keeps working on a tag:
            #   cosign verify-attestation --key cosign.pub --type cyclonedx <repo>:<tag>
            # surfaces both arches' CycloneDX SBOMs. Present only on the release path.
            [ -f "arts/sbom-${attr}-amd64.json" ] && echo "${listref} arts/sbom-${attr}-amd64.json" >> attest-plan.txt
            [ -f "arts/sbom-${attr}-arm64.json" ] && echo "${listref} arts/sbom-${attr}-arm64.json" >> attest-plan.txt
          done
          echo "---- sign-lists.txt ----"; cat sign-lists.txt
          echo "---- attest-plan.txt ----"; cat attest-plan.txt || true
      # Proof-of-multi-arch gate: assert each lean list really advertises BOTH arches.
      # This is the explicit check the dry run exists for; it also guards the release.
      - name: Verify both arches are present
        run: |
          set -euo pipefail
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          cf="${base}-cloudflare"
          check() {  # $1=repo:tag
            local ref="$1" raw arches
            raw="$(nix run nixpkgs#skopeo -- inspect --raw "docker://${ref}")"
            arches="$(printf '%s' "$raw" | jq -r '.manifests[]?.platform.architecture' 2>/dev/null | sort -u)"
            echo "${ref} → arches: $(printf '%s' "$arches" | paste -sd, -)"
            if printf '%s\n' "$arches" | grep -qx amd64 && printf '%s\n' "$arches" | grep -qx arm64; then
              return 0
            fi
            echo "::error::${ref} is not a complete amd64+arm64 manifest list"
            printf '%s\n' "$raw"
            exit 1
          }
          check "${base}:${PUSH_TAG}"
          check "${cf}:${PUSH_TAG}"
      # KEY-sign each manifest list by its immutable tag, `--recursive` (so the list +
      # both arch children are signed), and attest the per-arch CycloneDX SBOMs to the
      # list, so the UNCHANGED single-command verifier flow works on any human tag:
      #   cosign verify             --key cosign.pub <repo>:<tag>
      #   cosign verify-attestation --key cosign.pub --type cyclonedx <repo>:<tag>
      # The private half is COSIGN_PRIVATE_KEY, scoped to `release-signing`. Release only.
      - name: Sign manifest lists + attest SBOMs (cosign key + syft)
        if: ${{ env.IS_RELEASE == 'true' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: "" # the release key is passwordless; it lives only as the CI secret
        run: |
          set -euo pipefail
          # Resolve cosign ONCE for the whole loop — a per-op `nix run nixpkgs#…`
          # re-evaluates nixpkgs each time.
          nix shell nixpkgs#cosign -c bash -euo pipefail -c '
            while read -r ref; do
              [ -n "$ref" ] || continue
              cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY "$ref"
            done < sign-lists.txt
            while read -r ref sbom; do
              [ -n "$ref" ] || continue
              cosign attest --yes --key env://COSIGN_PRIVATE_KEY --predicate "$sbom" --type cyclonedx "$ref"
            done < attest-plan.txt
          '

      # Publish the operator Helm chart as an OCI artifact alongside the images. Release only.
      - name: Package + push the Helm chart
        if: ${{ env.IS_RELEASE == 'true' }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          # Pin the chart's appVersion (operator image tag) to this release.
          nix run nixpkgs#kubernetes-helm -- package charts/boatramp-operator \
            --version "$tag" --app-version "$tag" -d dist
          nix run nixpkgs#kubernetes-helm -- push \
            "dist/boatramp-operator-${tag}.tgz" "oci://ghcr.io/${owner}/charts"

  # Publish the workspace to crates.io. Gated four ways: it runs only on a real
  # `vX.Y.Z` tag push (never the workflow_dispatch dry run), only after `preflight`
  # (the full nightly matrix on the release commit), only after `build` AND `container`
  # (the GHCR images) are green, and only once a human approves the `crates-io`
  # environment (a required-reviewer rule set in repo Settings >
  # Environments). The `needs: [build, container, preflight]` is load-bearing: a crates.io
  # publish is IRREVERSIBLE (a version can't be overwritten — a later break forces a
  # version bump + re-cut), while the binaries and GHCR images are rebuildable from
  # the tag. So the irreversible step MUST go last: gating it on `container` means
  # the approval gate does not even appear until the images are published green, so
  # a reviewer cannot approve crates.io while GHCR is still in flight (the v0.28.0
  # lapse). The environment also holds the `CRATES_IO_TOKEN` secret. The single
  # source of truth for order + safety is `just publish`: it refuses unless HEAD is
  # on an exact vX.Y.Z tag matching the workspace version, publishes the crates in
  # dependency order, and is resumable (skips versions already on crates.io) so a
  # rerun after a rate-limit stall picks up where it left off.
  crates-io:
    name: publish to crates.io
    needs: [build, container, preflight]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: crates-io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags so `just publish`'s `git describe --exact-match`
          # resolves the vX.Y.Z tag it guards on.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Publish workspace crates (dependency order, resumable)
        env:
          # cargo reads the crates.io token from this env var, so no `cargo login`.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: just publish
