# cargo-deny configuration. Run `just deny` (or `cargo deny check`).
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Both advisories below are "unmaintained" notices (not vulnerabilities) on
  # transitive deps pulled in via slatedb -> foyer (its block cache); we don't
  # depend on either directly and no safe upgrade exists. Revisit when
  # foyer/slatedb drop them.
  "RUSTSEC-2024-0436", # paste: compile-time-only proc-macro, archived upstream
  "RUSTSEC-2025-0141", # bincode 1.3.3: development ceased; 1.3.3 is "complete"

  # rustls-pemfile: unmaintained (folded into rustls-pki-types). Transitive via
  # the TLS stacks below; no direct dep. Drops out when they bump.
  "RUSTSEC-2025-0134",

  # Old-rustls-line advisories (rustls itself + rustls-webpki), all fixed on the
  # primary 0.23 line (0.23.46, which reqwest/the workspace already use) but
  # unbumpable on the two pinned-transitive old lines: rustls 0.21.12 +
  # rustls-webpki 0.101.7 via the aws-sdk (s3 feature) -> rustls 0.21; rustls
  # 0.22.4 + rustls-webpki 0.102.8 via libsql -> hyper-rustls 0.25 -> rustls
  # 0.22. Limited impact (the cert/CRL advisories need a compromised trusted
  # issuing authority; the Debug/downgrade advisories need a custom
  # ClientSessionStore that Debug-logs session values, which boatramp doesn't
  # have). Revisit when libsql / aws-sdk move to rustls 0.23.
  "RUSTSEC-2026-0049", # rustls-webpki: CRL distribution-point matching
  "RUSTSEC-2026-0098", # rustls-webpki: name constraints for URI names
  "RUSTSEC-2026-0099", # rustls-webpki: name constraints with wildcard names
  "RUSTSEC-2026-0104", # rustls-webpki: panic in CRL parsing
  "RUSTSEC-2026-0382", # rustls-webpki: distrusted emSign intermediates
  "RUSTSEC-2026-0346", # rustls: Debug impls for client session values expose TLS secrets
  "RUSTSEC-2026-0349", # rustls: unauthenticated ServerHello can downgrade to classical key exchange

  # h2 0.3.27 unbounded empty DATA frames (low severity; patched in 0.4.16, and
  # the workspace's primary h2 line is already >=0.4.20). Pinned transitively by
  # the AWS SDK (aws-smithy-http-client -> aws-smithy-runtime -> aws-config),
  # reachable only through the opt-in S3 blob backend, not the default build.
  # Revisit when aws-smithy-http-client moves off h2 0.3.
  "RUSTSEC-2026-0258",

  # rkyv 0.7.46 shared-pointer validation bypass (fixed in 0.8.17; the 0.7 series
  # is no longer supported upstream). Transitive via lightningcss (alpha, pins
  # rkyv 0.7) -> parcel_sourcemap, lightningcss's own build/bundle-time sourcemap
  # cache — a build-time CSS path over boatramp's own authored input, not
  # attacker-controlled and not guest-reachable at runtime. Revisit when
  # lightningcss leaves alpha and bumps rkyv.
  "RUSTSEC-2026-0235",

  # unsafe-libyaml 0.2.11: unmaintained, no fixed release exists. Transitive, no
  # direct dep. Revisit if a replacement YAML backend appears upstream.
  "RUSTSEC-2024-0449",

  # crossbeam-epoch (0.9.18): invalid pointer deref in the `fmt::Pointer`/`Debug`
  # impls for `Atomic`/`Shared` — only triggered by *formatting* a null-created
  # epoch pointer. Transitive via slatedb -> crossbeam-skiplist (its memtable),
  # which never Debug-prints those pointers, so the path is unreachable. No safe
  # upgrade (0.9.18 is the current line). Revisit when crossbeam-epoch patches.
  "RUSTSEC-2026-0204",

  # rsa (0.9.10) "Marvin" RSA-decryption timing side-channel. Present ONLY with
  # the opt-in `sql-mysql` feature (not the default graph): sqlx-mysql pulls `rsa`
  # solely for MySQL's sha256/caching_sha2 auth, where the *client* RSA-**encrypts**
  # the password during a non-TLS handshake. Marvin targets the private-key
  # *decryptor* (the MySQL server), an operation boatramp never performs — and a
  # TLS connection skips the RSA exchange entirely. No fixed `rsa` release exists.
  # Revisit when RustCrypto/RSA ships a constant-time release or sqlx drops it.
  "RUSTSEC-2023-0071",

  # zstd 0.13.3: four decompression advisories (RUSTSEC-2026-0391 cross-stream data
  # leak on a reused context; -0398 Seekable::decompress sets a Vec length beyond
  # capacity for out-of-range offsets; -0403 uninitialized memory exposed on a failed
  # legacy-frame streaming decompress; -0410). Pulled transitively by BOTH wasmtime 50
  # (its wasm module cache, via wasmtime-internal-cache) AND slatedb -> foyer (the
  # block cache); both pin zstd 0.13 and wasmtime 50 is the LATEST published wasmtime,
  # so NO upgrade exists at this time. Impact is low here: both only (de)compress
  # boatramp's OWN cache blocks (wasm modules, slatedb blocks), never attacker-
  # controlled external zstd input. Revisit when wasmtime / foyer move to zstd 0.14.
  "RUSTSEC-2026-0391",
  "RUSTSEC-2026-0398",
  "RUSTSEC-2026-0403",
  "RUSTSEC-2026-0410",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The internal workspace crates are referenced by path (no version), which the
# wildcard check would otherwise flag.
allow-wildcard-paths = true

[licenses]
version = 2
# Permissive licenses we are happy to depend on. Add more as the tree grows
# (run `cargo deny check licenses` to see what is needed).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "BSL-1.0",
  "0BSD",
  "CC0-1.0",
  "MPL-2.0",
  # Permissive data license (e.g. bundled CA / IANA data sets).
  "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
