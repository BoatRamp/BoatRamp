# Example edge (root) component: imports the `adder` interface and exports `run`.
# Built to a component with `cargo build --release --target wasm32-wasip2`; its
# `adder` import is satisfied by the `plugin` component via `boatramp compose`.
# Consumed as a fixture by the CLI's compose test. Excluded from the workspace
# (it targets wasm, not the host).
[package]
name = "boatramp-compose-edge"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
strip = true
