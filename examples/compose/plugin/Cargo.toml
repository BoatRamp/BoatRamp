# Example plugin (leaf) component: exports the `adder` interface. Built to a
# component with `cargo build --release --target wasm32-wasip2` and composed into
# the `edge` component by `boatramp compose`; consumed as a fixture by the CLI's
# compose test. Excluded from the workspace (it targets wasm, not the host).
[package]
name = "boatramp-compose-plugin"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
strip = true
