# Example WebAssembly *session* guest (mailroom cap-req 17): exports the boatramp `session-handler`
# and imports the `session` host half (send/checkpoint/close), like `session-echo`, but greets
# UNSOLICITED — on the first re-entry that has not yet checkpointed a `greeted` flag, even one
# carrying NO frames (the host's connect-time dispatch). Proves a server-speaks-first protocol
# (IMAP `* OK` / SMTP `220` / POP3 `+OK`) can emit its banner before the client sends a byte, with
# zero guest/WIT change from `session-echo`'s shape.
# Built to a component with `cargo build --release --target wasm32-wasip2`; consumed as a fixture by
# the session-listener live-capability gate. Excluded from the workspace (targets wasm).
[package]
name = "boatramp-example-session-greet"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
strip = true
