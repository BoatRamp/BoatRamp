# Example WebAssembly handler guest: a wasi:http handler that opens BOTH the default
# (`""`) and a NAMED (`product`) SQL database, reads distinct data from each, and asserts an
# un-granted name (`privileged`) is denied — exercising named SQL binding dispatch +
# least-privilege authz end to end. Built to a component with
# `cargo build --release --target wasm32-wasip2`; consumed as a fixture by the
# `boatramp-server` conformance tests. Excluded from the workspace (targets wasm).
[package]
name = "boatramp-example-sql-named"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
strip = true
