# Example GraphQL federation **subgraph** guest (the `agent` subgraph (a Mutation)). Built to a
# `wasi:http` component with `cargo build --release --target wasm32-wasip2`; consumed as a
# fixture by the `boatramp-server` federation end-to-end conformance test. Excluded from
# the workspace (it targets wasm, not the host). Unlike `accounts`, it parses the incoming
# request body to honor the `_entities` contract, so it depends on `serde_json`.
[package]
name = "boatramp-example-graphql-agent"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
