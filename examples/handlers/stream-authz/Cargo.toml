# Example WebAssembly guest authorizer for a `guest_mediated` stream (stream-authz
# hardening). Built to a `wasi:http` component with
# `cargo build --release --target wasm32-wasip2`; consumed as a fixture by the
# `boatramp-server` guest-mediated stream-authz gate. Excluded from the workspace
# (it targets wasm, not the host).
[package]
name = "boatramp-example-stream-authz"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
strip = true
