# Example WebAssembly handler guest: a wasi:http handler that WRITES DNS records
# through the boatramp `dns-publish` capability (cap-req #24 WS3), returning a
# line-per-op outcome report. Exercises the engine's dns-publish host binding end
# to end (the three-layer fail-closed gate + the ManualDnsProvider capture). Built
# to a component with `cargo build --release --target wasm32-wasip2`; consumed as a
# fixture by the boatramp-handlers engine tests. Excluded from the workspace (wasm).
[package]
name = "boatramp-example-dns-publish-writer"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
strip = true
