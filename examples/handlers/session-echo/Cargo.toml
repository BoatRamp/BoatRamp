# Example WebAssembly *session* guest: exports the boatramp `session-handler`
# (the engine re-enters it once per inbound frame batch — mechanism B) and imports
# the `session` host half (send/checkpoint/close). It echoes each inbound frame back
# with a running counter rehydrated from the resume checkpoint, and closes on a
# `cancel` frame — exercising the duplex + resume + guest-close contract end to end.
# Built to a component with `cargo build --release --target wasm32-wasip2`; consumed
# as a fixture by the session live-capability gate. Excluded from the workspace
# (targets wasm).
[package]
name = "boatramp-example-session-echo"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
strip = true
