# Example WebAssembly MIGRATION-FUNCTION guest: a wasi:http handler that imports the owner-role
# `migrate-ddl` capability (and the tenant `sql` capability, to prove the binding-split). Built to a
# component with `cargo build --release --target wasm32-wasip2`; consumed as a fixture by the migrate
# function-step live gate. Excluded from the workspace (targets wasm).
[package]
name = "boatramp-example-migrate-fn"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
strip = true
