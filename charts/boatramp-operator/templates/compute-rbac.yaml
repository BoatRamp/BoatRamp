{{- /*
Kubernetes COMPUTE-BACKEND RBAC (mailroom #26).

When boatramp runs AS a pod and uses the `kubernetes` compute backend, the serve pod
manages its own managed compute (managed databases now; generic workloads in Phase 2) as
native k8s objects in its OWN namespace. This ships a LEAST-PRIVILEGE, NAMESPACE-SCOPED
Role (never a ClusterRole) + a RoleBinding (and, by default, the ServiceAccount) for that
pod. Gated on `.Values.computeBackend.kubernetes.enabled` so a non-k8s-backend install
grants nothing.

Point the serve pod's `serviceAccountName` at `.Values.computeBackend.kubernetes.serviceAccountName`.

Non-helm installs: apply the equivalent Role/RoleBinding below to the serve pod's
namespace + ServiceAccount by hand.
*/ -}}
{{- if .Values.computeBackend.kubernetes.enabled }}
{{- $sa := .Values.computeBackend.kubernetes.serviceAccountName }}
{{- if .Values.computeBackend.kubernetes.createServiceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boatramp-operator.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
# Least-privilege Role for the serve pod's compute backend, scoped to THIS namespace.
# Covers the exact resources/verbs the kubernetes backend applies + reads:
#   - apps/statefulsets + apps/deployments: the managed-DB (stateful) + generic (stateless)
#     workloads the backend server-side-applies.
#   - services + persistentvolumeclaims: the per-workload routing Service + the data PVC
#     (list/delete back the Phase-2 PVC volume-management + reaper surfaces).
#   - pods + pods/log: pod readiness/liveness reads + the Phase-2 pod-log stream.
#   - pods/exec: the Phase-2 `ComputeExec` (run a command inside a running pod).
#   - snapshot.storage.k8s.io/volumesnapshots: the Phase-2 CSI VolumeSnapshot backup /
#     restore (gated on a configured VolumeSnapshotClass; a no-op grant if unused).
# No wildcards; no cluster-scoped (ClusterRole) grants — a boatramp-owned expandable
# StorageClass or a VolumeSnapshotClass, being cluster-scoped, is intentionally NOT granted
# here (an explicit operator step), and NO `secrets` verb (the imagePullSecret is managed
# out-of-band). Non-helm installs: apply the equivalent Role below by hand.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boatramp-operator.labels" . | nindent 4 }}
rules:
  # apps workloads: get (readiness/liveness reads) + server-side-apply (create+patch) +
  # delete (teardown). No `watch` (the backend runs no informer) and no `update` (SSA is a
  # PATCH, never a plain UPDATE); `list` kept as a cheap read for operator visibility.
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # The per-workload routing Service + the data PVC: apply (create+patch), delete, and
  # list (list_volumes enumerates the managed PVCs). No watch/update.
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # Pods are READ-ONLY to the backend: resolve_pod LISTs them and they are
  # StatefulSet/Deployment-controller-managed — the backend never creates, mutates or
  # deletes a pod directly. Granting only get+list stops a compromised serve token from
  # touching (deleting/patching) co-located pods in the namespace.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Pod logs (get) + the exec subresource (create — exec is a POST/connect, not a writer).
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  # CSI VolumeSnapshot backup / restore (Phase 2): apply (create+patch) + get + delete
  # (snapshot cleanup). Namespace-scoped; the cluster-scoped VolumeSnapshotClass is NOT
  # granted (an operator step).
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boatramp-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $sa }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
