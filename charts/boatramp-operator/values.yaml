# The operator image. Same artifact as the boatramp server; the operator is a
# subcommand of the one binary.
image:
  repository: ghcr.io/boatramp/boatramp
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# Operator Deployment replica count. One active reconciler is enough (kube-rs
# holds no leader election here); >1 is only for faster failover.
replicaCount: 1

# Watch a single namespace (leave empty to watch all — the ClusterRole allows it).
watchNamespace: ""

# Pod resource requests/limits.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Hardened pod/container security context (the operator needs no privileges).
# `runAsUser`/`runAsGroup` are required alongside `runAsNonRoot`: the shipped
# `ghcr.io/boatramp/boatramp` image runs as root (the same binary serves and
# writes its data volume elsewhere), so without an explicit non-root uid the
# kubelet rejects the pod with CreateContainerConfigError ("image will run as
# root"). 65534 = nobody; the operator only talks to the API server, so it needs
# no writable paths (readOnlyRootFilesystem stays on).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}

# Kubernetes COMPUTE BACKEND (mailroom #26). When boatramp serve runs AS a pod and uses
# the `kubernetes` compute backend (`[compute].backend: kubernetes` / in-cluster
# auto-detect), it manages its own managed compute (managed DBs → StatefulSet + Service +
# PVC) as native k8s objects in its OWN namespace. Enable this to ship the least-privilege,
# namespace-scoped Role + RoleBinding (+ ServiceAccount) that lets the serve pod do so. No
# ClusterRole is granted. Off by default — a plain operator install needs none of it.
computeBackend:
  kubernetes:
    enabled: false
    # The ServiceAccount the serve pod runs as; the Role is bound to it. Point the serve
    # pod's `serviceAccountName` at this value.
    serviceAccountName: boatramp-compute
    # Create the ServiceAccount here (set false to bind a pre-existing one).
    createServiceAccount: true

# Extra labels/annotations applied to operator resources.
commonLabels: {}
commonAnnotations: {}
