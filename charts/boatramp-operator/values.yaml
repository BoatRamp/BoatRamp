# The operator image. Same artifact as the boatramp server; the operator is a
# subcommand of the one binary.
image:
  repository: ghcr.io/boatramp/boatramp
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# Operator Deployment replica count. One active reconciler is enough (kube-rs
# holds no leader election here); >1 is only for faster failover.
replicaCount: 1

# Watch a single namespace (leave empty to watch all — the ClusterRole allows it).
watchNamespace: ""

# Pod resource requests/limits.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Hardened pod/container security context (the operator needs no privileges).
# `runAsUser`/`runAsGroup` are required alongside `runAsNonRoot`: the shipped
# `ghcr.io/boatramp/boatramp` image runs as root (the same binary serves and
# writes its data volume elsewhere), so without an explicit non-root uid the
# kubelet rejects the pod with CreateContainerConfigError ("image will run as
# root"). 65534 = nobody; the operator only talks to the API server, so it needs
# no writable paths (readOnlyRootFilesystem stays on).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}

# Extra labels/annotations applied to operator resources.
commonLabels: {}
commonAnnotations: {}
