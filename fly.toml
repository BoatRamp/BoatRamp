# fly.toml — a generic boatramp instance dogfooding boatramp itself: it hosts
# multiple sites, routed by Host —
#   docs.boatramp.dev → site "docs" (published from this repo, deploy-docs.yml)
#   boatramp.dev      → site "www"  (published from ../boatramp-website, its own CI)
# Cloudflare fronts both; one origin machine stays warm so the first request
# after a cache miss/purge never pays a cold VM start.
#
# Safe to commit publicly: this is configuration, not secrets. The one secret —
# the control-plane root key — is set out-of-band and injected at runtime:
#   fly secrets set BOATRAMP_AUTH_ROOT_PRIVATE_KEY=<hex>
# (done by `just fly-provision` in the uchron-devops repo); it never appears here.
#
# No Dockerfile: the image is the flake's `.#container` (base: fs + SlateDB), built
# + pushed to fly's registry by `just fly-image` and selected with
# `fly deploy --image`. Site *content* is published separately with `boatramp sync`
# (per-site, from each site's own repo) — no image redeploy needed.

app = "boatramp"
primary_region = "ams"

# Graceful-stop budget (v0.9.0 KV-recovery, C12; v0.11.0 fsync + auto-recovery). A `fly deploy` roll
# sends SIGINT, waits `kill_timeout`, then SIGKILLs. boatramp drains + `close()`s the control-plane
# SlateDB store on SIGINT (freeze memtables → L0, advance the durable frontier) so the next boot has no
# torn WAL tail; that close must fit inside this window or a SIGKILL mid-close leaves a torn tail (the
# recurring incident). fly's default is 5s.
#
# SIZING FORMULA:
#   kill_timeout   >=  close_deadline + ~5s scheduler/reconcile-drain margin
#   close_deadline (`[serve.kv] close_deadline`, default 20s)  >=  measured worst-case quiesce+close  =
#                     reconcile-loop drain  +  (dirty memtable bytes ÷ object-store write throughput)
#                     for the final memtable→L0 freeze + manifest PUT.
# With continuous checkpointing (`[serve.kv] checkpoint_interval`, default 10s) the dirty set at
# shutdown is at most one interval, so the close is cheap and this rarely bites — the headroom is the
# belt to the checkpoint's suspenders. Keep `kill_timeout` >= `close_deadline` so fly never SIGKILLs
# first (BOATRAMP_KV_CLOSE_DEADLINE below = 25, kill_timeout = 30 → 5s margin).
#
# v0.11.0: the local SlateDB store now opens with fsync ON, so even a SIGKILL mid-close is
# NON-CORRUPTING (the manifest/WAL final name only appears once its data is durable), and an empty/torn
# latest manifest AUTO-RECOVERS on the next boot by rolling back to the last-good generation (lossless-
# for-acked). This budget is now DEFENSE-IN-DEPTH, not the sole guard — but keep the headroom.
kill_timeout = 30

[env]
BOATRAMP_ADDR = "0.0.0.0:8080"
BOATRAMP_DATA_DIR = "/data"
# Bound the graceful drain+close (seconds). Default is 20s (`[serve.kv] close_deadline`); kept below
# `kill_timeout` above so the store closes cleanly before fly's SIGKILL. See C12.
BOATRAMP_KV_CLOSE_DEADLINE = "25"
# Fallback for a Host matching no registered domain; the real domains
# (docs.boatramp.dev / boatramp.dev) route to their sites explicitly.
BOATRAMP_DEFAULT_SITE = "www"

[http_service]
internal_port = 8080
force_https = true
# Cloudflare fronts + caches the site, but the origin still serves the first
# request after a cache miss or purge — and a scaled-to-zero origin makes that
# first hit pay a cold VM start, a hiccup that's visible on the showcase. Keep one
# 256MB machine always warm (~$2/mo) so the origin never cold-starts in public.
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[http_service.concurrency]
type = "requests"
soft_limit = 200
hard_limit = 250

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"

# Persistent state (blobs + SlateDB metadata). The base image runs as root so it
# can own this mount. The volume is created by `just fly-provision`.
[mounts]
source = "boatramp_data"
destination = "/data"
