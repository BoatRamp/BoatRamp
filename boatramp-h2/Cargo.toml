[package]
name = "boatramp-h2"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A minimal, conformance-gated HTTP/2 server with a kernel zero-copy (splice/kTLS) response-body fast-path."
repository = "https://github.com/BoatRamp/BoatRamp"
publish = false # flip once the API stabilizes and h2spec is green

# The frame/error/settings/stream foundation is pure std. The connection driver +
# HPACK + server API add tokio + an HPACK codec; the Linux-only splice body path
# (M4) adds libc. See README roadmap.
[dependencies]
tokio = { version = "1", features = ["io-util", "net", "rt", "macros", "time", "sync"] }
# A response body can be a pull `Stream` of `Bytes` the driver polls directly — a
# reverse-proxy bridge hands the upstream body straight in with no channel/task hop.
tokio-stream = "0.1"
fluke-hpack = "0.3"
# Ref-counted byte buffers for the response-body path: streamed/proxied bodies flow
# as `Bytes` (cheap clones, no copy) instead of `Vec<u8>` — a profile showed body
# copying (`memmove`) was the top cost once allocation was handled.
bytes = "1"
# Requests/responses are the standard `http` crate types (`http::Request`/`Response`
# + `HeaderMap`), so the driver decodes straight into them and an embedder / reverse
# proxy hands them to a tower/hyper service with no per-request re-marshaling.
http = "1"

# The zero-copy splice body path + kTLS handoff are Linux-only, so their deps are
# target-gated — the crate (and its tests) still build everywhere on the buffered
# path. `libc` for splice()/pipe2; rustls+ktls for the TLS handshake→kTLS handoff.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rustls = { version = "0.23", default-features = true }
tokio-rustls = "0.26"
rustls-pemfile = "2"
ktls = "6"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
# The reference HTTP/2 implementation, used as an in-process client to smoke-test
# the server and (M3) as the differential oracle.
h2 = "0.4"
http = "1"
bytes = "1"

# Vendored fluke-hpack with one fix: its HPACK decoder rebuilt a 257-symbol Huffman
# decode table (a nested HashMap) for *every* Huffman-encoded header string, which
# profiled as the top per-request userspace cost on the h2 proxy path. The vendored
# copy shares one process-wide decoder (the table is immutable). Decode logic is
# otherwise identical, so h2spec conformance is unchanged.
[patch.crates-io]
fluke-hpack = { path = "vendor/fluke-hpack" }
