[package]
name = "boatramp-h2"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A minimal, conformance-gated HTTP/2 server with a kernel zero-copy (splice/kTLS) response-body fast-path."
repository = "https://github.com/BoatRamp/BoatRamp"
publish = false # flip once the API stabilizes and h2spec is green

# The frame/error/settings/stream foundation is pure std. The connection driver +
# HPACK + server API add tokio + an HPACK codec; the Linux-only splice body path
# (M4) adds libc. See README roadmap.
[dependencies]
tokio = { version = "1", features = ["io-util", "net", "rt", "macros", "time", "sync"] }
fluke-hpack = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
# The reference HTTP/2 implementation, used as an in-process client to smoke-test
# the server and (M3) as the differential oracle.
h2 = "0.4"
http = "1"
bytes = "1"
